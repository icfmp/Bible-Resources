name: Observe commentary XML structure (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/commentary-xml-witness.yml'
      - 'scripts/commentary_xml_witness.py'
      - 'tests/test_commentary_xml_witness.py'
      - 'config/commentary-intake/**'
      - 'scripts/pilot_fetch.py'
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Reviewed commentary intake manifest ID"
        required: true
        type: string
        default: mhcc-crosswire

permissions:
  contents: read

concurrency:
  group: commentary-xml-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select-source:
    runs-on: ubuntu-latest
    outputs:
      resources: ${{ steps.select.outputs.resources }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select exactly the modified commentary manifests
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RESOURCE_ID: ${{ inputs.resource_id || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          directory = Path("config/commentary-intake")
          registered = {}
          for path in sorted(directory.glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("category") == "commentary" and data.get("resource_id") == path.stem:
                  registered[path.as_posix()] = path.stem

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              requested = os.environ["INPUT_RESOURCE_ID"]
              if requested not in registered.values():
                  raise SystemExit(f"Unknown commentary manifest: {requested!r}")
              resources = [requested]
          else:
              # Default pull_request checkout is GitHub's synthetic merge commit:
              # first parent = base, HEAD = tested merged candidate.
              changed = set(subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^1", "HEAD"],
                  text=True).splitlines())
              resources = sorted(set(registered[path] for path in changed if path in registered))
              if not resources:
                  # Preserve the historical default when only reusable code or
                  # a corrections plan changes; no fabricated MHC acceptance.
                  resources = ["mhcc-crosswire"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("resources=" + json.dumps(resources) + "\n")
          print("Selected source identities:", ", ".join(resources))
          PY

  source_xml_inventory:
    needs: select-source
    strategy:
      fail-fast: false
      matrix:
        resource_id: ${{ fromJSON(needs.select-source.outputs.resources) }}
    name: XML source witness (${{ matrix.resource_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESOURCE_ID: ${{ matrix.resource_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project-pinned XML parser
        run: python -m pip install -r requirements.txt
      - name: Independently observe official XML source into disposable runner storage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_xml_witness.py \
            --resource-id "$RESOURCE_ID" \
            --report "${RUNNER_TEMP}/commentary-xml-structure.json"
      - name: Record verified XML witness fingerprints without source prose
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "commentary-xml-structure.json").read_text())
          observations = report.get("volume_observations", [report])
          for row in observations:
              tags = row["element_counts"]
              print("Read-only original CCEL XML volume", row.get("volume", 1),
                    "sha256", row["xml_sha256"], "bytes", row["bytes"],
                    "root", row["root_element_name"],
                    "div1", tags.get("div1", 0), "div2", tags.get("div2", 0),
                    "scripCom", tags.get("scripCom", 0),
                    "p", tags.get("p", 0))
          assert report["rights_approved"] is False
          assert report["original_source_edition_matched_to_sword"] is False
          assert report["published"] is False
          PY
      - name: Keep only metadata without authorial text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary-xml-structure-receipt-${{ matrix.resource_id }}
          path: ${{ runner.temp }}/commentary-xml-structure.json
          if-no-files-found: warn
          retention-days: 90
      - name: Distinguish structure discovery from legal or textual acceptance
        if: always()
        shell: bash
        run: |
          {
            echo '## Independent CCEL XML witness'
            echo 'All CCEL source bytes are temporary. The uploaded receipt contains structural names/counts and SHA only.'
            echo 'No DTD/entity resolution, OSIS/ThML schema validation or original text redistribution is authorized.'
            echo 'An XML layout inventory does not establish identity with the CCEL plaintext or CrossWire module.'
          } >> "$GITHUB_STEP_SUMMARY"
