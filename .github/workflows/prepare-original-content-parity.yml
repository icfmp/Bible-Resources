name: Prepare reusable original content comparison
on:
  push:
    branches: [audit/original-authorial-content-parity]
    paths: ['.github/workflows/prepare-original-content-parity.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_original_authorial_content_parity.py -v
      - name: Execute exact real-source proof with existing owner-approved ledger
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          import json,zipfile
          from hashlib import sha256
          from pilot_preflight import inspect_archive
          from approved_osis_sword_candidate import approved_source_for
          from research.bible.original_authorial_content_parity import verify_numbered_content
          source=Path("sources/original/bibles/fr/lsg-1910")
          p=json.loads((source/"PROVENANCE.json").read_text())
          w=p["additional_original_witness"]
          fm,fx=source/p["original_file"],source/w["filename"]
          for path,expected,size in [(fm,p["original_sha256"],p["original_size_bytes"]),(fx,w["sha256"],w["size_bytes"])]:
              receipt=inspect_archive(path,source_kind="authored")
              assert receipt["archive_sha256"]==expected and receipt["archive_bytes"]==size
          ledger_path=Path("sources/cleaned/bibles/fr/lsg-1910/editorial/REVIEWED_REFERENCE_AND_INTRO_OVERLAY_2026-11-23.json")
          assert sha256(ledger_path.read_bytes()).hexdigest()=="3e29ce023671fcc8ab4b85c1a639f7f52b8d89d4024d27cea6d3335e74787aa4"
          ledger=json.loads(ledger_path.read_text())
          approval=json.loads(Path("config/catalogue-import-lsg-1.0.0.json").read_text())
          assert approval["editorial_approval"]["approved_by"]=="Bible Resources project owner"
          assert ledger["original_usfx_zip_sha256"]==w["sha256"]==approval["source_usfx_zip_sha256"]
          repairs={}
          for e in ledger["edits"]:
              if e["type"]!="cross_reference_fragment":continue
              k=(e["book"]+"."+e["source_origin"],e["source_note_caller"])
              assert k not in repairs
              repairs[k]=(e["original_label"],e["new_label"])
          _,xml=approved_source_for(p["resource_id"])
          assert sha256(xml).hexdigest()=="cf867c35a55208726f5e0d57c15555b2947f6e799ecbc1996204e5120f3235f0"
          mapping={x["usfm"]:x["osis"] for x in json.loads(Path("config/standard_usfm_osis_66.json").read_text())["books"]}
          with zipfile.ZipFile(fx) as z:
              members=[m for m in z.infolist() if Path(m.filename).name.casefold().endswith("_usfx.xml")]
              assert len(members)==1
              raw=z.read(members[0])
          with zipfile.ZipFile(fm) as z:
              result=verify_numbered_content(raw,xml,mapping,repairs,z)
          print("GENERIC_ORIGINAL_CONTENT",json.dumps(result,sort_keys=True),flush=True)
          assert result["all_supported_content_checks_equal"],result["mismatch_counts"]
          PY
      - run: |
          git rm .github/workflows/prepare-original-content-parity.yml
          python scripts/tool_registry.py --write
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          python scripts/tool_registry.py --check
          python -m unittest discover -s tests -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh registry for original content fidelity'
          git push origin HEAD:refs/heads/audit/original-authorial-content-parity
