name: LSG 1910 original printed reference scan evidence (draft only)
on:
  pull_request:
    paths:
      - '.github/workflows/lsg-printed-margin-sample.yml'
permissions:
  contents: read
jobs:
  original_print:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install DjVu decoder and image cropping library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y djvulibre-bin
          python -m pip install -q Pillow
      - name: Pin and render printed Genesis 35:10 and Genesis 9:4 with source-aligned bands
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          from io import BytesIO
          from PIL import Image,ImageOps,ImageEnhance,ImageFilter
          import hashlib,base64,subprocess
          uri='https://upload.wikimedia.org/wikipedia/commons/1/17/La_Sainte_Bible%2C_trad._Segond%2C_ed._1910.djvu'
          root=Path('/tmp/lsg-printed-1910-evidence')
          root.mkdir(parents=True,exist_ok=True)
          archive=root/'original-1910.djvu'
          req=Request(uri,headers={'User-Agent':'Bible-Resources-evidence/1.0 (https://github.com/icfmp/Bible-Resources)'})
          with urlopen(req,timeout=120) as response,archive.open('wb') as f:
              h=hashlib.sha256()
              total=0
              while True:
                  data=response.read(1024*1024)
                  if not data:break
                  h.update(data)
                  f.write(data)
                  total+=len(data)
          print('1910_ORIGINAL_PRINT_SCAN',uri,'bytes',total,'sha256',h.hexdigest())
          if total < 200000000:
              raise SystemExit('Unexpectedly small original full scan: abort source proof')
          for page in [36,13]:
              tiff=root/f'1910-original-page{page}.tif'
              subprocess.run(['ddjvu','-page='+str(page),'-format=tiff',str(archive),str(tiff)],check=True)
              im=Image.open(tiff).convert('RGB')
              w,height=im.size
              print('1910_ORIGINAL_PAGE',page,'native_pixel_dimensions',w,height)
              if w < 700 or height < 1000:
                  raise SystemExit('Source image resolution insufficient, do not claim certainty')
              im.save(root/f'1910-original-page{page}-full.png')
              # Source verse + authentic marginal note, generous bounds for position verification.
              top,bottom=(int(height*.12),int(height*.88))
              crop=im.crop((int(w*.35),top,int(w*.63),bottom))
              crop=ImageOps.grayscale(crop)
              crop=ImageEnhance.Contrast(crop).enhance(1.75)
              crop=crop.resize((crop.width*3,crop.height*3),Image.Resampling.NEAREST)
              b=BytesIO()
              crop.save(b,format='PNG',optimize=True)
              data=b.getvalue()
              (root/f'1910-original-page{page}-reference-region.png').write_bytes(data)
              print(f'LSG_1910_ORIGINAL_PAGE_{page}_IMAGE_BEGIN')
              print(base64.b64encode(data).decode('ascii'))
              print(f'LSG_1910_ORIGINAL_PAGE_{page}_IMAGE_END')
              bands=[('upper',.10,.40),('middle',.36,.68),('lower',.65,.90)]
              for band,a,z in bands:
                  region=im.crop((int(w*.24),int(height*a),int(w*.63),int(height*z)))
                  region=ImageOps.grayscale(region)
                  region=ImageEnhance.Contrast(region).enhance(1.85)
                  region=region.resize((region.width*3,region.height*3),Image.Resampling.NEAREST)
                  f=BytesIO()
                  region.save(f,format='PNG',optimize=True)
                  data=f.getvalue()
                  (root/f'1910-original-page{page}-{band}-with-note-callouts.png').write_bytes(data)
                  print(f'LSG_1910_PAGE_{page}_{band.upper()}_IMAGE_BEGIN')
                  print(base64.b64encode(data).decode('ascii'))
                  print(f'LSG_1910_PAGE_{page}_{band.upper()}_IMAGE_END')
              tiff.unlink(missing_ok=True)
          archive.unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsg-printed-1910-original-image-excerpts-not-certified
          path: /tmp/lsg-printed-1910-evidence/*png
          retention-days: 14
