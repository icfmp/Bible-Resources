name: Stage verified published dictionary and validate its exact TEI
on:
  push:
    branches: [integration/published-isbe-1915]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: icfmp/Bible-Resources-ISBE
          ref: b99f32dd45b408ed4be3b1ac6f4f28ee6a1eb333
          path: .intake-upstream
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: verified-published-isbe-intake
          run-id: 45486706493
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/intake
      - name: Check exact published source and payload bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ["RUNNER_TEMP"])/"intake"
          evidence=Path("sources/cleaned/encyclopedias/en/isbe-1915/editorial/evidence")
          proof=json.loads((evidence/"UPSTREAM_PUBLICATION.json").read_text())
          acquisition=json.loads((root/"acquisition.json").read_text())
          sha=lambda data:hashlib.sha256(data).hexdigest()
          for kind in ("SWORD","source"):
              name=f"BRISBE1915-0.1.0-{kind}.zip"
              expected=proof["release"]["assets"][name]
              p=root/name
              assert p.stat().st_size==expected["size_bytes"] and sha(p.read_bytes())==expected["sha256"]
              with zipfile.ZipFile(p) as z:
                  assert len(z.infolist())==len(acquisition[kind]["members"])
                  assert len(z.namelist())==len(set(z.namelist()))
                  assert set(z.namelist())==set(acquisition[kind]["members"])
                  for i in z.infolist():
                      n=i.filename
                      rel=PurePosixPath(n)
                      assert not rel.is_absolute() and ".." not in rel.parts and str(rel)==n and "\\" not in n
                      assert stat.S_ISREG(i.external_attr>>16) and not i.is_dir()
                      data=z.read(i)
                      rec=acquisition[kind]["members"][n]
                      assert sha(data)==rec["sha256"] and len(data)==rec["size_bytes"]
                      if kind=="SWORD":
                          assert n=="mods.d/brisbe1915.conf" or n.startswith("modules/lexdict/zld/brisbe1915/")
                          out=Path("modules/isbe-1915/payload")/n
                      elif n=="source/ISBE.xml":
                          out=root/"master.xml"
                      else:
                          continue
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(data)
          assert sha((root/"master.xml").read_bytes())==proof["source"]["corrected_historical_tei_sha256"]
          rr=json.loads((root/"roundtrip.json").read_text())
          assert rr["native_roundtrip_verified"] and rr["native_keys"]==rr["expected_keys"]==9380
          assert rr["expected_tei_sha256"]==proof["source"]["native_sword_adapter_import_sha256"]
          assert rr["native_imp_sha256"]=="5d39f597757745875cba20cc603488dc115f173e7f75d416a81a3e8cad4546d0"
          for name in ("acquisition.json","roundtrip.json","reader.json"):
              (evidence/name).write_bytes((root/name).read_bytes())
          print("Exact five public SWORD files staged, original TEI retained in authoritative source release.")
          PY
      - name: Install official TEI schema validation tools
        run: |
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y -qq jing libsaxonhe-java
      - name: Validate exact corrected TEI with pinned official RELAX NG and Schematron
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,".intake-upstream/scripts")
          from validate_official_tei_p5 import get,command,saxon,INVALID_RNG,INVALID_SCHEMATRON
          from check_tei_p5_svrl import summarize_svrl
          import subprocess
          root=Path(os.environ["RUNNER_TEMP"])/"intake"
          schema=root/"schema"
          schema.mkdir()
          rng=schema/"tei_all.rng"
          sch=schema/"tei_all.isosch"
          base="https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/"
          rng_sha="b0f115095ead2ccc6933aa3365c6f4a82cba3b2ec7eee7f76bb616d7a63b7e48"
          sch_sha="500f231ac32d12827bdbdd4168e88743848656bc46cc83286d39bd1f396113d5"
          get(base+"custom/schema/relaxng/tei_all.rng",rng,rng_sha)
          get(base+"Exemplars/tei_all.isosch",sch,sch_sha)
          command("jing",rng,root/"master.xml")
          invalid=schema/"invalid-rng.xml"
          invalid.write_text(INVALID_RNG)
          assert subprocess.run(["jing",str(rng),str(invalid)]).returncode!=0
          iso=schema/"iso"
          iso.mkdir()
          compiler="77dcd36c53d12ed786c144ece3b2af7694abdc56"
          names=["iso_dsdl_include.xsl","iso_abstract_expand.xsl","iso_svrl_for_xslt2.xsl","iso_schematron_skeleton_for_saxon.xsl"]
          for name in names:
              get("https://raw.githubusercontent.com/Schematron/schematron/"+compiler+"/trunk/schematron/code/"+name,iso/name)
          included=schema/"included.sch"; expanded=schema/"expanded.sch"; validator=schema/"validator.xsl"
          saxon(sch,iso/names[0],included)
          saxon(included,iso/names[1],expanded)
          saxon(expanded,iso/names[2],validator)
          result=schema/"result.svrl"
          saxon(root/"master.xml",validator,result)
          bad=schema/"invalid-sch.xml"; bad.write_text(INVALID_SCHEMATRON)
          negative=schema/"negative.svrl"
          saxon(bad,validator,negative)
          p=summarize_svrl(result); n=summarize_svrl(negative)
          print("TEI_SCHEMA_DIAGNOSTICS",json.dumps({"positive":p,"negative":n}))
          assert p["active_patterns"]>0 and p["fired_rules"]>0 and p["failed_assertions"]==p["successful_reports"]==0
          assert n["failed_assertions"]+n["successful_reports"]>0
          receipt={"schema_version":1,"source_sha256":hashlib.sha256((root/"master.xml").read_bytes()).hexdigest(),"standard":"TEI P5","version":"4.12.0","rng_sha256":rng_sha,"schematron_sha256":sch_sha,"relax_ng_passed":True,"schematron_passed":True,"relax_ng_negative_control_rejected":True,"schematron_negative_control_rejected":True,"schematron_positive_counts":p,"schematron_negative_counts":n,"workflow_run":os.environ["GITHUB_RUN_ID"],"historical_print_collation_certified":False}
          dest=Path("sources/cleaned/encyclopedias/en/isbe-1915/editorial/evidence/TEI_SCHEMA_VALIDATION.json")
          dest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("TEI_SCHEMA_RECEIPT",json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve staged payload and receipts on integration branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/integration/published-isbe-1915
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- modules/isbe-1915/payload sources/cleaned/encyclopedias/en/isbe-1915/editorial/evidence
          git diff --cached --stat
          git commit -m 'Stage byte-identical published ISBE native files and exact TEI proof'
          git push origin HEAD:refs/heads/integration/published-isbe-1915
