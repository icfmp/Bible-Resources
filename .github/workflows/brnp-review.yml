name: BRNP advisory diagnostics (not publication conformance)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check_brnp.py'
      - 'tests/test_brnp.py'
      - 'docs/architecture/BRNP.md'
      - '.github/workflows/brnp-review.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Run positive and negative synthetic fixtures
        run: python -m unittest discover -s tests -p test_brnp.py -v
      - name: Retrieve and verify pinned official OSIS schema
        run: python scripts/fetch_reviewed_schema.py --directory "${RUNNER_TEMP}/reviewed-osis"
      - name: Read-only real-edition inventory (diagnostic, not release approval)
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/brnp-reports"
          paths=(
            "bible|sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml|lsg"
            "bible|sources/cleaned/bibles/fr/darby-jnd-2024/bible_jnd_2_0.osis.xml|darby"
            "commentary|sources/cleaned/commentaries/en/mhcc-crosswire/mhcc.osis.xml|mhcc"
            "commentary|sources/cleaned/commentaries/en/mhc-crosswire/mhc.osis.xml|mhc"
          )
          echo '## BRNP v0.2-draft inventory (not a certification)' >> "$GITHUB_STEP_SUMMARY"
          echo '| Edition | Diagnostic exit |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for entry in "${paths[@]}"; do
            IFS='|' read -r kind input label <<< "$entry"
            set +e
            python scripts/check_brnp.py "$input" --kind "$kind" --schema "${RUNNER_TEMP}/reviewed-osis/osisCore.2.1.1-cw-latest.xsd" --report "${RUNNER_TEMP}/brnp-reports/$label.json"
            status=$?
            set -e
            echo "| $label | $status |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -ge 2 ]; then
              echo "::warning::BRNP pilot could not inspect $label (exit $status)"
            fi
          done
          python - <<'PY'
          import collections, json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "brnp-reports"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print("### Full diagnostic category counts", file=summary)
              for path in sorted(folder.glob("*.json")):
                  report = json.loads(path.read_text(encoding="utf-8"))
                  counts = report.get("finding_codes", {})
                  print(path.stem, report.get("finding_count"), dict(counts), "tags:", report.get("unreviewed_elements", {}), "verse reasons:", report.get("verse_start_reasons", {}), "representative findings:", report.get("finding_examples_by_code", {}))
                  print(f"- {path.stem}: total {report.get('finding_count', 0)}; categories {dict(counts)}; element tags {report.get('unreviewed_elements', {})}", file=summary)
          PY
          echo 'Nonzero finding counts indicate unresolved BRNP draft non-conformance; a green workflow means diagnostics executed, NOT resources passed. The official OSIS schema result is separate. These findings are non-gating until owner approval.' >> "$GITHUB_STEP_SUMMARY"
      - name: Classify real OSIS structures without exposing authorial prose
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from lxml import etree
          ns = '{http://www.bibletechnologies.net/2003/OSIS/namespace}'
          paths = {
              'lsg': 'sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml',
              'mhc': 'sources/cleaned/commentaries/en/mhc-crosswire/mhc.osis.xml',
              'mhcc': 'sources/cleaned/commentaries/en/mhcc-crosswire/mhcc.osis.xml',
          }
          for label, path in paths.items():
              doc = etree.parse(path, etree.XMLParser(resolve_entities=False,
                  load_dtd=False, no_network=True, huge_tree=False))
              print('FORENSIC:',label, 'bytes=',Path(path).stat().st_size)
              refs = list(doc.iter(ns+'reference'))
              no_target=[e for e in refs if not (e.get('osisRef') or '').strip()]
              print('reference total/missing:',len(refs),len(no_target))
              print('reference missing parents:',Counter(
                  etree.QName(e.getparent()).localname for e in no_target).most_common(12))
              print('reference missing ancestors of note type:',Counter(
                  next((a.get('type') or '<none>' for a in e.iterancestors()
                        if a.tag==ns+'note'),'<not_in_note>')
                  for e in no_target).most_common(12))
              print('reference missing attrs:',Counter(
                  tuple(sorted(e.attrib)) for e in no_target).most_common(8))
              print('reference missing label lengths:',Counter(
                  'empty' if not ''.join(e.itertext()).strip() else
                  'short' if len(''.join(e.itertext()).strip()) < 10 else 'long'
                  for e in no_target))
              print('reference sample references with target (not prose):',
                    [e.get('osisRef') for e in refs if e.get('osisRef')][:6])
              whitespace=[e for e in refs if e.get('osisRef') and
                  e.get('osisRef') != e.get('osisRef').strip()]
              print('reference whitespace count/values:',
                    len(whitespace),[repr(e.get('osisRef')) for e in whitespace[:12]])
              books=[e for e in doc.iter(ns+'div') if e.get('type')=='book']
              nested=[e for e in books if any(
                  a.tag==ns+'div' and a.get('type')=='book' for a in e.iterancestors())]
              print('book counts total/nested',len(books),len(nested))
              print('nested sample pairs (inner, outer):', [
                  (e.get('osisID'),next((a.get('osisID') for a in e.iterancestors()
                   if a.tag==ns+'div' and a.get('type')=='book'),None))
                  for e in nested[:12]])
              print('nested parent tags:',Counter(
                  (e.getparent().get('type'),e.getparent().get('osisID'))
                  for e in nested).most_common(8))
              print('book descendants div type:',Counter(
                  e.get('type') for e in doc.iter(ns+'div')).most_common(12))
              starts={};ends=set()
              for e in doc.iter(ns+'chapter'):
                  if e.get('sID'):starts[e.get('sID')]=e
                  if e.get('eID'):ends.add(e.get('eID'))
              unmatched=[(k,e) for k,e in starts.items() if k not in ends]
              print('unmatched chapter:',[(k,e.getparent().tag.removeprefix(ns),
                  e.getparent().get('osisID'),e.getparent().get('type')) for k,e in unmatched[:10]])
              print('unmatched parent children type:', [
                  (k,Counter(etree.QName(x).localname for x in e.getparent()))
                  for k,e in unmatched[:5]])
              divs=[e for e in doc.iter(ns+'div') if e.get('annotateRef')]
              verses=[e for e in doc.iter(ns+'verse') if e.get('osisID')]
              print('scoped annotation divs, keyed verse starts:',len(divs),len(verses))
              if label=='lsg':
                  print('LSG note reference tag distributions:',Counter(
                      (e.get('type'),e.get('subType')) for e in no_target).most_common(10))
                  for parent_type in ('note','item'):
                      sample=[e for e in no_target
                              if etree.QName(e.getparent()).localname==parent_type][:5]
                      print('LSG sample labels under',parent_type,[
                          ''.join(e.itertext()).strip()[:48] for e in sample])
                  print('LSG sample note attributes:',[dict(e.getparent().attrib)
                      for e in no_target[:5]])
              if label=='mhcc':
                  for e in [b for b in books if b.get('osisID')=='Gen'][:6]:
                      ancestry=[(a.get('type'),a.get('osisID')) for a in
                                e.iterancestors() if a.tag==ns+'div']
                      print('MHCC Gen book wrapper:',dict(e.attrib),'parents:',ancestry,
                            'children:',Counter((etree.QName(x).localname,
                            x.get('type')) for x in e).most_common(8),
                            'direct_text_length:',len(e.text or ''))
                  print('MHCC repeated nested book attr sets:',Counter(
                      tuple(sorted(e.attrib)) for e in nested).most_common(5))
              if label=='mhc':
                  print('MHC verse attributes first:',[dict(e.attrib) for e in verses[:6]])
                  print('MHC parent types of keyed verses:',Counter(
                      (etree.QName(e.getparent()).localname,e.getparent().get('type'))
                      for e in verses).most_common(10))
          PY
      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brnp-readonly-structural-inventory
          path: ${{ runner.temp }}/brnp-reports/*.json
          if-no-files-found: warn
          retention-days: 30
