name: One-shot retired-audit tool inventory refresh
on:
  pull_request:
    paths:
      - '.github/workflows/maintenance-retire-audits-registry.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/retire-unconsumed-oneoff-audits-20261121
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove temporary runner before deterministic registry generation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintenance-retire-audits-registry.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync registry after retiring unconsumed one-off audits'
          git push origin HEAD:maintenance/retire-unconsumed-oneoff-audits-20261121
