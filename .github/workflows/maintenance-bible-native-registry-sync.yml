name: One-shot native Bible library inventory update
on:
  push:
    branches:
      - maintenance/bible-native-structure-libraries-20261122
permissions:
  contents: write
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh metadata-only registry and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintenance-bible-native-registry-sync.yml
          python scripts/tool_registry.py --write
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          python scripts/tool_registry.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize registry after merging native libraries"
          git push
