# One-time source-bound generated registry update. Deletes itself on success.
name: Refresh reference identity script registry once
on:
  push:
    branches:
      - maintenance/extract-original-link-identity-20261121
    paths:
      - '.github/workflows/script-reference-registry-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ github.repository == 'icfmp/Bible-Resources' && github.ref == 'refs/heads/maintenance/extract-original-link-identity-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recreate static registry and drop temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/script-reference-registry-once.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git commit -m 'chore: regenerate inventory for original link identity helper'
          git push origin HEAD:refs/heads/maintenance/extract-original-link-identity-20261121
