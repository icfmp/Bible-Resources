name: Replay exact LSG layout candidate and prepare private release package
on:
  push:
    branches: [research/lsg-layout-package-replay]
    paths: ['.github/workflows/lsg-layout-package-replay.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 update -qq
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y libsword-dev libsword-utils diatheke
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_raw_corpus.cpp -o "$RUNNER_TEMP/native-raw" -lsword
      - name: Reconstruct byte-exact audited candidate and compare compiler output
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json,os,shutil,zipfile
          from approved_osis_sword_candidate import approved_source_for,_create_candidate_layout,_compile_osis
          from stable_sword_refs import module_payload_digest
          t=Path(os.environ['RUNNER_TEMP'])
          e=json.loads(Path('sources/cleaned/bibles/fr/lsg-1910/editorial/evidence/lsg-layout-candidate-571.json').read_text())
          _,xml=approved_source_for('lsg-1910')
          assert e['publication_authorized'] is False
          for stage,oldkey,editkey in [(e['table'],'source_sha256','edits'),(e['paragraph'],'table_candidate_sha256','byte_edits')]:
              assert sha256(xml).hexdigest()==stage[oldkey]
              previous=xml;cursor=0;chunks=[]
              for patch in stage[editkey]:
                  i=patch['source_byte_offset'];old=patch['old_utf8'].encode();new=patch['new_utf8'].encode()
                  assert i>=cursor and xml[i:i+len(old)]==old
                  chunks.append(xml[cursor:i])
                  assert sum(map(len,chunks))==patch['candidate_byte_offset']
                  chunks.append(new);cursor=i+len(old)
              chunks.append(xml[cursor:]);xml=b''.join(chunks)
              assert sha256(xml).hexdigest()==stage['candidate_sha256']
              inverse=xml
              for patch in reversed(stage[editkey]):
                  i=patch['candidate_byte_offset'];old=patch['old_utf8'].encode();new=patch['new_utf8'].encode()
                  assert inverse[i:i+len(new)]==new
                  inverse=inverse[:i]+old+inverse[i+len(new):]
              assert inverse==previous
          assert sha256(xml).hexdigest()==e['native']['candidate_sha256']==e['xiphos']['candidate_sha256']
          assert e['native']['numbered_slot_text_and_note_parity_verified']
          assert e['native']['source_native_body_boundary_positions']['all_book_body_nonspace_and_boundary_events_equal']
          assert e['schema']['official_osis_validated'] and e['xiphos']['all_source_prose_witnesses']
          path=t/'lsg-layout-candidate.osis.xml';path.write_bytes(xml)
          work=t/'private-lsg-layout';work.mkdir()
          payload,out=_create_candidate_layout(work,'BRLSG1910','Segond','fr')
          shutil.copyfile('modules/lsg-1910/payload/mods.d/brlsg1910.conf',payload/'mods.d/brlsg1910.conf')
          compiler=_compile_osis(Path(shutil.which('osis2mod')),path,out,'Segond',t/'private-compile.log')
          digest=module_payload_digest(work)
          assert digest==e['native']['compiled_payload_sha256'],('Compiler output differs from audited candidate',digest)
          for name,value in [('lsg-layout-native.json',e['native']),('lsg-paragraph-receipt.json',e['paragraph'])]:
              (t/name).write_text(json.dumps(value))
          # Version is provisional and only applied inside an isolated package.
          # Preserve the verified native payload and all other config bytes.
          conf=payload/'mods.d/brlsg1910.conf'
          b=conf.read_bytes();assert b.count(b'Version=1.0.3')==1
          revised=b.replace(b'Version=1.0.3',b'Version=1.0.4')
          files={f.relative_to(payload).as_posix():f.read_bytes() for f in sorted(payload.rglob('*')) if f.is_file()}
          files['mods.d/brlsg1910.conf']=revised
          old=json.loads(Path('config/catalogue-import-lsg-1.0.3.json').read_text())
          assert set(files)==set(old['files'])
          zip_path=t/'BRLSG1910-1.0.4-candidate.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name,content in sorted(files.items()):
                  info=zipfile.ZipInfo(name,(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16
                  z.writestr(info,content)
          hashes={name:sha256(content).hexdigest() for name,content in files.items()}
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None and set(z.namelist())==set(hashes)
              assert all(sha256(z.read(name)).hexdigest()==digest for name,digest in hashes.items())
          result={'candidate_source_sha256':sha256(xml).hexdigest(),'audited_unversioned_payload_sha256':digest,'proposed_version':'1.0.4','zip_sha256':sha256(zip_path.read_bytes()).hexdigest(),'zip_size_bytes':zip_path.stat().st_size,'member_sha256':hashes,'native_data_matches_audited_candidate':True,'public_release_created':False,'editorial_approval_pending':True,'compiler':compiler}
          (t/'lsg-private-package-receipt.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('LSG_PRIVATE_PACKAGE',json.dumps(result,sort_keys=True),flush=True)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Independent full-index JSword readback of isolated candidate
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/AndBible/jsword.git "$RUNNER_TEMP/jsword"
          git -C "$RUNNER_TEMP/jsword" fetch --quiet --depth=1 origin 6ebd10a005fa7761e611c048ececea1430e22546
          git -C "$RUNNER_TEMP/jsword" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/jsword" rev-parse HEAD)" = 6ebd10a005fa7761e611c048ececea1430e22546
          mkdir -p "$RUNNER_TEMP/jsword/src/test/java/org/icfmp/research"
          cat > "$RUNNER_TEMP/jsword/src/test/java/org/icfmp/research/ApprovedBibleFullIndexProbeTest.java" <<'JAVA'
          package org.icfmp.research;
          
          import java.io.File;
          import java.nio.file.Files;
          import java.nio.file.Paths;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.*;
          import org.crosswire.jsword.book.Book;
          import org.crosswire.jsword.book.BookData;
          import org.crosswire.jsword.book.BookMetaData;
          import org.crosswire.jsword.book.Books;
          import org.crosswire.jsword.book.OSISUtil;
          import org.crosswire.jsword.book.sword.SwordBookPath;
          import org.crosswire.jsword.passage.Key;
          import org.crosswire.jsword.passage.Verse;
          import org.crosswire.jsword.versification.BibleBook;
          import org.crosswire.jsword.versification.Versification;
          import org.crosswire.jsword.versification.system.Versifications;
          import org.junit.Test;
          import static org.junit.Assert.*;
          
          public final class ApprovedBibleFullIndexProbeTest {
              static String hash(String s) throws Exception {
                  byte[] b=MessageDigest.getInstance("SHA-256").digest(s.getBytes(StandardCharsets.UTF_8));
                  StringBuilder out=new StringBuilder();
                  for(byte v:b) out.append(String.format("%02x",v&255));
                  return out.toString();
              }
              static String compact(String s) {
                  StringBuilder out=new StringBuilder();
                  s.codePoints().filter(c -> !Character.isWhitespace(c) && !Character.isSpaceChar(c)).forEach(out::appendCodePoint);
                  return out.toString();
              }
              @Test public void independentlyReadExactPublishedBibleIndexes() throws Exception {
                  File root=new File(System.getenv("BIBLE_PROBE_ROOT")).getCanonicalFile();
                  assertTrue(root.isDirectory() && root.getName().equals("private-approved-bible-reader-root"));
                  SwordBookPath.setAugmentPath(new File[]{root});
                  List<String> modules=Files.readAllLines(Paths.get(System.getenv("BIBLE_PROBE_PLAN")),StandardCharsets.US_ASCII);
                  assertEquals(1,modules.size());
                  int failures=0;
                  for(String line:modules) {
                      String[] spec=line.split("\t");
                      String id=spec[0], v11n=spec[1];
                      Book bible=Books.installed().getBook(id);
                      if(bible==null){System.out.println("BIBLE_JSWORD_RESULT "+id+" unavailable");failures++;continue;}
                      assertEquals(id,bible.getInitials());
                      Versification v=Versifications.instance().getVersification(v11n);
                      if(v==null){System.out.println("BIBLE_JSWORD_RESULT "+id+" versification_unavailable");failures++;continue;}
                      assertEquals(v11n,bible.getBookMetaData().getProperty(BookMetaData.KEY_VERSIFICATION));
                      Set<String> expected=new HashSet<>();
                      int missing=0, rawExact=0, rawCompact=0, rawRead=0, badKeys=0, structured=0, structuredExpected=0, structuredExact=0;
                      List<String> rawDiff=new ArrayList<>(),missingRefs=new ArrayList<>(),sampleDiff=new ArrayList<>();
                      for(String row:Files.readAllLines(Paths.get(spec[2]),StandardCharsets.US_ASCII)){
                          String[] cols=row.split("\t",-1);
                          String ref=cols[0];assertTrue(expected.add(ref));
                          String[] parts=ref.split("\\.");
                          BibleBook b=BibleBook.fromExactOSIS(parts[0]);assertNotNull(b);
                          Verse k=new Verse(v,b,Integer.parseInt(parts[1]),Integer.parseInt(parts[2]));
                          if(!ref.equals(k.getOsisRef())){badKeys++;continue;}
                          if(!bible.contains(k)){missing++;if(missingRefs.size()<20)missingRefs.add(ref);continue;}
                          String raw=bible.getRawText(k);
                          if(raw!=null){
                              rawRead++;
                              if(hash(raw).equals(cols[1]))rawExact++;
                              else if(rawDiff.size()<20)rawDiff.add(ref);
                              if(hash(compact(raw)).equals(cols[2]))rawCompact++;
                          }
                          if(!cols[3].isEmpty()){
                              structuredExpected++;
                              String prose=OSISUtil.getCanonicalText(new BookData(bible,k).getOsisFragment());
                              if(prose!=null && !prose.trim().isEmpty()){
                                  structured++;
                                  if(hash(compact(prose)).equals(cols[3])) structuredExact++;
                                  else if(sampleDiff.size()<20)sampleDiff.add(ref);
                              }
                          }
                      }
                      int extra=0;
                      for(Key key:bible.getScope()){
                          if(!(key instanceof Verse))continue;
                          Verse x=(Verse)key;
                          if(x.getChapter()>0 && x.getVerse()>0 && !expected.contains(x.getOsisRef()) && bible.contains(x))extra++;
                      }
                      System.out.println("BIBLE_JSWORD_RESULT "+id+" expected="+expected.size()+" missing="+missing+" extra="+extra+" changed_keys="+badKeys+" raw_read="+rawRead+" raw_exact="+rawExact+" raw_nonspace="+rawCompact+" structured_samples="+structured+" structured_expected="+structuredExpected+" structured_exact="+structuredExact);
                      System.out.println("BIBLE_JSWORD_DIFFERENCES "+id+" missing="+missingRefs+" raw="+rawDiff+" structured="+sampleDiff);
                      if(missing!=0 || extra!=0 || badKeys!=0 || rawRead!=expected.size() || rawCompact!=expected.size() || structuredExpected<2 || structured!=structuredExpected || structuredExact!=structuredExpected) failures++;
                  }
                  assertEquals("At least one independent Bible engine retrieval/index check failed",0,failures);
              }
          }
          JAVA
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import os,json,shutil
          from approved_osis_sword_candidate import original_osis_verses_and_notes,project_reviewed_merge_slots,_read_native_frames
          from stable_sword_refs import load_approved_merge_policy
          t=Path(os.environ['RUNNER_TEMP'])
          payload=t/'private-lsg-layout/payload'
          root=t/'private-approved-bible-reader-root'
          import zipfile
          package=t/'BRLSG1910-1.0.4-candidate.zip'
          plan=json.loads((t/'lsg-private-package-receipt.json').read_text())
          assert sha256(package.read_bytes()).hexdigest()==plan['zip_sha256']
          root.mkdir()
          with zipfile.ZipFile(package) as z:
              assert set(z.namelist())==set(plan['member_sha256'])
              for name in z.namelist():
                  data=z.read(name)
                  assert sha256(data).hexdigest()==plan['member_sha256'][name]
                  dst=root/name
                  assert dst.resolve().is_relative_to(root.resolve()) and not dst.exists()
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(data)
          xml=(t/'lsg-layout-candidate.osis.xml').read_bytes()
          receipt=json.loads((t/'lsg-layout-native.json').read_text())
          assert sha256(xml).hexdigest()==receipt['candidate_sha256']
          m=Path('modules/lsg-1910')
          compat=json.loads((m/'SWORD_COMPATIBILITY.json').read_text())
          merges,_=load_approved_merge_policy(m/'SOURCE_REFERENCE_MERGES.json',publisher_digest=compat['original_publisher_document_sha256'],versification='Segond')
          verses,notes,_=original_osis_verses_and_notes(xml)
          projected,_=project_reviewed_merge_slots(verses,notes,merges)
          native={ref:raw.decode('utf-8') for kind,ref,raw in _read_native_frames(t/'native-raw','BRLSG1910',root) if kind=='K'}
          assert set(native)==set(projected)
          changes=json.loads((t/'lsg-paragraph-receipt.json').read_text())['boundary_changes']
          samples={x['book']+'.'+x['ref'] for x in changes if x['kind']=='restore_source_boundary'}|{'Gen.1.1','Ps.23.1','John.3.16','Mark.10.52','Eccl.11.1','Eccl.12.1'}
          compact=lambda s:''.join(s.split())
          digest=lambda s:sha256(s.encode()).hexdigest()
          path=t/'candidate-jsword.tsv'
          path.write_text(''.join(k+'\t'+digest(native[k])+'\t'+digest(compact(native[k]))+'\t'+(digest(compact(v)) if k in samples else '')+'\n' for k,v in projected.items()),encoding='ascii')
          (t/'bible-plan.tsv').write_text('BRLSG1910\tSegond\t'+str(path)+'\n',encoding='ascii')
          print('LSG_JSWORD_INPUT',json.dumps({'source_sha256':receipt['candidate_sha256'],'native_slots':len(native),'samples':sorted(samples)},sort_keys=True))
          PY
          export BIBLE_PROBE_ROOT="$RUNNER_TEMP/private-approved-bible-reader-root"
          export BIBLE_PROBE_PLAN="$RUNNER_TEMP/bible-plan.tsv"
          export SWORD_PATH="$BIBLE_PROBE_ROOT"
          export HOME="$RUNNER_TEMP/isolated-java-home"
          export GRADLE_USER_HOME="$RUNNER_TEMP/isolated-gradle-home"
          mkdir -m 700 "$HOME" "$GRADLE_USER_HOME"
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME"
          cd "$RUNNER_TEMP/jsword"
          set +e
          timeout 720 bash ./gradlew --no-daemon --console=plain test --tests org.icfmp.research.ApprovedBibleFullIndexProbeTest > "$RUNNER_TEMP/private-jsword.log" 2>&1
          rc=$?
          set -e
          export PROBE_RC="$rc"
          python - <<'PY'
          import json,re,os,xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('build/test-results/test/TEST-org.icfmp.research.ApprovedBibleFullIndexProbeTest.xml')
          if not p.is_file():
              log=(Path(os.environ['RUNNER_TEMP'])/'private-jsword.log').read_text(errors='replace')
              tags=['Could not resolve','Could not download','Could not GET','compileTestJava FAILED','Connection timed out','UnknownHostException','Read timed out','Gradle build daemon disappeared','Unsupported class file','No tests found','Could not create','OutOfMemoryError','Could not install','Permission denied','FAILURE: Build failed','Could not initialize']
              print('JSWORD_INFRASTRUCTURE',json.dumps({'exit':int(os.environ['PROBE_RC']),'markers':[x for x in tags if x in log],'log_sha256':__import__('hashlib').sha256(log.encode()).hexdigest(),'log_lines':len(log.splitlines())}),flush=True)
              raise SystemExit('No independent Java test result')
          root=ET.parse(p).getroot()
          lines=[line for n in root.findall('system-out') for line in (n.text or '').splitlines() if re.fullmatch(r'BIBLE_JSWORD_(?:RESULT|DIFFERENCES) [A-Za-z0-9 ._\[\],=:-]+',line)]
          for line in lines:print(line)
          report={'junit':{k:int(root.get(k,'0')) for k in ('tests','errors','failures','skipped')},'gradle_exit_code':int(os.environ['PROBE_RC']),'reader_results':lines,'android_gui_verified':False}
          (Path(os.environ['RUNNER_TEMP'])/'lsg-layout-jsword.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          assert report['gradle_exit_code']==0 and report['junit']=={'tests':1,'errors':0,'failures':0,'skipped':0}
          assert len([x for x in lines if x.startswith('BIBLE_JSWORD_RESULT BRLSG1910 expected=')])==1
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsg-private-package-and-jsword-receipts
          path: |
            ${{ runner.temp }}/lsg-private-package-receipt.json
            ${{ runner.temp }}/lsg-layout-jsword.json
          retention-days: 30
