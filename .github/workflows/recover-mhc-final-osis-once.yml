name: Recover exact attested MHC final OSIS editorial master
on:
  push:
    branches: [recovery/approved-clean-osis-20261120]
    paths: [.github/workflows/recover-mhc-final-osis-once.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    if: github.repository == 'icfmp/Bible-Resources'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install existing verified source tools and native SWORD reader
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt -q
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 update -qq
          timeout 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y --no-install-recommends libsword-dev
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_raw_corpus.cpp -o "$RUNNER_TEMP/mhc-native" -lsword
      - name: Reproduce every SHA-attested MHC OSIS transformation
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=scripts
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from clean_source_osis import clean
          from repair_commentary_osis_milestones import repair_private_bytes as repair_range
          from repair_osis_source_bytes import patch_reviewed_osis_reference_attributes
          from reclassify_osis_commentary_introduction import repair_private_bytes as repair_intro
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          root=Path.cwd()
          original=root/"sources/original/commentaries/en/mhc-crosswire/mhc.osis.xml"
          original_sha="3cf367f00c498a3124b339c00896aaef4ef1196a2d5c310ecb20ea42abd130f6"
          stages=[
            ("original",original_sha),
            ("cosmetic", "ded53fe37e83609790433a01b2dabf0ea3a13e929bd3bded39262ce4a5b24016"),
            ("endpoints", "dbf5aedadf7ef4f2f02ddedf8cc22de1ecc51b0b8ee2ece7c29acaf540a8d93c"),
            ("overlaps", None),
            ("crossreferences", "49da878758587e52fa25fe59a0b55fc3d058c511fb7c31c4f42f7163fab70f10"),
            ("chapter_intro", "c64891f4fb2c3bd3a7e5e6cca992d80675849e7b3615f80ee95121461ef385f4")]
          def digest(raw):return hashlib.sha256(raw).hexdigest()
          def require(name,data,want):
              got=digest(data)
              if want is not None and got!=want:
                  raise ValueError(name+" reconstructed OSIS hash differs, got "+got)
              print("Verified "+name+" original-format OSIS SHA256="+got+" bytes="+str(len(data)))
              return got
          original_bytes=original.read_bytes()
          require("original",original_bytes,original_sha)
          from tempfile import TemporaryDirectory
          with TemporaryDirectory(prefix="mhc-recovery-") as tmp:
              tmp=Path(tmp)
              cleaned_path=tmp/"cosmetic.osis.xml"
              receipt=clean(original,original_sha,output=cleaned_path)
              if receipt.get("cleanup_changes",{}).get("empty_display_hi_elements_removed")!=11:
                  raise ValueError("Unexpected MHC original cleanup operation count")
              cleaned=cleaned_path.read_bytes()
              require("cosmetic",cleaned,stages[1][1])
              data=cleaned
              for label,plan_path,want in [
                  ("endpoints","config/commentary-osis-repair-plans/mhc-endpoints-private-preview.json",stages[2][1]),
                  ("overlaps","config/commentary-osis-repair-plans/mhc-overlap-reindex-private-experiment.json",None)
              ]:
                  plan=json.loads((root/plan_path).read_text())
                  if plan["source_sha256"]!=digest(data):
                      raise ValueError("Source SHA mismatch in "+plan_path)
                  data,report=repair_range(data,plan)
                  require(label,data,want)
                  if report["corrected_source_verse_groups"]!=(3 if label=="endpoints" else 6):
                      raise ValueError("Source range repair count drift")
              link_plan=json.loads((root/"config/commentary-osis-repair-plans/mhc-crossreferences-private-preview.json").read_text())
              if digest(data)!=link_plan["source_sha256"]:
                  raise ValueError("Reviewed link source pin diverged")
              # Read actual already published MHC native keys, not a guessed range.
              cmd=[os.environ["RUNNER_TEMP"]+"/mhc-native","MHC"]
              env=dict(os.environ,SWORD_PATH=str(root/"modules/mhc-crosswire/payload"))
              p=subprocess.Popen(cmd,env=env,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              try:
                  _,verses,intros,_=parse_native_raw_corpus(p.stdout)
                  if p.wait(timeout=80)!=0:raise ValueError("Published native MHC reader failed")
              finally:
                  if p.stdout:p.stdout.close()
                  if p.poll() is None:p.kill()
                  p.wait()
              if len(verses)!=31098 or len(intros)!=1255:
                  raise ValueError("Published MHC corpus differs from accepted original proof")
              data,link_receipt=patch_reviewed_osis_reference_attributes(data,link_plan,set(verses))
              require("crossreferences",data,stages[4][1])
              if link_receipt["exact_reference_attribute_only_changes"]!=25:
                  raise ValueError("Source-approved cross-reference corrections diverged")
              intro_plan=json.loads((root/"config/commentary-osis-repair-plans/mhc-chapter-introduction-private.json").read_text())
              if intro_plan["private_candidate_before_intro_sha256"]!=digest(data):
                  raise ValueError("Approved introduction input SHA mismatch")
              intro_plan["source_sha256"]=digest(data)
              final,intro_receipt=repair_intro(data,intro_plan)
              require("chapter_intro",final,stages[5][1])
              if not intro_receipt["all_original_source_text_whitespace_and_punctuation_identical"]:
                  raise ValueError("Content drift during chapter introduction reclassification")
              destination=root/"sources/cleaned/commentaries/en/mhc-crosswire"
              if destination.exists():
                  raise ValueError("Do not overwrite existing cleaned MHC source")
              destination.mkdir(parents=True)
              (destination/"mhc.osis.xml").write_bytes(final)
              manifest={
                "schema_version":1,"resource_id":"mhc-crosswire",
                "language":"en","type":"commentary",
                "status":"recovered_exact_approved_source_input",
                "source_original_path":"sources/original/commentaries/en/mhc-crosswire/mhc.osis.xml",
                "cleaned_path":"sources/cleaned/commentaries/en/mhc-crosswire/mhc.osis.xml",
                "source_original_sha256":original_sha,
                "approved_cleaned_sha256":digest(final),
                "source_attestation_run":"https://github.com/icfmp/Bible-Resources/actions/runs/44554276085",
                "published_release":"https://github.com/icfmp/Bible-Resources/releases/tag/mhc-0.1.0",
                "transformation_steps":[{"stage":n,"sha256":digest(original_bytes) if n=="original" else w}
                  for n,w in stages if w is not None],
                "reviewed_patches":{"empty_inert_hi":11,"invalid_range_endpoints":3,
                  "overlap_reindex_groups":6,"cross_reference_destinations":25,
                  "chapter_intro_reclassification":1},
                "reconstruction_method":"Existing generic scripts and source-SHA-pinned plans; byte-for-byte validated against all historical checkpoint digests; original untouched.",
                "no_authorial_prose_changed":True
              }
              (destination/"CLEANUP_MANIFEST.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
              print("Recovered accepted MHC OSIS editorial master verified, final bytes",len(final))
          PY
      - name: Commit recovered approved OSIS, retain original, remove disposable workflows
        run: |
          set -euo pipefail
          git rm .github/workflows/recover-mhc-final-osis-once.yml
          git rm .github/workflows/inspect-hmcc-source-recovery.yml
          git add sources/cleaned/commentaries/en/mhc-crosswire/
          git diff --cached --check -- ':!sources/cleaned/**/*.xml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore exact MHC source-attested cleaned OSIS from approved transformations"
          git push origin HEAD:recovery/approved-clean-osis-20261120
