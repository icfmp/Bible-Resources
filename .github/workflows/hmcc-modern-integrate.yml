name: Integrate reviewed modern commentary header repair
on:
  pull_request:
    paths:
      - '.github/workflows/hmcc-modern-integrate.yml'
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/hmcc-modern-maintenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate exact proven candidate with independent rights checks and immutable historical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          gh api repos/icfmp/Bible-Resources/actions/artifacts/14958203748/zip > "$RUNNER_TEMP/modern-trial.zip"
          echo "7159ff1b1b65a5aa7417e80975fd3f929d75619dcbc1c785fb22a0f1d26fd94b  $RUNNER_TEMP/modern-trial.zip" | sha256sum -c
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json,os,shutil
          from validate import parse_conf
          from reviewed_modern_commentary_rebuild import reviewed_modern_commentary_errors
          from build import build
          t=Path(os.environ["RUNNER_TEMP"]);root=Path(".");m=root/"modules/hmcc-modern";ed=root/"sources/cleaned/commentaries/en/hmcc-modern";old=ed/"editorial/evidence/release-0.1.0";old.mkdir()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          load=lambda p:json.loads(p.read_text())
          def save(p,obj):p.write_text(json.dumps(obj,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          plan=root/"config/commentary-rebuilds/hmcc-modern.json";release=root/"config/release-plans/hmcc-modern-0.1.0.json";conf=m/"payload/mods.d/hmccmodern.conf";meta=m/"metadata.json";proof=m/"SOURCE_VALIDATION.json";artifact=m/"RELEASE_ARTIFACT_PROOF.json";source=ed/"hmcc-modern.osis.xml";cleanup=ed/"CLEANUP_MANIFEST.json"
          assert not reviewed_modern_commentary_errors(m,root,load(meta),parse_conf(conf)[1])
          for f,n in [(plan,"review-manifest.json"),(release,"release-plan.json"),(meta,"metadata.json"),(proof,"SOURCE_VALIDATION.json"),(artifact,"RELEASE_ARTIFACT_PROOF.json"),(conf,"module.conf"),(cleanup,"CLEANUP_MANIFEST.json"),(m/"EDITORIAL.md","EDITORIAL.md")]:shutil.copyfile(f,old/n)
          receipt=ed/"editorial/evidence/2026-11-24-header-revision-trial.json";rr=load(receipt)["results"]["MODERN_HEADER_TRIAL"]
          with ZipFile(t/"modern-trial.zip") as z:
              assert set(z.namelist())=={"hmcc-modern-candidate.osis.xml","header-correction.json"}
              out=z.read("hmcc-modern-candidate.osis.xml")
              assert json.loads(z.read("header-correction.json"))==rr
          assert hashlib.sha256(out).hexdigest()==rr["candidate_sha256"] and sha(source)==rr["source_sha256"]
          version="1.0.0";title="Matthew Henry's Modern Concise Commentary"
          rev={"previous_version":"0.1.0","previous_review_sha256":sha(old/"review-manifest.json"),"previous_proof_sha256":sha(old/"SOURCE_VALIDATION.json"),"previous_artifact_sha256":sha(old/"RELEASE_ARTIFACT_PROOF.json"),"previous_metadata_sha256":sha(old/"metadata.json"),"previous_conf_sha256":sha(old/"module.conf"),"receipt_name":receipt.name,"receipt_sha256":sha(receipt),"candidate_source_sha256":rr["candidate_sha256"],"new_display_name":title,"old_text_source":parse_conf(conf)[1]["TextSource"]}
          source.write_bytes(out)
          old_meta=load(meta);new_meta=dict(old_meta,version=version,title=dict(old_meta["title"],en=title));save(meta,new_meta)
          data=conf.read_bytes()
          for a,b in [(b"Version=0.1.0\n",b"Version=1.0.0\n"),(("Description="+old_meta["title"]["en"]+"\n").encode(),("Description="+title+"\n").encode()),(("TextSource="+rev["old_text_source"]+"\n").encode(),b"TextSource=https://github.com/icfmp/Bible-Resources/blob/main/sources/cleaned/commentaries/en/hmcc-modern/hmcc-modern.osis.xml\n")]:
              assert data.count(a)==1
              data=data.replace(a,b,1)
          conf.write_bytes(data)
          a=load(artifact);a["header_revision"]=rev;a["payload_sha256"]["mods.d/hmccmodern.conf"]=sha(conf);save(artifact,a)
          save(plan,dict(load(plan),version=version,header_revision=rev));save(proof,dict(load(proof),curated_version=version,header_revision=rev))
          save(cleanup,dict(load(cleanup),approved_source_sha256=rr["candidate_sha256"],previous_approved_source_sha256=rr["source_sha256"],source_bytes=len(out),header_revision=rev))
          errors=reviewed_modern_commentary_errors(m,root,new_meta,parse_conf(conf)[1]);assert not errors,errors
          # Reversible source and preserved config gate must fail on unapproved edits.
          for f in (source,conf):
              orig=f.read_bytes()
              try:
                  f.write_bytes(orig+b"\n")
                  assert reviewed_modern_commentary_errors(m,root,new_meta,parse_conf(conf)[1])
              finally:f.write_bytes(orig)
          notes=ed/"editorial/releases/HMCC-Modern-1.0.0.md"
          notes.write_text("# Matthew Henry's Modern Concise Commentary — 1.0.0 candidate\n\nHeader-only schema repair with zero BRNP findings and exact all-entry native comparison. No modern prose, notes, references, or six binary members altered. Corrected the obsolete SWORD TextSource link and proposed harmonized display name; existing HMCCModern module ID retained. The historical 0.1.0 proof remains archived. Modern-English semantic review and actual note-click verification are distinct from this technical correction. Pending final owner release approval.\n")
          with (m/"EDITORIAL.md").open("a") as f:f.write("\n## 1.0.0 candidate technical maintenance\n\n"+notes.read_text().split("\n\n",1)[1])
          snapshot=root/"catalog/v1/catalog.json";snapshot.unlink();dist=t/"dist";build(output=dist);shutil.copyfile(dist/"catalog/v1/catalog.json",snapshot)
          pkg=dist/"sword/packages/HMCCModern.zip"
          nextplan=dict(load(release),tag="hmcc-modern-1.0.0",version=version,title=title+" — 1.0.0",zip_name="HMCCModern-1.0.0.zip",notes_path=str(notes),package_sha256=sha(pkg),package_size_bytes=pkg.stat().st_size)
          nextplan["authorization"]=dict(nextplan["authorization"],decision="Technical maintenance requested by owner; candidate pending separate final publication approval.",evidence_url="https://github.com/icfmp/Bible-Resources/issues/559")
          save(root/"config/release-plans/hmcc-modern-1.0.0.json",nextplan);release.unlink()
          print("MODERN_CANDIDATE",json.dumps(nextplan,sort_keys=True),flush=True)
          PY
          git add -A -- sources/cleaned/commentaries/en/hmcc-modern modules/hmcc-modern config/release-plans config/commentary-rebuilds/hmcc-modern.json catalog/v1/catalog.json
          python scripts/tool_registry.py --write
          git add -u -- reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          python scripts/release_preflight.py --module-id hmcc-modern --report "$RUNNER_TEMP/preflight.json"
          python -m unittest discover -s tests -v
      - name: Commit candidate to draft branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --stat
          git commit -m "Integrate proven header-only modern commentary maintenance candidate"
          git push origin HEAD:refs/heads/audit/hmcc-modern-maintenance
