# One-time inventory regeneration; removes itself in a source-bound commit.
name: Refresh consolidated nonlink script registry once
on:
  push:
    branches:
      - maintenance/consolidate-nonlink-lexical-20261121
    paths:
      - '.github/workflows/script-nonlink-registry-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ github.repository == 'icfmp/Bible-Resources' && github.ref == 'refs/heads/maintenance/consolidate-nonlink-lexical-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate registry and remove one-time helper
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/script-nonlink-registry-once.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git commit -m 'chore: synchronize registry for unified nonlink research'
          git push origin HEAD:refs/heads/maintenance/consolidate-nonlink-lexical-20261121
