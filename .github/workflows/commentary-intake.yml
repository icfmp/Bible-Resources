name: Observe commentary intake (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/commentary-intake.yml'
      - 'scripts/commentary_intake.py'
      - 'scripts/commentary_native_inventory.py'
      - 'scripts/sword_native_commentary_index.cpp'
      - 'scripts/pilot_fetch.py'
      - 'config/commentary-intake/**'
      - 'tests/test_commentary_intake.py'
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Reviewed config/commentary-intake/<id>.json manifest"
        required: true
        type: string
        default: mhcc-crosswire
      stage:
        description: "1 = metadata-only; observe = unpinned fingerprint; 2 = SHA-pinned readback"
        required: true
        type: choice
        default: auto
        options: ['1', 'observe', '2', 'auto']
permissions:
  contents: read
concurrency:
  group: commentary-intake-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select-source:
    runs-on: ubuntu-latest
    outputs:
      resources: ${{ steps.select.outputs.resources }}
    steps:
      - uses: actions/checkout@v4
      - name: Select exactly the modified commentary manifests
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RESOURCE_ID: ${{ inputs.resource_id || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          directory = Path("config/commentary-intake")
          registered = {}
          for path in sorted(directory.glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("category") == "commentary" and data.get("resource_id") == path.stem:
                  registered[path.as_posix()] = path.stem

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              requested = os.environ["INPUT_RESOURCE_ID"]
              if requested not in registered.values():
                  raise SystemExit(f"Unknown commentary manifest: {requested!r}")
              resources = [requested]
          else:
              # Default pull_request checkout is GitHub's synthetic merge commit:
              # first parent = base, HEAD = tested merged candidate.
              changed = set(subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^1", "HEAD"],
                  text=True).splitlines())
              resources = sorted(set(registered[path] for path in changed if path in registered))
              if not resources:
                  # Preserve the historical default when only reusable code or
                  # a corrections plan changes; no fabricated MHC acceptance.
                  resources = ["mhcc-crosswire"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("resources=" + json.dumps(resources) + "\n")
          print("Selected source identities:", ", ".join(resources))
          PY

  intake:
    needs: select-source
    strategy:
      fail-fast: false
      matrix:
        resource_id: ${{ fromJSON(needs.select-source.outputs.resources) }}
    name: Read-only intake (${{ matrix.resource_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESOURCE_ID: ${{ matrix.resource_id }}
      STAGE: ${{ github.event.inputs.stage || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real SWORD reader for bounded, content-free output hashes
        if: env.STAGE != '1'
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y diatheke libsword-dev
      - name: Observe original commentary in disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_intake.py \
            --resource-id "$RESOURCE_ID" \
            --stage "$STAGE" \
            --report "${RUNNER_TEMP}/commentary-intake-report.json"
      - name: Real native occupied-key inventory only for independently SHA-pinned source
        if: env.STAGE != '1'
        shell: bash
        run: |
          set -euo pipefail
          # This adds a distinct source/native structural observation to the
          # original read-only intake; no competing SWORD importer or release.
          if python - <<'PY'
          import json,os,re
          from pathlib import Path
          resource=os.environ["RESOURCE_ID"]
          assert re.fullmatch(r"[a-z][a-z0-9-]{1,63}",resource)
          stage=os.environ["STAGE"]
          p=Path("config/commentary-intake")/(resource+".json")
          conf=json.loads(p.read_text(encoding="utf-8"))
          pinned=bool(re.fullmatch(r"[a-f0-9]{64}",conf.get("archive_sha256") or ""))
          raise SystemExit(0 if stage in ("2","auto") and pinned else 1)
          PY
          then
            python -m pip install -r requirements.txt
            g++ -std=c++17 -O2 -I/usr/include/sword \
              scripts/sword_native_commentary_index.cpp \
              -o "${RUNNER_TEMP}/commentary-native-index" -lsword
            python scripts/commentary_native_inventory.py \
              --resource-id "$RESOURCE_ID" \
              --native-inspector "${RUNNER_TEMP}/commentary-native-index" \
              --report "${RUNNER_TEMP}/commentary-native-index.json"
            python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/
                             "commentary-native-index.json").read_text())
          assert result["status"]=="occupied_slot_inventory_not_entry_parity"
          assert result["rights_review_status"]=="research_only"
          assert result["source_to_native_text_fidelity_verified"] is False
          assert result["published"] is False
          print("Pinned real commentary native coverage:",
                result["module_id"],result["driver"],
                "K",result["occupied_numbered_slots"],
                "I",result["occupied_intro_slots"],
                "TOP",result["occupied_anonymous_top_slots"],
                "(not authorial parity or permission)")
          PY
          else
            echo "Native inventory not run: this intake is unpinned or metadata-only. No source fidelity PASS inferred."
          fi
      - name: Keep only metadata-only receipt, never the original module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary-intake-receipt-${{ matrix.resource_id }}
          path: |
            ${{ runner.temp }}/commentary-intake-report.json
            ${{ runner.temp }}/commentary-native-index.json
          if-no-files-found: warn
          retention-days: 30
      - name: Explain strict research scope
        if: always()
        shell: bash
        run: |
          {
            echo '## Commentary intake'
            echo 'Original archives and returned commentary text are **never uploaded**.'
            echo 'Read-only ZIP fingerprint and SWORD probes are evidence, not original/source parity.'
            echo 'A successful Action does **not** approve rights, repairs or release.'
            echo 'Store the validated fingerprint and next review decision in the import issue.'
          } >> "$GITHUB_STEP_SUMMARY"
