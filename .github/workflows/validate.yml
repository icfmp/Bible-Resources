name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and SWORD reader
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y diatheke libsword-dev
      - run: python -m unittest discover -s tests -v
      - name: Independently scan the exact published SWORD module's native verse-index
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_index.cpp -o "${RUNNER_TEMP}/sword-native-index" -lsword
          python scripts/sword_native_inventory.py \
            --inspector "${RUNNER_TEMP}/sword-native-index" \
            --module-directory modules/lsg-1910 \
            --module-id BRLSG1910 \
            --reader-keys-output "${RUNNER_TEMP}/sword-reader-keys.txt" \
            --registry-tsv-output "${RUNNER_TEMP}/sword-registry.tsv" \
            --report "${RUNNER_TEMP}/sword-native-index-proof.json"
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          from sys import path
          path.insert(0, "scripts")
          from stable_sword_refs import parse_keys, parse_registry
          audit = json.loads(Path("modules/lsg-1910/SOURCE_AUDIT.json").read_text())
          proof = json.loads((Path(os.environ["RUNNER_TEMP"]) / "sword-native-index-proof.json").read_text())
          trial = audit["stock_sword_compiled_candidate"]["full_source_verse_roundtrip"]
          original_source_count = trial["total_source_verse_keys"]
          approved_reader_merges = trial["totals"]["source_keys_missing"]
          expected_reader_count = original_source_count - approved_reader_merges
          assert proof["native_occupied_numbered_verse_count"] == expected_reader_count, (
              "Actual native SWORD occupied reference index has drifted from the independently attested release")
          assert proof["native_registry_chapter_count"] == trial["expected_chapters"], (
              "Installed stock SWORD registry differs from approved Segond audit")
          assert len(parse_keys((Path(os.environ["RUNNER_TEMP"]) / "sword-reader-keys.txt").read_text())) == expected_reader_count
          assert len(parse_registry((Path(os.environ["RUNNER_TEMP"]) / "sword-registry.tsv").read_text(), "Segond")) == trial["expected_chapters"]
          print("Independent stock SWORD native source-index readback agrees with original published LSG audit.")
          PY
      - name: Privately hash the complete actual approved LSG SWORD raw corpus
        shell: bash
        run: |
          set -euo pipefail
          # Raw Bible text moves only through the private captured pipe from
          # stock libsword into the Python hasher; never log stdout directly.
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_raw_corpus.cpp \
            -o "${RUNNER_TEMP}/sword-native-raw-corpus" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_raw_entry.cpp \
            -o "${RUNNER_TEMP}/sword-native-raw-entry" -lsword
          python scripts/sword_native_raw_corpus_inventory.py \
            --module-directory modules/lsg-1910 \
            --module-id BRLSG1910 \
            --native-raw-binary "${RUNNER_TEMP}/sword-native-raw-corpus" \
            --native-index-binary "${RUNNER_TEMP}/sword-native-index" \
            --native-entry-binary "${RUNNER_TEMP}/sword-native-raw-entry" \
            --report "${RUNNER_TEMP}/lsg-entire-native-raw-corpus.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          corpus = json.loads((root / "lsg-entire-native-raw-corpus.json").read_text())
          index = json.loads((root / "sword-native-index-proof.json").read_text())
          assert corpus["exact_all_occupied_native_keys_matched_independent_index"]
          assert corpus["independent_native_exact_key_raw_spotcheck_verified"]
          assert len(corpus["independent_native_exact_key_raw_spotcheck_refs"]) >= 2
          assert corpus["actual_occupied_numbered_entry_count"] == index["native_occupied_numbered_verse_count"]
          assert corpus["actual_occupied_intro_entry_count"] == index["native_occupied_verse_zero_intro_count"]
          assert corpus["actual_occupied_anonymous_top_entry_count"] == index["native_nonaddressable_populated_top_count"]
          assert len(corpus["all_native_raw_entries_ordered_sha256"]) == 64
          assert corpus["source_original_authorial_text_compared"] is False
          assert corpus["rights_and_editorial_approval"] is False
          print("Actual LSG full-corpus unfiltered stock-SWORD raw-entry SHA inventory passed without text disclosure")
          PY
      - name: Verify local approved LSG payload is byte-identical to itself (read-only update audit)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/diff_sword_snapshots.py \
            --module-id BRLSG1910 \
            --previous modules/lsg-1910/payload \
            --candidate modules/lsg-1910/payload \
            --report "${RUNNER_TEMP}/approved-module-snapshot-identity.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "approved-module-snapshot-identity.json").read_text())
          assert report["status"] == "file_bytes_identical_not_source_equivalence"
          assert report["changed_file_count"] == report["added_file_count"] == report["removed_file_count"] == 0
          assert report["actual_binary_files_changed"] is False
          assert report["published"] is False and report["editorial_approval"] is False
          print("Existing approved LSG SWORD payload read-only identity scan passed.")
          PY
      - run: python scripts/validate.py
      - run: python scripts/build.py --output dist
      - run: python scripts/smoke.py
