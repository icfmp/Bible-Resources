name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Only superseded PR validations are cancelled. Main branch and manually
# triggered release/reader research runs retain their own checkpoints.
concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and SWORD reader
        timeout-minutes: 8
        run: |
          python -m pip install -r requirements.txt
          # External mirror outages must fail CI promptly, not consume the
          # entire workflow timeout. No missing native test is waived.
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 \
            install -y diatheke libsword-dev
      - name: Audit original numbered Bible content across OSIS and reviewed USFM/USFX adapters
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          import json,zipfile
          from hashlib import sha256
          from pilot_preflight import inspect_archive
          from approved_osis_sword_candidate import approved_source_for
          from research.bible.original_authorial_content_parity import verify_numbered_content
          from research.bible.original_authorial_key_inventory import usfm,usfx,compare
          def read(path):
              path=Path(path)
              assert path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(Path.cwd())
              return json.loads(path.read_text())
          adapters=read("config/original-bible-content-adapters.json")
          assert adapters["schema_version"]==1
          reviewed=adapters["resources"]
          seen=set()
          osis_reviewed=adapters.get("osis_resources",{})
          osis_seen=set()
          for folder in sorted(Path("modules").iterdir()):
              if not (folder/"metadata.json").is_file():continue
              m=read(folder/"metadata.json")
              if m["category"]!="bible" or m["quality"]["status"]!="approved":continue
              resource=m["id"]
              original_dir=Path("sources/original/bibles")/m["language"]/resource
              provenance=read(original_dir/"PROVENANCE.json")
              if provenance["format"]=="OSIS":
                  assert resource not in reviewed,"Unexpected USFM adapter for OSIS original"
                  # Compare the actual pinned original and approved cleaned OSIS,
                  # using the same independent verse/note parser as native QA.
                  # Editorial repairs may legitimately differ: inventory them
                  # and account for each exact reviewed edit before accepting parity.
                  from approved_osis_sword_candidate import original_osis_verses_and_notes
                  from collections import Counter
                  original=original_dir/provenance["original_file"]
                  assert original.is_file() and not original.is_symlink()
                  assert original.resolve().is_relative_to(original_dir.resolve())
                  raw=original.read_bytes()
                  assert len(raw)==provenance["original_size_bytes"]
                  assert sha256(raw).hexdigest()==provenance["original_sha256"]
                  _,cleaned=approved_source_for(resource)
                  old,old_notes,old_meta=original_osis_verses_and_notes(raw)
                  new,new_notes,new_meta=original_osis_verses_and_notes(cleaned)
                  # All intentional differences are source-hash-bound data.
                  # Unlisted editions must preserve numbered semantics exactly.
                  review=osis_reviewed.get(resource)
                  marks={}
                  edits={}
                  if review is not None:
                      osis_seen.add(resource)
                      from hashlib import sha1
                      from source_osis_inventory import _source_tree, OSIS
                      assert sha256(raw).hexdigest()==review["original_sha256"]
                      assert sha256(cleaned).hexdigest()==review["cleaned_sha256"]
                      approval_path=Path(review["approval_manifest"])
                      approval=read(approval_path)
                      approval_bytes=approval_path.read_bytes()
                      assert sha1(b"blob "+str(len(approval_bytes)).encode()+b"\0"+approval_bytes).hexdigest()==review["approval_manifest_git_blob_sha1"]
                      assert approval["source_osis_sha256"]==review["original_sha256"]
                      assert approval["compiler_input_osis_sha256"]==review["cleaned_sha256"]
                      assert approval["owner_approval_url"]
                      marker_policy=review.get("division_markers")
                      if marker_policy:
                          tree=_source_tree(cleaned)
                          for verse in tree.iter(OSIS+"verse"):
                              ref=verse.get("sID")
                              if not ref:continue
                              node=verse.getnext()
                              if node is None or node.tag!=OSIS+"milestone" or node.get("type") not in marker_policy["types"]:continue
                              assert not (verse.tail or "").strip()
                              assert node.get("marker") is None and ref not in marks
                              mark=marker_policy["subtypes"][node.get("subType")]
                              assert mark and set(mark)=={"*"}
                              marks[ref]=mark
                          assert len(marks)==marker_policy["expected_count"]
                          all_markers=[n for n in tree.iter(OSIS+"milestone") if n.get("type") in marker_policy["types"]]
                          assert len(all_markers)==len(marks)
                      for ref,index,original_target,new_target in review.get("note_target_edits",[]):
                          assert ref in old_notes and 1<=index<=len(old_notes[ref])
                          key=(ref,index)
                          mapping=edits.setdefault(key,{})
                          assert original_target not in mapping
                          mapping[original_target]=new_target
                  counts=Counter()
                  samples={}
                  used_edits=set()
                  used_marks=set()
                  def delta(kind,ref,index=None):
                      counts[kind]+=1
                      rows=samples.setdefault(kind,[])
                      if len(rows)<12:
                          row={"reference":ref}
                          if index is not None:row["note_index"]=index
                          rows.append(row)
                  def nonspace(value):return "".join(value.split())
                  def folded(value):return " ".join(value.split())
                  for ref in sorted(set(old)-set(new)):delta("missing_verse",ref)
                  for ref in sorted(set(new)-set(old)):delta("added_verse",ref)
                  for ref in old:
                      if ref not in new:continue
                      counts["verse_pairs"]+=1
                      mark=marks.get(ref,"")
                      original_text=old[ref]
                      if mark:
                          original_text=original_text.lstrip()
                          assert original_text.startswith(mark)
                          original_text=original_text[len(mark):]
                          used_marks.add(ref)
                          counts["reviewed_division_markers_preserved"]+=1
                      if nonspace(original_text)!=nonspace(new[ref]):
                          delta("verse_nonspace_difference",ref)
                      if folded(original_text)!=folded(new[ref]):
                          delta("verse_folded_whitespace_difference",ref)
                      if len(old_notes[ref])!=len(new_notes[ref]):
                          delta("note_count_difference",ref)
                          continue
                      for i,(a_note,b_note) in enumerate(zip(old_notes[ref],new_notes[ref]),1):
                          counts["note_pairs"]+=1
                          for field in ("caller","type"):
                              if a_note[field]!=b_note[field]:delta("note_"+field+"_difference",ref,i)
                          if a_note["point"]-len(mark)!=b_note["point"]:
                              delta("note_point_difference",ref,i)
                          elif mark:
                              counts["reviewed_marker_note_anchor_shifts"]+=1
                          expected_targets=list(a_note["targets"])
                          for target,replacement in edits.get((ref,i),{}).items():
                              assert expected_targets.count(target)==1
                              idx=expected_targets.index(target)
                              if replacement is None:expected_targets.pop(idx)
                              else:expected_targets[idx]=replacement
                              used_edits.add((ref,i,target))
                              counts["reviewed_note_target_edits"]+=1
                          if tuple(expected_targets)!=b_note["targets"]:
                              delta("note_targets_difference",ref,i)
                          if nonspace(a_note["body"])!=nonspace(b_note["body"]):
                              delta("note_body_nonspace_difference",ref,i)
                          if folded(a_note["body"])!=folded(b_note["body"]):
                              delta("note_body_folded_whitespace_difference",ref,i)
                  print("ORIGINAL_OSIS_NUMBERED_DIFFERENCE_INVENTORY",resource,json.dumps({
                      "original_sha256":sha256(raw).hexdigest(),
                      "cleaned_sha256":sha256(cleaned).hexdigest(),
                      "original_book_count":old_meta["publisher_book_count"],
                      "cleaned_book_count":new_meta["publisher_book_count"],
                      "original_verse_count":len(old),"cleaned_verse_count":len(new),
                      "original_note_count":old_meta["publisher_numbered_note_count"],
                      "cleaned_note_count":new_meta["publisher_numbered_note_count"],
                      "original_outside_numbered_notes":old_meta["publisher_notes_outside_numbered_verses"],
                      "cleaned_outside_numbered_notes":new_meta["publisher_notes_outside_numbered_verses"],
                      "ordered_numbered_keys_equal":list(old)==list(new),
                      "counts":dict(counts),"bounded_reference_only_differences":samples,
                      "all_numbered_differences_reconciled_with_reviewed_edits":not samples,
                      "full_layout_or_typography_certified":False,
                  },sort_keys=True),flush=True)
                  # These are required invariants for the currently supported
                  # no-renumbering/no-note-caller-rewrite OSIS route. A future
                  # authorized change needs an explicit reviewed transformation
                  # policy; never a translation-specific bypass.
                  assert list(old)==list(new),(resource,"original numbered keys differ")
                  assert used_marks==set(marks),resource
                  assert used_edits=={(ref,i,t) for (ref,i),mapping in edits.items() for t in mapping},resource
                  assert not samples,(resource,dict(counts))
                  assert old_meta["publisher_notes_outside_numbered_verses"]==new_meta["publisher_notes_outside_numbered_verses"],resource
                  continue
              assert provenance["format"]=="USFM" and resource in reviewed,("No reviewed original-format adapter",resource)
              a=reviewed[resource];seen.add(resource)
              witness=provenance["additional_original_witness"]
              assert witness["format"]=="USFX"
              fm=original_dir/provenance["original_file"];fx=original_dir/witness["filename"]
              for archive,digest,size in [(fm,provenance["original_sha256"],provenance["original_size_bytes"]),(fx,witness["sha256"],witness["size_bytes"])]:
                  result=inspect_archive(archive,source_kind="authored")
                  assert result["archive_sha256"]==digest and result["archive_bytes"]==size
              assert a["usfm_sha256"]==provenance["original_sha256"] and a["usfx_sha256"]==witness["sha256"]
              crosswalk=read(a["crosswalk"])
              mapping={x["usfm"]:x["osis"] for x in crosswalk["books"]}
              assert len(mapping)==len(crosswalk["books"])==len(set(mapping.values()))
              repairs={}
              if a.get("note_repair_ledger"):
                  ledger_path=Path(a["note_repair_ledger"])
                  ledger=read(ledger_path)
                  assert sha256(ledger_path.read_bytes()).hexdigest()==a["note_repair_ledger_sha256"]
                  approval=read(a["approval_manifest"])
                  from hashlib import sha1
                  approved_bytes=Path(a["approval_manifest"]).read_bytes()
                  assert sha1(b"blob "+str(len(approved_bytes)).encode()+b"\0"+approved_bytes).hexdigest()==a["approval_manifest_git_blob_sha1"]
                  assert approval["editorial_approval"]["approved_by"]=="Bible Resources project owner"
                  assert ledger["original_usfx_zip_sha256"]==witness["sha256"]==approval["source_usfx_zip_sha256"]
                  for e in ledger["edits"]:
                      if e["type"]!="cross_reference_fragment":continue
                      k=(e["book"]+"."+e["source_origin"],e["source_note_caller"])
                      assert k not in repairs
                      repairs[k]=(e["original_label"],e["new_label"])
              _,xml=approved_source_for(resource)
              with zipfile.ZipFile(fm) as zfm,zipfile.ZipFile(fx) as zfx:
                  member=a["usfx_member"]
                  assert zfx.namelist().count(member)==1
                  fm_keys,_=usfm(zfm);fx_keys,_=usfx(zfx,member)
                  assert compare(fm_keys,fx_keys)["ordered_labels_within_every_book_equal"]
                  proof=verify_numbered_content(zfx.read(member),xml,mapping,repairs,zfm)
              print("MANDATORY_ORIGINAL_NUMBERED_CONTENT",resource,json.dumps(proof,sort_keys=True),flush=True)
              assert proof["all_supported_content_checks_equal"],(resource,proof["mismatch_counts"])
          assert seen==set(reviewed),"Unused/stale original-format adapter"
          assert osis_seen==set(osis_reviewed),"Unused/stale original OSIS review"
          PY
      - name: Require original USFX poetry, Selah, tables and numbered paragraph fidelity
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from collections import Counter,defaultdict
          import hashlib,json,re,zipfile
          from pathlib import Path
          from lxml import etree
          from pilot_preflight import PilotError,inspect_archive
          from approved_osis_sword_candidate import approved_source_for
          from source_osis_inventory import _source_tree,OSIS
          from research.bible.original_authorial_content_parity import parse_usfx
          NON_VERSE_TEXT_ELEMENTS={"x","f","fig","s","r","toc","h","id"}
          NON_VERSE_PARAGRAPH_STYLES={"r","s","s1","s2","s3","s4","sr","h","toc1","toc2","toc3"}
          SKIP_TARGET=frozenset(("title","header","note","revisionDesc","description"))
          SKIP_SOURCE=frozenset(NON_VERSE_TEXT_ELEMENTS)|{'fe','ef','ex'}
          def _name(node):
              return etree.QName(node).localname if isinstance(node.tag,str) else ""
          
          
          def _hash(value):
              return hashlib.sha256(value.encode("utf-8")).hexdigest()
          
          
          def _no_space(text):
              return "".join(text.split())
          
          
          POETRY_STYLES=re.compile(r"^(?:q[1-4]?|qm[1-4]?|qr|qc|qd)$")
          
          
          def _source_poetry_style(node):
              """A poetic paragraph is identified by USFX marker/style, never guesswork."""
              name=_name(node)
              marker=node.get("sfm") or node.get("style") or name
              if name not in {"q","qr","qc","qd","qm","p"}:
                  return None
              if not POETRY_STYLES.fullmatch(marker):
                  if name in {"q","qr","qc","qd","qm"} or marker.startswith("q"):
                      raise PilotError("Unreviewed source poetry paragraph style")
                  return None
              if marker in {"qr","qc","qd"}:
                  return {"qr":"right","qc":"center","qd":"hebrew-end"}[marker]
              embedded=marker.startswith("qm")
              level=marker[2:] if embedded else marker[1:]
              return ("embedded" if embedded else "indent") + ":" + (level or "1")
          
          
          def _candidate_poetry_style(node):
              kind=node.get("type")
              if kind=="selah":
                  # OSIS uses a separate <l> for the USFM inline \qs marker.
                  # Audit it as editorial text, never as an ordinary poetic line.
                  return None
              if kind in {"x-right","x-center","x-usfm-qd"}:
                  return {"x-right":"right","x-center":"center",
                          "x-usfm-qd":"hebrew-end"}[kind]
              if kind not in (None,"x-embedded"):
                  return "unsupported-type:"+kind
              level=node.get("level")
              if not level or not level.isdecimal():
                  return "unsupported-level:"+str(level)
              return ("embedded" if kind=="x-embedded" else "indent")+":"+level
          
          
          def _read(root, *, source):
              """Read line text as XML events; verse ownership changes at milestones."""
              expected="usfx" if source else "osis"
              if _name(root)!=expected:
                  raise PilotError(f"Poetry segment audit expected {expected} XML")
              book_iterator=root.iter("book") if source else (
                  node for node in root.iter(OSIS+"div") if node.get("type")=="book")
              assigned=defaultdict(list)
              selah_by_verse=defaultdict(list)
              selah_nodes=0
              selah_unowned_nodes=0
              total_nodes=0
              with_text_unowned=0
              empty_nodes=0
              multiverse_nodes=0
              styles=Counter()
              for book in book_iterator:
                  code=book.get("id") if source else book.get("osisID")
                  if not code:
                      raise PilotError("Unreviewed book identity in poetry segment audit")
                  chapter=None
                  current=None
                  active_lines=[]
                  active_selah=[]
          
                  def emit(value):
                      if not value or not value.strip():
                          return
                      if active_selah:
                          marker=active_selah[-1]
                          if current is None:
                              marker["unowned_text"]+=len(_no_space(value))
                          else:
                              marker["parts"][current].append(value)
                          return
                      if not active_lines:
                          return
                      line=active_lines[-1]
                      if current is None:
                          line["unowned_text"]+=len(_no_space(value))
                      else:
                          line["parts"][current].append(value)
          
                  def walk(node):
                      nonlocal chapter,current,total_nodes,empty_nodes,multiverse_nodes,with_text_unowned
                      nonlocal selah_nodes,selah_unowned_nodes
                      if isinstance(node,etree._Comment):
                          return
                      if not isinstance(node.tag,str):
                          raise PilotError("Unexpected non-element in poetry segmentation")
                      kind=_name(node)
                      if source:
                          if kind=="c":
                              val=node.get("id")
                              if not val or not val.isdecimal():
                                  raise PilotError("Unreviewed USFX chapter for poetry")
                              chapter=int(val)
                          elif kind=="v":
                              val=node.get("id")
                              if not val or not val.isdecimal() or chapter is None:
                                  raise PilotError("Unreviewed USFX verse for poetry")
                              current=(code,chapter,int(val))
                          elif kind=="ve":
                              if current is None:
                                  raise PilotError("USFX orphan verse close in poetry audit")
                              current=None
                          if (kind in SKIP_SOURCE or
                                  (kind=="p" and (node.get("sfm") or node.get("style"))
                                   in NON_VERSE_PARAGRAPH_STYLES)):
                              return
                      else:
                          if kind=="verse":
                              start=node.get("osisID") or node.get("sID")
                              end=node.get("eID")
                              if start:
                                  if current is not None:
                                      raise PilotError("Overlapping OSIS verse in poetry segment audit")
                                  current=start
                              elif end:
                                  if current!=end:
                                      raise PilotError("Mismatched OSIS verse ending in poetry segment audit")
                                  current=None
                              else:
                                  raise PilotError("Unknown OSIS verse marker in poetry segment audit")
                          if kind in SKIP_TARGET:
                              return
                      is_selah=(kind=="qs" if source else
                                kind=="l" and node.get("type")=="selah")
                      if is_selah:
                          if active_selah:
                              raise PilotError("Nested Selah markers require editorial review")
                          selah_nodes+=1
                          active_selah.append({"parts":defaultdict(list),"unowned_text":0})
                      style=_source_poetry_style(node) if source else (
                          _candidate_poetry_style(node) if kind=="l" else None)
                      is_poetic_line=(style is not None)
                      if is_poetic_line:
                          if active_lines:
                              raise PilotError("Nested poetry line nodes require editorial review")
                          total_nodes+=1
                          styles[style]+=1
                          active_lines.append({"level":style,
                                               "parts":defaultdict(list),"unowned_text":0})
                      emit(node.text)
                      for child in node:
                          walk(child)
                          emit(child.tail)
                      if is_poetic_line:
                          line=active_lines.pop()
                          if not line["parts"] and not line["unowned_text"]:
                              empty_nodes+=1
                          if line["unowned_text"]:
                              with_text_unowned+=1
                          if len(line["parts"])>1:
                              multiverse_nodes+=1
                          for ref, text_parts in line["parts"].items():
                              body="".join(text_parts)
                              compact=_no_space(body)
                              if not compact:
                                  continue
                              assigned[ref].append({
                                  "level":line["level"],
                                  "text_sha256":_hash(compact),
                                  "chars":len(compact),
                              })
                      if is_selah:
                          marker=active_selah.pop()
                          if marker["unowned_text"]:
                              selah_unowned_nodes+=1
                          for ref, chunks in marker["parts"].items():
                              compact=_no_space("".join(chunks))
                              selah_by_verse[ref].append({
                                  "text_sha256":_hash(compact),"chars":len(compact)})
                  walk(book)
                  if active_selah:
                      raise PilotError("Open Selah marker in poetry audit")
                  if active_lines:
                      raise PilotError("Open poetry line in source XML")
                  if not source and current is not None:
                      raise PilotError("Open OSIS verse at end of poetry audit book")
              return assigned, {
                  "all_poetry_line_nodes":total_nodes,
                  "selah_marker_nodes":selah_nodes,
                  "selah_marker_nodes_outside_verse":selah_unowned_nodes,
                  "line_nodes_containing_nonverse_text":with_text_unowned,
                  "empty_poetry_line_nodes":empty_nodes,
                  "line_nodes_spanning_multiple_verses":multiverse_nodes,
                  "poetry_line_style_counts":dict(sorted(styles.items())),
              },selah_by_verse
          
          
          def audit_segments(source_root, candidate_root, mapping, source_keys):
              if isinstance(candidate_root,etree._ElementTree):
                  candidate_root=candidate_root.getroot()
              authored,source_meta,source_selah=_read(source_root,source=True)
              converted,target_meta,target_selah=_read(candidate_root,source=False)
              hist=Counter()
              mismatching_books=Counter()
              discrepancies=Counter()
              first=[]
              equal_counts=equal_text=equal_levels=0
              missing_line_patterns=Counter()
              initial_line_loss_refs=[]
              equal_selah=0
              first_selah_differences=[]
              for book,chapter,verse in source_keys:
                  key=(book,chapter,verse)
                  target_key=f"{mapping[book]}.{chapter}.{verse}"
                  a=authored.get(key,())
                  b=converted.get(target_key,())
                  delta=len(b)-len(a)
                  hist[delta]+=1
                  if delta<0:
                      matching_suffix=(
                          [x["text_sha256"] for x in b]
                          ==[x["text_sha256"] for x in a[-len(b):]]
                          if b else True
                      )
                      if (delta==-1 and matching_suffix
                              and [x["level"] for x in b]
                              ==[x["level"] for x in a[1:]]):
                          pattern="missing_first_source_line_other_lines_intact"
                          if len(initial_line_loss_refs)<60:
                              initial_line_loss_refs.append({
                                  "reference":f"{book}.{chapter}.{verse}",
                                  "missing_line_text_sha256":a[0]["text_sha256"],
                                  "missing_line_text_characters":a[0]["chars"],
                                  "chapter_first_verse":verse==1,
                              })
                      else:
                          pattern="other_missing_line_or_merged_text"
                      missing_line_patterns[pattern]+=1
                  selah_a=source_selah.get(key,())
                  selah_b=target_selah.get(target_key,())
                  if selah_a==selah_b:
                      equal_selah+=1
                  elif len(first_selah_differences)<35:
                      first_selah_differences.append({
                          "reference":f"{book}.{chapter}.{verse}",
                          "source_selah_count":len(selah_a),
                          "candidate_selah_count":len(selah_b),
                          "source_text_hashes":[x["text_sha256"] for x in selah_a],
                          "candidate_text_hashes":[x["text_sha256"] for x in selah_b],
                      })
                  same_count=(delta==0)
                  same_text=(same_count and
                             [x["text_sha256"] for x in a]==
                             [x["text_sha256"] for x in b])
                  known_levels=all(x["level"] is not None for x in (*a,*b))
                  same_levels=(same_count and known_levels
                               and [x["level"] for x in a]==[x["level"] for x in b])
                  equal_counts+=same_count
                  equal_text+=same_text
                  equal_levels+=same_levels
                  if same_text and same_levels:
                      continue
                  mismatching_books[book]+=1
                  if not same_count:
                      discrepancies["line_count"]+=1
                  if not same_text:
                      discrepancies["line_text_or_segmentation"]+=1
                  if not same_levels:
                      discrepancies["indentation_unknown_or_different"]+=1
                  if len(first)<80:
                      first.append({
                          "reference":f"{book}.{chapter}.{verse}",
                          "source_lines":len(a),"candidate_lines":len(b),
                          "count_equal":same_count,
                          "line_text_equal_ignoring_whitespace":same_text,
                          "indentation_levels_equal":same_levels,
                          "source_levels":[x["level"] for x in a],
                          "candidate_levels":[x["level"] for x in b],
                          "source_line_hashes":[x["text_sha256"] for x in a],
                          "candidate_line_hashes":[x["text_sha256"] for x in b],
                      })
              missing_source_keys=len(set(authored)-set(source_keys))
              allowed_target={f"{mapping[c]}.{ch}.{v}" for c,ch,v in source_keys}
              unexpected_target_keys=len(set(converted)-allowed_target)
              total=len(source_keys)
              return {
                  "total_compared_verse_keys":total,
                  "source_poetry":source_meta,
                  "candidate_poetry":target_meta,
                  "matching_verse_line_counts_with_text_ownership":equal_counts,
                  "matching_verse_line_text_sequences_ignoring_whitespace":equal_text,
                  "matching_verse_line_indentation_levels":equal_levels,
                  "matching_verse_selah_marker_text_sequences":equal_selah,
                  "first_selah_differences":first_selah_differences,
                  "all_selah_text_and_verse_positions_verified":(
                      equal_selah==total
                      and source_meta["selah_marker_nodes"]==target_meta["selah_marker_nodes"]
                      and not source_meta["selah_marker_nodes_outside_verse"]
                      and not target_meta["selah_marker_nodes_outside_verse"]),
                  "line_delta_histogram":dict(sorted(hist.items())),
                  "missing_line_pattern_classification":dict(sorted(missing_line_patterns.items())),
                  "first_source_line_loss_references":initial_line_loss_refs,
                  "mismatching_books":dict(sorted(mismatching_books.items())),
                  "difference_categories":dict(sorted(discrepancies.items())),
                  "source_poetry_keys_outside_verse_index":missing_source_keys,
                  "candidate_poetry_keys_outside_verse_index":unexpected_target_keys,
                  "first_differences":first,
                  "all_poetry_segments_and_levels_verified":(
                      equal_counts==equal_text==equal_levels==total
                      and not missing_source_keys and not unexpected_target_keys
                      and not source_meta["line_nodes_containing_nonverse_text"]
                      and not target_meta["line_nodes_containing_nonverse_text"]
                  ),
                  "full_editorial_poetry_layout_verified":False,
                  "limitation":"Independent content-owner audit handles lines spanning milestones. "
                               "USFM inline \\qs and OSIS <l type=selah> are compared separately; "
                               "their presentation is not automatically equivalent. "
                               "Line grouping (<lg>), blank stanzas, headings and presentation "
                               "must still be reviewed; no original body text is exported.",
              }
          # Exercise the actual comparator, not an unrelated mock. The same
          # line spans two verse milestones and a Selah is separately owned.
          sample_source=parse_usfx(b'<usfx><book id="GEN"><c id="1"/>'
              b'<q sfm="q1"><v id="1"/>alpha<ve/><v id="2"/>beta<qs>Selah</qs><ve/></q>'
              b'</book></usfx>')
          sample_target=(b'<osis xmlns="http://www.bibletechnologies.net/2003/OSIS/namespace">'
              b'<div type="book" osisID="Gen"><chapter osisID="Gen.1"><lg>'
              b'<l level="1"><verse osisID="Gen.1.1" sID="Gen.1.1"/>alpha'
              b'<verse eID="Gen.1.1"/><verse osisID="Gen.1.2" sID="Gen.1.2"/>beta'
              b'</l><l type="selah">Selah</l><verse eID="Gen.1.2"/>'
              b'</lg></chapter></div></osis>')
          def sample_passes(raw):
              result=audit_segments(sample_source,etree.fromstring(raw),
                  {"GEN":"Gen"},[("GEN",1,1),("GEN",1,2)])
              return (result["all_poetry_segments_and_levels_verified"] and
                      result["all_selah_text_and_verse_positions_verified"] and
                      result["source_poetry"]==result["candidate_poetry"])
          assert sample_passes(sample_target),"Valid multi-verse poetry fixture rejected"
          for corrupted in (
              sample_target.replace(b'<l level="1">',b'<l level="2">'),
              sample_target.replace(b'alpha',b'altered'),
              sample_target.replace(b'beta</l>',b'</l>beta'),
              sample_target.replace(b'<l type="selah">Selah</l>',b'Selah'),
              sample_target.replace(b'>Selah</l>',b'>Changed</l>'),
              sample_target.replace(b'</lg>',b'<l level="1"/></lg>'),
          ):
              assert not sample_passes(corrupted),"Poetry corruption was accepted"
          print("Original poetry comparator: positive fixture and six corruption cases passed")
          # Read-only structural checks recovered from the source-attested
          # table/paragraph repair evidence. No patching or resource IDs.
          def table_signature(book,source):
              def cell_spans(cell):
                  pos=0; spans=[]
                  def append(value):
                      nonlocal pos
                      pos+=len(_no_space(value or ""))
                  def walk(node):
                      kind=_name(node)
                      if not kind:return
                      start=pos
                      if node is cell:style=None
                      elif source and kind in {"it","bd","ord","wj"}:
                          style={"it":"italic","bd":"bold","ord":"super","wj":"quotation"}[kind]
                      elif not source and kind=="hi":style=node.get("type")
                      elif not source and kind=="q":style="quotation"
                      else:raise ValueError("Unsupported table inline element "+kind)
                      append(node.text)
                      for child in node:
                          walk(child);append(child.tail)
                      if style:spans.append((style,start,pos))
                  walk(cell)
                  return spans
              tables=[]
              for table in book.iter("table" if source else OSIS+"table"):
                  rows=[]
                  for row in table:
                      assert _name(row)==("tr" if source else "row")
                      cells=[]
                      for cell in row:
                          assert _name(cell) in ({"tc","th"} if source else {"cell"})
                          cells.append((" ".join("".join(cell.itertext()).split()),
                              _name(cell)=="th" if source else cell.get("role")=="label",
                              cell_spans(cell)))
                      rows.append(cells)
                  tables.append(rows)
              return tables
          def paragraph_signature(book,source):
              # Numbered nonspace coordinates remain stable across format
              # conversion, including in-verse paragraph openings.
              pos=0; current=None; chapter=None; starts=[]
              styles={"p":None,"m":"x-noindent","pi":"x-indented-1","pi1":"x-indented-1"}
              titles={"s","s1","s2","s3","s4","r","sr","mr","ms","ms1","ms2","ms3",
                      "mt","mt1","mt2","mt3","imt","imt1","imt2","imt3","is","is1","is2"}
              def append(value):
                  nonlocal pos
                  if current is not None:pos+=len(_no_space(value or ""))
              def walk(n):
                  nonlocal current,chapter
                  k=_name(n)
                  if not k:return
                  style=n.get("sfm") or n.get("style") or k
                  if source and (k in {"x","f","fe","ef","ex","id","h","toc"}|titles or k=="p" and style in titles):return
                  if not source and k in {"note","title","header"}:return
                  container=False
                  if source and k=="c":
                      assert current is None;chapter=n.get("id")
                  elif source and k=="v":
                      assert current is None and chapter;current=n.get("id")
                  elif source and k=="ve":
                      assert current is not None;current=None
                  elif not source and k=="verse":
                      if n.get("eID"):
                          assert current==n.get("eID");current=None
                      else:
                          assert current is None and n.get("osisID")
                          current=n.get("osisID");container=not bool(n.get("sID"))
                  if source and k=="p" and style in styles and pos>0:
                      starts.append((pos,styles[style]))
                  if not source and k=="p" and pos>0:
                      assert n.get("type") in set(styles.values())
                      starts.append((pos,n.get("type")))
                  append(n.text)
                  for c in n:
                      walk(c);append(c.tail)
                  if container:current=None
              walk(book)
              assert current is None
              return starts,pos
          def compare_original_tables_and_paragraphs(source,target,mapping):
              old={mapping[b.get("id")]:b for b in source.iter("book")}
              new={b.get("osisID"):b for b in target.iter(OSIS+"div") if b.get("type")=="book"}
              assert old and list(old)==list(new)
              counts=Counter(); findings=[]
              for ident in old:
                  a=table_signature(old[ident],True);b=table_signature(new[ident],False)
                  counts["source_tables"]+=len(a);counts["candidate_tables"]+=len(b)
                  counts["source_cells"]+=sum(len(row) for table in a for row in table)
                  counts["candidate_cells"]+=sum(len(row) for table in b for row in table)
                  if a!=b:findings.append((ident,"tables"))
                  x,n=paragraph_signature(old[ident],True);y,m=paragraph_signature(new[ident],False)
                  counts["source_numbered_paragraph_starts_after_offset_zero"]+=len(x)
                  counts["candidate_numbered_paragraph_starts_after_offset_zero"]+=len(y)
                  if x!=y or n!=m:findings.append((ident,"numbered_paragraph_starts"))
              return {"books":len(old),"counts":dict(counts),"differences":findings,
                      "supported_table_and_numbered_paragraph_parity":not findings,
                      "scope":"ordered table rows/cell text/header roles/selected inline spans; paragraph starts and style at positive numbered offsets; not initial or intro paragraph boundaries or exact typography"}
          # Positive fixture with a mid-verse paragraph and two distinct tables.
          sample_layout_source=parse_usfx(b'<usfx><book id="GEN">'
              b'<table><tr><th>A</th><tc><it>B</it>C</tc></tr></table>'
              b'<table><tr><tc>D</tc></tr></table><c id="1"/>'
              b'<p><v id="1"/>alpha</p><p sfm="m">beta<ve/></p>'
              b'</book></usfx>')
          sample_layout_target=(b'<osis xmlns="http://www.bibletechnologies.net/2003/OSIS/namespace">'
              b'<div type="book" osisID="Gen"><table><row><cell role="label">A</cell>'
              b'<cell><hi type="italic">B</hi>C</cell></row></table>'
              b'<table><row><cell>D</cell></row></table><chapter osisID="Gen.1">'
              b'<p><verse osisID="Gen.1.1" sID="Gen.1.1"/>alpha</p>'
              b'<p type="x-noindent">beta<verse eID="Gen.1.1"/></p>'
              b'</chapter></div></osis>')
          def layout_sample(raw):
              return compare_original_tables_and_paragraphs(
                  sample_layout_source,etree.fromstring(raw),{"GEN":"Gen"})
          assert layout_sample(sample_layout_target)["supported_table_and_numbered_paragraph_parity"]
          for before,after,kind in (
              (b'role="label"',b'role="data"',"tables"),
              (b'>A</cell>',b'>X</cell>',"tables"),
              (b'<hi type="italic">B</hi>C',b'B<hi type="italic">C</hi>',"tables"),
              (b'</row></table><table><row>',b'</row><row>',"tables"),
              (b'</p><p type="x-noindent">beta',b'b</p><p type="x-noindent">eta',"numbered_paragraph_starts"),
              (b'<p type="x-noindent">',b'<p type="x-indented-1">',"numbered_paragraph_starts"),
              (b'</p><p type="x-noindent">',b'',"numbered_paragraph_starts"),
          ):
              assert sample_layout_target.count(before)==1
              proof=layout_sample(sample_layout_target.replace(before,after))
              assert ("Gen",kind) in proof["differences"],kind
          print("Original layout comparator: positive fixture and seven corruption cases passed")
          # Use the same explicit, hash-pinned original member and reviewed
          # crosswalk as the preceding original numbered-content gate.
          adapters=json.loads(Path("config/original-bible-content-adapters.json").read_text())["resources"]
          for resource,a in sorted(adapters.items()):
              m=json.loads((Path("modules")/resource/"metadata.json").read_text())
              assert m["quality"]["status"]=="approved" and m["category"]=="bible"
              folder=Path("sources/original/bibles")/m["language"]/resource
              p=json.loads((folder/"PROVENANCE.json").read_text())
              witness=p["additional_original_witness"]
              assert witness["format"]=="USFX" and witness["sha256"]==a["usfx_sha256"]
              archive=folder/witness["filename"]
              receipt=inspect_archive(archive,source_kind="authored")
              assert receipt["archive_sha256"]==witness["sha256"] and receipt["archive_bytes"]==witness["size_bytes"]
              with zipfile.ZipFile(archive) as z:
                  assert z.namelist().count(a["usfx_member"])==1
                  raw=z.read(a["usfx_member"])
              root=parse_usfx(raw)
              crosswalk=json.loads(Path(a["crosswalk"]).read_text())
              mapping={x["usfm"]:x["osis"] for x in crosswalk["books"]}
              assert len(mapping)==len(crosswalk["books"])==len(set(mapping.values()))
              keys=[]
              for book in root.iter("book"):
                  chapter=None
                  for n in book.iter():
                      if n.tag=="c":chapter=int(n.get("id"))
                      if n.tag=="v":keys.append((book.get("id"),chapter,int(n.get("id"))))
              assert len(keys)==len(set(keys)) and keys
              _,xml=approved_source_for(resource)
              result=audit_segments(root,_source_tree(xml),mapping,keys)
              result.update({"resource":resource,"source_zip_sha256":witness["sha256"],"approved_osis_sha256":hashlib.sha256(xml).hexdigest()})
              print("ORIGINAL_USFX_POETRY_PROOF",json.dumps(result,sort_keys=True),flush=True)
              assert result["all_poetry_segments_and_levels_verified"],resource
              assert result["all_selah_text_and_verse_positions_verified"],resource
              # No lost/inserted line nodes even if verse-owned text matches.
              assert result["source_poetry"]==result["candidate_poetry"],resource
              layout=compare_original_tables_and_paragraphs(root,_source_tree(xml),mapping)
              print("ORIGINAL_USFX_TABLE_PARAGRAPH_PROOF",resource,json.dumps(layout,sort_keys=True),flush=True)
              assert layout["supported_table_and_numbered_paragraph_parity"],(resource,layout["differences"])
          PY
      - name: Audit exact stock-reader-key Bible payloads (read-only candidate evidence)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_index.cpp -o "$RUNNER_TEMP/candidate-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_raw_corpus.cpp -o "$RUNNER_TEMP/candidate-raw" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_render.cpp -o "$RUNNER_TEMP/candidate-render" -lsword
          "$RUNNER_TEMP/candidate-render" --self-test
          PYTHONPATH=scripts python - <<'PY'
          import hashlib, io, json, os, re, subprocess, zipfile
          from pathlib import Path
          from approved_osis_sword_candidate import (
              approved_source_for, _candidate_result, original_osis_verses_and_notes,
              project_reviewed_merge_slots, _read_native_frames,
              authorial_structures, authorial_body_opening_sequences,
              authorial_book_streams, authorial_outside_book_titles,
          )
          from pilot_subprocess import query
          from smoke import reader_failure_class
          from stable_sword_refs import (module_payload_digest, proof_errors, load_approved_merge_policy,
                                         inspect_references, parse_keys, parse_registry)
          from sword_native_inventory import collect_native_inventory
          from source_osis_inventory import _source_tree, OSIS
          from lxml import etree
          tmp = Path(os.environ["RUNNER_TEMP"])
          legacy = json.loads(Path("config/release-legacy-bindings.json").read_text())["entries"]
          legacy = {row["module_id"]: row for row in legacy}
          for folder in sorted(Path("modules").iterdir()):
              if not (folder / "metadata.json").is_file():
                  continue
              m = json.loads((folder / "metadata.json").read_text())
              if m["quality"]["status"] != "approved" or m["category"] != "bible":
                  continue
              payload = folder / "payload"
              # Diagnostic fingerprint only. The production builder and snapshot gate
              # independently verify the canonical archive later in this workflow.
              stream = io.BytesIO()
              members = {}
              with zipfile.ZipFile(stream, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
                  for p in sorted(p for p in payload.rglob("*") if p.is_file()):
                      rel = p.relative_to(payload).as_posix()
                      data = p.read_bytes()
                      members[rel] = hashlib.sha256(data).hexdigest()
                      info = zipfile.ZipInfo(rel, (1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      z.writestr(info, data)
              receipt = {
                  "resource_id": m["id"], "version": m["version"],
                  "package_sha256": hashlib.sha256(stream.getvalue()).hexdigest(),
                  "package_size_bytes": len(stream.getvalue()),
                  "module_payload_sha256": module_payload_digest(folder),
                  "member_sha256": members,
              }
              print("CANDIDATE_FINGERPRINT", json.dumps(receipt, sort_keys=True), flush=True)
              previous_root = None
              old = legacy.get(m["id"])
              release_proof = folder / "RELEASE_PROVENANCE.json"
              config_only = False
              if release_proof.is_file():
                  proof = json.loads(release_proof.read_text())
                  config_only = proof.get("candidate_scope") == "configuration_only"
                  if config_only:
                      old = proof["prior_release_binding"]
                      assert old["module_id"] == m["id"] and old["sword_id"] == m["sword_id"]
              if old and old["version"] != m["version"]:
                  previous = tmp / old["asset_name"]
                  subprocess.run(["gh", "release", "download", old["tag"],
                                  "--pattern", old["asset_name"], "--dir", str(tmp)],
                                 check=True, timeout=120)
                  prior_bytes = previous.read_bytes()
                  assert hashlib.sha256(prior_bytes).hexdigest() == old["release_sha256"]
                  assert len(prior_bytes) == old["release_size_bytes"]
                  with zipfile.ZipFile(previous) as z:
                      assert z.testzip() is None
                      assert len(z.namelist()) == len(members)
                      assert set(z.namelist()) == set(members)
                      changed = sorted(name for name in members
                                       if hashlib.sha256(z.read(name)).hexdigest() != members[name])
                  if config_only:
                      assert changed == ["mods.d/" + m["sword_id"].lower() + ".conf"], (m["id"], changed)
                      previous_root = tmp / (m["id"] + "-previous-payload")
                      previous_root.mkdir()
                      # Names exactly match the validated current regular-file layout.
                      with zipfile.ZipFile(previous) as z:
                          for name in members:
                              target = previous_root / name
                              target.parent.mkdir(parents=True, exist_ok=True)
                              target.write_bytes(z.read(name))
                  print("PREVIOUS_RELEASE_COMPARISON", json.dumps({
                      "resource_id": m["id"], "previous_tag": old["tag"],
                      "previous_zip_sha256": old["release_sha256"], "changed_members": changed,
                  }), flush=True)
              provenance = Path("sources/original/bibles") / m["language"] / m["id"] / "PROVENANCE.json"
              if provenance.is_file():
                  p = json.loads(provenance.read_text())
                  if p.get("original_file") and p.get("original_sha256"):
