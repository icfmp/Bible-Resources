name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and SWORD reader
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y diatheke
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: python scripts/build.py --output dist
      - run: python scripts/smoke.py
