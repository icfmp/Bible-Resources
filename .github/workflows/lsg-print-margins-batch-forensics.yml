name: LSG printed 1910 margin alignment exploratory (read-only)
on:
  pull_request:
    paths:
      - .github/workflows/lsg-print-margins-batch-forensics.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install DjVu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y djvulibre-bin
          python -m pip install -q rapidfuzz
      - uses: actions/cache@v4
        with:
          path: /tmp/lsg-original-1910.djvu
          key: pinned-1910-djvu-67854882ec0e88defa5fea2d76a53ef479d2173467cdfa9b57f94a91c470643b-v2
      - name: Verify original 1910 facsimile identity
        run: |
          if [ ! -f /tmp/lsg-original-1910.djvu ]; then
            curl -fsSL --retry 3 'https://upload.wikimedia.org/wikipedia/commons/1/17/La_Sainte_Bible%2C_trad._Segond%2C_ed._1910.djvu' -o /tmp/lsg-original-1910.djvu
          fi
          echo '67854882ec0e88defa5fea2d76a53ef479d2173467cdfa9b57f94a91c470643b  /tmp/lsg-original-1910.djvu' | sha256sum -c
      - name: Align 54 source verses to physical page marginal OCR coordinates (not transcription certification)
        run: |
          mkdir -p /tmp/print1910-margin-batch
          python - <<'PY'
          from pathlib import Path
          from rapidfuzz import fuzz
          from concurrent.futures import ThreadPoolExecutor
          from unicodedata import normalize,combining
          import subprocess,re,json,statistics
          ledger=json.loads(Path('sources/cleaned/bibles/fr/lsg-1910/editorial/PRINTED_1910_PAGE_LOCATORS_2026-11-23.json').read_text(encoding='utf-8'))
          assert len(ledger['records'])==54
          def normalize_words(s):
              t=normalize('NFKD',s.casefold())
              t=''.join(c for c in t if not combining(c))
              return re.findall(r'[a-z0-9]+',t)
          def process(rec):
              p=rec['original_1910_djvu_page']
              raw=subprocess.run(['djvutxt','-page='+str(p),'-detail=word','/tmp/lsg-original-1910.djvu'],
                  capture_output=True,check=True).stdout.decode('utf-8','replace')
              triples=[]
              regex=r'\(word (\d+) (\d+) (\d+) (\d+) "((?:\\.|[^"\\])*)"\)'
              for m in re.finditer(regex,raw):
                  a,b,c,d=map(int,m.group(1,2,3,4))
                  word=m.group(5).replace('\\"','"')
                  triples.append(dict(x=a,y=b,t=word,x2=c,y2=d))
              # Native scan page x positions: left text <=365, center notes x375-449, right text >=450.
              cols={
                  'left':[w for w in triples if 60<=w['x']<=370],
                  'right':[w for w in triples if 448<=w['x']<=800],
                  'middle':[w for w in triples if 371<=w['x']<448],
              }
              target=normalize_words(rec['original_citation_label'])
              # For identifying the physical verse, match relevant source snippet across all source
              # page body lines. This is only a visual aid; exact original reference is never inferred.
              # body original verse snippets are NOT currently versioned in this locator, so
              # record only a bounded, source-independent entire central reference column.
              middle=cols['middle']
              # Sort by approximate physical height, top to bottom. Keep line grouping for
              # reproducible, inspectable text without making claims about citation grouping.
              grouped={}
              for word in middle:
                  y=round((word['y']+word['y2'])/2/8)*8
                  grouped.setdefault(y,[]).append(word)
              lines=[]
              for y in sorted(grouped,reverse=True):
                  parts=sorted(grouped[y],key=lambda w:w['x'])
                  lines.append({'y_bottom_origin':y,'text':' '.join(x['t'] for x in parts)})
              return {
                  'record_id':rec['record_id'],
                  'original_usfm_book':rec['original_usfm_book'],
                  'source_note_origin':rec['source_note_origin'],
                  'source_label':rec['original_citation_label'],
                  'secondary_digital_label':rec['secondary_citation_label'],
                  'native_page':p,'raw_word_token_count':len(triples),
                  'middle_column_token_count':len(middle),
                  'margin_reading_status':'candidate_ocr_not_physical_print_certification',
                  'middle_column_ocr':lines,
              }
          with ThreadPoolExecutor(max_workers=8) as pool: results=list(pool.map(process,ledger['records']))
          assert len(results)==54
          Path('/tmp/print1910-margin-batch/margin_candidates.json').write_text(
            json.dumps({'scan_sha256':ledger['original_printed_djvu_sha256'],
               'source_identity_sha256':ledger['source_usfx_sha256'],
               'status':'automatically_extracted_OCR_only_not_certified_printed_labels',
               'records':results},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('MARGIN_BATCH_SUCCESS 54 of 54 native pages parsed')
          for r in results:
              alltext=' / '.join(x['text'] for x in r['middle_column_ocr'])
              print('PRINT_MARGIN_CASE='+json.dumps({
                'id':r['record_id'],'ref':r['original_usfm_book']+' '+r['source_note_origin'],
                'page':r['native_page'],'source':r['source_label'],'biblia':r['secondary_digital_label'],
                'margin_raw':alltext[:2000]},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lsg-1910-original-print-margin-ocr-batch-NOT-certification
          path: /tmp/print1910-margin-batch/margin_candidates.json
          retention-days: 7
