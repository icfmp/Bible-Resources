name: Monitor upstream SWORD editions

on:
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare curated baselines with upstreams
        run: python scripts/check_updates.py --output reports/upstream-status.json
      - name: Upload read-only report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-status
          path: reports/upstream-status.json
          retention-days: 30
      - name: Display summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          data=json.load(open('reports/upstream-status.json',encoding='utf-8'))
          lines=['## Upstream update report', '', '| Provider | Status | Modules indexed |','|---|---|---:|']
          for k,v in data['providers'].items():
              lines.append(f"| {k} | {v['status']} | {v.get('modules_in_catalog', '—')} |")
          lines.extend(['','| Module | Upstream | Status |','|---|---|---|'])
          for m in data['modules']:
              for src in m['upstreams']:
                  lines.append(f"| {m['id']} | {src['provider']} | {src['status']} |")
          lines.append('')
          lines.append('Read-only monitoring: no modules downloaded or published.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          PY
