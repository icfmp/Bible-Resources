name: Review second real Bible (WEBP source and SWORD index)
on:
  pull_request:
    paths:
      - .github/workflows/second-bible-proof.yml
      - scripts/real_second_bible_probe.py
      - scripts/source_native_scope.py
      - config/standard_usfm_osis_66.json
      - tests/test_source_native_scope.py
      - scripts/sword_native_raw_entry.cpp
      - scripts/sword_missing_verse_witness.py
      - tests/test_sword_missing_verse_witness.py
      - scripts/sword_native_raw_corpus.cpp
      - scripts/sword_native_raw_corpus_inventory.py
      - tests/test_sword_native_raw_corpus_inventory.py
      - scripts/source_native_maintext_probe.py
      - tests/test_source_native_maintext_probe.py
      - scripts/native_absorbed_verse_groups.py
      - tests/test_native_absorbed_verse_groups.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  second-real-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install parser and released SWORD C++ library
        timeout-minutes: 8
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libsword-dev
      - name: Build generic independent native SWORD reader
        run: |
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_index.cpp \
            -o "${RUNNER_TEMP}/sword-native-index" -lsword
      - name: Build private captured-only native raw-entry reader
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_raw_entry.cpp \
            -o "${RUNNER_TEMP}/sword-native-raw-entry" -lsword
      - name: Build captured-only full native raw-corpus inspector
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_raw_corpus.cpp \
            -o "${RUNNER_TEMP}/sword-native-raw-corpus" -lsword
      - name: Fetch official immutable-for-this-run private research inputs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            --proto '=https' --proto-redir '=https' \
            https://ebible.org/Scriptures/engwebp_usfx.zip \
            --output "${RUNNER_TEMP}/original-engwebp-usfx.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            --proto '=https' --proto-redir '=https' \
            https://ebible.org/sword/zip/engweb2025peb.zip \
            --output "${RUNNER_TEMP}/original-engwebp-sword.zip"
          # These hashes were established by the independent real first run.
          # A changed upstream file is NOT silently treated as the same edition.
          printf '%s  %s\n' \
            66f99b22a380d8ef8dbd9d401806fc02be3650e5fe3dbb0cec4d9693b53e1e44 \
            "${RUNNER_TEMP}/original-engwebp-usfx.zip" | sha256sum --check -
          printf '%s  %s\n' \
            53d45377d1aa376f483aded415b6d122b7cbe6795baddc49dae6574e304b8810 \
            "${RUNNER_TEMP}/original-engwebp-sword.zip" | sha256sum --check -
      - name: Independently scan the real USFX source and real native zText reader
        shell: bash
        run: |
          set -euo pipefail
          python scripts/real_second_bible_probe.py \
            --source-usfx-zip "${RUNNER_TEMP}/original-engwebp-usfx.zip" \
            --original-sword-zip "${RUNNER_TEMP}/original-engwebp-sword.zip" \
            --native-inspector "${RUNNER_TEMP}/sword-native-index" \
            --native-corpus-inspector "${RUNNER_TEMP}/sword-native-raw-corpus" \
            --native-entry-inspector "${RUNNER_TEMP}/sword-native-raw-entry" \
            --report "${RUNNER_TEMP}/second-bible-metadata-only.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                              "second-bible-metadata-only.json").read_text())
          assert proof["publisher_original_book_count"] >= 60, "Wrong/incomplete official source edition"
          assert proof["actual_reader_book_count"] >= 60, "Wrong/incomplete original SWORD module"
          assert proof["publisher_native_driver"] == "zText", "This real trial must exercise a different stock-SWORD driver from LSG"
          assert proof["actual_reader_occupied_numbered_verses"] > 20000
          full_raw = proof["independent_full_native_raw_corpus_digest"]
          assert full_raw["exact_all_occupied_native_keys_matched_independent_index"]
          assert full_raw["independent_native_exact_key_raw_spotcheck_verified"]
          assert full_raw["actual_occupied_numbered_entry_count"] == proof["actual_reader_occupied_numbered_verses"]
          assert full_raw["actual_occupied_intro_entry_count"] == proof["actual_native_verse_zero_intros"]
          assert full_raw["actual_occupied_anonymous_top_entry_count"] == proof["actual_native_anonymous_top_records"]
          assert full_raw["module_driver"] == "zText"
          assert full_raw["source_original_authorial_text_compared"] is False
          assert full_raw["rights_and_editorial_approval"] is False
          print("Verified private whole-zText-corpus native raw SHA:", full_raw["all_native_raw_entries_ordered_sha256"])
          scoped = proof["explicit_standard_book_scope_reference_audit"]
          assert scoped["mapped_book_count"] == 66, "Expected explicitly reviewed standard 66-book scope"
          assert scoped["source_mapped_book_count"] == 66, "Source lacks canonical books"
          assert scoped["source_canonical_book_order_verified"], "Authored canonical order changed"
          assert scoped["native_canonical_book_order_verified"], "Native canonical book order changed"
          assert scoped["authorial_full_source_to_compiled_scope_fidelity_verified"] is False
          assert scoped["source_to_compiled_text_notes_lexical_and_layout_verified"] is False
          assert scoped["rights_and_publication_approved"] is False
          print("Mapped canonical scope status:", scoped["status"])
          print("Original additional source books:",
                scoped["additional_original_source_book_count"])
          print("Canonical key differences:",
                scoped["source_canonical_refs_unreachable_in_reader_count"],
                scoped["native_canonical_refs_not_authored_in_source_count"])
          assert proof["source_to_sword_exact_words_punctuation_verified"] is False
          assert proof["source_to_sword_fidelity_gate"] in {
              "blocked_canon_scope_mismatch_requires_edition_review",
              "not_verified_requires_independent_book_mapping_and_full_content_probe",
          }
          assert proof["edition_for_publication_approved"] is False
          assert proof["published"] is False
          print("Independent real zText reader index and original USFX source inspected; full text parity NOT certified")
          PY
      - name: Inspect actual native raw-entry lexical witnesses without logging any Bible text
        shell: bash
        run: |
          set -euo pipefail
          # The helper emits unfiltered Scripture bytes only to a captured
          # Python subprocess pipe. NEVER invoke the helper directly in CI.
          python scripts/sword_missing_verse_witness.py \
            --source-usfx-zip "${RUNNER_TEMP}/original-engwebp-usfx.zip" \
            --original-sword-zip "${RUNNER_TEMP}/original-engwebp-sword.zip" \
            --native-index-inspector "${RUNNER_TEMP}/sword-native-index" \
            --native-raw-inspector "${RUNNER_TEMP}/sword-native-raw-entry" \
            --crosswalk config/standard_usfm_osis_66.json \
            --report "${RUNNER_TEMP}/second-bible-native-raw-witness.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "second-bible-native-raw-witness.json").read_text())
          assert report["native_sword_driver"] == "zText"
          # This checks the *actual pinned researched source*, not a
          # generic code exception or editorial verse restoration.
          assert report["source_scope_missing_native_verse_count"] == 3
          # Regression only for these SHA-pinned original publisher inputs.
          # Proves a native raw-entry lexical presence witness, never authorial
          # versification, note/layout or punctuation completeness.
          assert all(
              row.get("source_word_run_found_contiguously_in_native_entry") is True
              for row in report["source_missing_native_verses"]
          ), "Previously witnessed source-only word run disappeared from original native raw entry"
          assert all(
              group["all_missing_source_word_runs_found"] and
              group["missing_source_word_runs_in_source_order"]
              for group in report["grouped_preceding_native_entries"]
          ), "Source-only word runs are not all present in their authored order"
          assert report["source_to_compiled_exact_punctuation_verified"] is False
          assert report["note_callers_bodies_anchors_verified"] is False
          assert report["authorial_complete_text_preservation_verified"] is False
          assert report["approved_for_publication"] is False
          assert report["published"] is False
          for row in report["source_missing_native_verses"]:
              print(row["unindexed_original_source_ref"],
                    row["diagnostic"],
                    "native", row["preceding_occupied_native_ref"])
          PY
      - name: Compare complete original USFX numbered main text to actual stock zText characters
        shell: bash
        run: |
          set -euo pipefail
          # The C++ native raw corpus emits Bible XML only to a private Python
          # subprocess pipe. NEVER invoke it directly from a public CI shell.
          python scripts/source_native_maintext_probe.py \
            --source-usfx-zip "${RUNNER_TEMP}/original-engwebp-usfx.zip" \
            --original-sword-zip "${RUNNER_TEMP}/original-engwebp-sword.zip" \
            --native-index-inspector "${RUNNER_TEMP}/sword-native-index" \
            --native-raw-inspector "${RUNNER_TEMP}/sword-native-raw-corpus" \
            --native-entry-inspector "${RUNNER_TEMP}/sword-native-raw-entry" \
            --crosswalk config/standard_usfm_osis_66.json \
            --report "${RUNNER_TEMP}/second-bible-maintext-metadata-only.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "second-bible-maintext-metadata-only.json").read_text())
          scope = report["source_book_scope"]
          comparison = report["mapped_numbered_text_comparison"]
          classes = comparison["classifications"]
          assert report["independent_native_whole_corpus_scan_completed"]
          assert report["independent_native_exact_key_raw_spotcheck_verified"]
          assert report["module_native_driver"] == "zText"
          assert scope["unmapped_authored_book_count"] > 0
          assert comparison["source_mapped_numbered_verse_count"] > 30000
          assert classes["matching_indexed_keys_checked"] > 30000
          assert classes["source_verses_without_native_indexed_entry"] >= 1
          assert not report["publication_rights_and_human_editorial_approval"]
          assert not report["note_callers_bodies_anchors_references_strong_and_layout_verified"]
          assert not report["published"]
          # This pinned original is known to have source-only Romans verse IDs:
          # passing CI proves the diagnostic ran, NOT full edition parity.
          assert comparison["status"] == "blocked_full_mapped_numbered_maintext_parity"
          groups = report["source_only_verse_grouped_native_maintext_witness"]
          assert groups["source_only_reference_count"] == classes[
              "source_verses_without_native_indexed_entry"]
          assert not groups["source_versification_preserved_in_native_reader"]
          assert not groups["whole_original_source_fidelity_verified"]
          assert not groups["publication_approved"]
          # Only this publisher-original SHA-pinned research fixture has the
          # reviewed source-only sequence; generic production code has NO
          # translation-specific verse cases or remapping exceptions.
          assert groups["status"] == (
              "all_bounded_source_only_verse_groups_word_preservation_witnessed")
          assert all(
              row["complete_grouped_word_sequence_equal_diagnostic_only"]
              and row["complete_grouped_characters_equal_after_whitespace_folding"]
              and row["source_only_refs_remain_unindexed"]
              for row in groups["grouped_source_verses"]
          ), "Original grouped words, punctuation or case no longer present in actual native slot"
          print("Source-only groups in original native entries (text-free):", [
              (row["occupied_native_ref"], row["original_source_only_refs"],
               row["status"],
               row.get("complete_grouped_word_sequence_equal_diagnostic_only"),
               row.get("complete_grouped_characters_equal_after_whitespace_folding"))
              for row in groups.get("grouped_source_verses", [])
          ])
          print("Unresolved source-only refs:", groups.get("unresolved_source_verse_refs", []))
          print("Whole-corpus source/native indexed main text classifications:", classes)
          print("Numeric-only first mismatch examples:", [
              (row["native_ref"], row["classification"],
               row.get("source_character_count"), row.get("compiled_character_count"),
               row.get("source_word_count"), row.get("compiled_word_count"))
              for row in comparison["first_differences_no_scripture"][:4]
          ])
          print("Material source/native mismatches (reference IDs and classification only):", [
              (row["native_ref"], row["classification"],
               row.get("source_word_count"), row.get("native_word_count"),
               row.get("secondary_tolerant_lexical_diagnostic", {}).get("status"))
              for row in comparison["material_difference_metadata_no_scripture"]
          ])
          print("Material metadata truncated:", comparison["material_differences_metadata_truncated"])
          print("USFX explicitly excluded editorial element counts:",
                scope["excluded_source_heading_or_note_element_counts"])
          print("Additional source books remain unverified:", scope["unmapped_authored_book_count"])
          PY
      - name: Upload metadata-only source/reader evidence (no Scripture content)
        uses: actions/upload-artifact@v4
        with:
          name: second-real-bible-source-and-reader-inventory
          path: |
            ${{ runner.temp }}/second-bible-metadata-only.json
            ${{ runner.temp }}/second-bible-native-raw-witness.json
            ${{ runner.temp }}/second-bible-maintext-metadata-only.json
          retention-days: 30
