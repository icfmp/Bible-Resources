name: Sync verified LSG OSIS source recovery with current main
on:
  push:
    branches: [recovery/lsg-1910-clean-osis]
    paths: [.github/workflows/sync-lsg-cleaned-source-once.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    if: github.repository == 'icfmp/Bible-Resources'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true, fetch-depth: 0}
      - name: Merge newest main, remove temporary workflow, retain SHA-pinned sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/sync-lsg-cleaned-source-once.yml
          git diff --cached --check
          git commit -m 'Sync verified original Segond authoring source with current approved repository'
          git push origin HEAD:recovery/lsg-1910-clean-osis
