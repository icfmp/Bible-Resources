name: Modern commentary source-native receipt (metadata-only)
on:
  pull_request:
    paths:
      - '.github/workflows/commentary-modern-source-receipt.yml'
      - 'scripts/commentary_modern_source_receipt.py'
      - 'scripts/commentary_modern_native_witness_probe.py'
      - 'tests/test_commentary_modern_native_witness_probe.py'
      - 'scripts/commentary_modern_ionly_preview.py'
      - 'scripts/sword_native_commentary_index.cpp'
      - 'scripts/commentary_modern_reference_gate.py'
      - 'scripts/commentary_modern_linked_candidate_preview.py'
      - 'tests/test_commentary_modern_linked_candidate_preview.py'
      - 'tests/test_commentary_modern_reference_gate.py'
      - 'tests/test_commentary_modern_source_receipt.py'
      - 'tests/test_commentary_modern_ionly_preview.py'
      - 'work/mhcc-modern/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modern-source-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-native and draft-coverage guards on synthetic fixtures
        run: python -m unittest tests/test_commentary_modern_source_receipt.py tests/test_commentary_modern_ionly_preview.py tests/test_commentary_modern_draft_guard.py tests/test_commentary_modern_draft_osis_preview.py tests/test_commentary_modern_reference_gate.py tests/test_commentary_modern_linked_candidate_preview.py tests/test_commentary_modern_native_witness_probe.py -v
      - name: Install real SWORD source reader
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y libsword-dev libsword-utils diatheke
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "${RUNNER_TEMP}/commentary-modern-source-raw" -lsword
      - name: Fetch the exact released and SHA-pinned MHCC 0.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --max-time 90 \
            'https://github.com/icfmp/Bible-Resources/releases/download/mhcc-0.1.1/MHCC-0.1.1.zip' \
            --output "${RUNNER_TEMP}/mhcc-0.1.1.zip"
          printf '%s  %s\n' \
            'a0639201b57b9a6ec843fca70ffc08f75e179a24130a22ce1fd43be8ca42c746' \
            "${RUNNER_TEMP}/mhcc-0.1.1.zip" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import zipfile
          root = Path(os.environ["RUNNER_TEMP"]) / "mhcc-source-root"
          root.mkdir()
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"])/"mhcc-0.1.1.zip") as zf:
              names = zf.namelist()
              assert "mods.d/mhcc.conf" in names
              assert len(names) <= 32
              for info in zf.infolist():
                  name = PurePosixPath(info.filename)
                  assert name.parts and not name.is_absolute() and ".." not in name.parts
                  assert not (info.external_attr >> 16) & 0o170000 == 0o120000
                  target = root.joinpath(*name.parts)
                  assert target.resolve().is_relative_to(root.resolve())
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      assert info.file_size <= 3 * 1024 * 1024
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as r, target.open("xb") as w:
                          w.write(r.read())
          print("Exact SHA-pinned published commentary installed only in an isolated temporary root")
          PY
      - name: Inventory full corrected original and Genesis 1–24 without exporting source text
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_source_receipt.py \
            --native-reader "${RUNNER_TEMP}/commentary-modern-source-raw" \
            --module-directory "${RUNNER_TEMP}/mhcc-source-root" \
            --module-id MHCC \
            --expected-corpus-sha256 \
            '2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e' \
            --chapters Gen.1 Gen.2 Gen.3 Gen.4 Gen.5 Gen.6 Gen.7 Gen.8 Gen.9 Gen.10 Gen.11 Gen.12 Gen.13 Gen.14 Gen.15 Gen.16 Gen.17 Gen.18 Gen.19 Gen.20 Gen.21 Gen.22 Gen.23 Gen.24 \
            --report "${RUNNER_TEMP}/mhcc-modern-source-native-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-source-native-receipt.json"
          r=json.loads(path.read_text())
          assert set(r["chapters"]) == {f"Gen.{i}" for i in range(1, 25)}
          assert r["source_prose_or_original_markup_exported"] is False
          assert r["semantic_translation_independently_approved"] is False
          assert r["complete_native_counts"] == {"K":28742,"I":1255,"TOP":2}
          for ch,x in r["chapters"].items():
              assert x["original_native_numbered_keys"] > 0
              assert x["distinct_original_raw_units"] > 0
              print(ch+": "+str(x["distinct_original_raw_units"])+
                    " distinct source bodies / "+str(x["original_native_numbered_keys"])+
                    " occupied native verse keys / "+
                    str(len(x["native_introductions_not_assumed_to_be_exposition"]))+
                    " independently retained introduction keys")
          for ch,x in r["chapters"].items():
              for u in x["original_units"]:
                  print("ORIGINAL_UNIT "+ch+" first_key="+u["first_key"]+
                        " keys="+",".join(u["keys"])+
                        " sha256="+u["source_unit_sha256"]+
                        " markup="+json.dumps(u["markup"],sort_keys=True))
              for u in x["native_introductions_not_assumed_to_be_exposition"]:
                  print("ORIGINAL_INTRO "+ch+" key="+u["key"]+
                        " sha256="+u["raw_sha256"]+
                        " markup="+json.dumps(u["markup"],sort_keys=True))
          print("Full source-native gate PASS (not independent semantic or build acceptance)")
          PY
      - name: Inventory all 1,189 canonical chapters against the original native SWORD source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          root=Path("work/mhcc-modern/production/accepted")
          files=sorted(root.glob("*.md"))
          assert len(files)==1189, "Canonical manuscript inventory is incomplete"
          refs=[]
          for path in files:
              front=path.read_text(encoding="utf-8").split("\n---\n", 1)[0]
              found=re.search(r'^chapter_osis: "([^"]+)"$',front,re.M)
              assert found, "Chapter missing its canonical OSIS identity: "+str(path)
              assert 'source_zip_sha256: "a0639201b57b9a6ec843fca70ffc08f75e179a24130a22ce1fd43be8ca42c746"' in front
              assert 'source_native_corpus_sha256: "2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e"' in front
              assert 'publication_status: "NOT RELEASED' in front
              refs.append(found.group(1))
          assert len(set(refs))==1189, "Duplicate manuscript chapter identity"
          assert len({x.split(".",1)[0] for x in refs})==66, "Wrong canonical book coverage"
          path=Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-canonical-chapters.txt"
          path.write_text("\n".join(refs)+"\n",encoding="utf-8")
          print("CANONICAL_MANUSCRIPT_INPUT: 1,189 distinct chapter identifiers, 66 books, pinned to original MHCC 0.1.1; NOT RELEASED")
          PY
          mapfile -t requested < "$RUNNER_TEMP/mhcc-modern-canonical-chapters.txt"
          python scripts/commentary_modern_source_receipt.py \
            --native-reader "$RUNNER_TEMP/commentary-modern-source-raw" \
            --module-directory "$RUNNER_TEMP/mhcc-source-root" \
            --module-id MHCC \
            --expected-corpus-sha256 \
            '2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e' \
            --chapters "${requested[@]}" \
            --report "$RUNNER_TEMP/mhcc-modern-whole-canon-native-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          native=json.loads((temp/"mhcc-modern-whole-canon-native-receipt.json").read_text())
          requested=set((temp/"mhcc-modern-canonical-chapters.txt").read_text().splitlines())
          chapters=native["chapters"]
          assert set(chapters)==requested and len(chapters)==1189
          assert native["complete_native_counts"]=={"K":28742,"I":1255,"TOP":2}
          assert not native["source_prose_or_original_markup_exported"]
          assert not native["semantic_translation_independently_approved"]
          assert not native["structured_derivative_readback_tested"]
          groups=sum(x["distinct_original_raw_units"] for x in chapters.values())
          keys=sum(x["original_native_numbered_keys"] for x in chapters.values())
          print(f"CANONICAL_NATIVE_TOTAL chapters={len(chapters)} original_groups={groups} numbered_keys={keys} published_native_K={native['complete_native_counts']['K']}")
          assert keys==native["complete_native_counts"]["K"], (
              "Some source K addresses are not covered by canonical chapter inventory")
          for chapter in sorted(chapters):
              entry=chapters[chapter]
              anchors=";".join(u["first_key"]+":"+u["keys"][-1]+":"+u["source_unit_sha256"]
                               for u in entry["original_units"])
              print("CANONICAL_NATIVE "+chapter+" groups="+str(entry["distinct_original_raw_units"])+
                    " keys="+str(entry["original_native_numbered_keys"])+
                    " source_sha_anchors="+anchors)
          print("COMPLETE NATIVE KEY RECEIPT PASS — metadata only; no draft semantics, links, notes or compiled derivative approved")
          PY
      - name: Probe five original SWORD source-body scopes against independent English anchors
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_native_witness_probe.py \
            --native-reader "$RUNNER_TEMP/commentary-modern-source-raw" \
            --module-directory "$RUNNER_TEMP/mhcc-source-root" \
            --native-receipt "$RUNNER_TEMP/mhcc-modern-whole-canon-native-receipt.json" \
            --witness-manifest "work/mhcc-modern/production/NATIVE_FIVE_CHAPTER_ANCHOR_PROBES.json" \
            --report "$RUNNER_TEMP/mhcc-modern-five-native-source-witness-probes.json"
      - name: Screen all modern manuscript outline tables for out-of-order source ranges
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          root=Path("work/mhcc-modern/production/accepted")
          files=sorted(root.glob("*.md"))
          assert len(files)==1189
          ordered=[]
          inspected=0
          skipped=0
          anomalies=[]
          range_pattern=re.compile(r"^\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*$")
          for path in files:
              raw=path.read_text(encoding="utf-8")
              prose=raw.split("\n---\n",2)
              if len(prose)<3:
                  raise ValueError("Unterminated manuscript: "+path.name)
              body=prose[1]
              h=re.search(r"(?m)^## Original[^\n]*outline[^\n]*$",body,re.I)
              if not h:
                  skipped+=1
                  continue
              span=body[h.end():]
              next_h=re.search(r"(?m)^## ",span)
              if next_h:
                  span=span[:next_h.start()]
              bounds=[]
              for line in span.splitlines():
                  if not line.strip().startswith("|"):
                      continue
                  cols=[p.strip() for p in line.strip().strip("|").split("|")]
                  if len(cols)<2:
                      continue
                  value=cols[-1].strip("() ")
                  m=range_pattern.fullmatch(value)
                  if m:
                      start=int(m[1]);end=int(m[2] or m[1])
                      if start<1 or end<start:
                          anomalies.append({"manuscript":path.name,"reason":"invalid original-outline numeric span","range":value})
                      else:
                          bounds.append((start,end))
              if not bounds:
                  skipped+=1
                  continue
              inspected+=1
              if len(bounds)>1:
                  bad=[(i+1,a,b) for i,(a,b) in enumerate(zip(bounds,bounds[1:]))
                       if b[0]<a[0]]
                  if bad:
                      anomalies.append({
                          "manuscript":path.name,
                          "reason":"source-outline rows out of canonical verse order; manual review only",
                          "ordered_row_bounds":[f"{a}-{b}" for a,b in bounds]
                      })
              ordered.append(path.name)
          report={
              "status":"DIAGNOSTIC_ONLY_NOT_ORIGINAL_SOURCE_OR_SEMANTIC_APPROVAL",
              "all_1189_chapter_manuscripts_examined":len(files),
              "outlines_with_numeric_rows_screened":inspected,
              "not_evaluable_by_this_narrow_heuristic":skipped,
              "anomalies":anomalies,
              "original_native_heading_or_outline_verified":False,
              "automatic_editorial_corrections_made":False
          }
          dest=Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-outline-order-diagnostic.json"
          dest.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("DRAFT_OUTLINE_ORDER_DIAGNOSTIC manuscripts=1189 "+
                f"screened={inspected} unevaluable={skipped} flagged={len(anomalies)}")
          for a in anomalies[:45]:
              print("DRAFT_OUTLINE_ORDER_FLAG "+a["manuscript"]+" "+str(a.get("ordered_row_bounds",a["reason"])))
          print("No original authorial outline rewritten; all flags need independent contextual review")
          PY
      - name: Independently inventory all 69 historically unchecked manuscripts against native source units
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          base=Path("work/mhcc-modern/production")
          archive=(base/"checkpoints/issue-270-body-2026-11-17-pre-reconciliation.md").read_text(encoding="utf-8")
          unchecked=re.findall(r"(?m)^- \[ \] (.+?)\s*$",archive)
          assert len(unchecked)==69 and len(set(unchecked))==69, (
              "Historical issue #270 no longer has exactly 69 distinct unchecked chapter rows")
          all_manuscripts=sorted((base/"accepted").glob("*.md"))
          assert len(all_manuscripts)==1189, "Canonical draft inventory changed"
          native=json.loads((Path(os.environ["RUNNER_TEMP"])/
              "mhcc-modern-whole-canon-native-receipt.json").read_text(encoding="utf-8"))
          assert native["status"]=="SOURCE_NATIVE_RECEIPT_ONLY_NOT_TRANSLATION_APPROVAL"
          assert not native["source_prose_or_original_markup_exported"]
          assert not native["semantic_translation_independently_approved"]
          titles={}
          for path in all_manuscripts:
              raw=path.read_text(encoding="utf-8")
              title=re.search(r"(?m)^# (.+?) — Modern English\s*$",raw)
              if title:
                  if title[1] in titles:
                      raise ValueError("Duplicate chapter title: "+title[1])
                  titles[title[1]]=(path,raw)
          reports=[]
          issues=[]
          section_digest_owner={}
          token=re.compile(r"\b[\w’-]+\b",re.UNICODE)
          verse_heading=re.compile(
              r"\(verses?\s+(\d{1,3})(?:\s*(?:[–—-]|and|,)\s*(\d{1,3}))?\)",
              re.IGNORECASE)
          for original_label in unchecked:
              chapter_issues=[]
              entry=titles.get(original_label)
              if entry is None:
                  issues.append({"chapter":original_label,"problem":"missing full modern manuscript"})
                  continue
              path,raw=entry
              if not raw.startswith("---\n") or "\n---\n" not in raw[4:]:
                  issues.append({"chapter":original_label,"problem":"invalid source frontmatter"})
                  continue
              front,rest=raw[4:].split("\n---\n",1)
              fields=dict(re.findall(r'(?m)^([a-z_][a-z0-9_]*): "([^"\n]*)"$',front))
              chapter=fields.get("chapter_osis","")
              original=native["chapters"].get(chapter)
              if original is None:
                  issues.append({"chapter":original_label,"problem":"no original native source chapter mapping"})
                  continue
              if (fields.get("source_module")!="MHCC 0.1.1"
                  or fields.get("source_zip_sha256")!="a0639201b57b9a6ec843fca70ffc08f75e179a24130a22ce1fd43be8ca42c746"
                  or fields.get("source_native_corpus_sha256")!="2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e"
                  or not fields.get("publication_status","").startswith("NOT RELEASED")):
                  chapter_issues.append("wrong original-source pin or false release claim")
              if "\n---\n" not in rest:
                  chapter_issues.append("missing prose/editorial boundary")
                  main=rest
                  review=""
              else:
                  main,review=rest.split("\n---\n",1)
              if not re.search(r"(?m)^## (?:Editorial|Source) (?:review|audit|verification)",review,re.I):
                  chapter_issues.append("missing separate original-witness review notes")
              headings=list(re.finditer(r"(?m)^## ([^\n]+)$",main))
              source_outline=[h for h in headings if "original chapter outline" in h[1].lower()]
              if len(source_outline)!=1:
                  chapter_issues.append("missing or multiple source-outline sections")
              sections=[h for h in headings
                        if "original chapter outline" not in h[1].lower()]
              original_units=original["original_units"]
              if not original_units or original["source_placement"]!="NUMBERED_KEYS_WITH_SEPARATE_INTRO":
                  chapter_issues.append("original source is not supported numbered-K commentary")
              if len(sections)!=len(original_units):
                  chapter_issues.append(
                      f"original K bodies={len(original_units)}, modern exposition sections={len(sections)}")
              source_verses=set()
              for u in original_units:
                  for key in u["keys"]:
                      if not key.startswith(chapter+"."):
                          chapter_issues.append("original source key in wrong chapter")
                      if key in source_verses:
                          chapter_issues.append("duplicate original numbered K key")
                      source_verses.add(key)
              if len(source_verses)!=original["original_native_numbered_keys"]:
                  chapter_issues.append("inconsistent native source occupied-key tally")
              modern_section_info=[]
              for i,h in enumerate(sections):
                  next_head=headings[headings.index(h)+1] if headings.index(h)+1<len(headings) else None
                  exposition=main[h.end():next_head.start() if next_head else len(main)]
                  words=len(token.findall(exposition))
                  marker=verse_heading.search(h[1])
                  claimed=(int(marker[1]),int(marker[2] or marker[1])) if marker else None
                  original_bounds=None
                  if i<len(original_units):
                      nums=[int(key.rsplit(".",1)[1]) for key in original_units[i]["keys"]]
                      original_bounds=(min(nums),max(nums)) if nums else None
                  if not marker:
                      chapter_issues.append(f"section {i+1}: no explicit verse bounds")
                  elif original_bounds and claimed!=original_bounds:
                      chapter_issues.append(
                          f"section {i+1}: modern verse bounds {claimed} differ from original {original_bounds}")
                  if words<25:
                      chapter_issues.append(f"section {i+1}: missing/too-short actual translation ({words} words)")
                  if re.search(r"(?i)\b(?:TODO|TBD|PLACEHOLDER|NOT YET TRANSLATED|LOREM IPSUM)\b",exposition):
                      chapter_issues.append(f"section {i+1}: unfinished draft marker")
                  digest=hashlib.sha256(exposition.strip().encode("utf-8")).hexdigest()
                  owner=section_digest_owner.setdefault(digest,(chapter,i+1))
                  if owner!=(chapter,i+1) and words>=50:
                      chapter_issues.append(f"section {i+1}: possible copied duplicate of {owner}")
                  modern_section_info.append({
                      "section_number":i+1,
                      "modern_words":words,
                      "claimed_verse_bounds":list(claimed) if claimed else None,
                      "original_native_verse_bounds":list(original_bounds) if original_bounds else None,
                      "original_unit_sha256":original_units[i]["source_unit_sha256"] if i<len(original_units) else None
                  })
              reports.append({
                  "historical_issue_label":original_label,
                  "chapter_osis":chapter,
                  "manuscript":path.as_posix(),
                  "manuscript_sha256":hashlib.sha256(raw.encode("utf-8")).hexdigest(),
                  "original_numbered_K_keys":original["original_native_numbered_keys"],
                  "original_K_source_units":len(original_units),
                  "modern_exposition_sections":len(sections),
                  "modern_exposition_word_count":sum(s["modern_words"] for s in modern_section_info),
                  "original_separate_introduction_keys":len(original["native_introductions_not_assumed_to_be_exposition"]),
                  "section_comparison":modern_section_info,
                  "machine_detected_structural_problems":chapter_issues,
                  "original_full_prose_meaning_independently_verified":False
              })
              if chapter_issues:
                  issues.append({"chapter":chapter,"problem":"; ".join(chapter_issues)})
          receipt={
              "status":"HISTORICALLY_UNCHECKED_DRAFT_SOURCE_UNIT_SCREEN_NOT_EDITORIAL_APPROVAL",
              "historical_unchecked_rows":len(unchecked),
              "complete_modern_manuscript_paths_read":len(reports),
              "original_source_edition":"MHCC 0.1.1",
              "native_corpus_sha256":native["original_compiled_corpus_sha256"],
              "original_numbered_source_units":sum(r["original_K_source_units"] for r in reports),
              "original_occupied_K_keys":sum(r["original_numbered_K_keys"] for r in reports),
              "modern_exposition_sections":sum(r["modern_exposition_sections"] for r in reports),
              "modern_exposition_words":sum(r["modern_exposition_word_count"] for r in reports),
              "structural_flags":issues,
              "chapters":reports,
              "source_full_prose_meaning_independently_approved":False,
              "published_derivative_module_built_or_validated":False,
              "source_original_prose_or_xml_exported":False
          }
          report_path=Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-historical-69-translation-coverage.json"
          report_path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("HISTORICAL_69_SCOPE original_rows=69 modern_manuscripts="+str(len(reports))+
                " original_K_units="+str(receipt["original_numbered_source_units"])+
                " modern_sections="+str(receipt["modern_exposition_sections"])+
                " original_occupied_K_keys="+str(receipt["original_occupied_K_keys"])+
                " modern_exposition_words="+str(receipt["modern_exposition_words"])+
                " problems="+str(len(issues)))
          for x in reports:
              print("HISTORICAL_69_CHAPTER "+x["chapter_osis"]+
                    " source_units="+str(x["original_K_source_units"])+
                    " modern_units="+str(x["modern_exposition_sections"])+
                    " words="+str(x["modern_exposition_word_count"])+
                    " native_K="+str(x["original_numbered_K_keys"]))
          for issue in issues:
              print("HISTORICAL_69_UNRESOLVED "+issue["chapter"]+": "+issue["problem"])
          print("Only original native section/key coverage and real modern prose checked; "+
                "not native-to-modern authorial meaning, notes, reference targets, or publication rights")
          assert not issues and len(reports)==69, "Historical 69 source-unit coverage NOT fully demonstrated"
          PY
      - name: Screen all 1189 modern prose sections against verified native source K and I group topology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import re
          base = Path("work/mhcc-modern/production/accepted")
          native = json.loads((Path(os.environ["RUNNER_TEMP"]) /
              "mhcc-modern-whole-canon-native-receipt.json").read_text(encoding="utf-8"))
          assert native["status"] == "SOURCE_NATIVE_RECEIPT_ONLY_NOT_TRANSLATION_APPROVAL"
          assert native["original_compiled_corpus_sha256"] == (
              "2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e")
          assert native["source_prose_or_original_markup_exported"] is False
          assert native["semantic_translation_independently_approved"] is False
          originals = native["chapters"]
          files = sorted(base.glob("*.md"))
          assert len(files) == len(originals) == 1189
          token = re.compile(r"\b[\w’-]+\b", re.UNICODE)
          heading = re.compile(r"(?m)^(#{2,5}) ([^\n]+)\s*$")
          quoted = re.compile(r'(?m)^([a-z_][a-z0-9_]*): "([^"\n]*)"$')
          verse_marker = re.compile(r"\(\s*verses?\s+([^)]+)\)\s*$", re.IGNORECASE)
          flags = []
          rows = []
          seen = set()
          for path in files:
              problems = []
              source = path.read_text(encoding="utf-8")
              if not source.startswith("---\n") or "\n---\n" not in source[4:]:
                  flags.append({"manuscript":path.name, "problem":"invalid frontmatter"})
                  continue
              front, rest = source[4:].split("\n---\n", 1)
              fields = dict(quoted.findall(front))
              chapter = fields.get("chapter_osis","")
              if chapter not in originals or chapter in seen:
                  flags.append({"manuscript":path.name, "problem":"unmapped or duplicate chapter_osis"})
                  continue
              seen.add(chapter)
              if (fields.get("source_module") != "MHCC 0.1.1"
                  or fields.get("source_native_corpus_sha256") != native["original_compiled_corpus_sha256"]
                  or fields.get("source_zip_sha256") !=
                     "a0639201b57b9a6ec843fca70ffc08f75e179a24130a22ce1fd43be8ca42c746"
                  or not fields.get("publication_status","").startswith("NOT RELEASED")):
                  problems.append("source identity/publication status not pinned")
              if "\n---\n" not in rest:
                  problems.append("no clear modern prose versus editorial notes boundary")
                  main = rest
              else:
                  main, _ = rest.split("\n---\n", 1)
              heads = list(heading.finditer(main))
              prose_units = []
              for idx, match in enumerate(heads):
                  title = match[2].strip()
                  low = title.lower()
                  if low.startswith("original ") or "book introduction" in low:
                      continue
                  # A ## heading containing ### authorial sections is a
                  # navigation/container label, not an extra authored K body.
                  # Preserve the parent prose separately for human review.
                  level = len(match[1])
                  if idx + 1 < len(heads) and len(heads[idx + 1][1]) > level:
                      continue
                  section = main[match.end():heads[idx + 1].start() if idx + 1 < len(heads)
                                 else len(main)]
                  prose_units.append((title, len(token.findall(section))))
              src = originals[chapter]
              source_units = src["original_units"]
              is_intro_only = src["source_placement"] == "INTRO_ONLY_NEEDS_INDEPENDENT_REVIEW"
              expected = 1 if is_intro_only else len(source_units)
              if is_intro_only:
                  intros = [i for i in src["native_introductions_not_assumed_to_be_exposition"]
                            if i["key"] in (chapter,chapter+".0") and i["visible_word_tokens"] > 0]
                  if len(intros) != 1 or source_units or src["original_native_numbered_keys"] != 0:
                      problems.append("intro-only original ownership not proven")
              elif src["source_placement"] != "NUMBERED_KEYS_WITH_SEPARATE_INTRO" or not source_units:
                  problems.append("unknown original source storage pattern")
              if len(prose_units) != expected:
                  problems.append(f"original authorial groups={expected}; modern prose sections={len(prose_units)}")
              for index, (title, words) in enumerate(prose_units):
                  if words < 25:
                      problems.append(f"modern exposition {index+1} has {words} words")
                  if re.search(r"\b(?:TODO|TBD|PLACEHOLDER|NOT YET TRANSLATED)\b",
                               main, re.IGNORECASE):
                      problems.append("untranslated marker in draft")
                      break
                  if index < len(source_units):
                      nums = [int(k.rsplit(".",1)[1]) for k in source_units[index]["keys"]]
                      m = verse_marker.search(title)
                      if not m:
                          problems.append(f"modern exposition {index+1} has no parseable verse-scope heading")
                      else:
                          bound = [int(t) for t in re.findall(r"\d+",m[1])]
                          if not bound or (bound[0],bound[-1]) != (min(nums),max(nums)):
                              problems.append(f"modern exposition {index+1} verse scope differs from native group")
              rows.append({
                  "chapter":chapter,
                  "manuscript":path.name,
                  "source_original_K_groups":len(source_units),
                  "source_original_intro_only":is_intro_only,
                  "modern_expositions":len(prose_units),
                  "modern_exposition_words":sum(w for _,w in prose_units),
                  "original_native_occupied_K_keys":src["original_native_numbered_keys"],
                  "problems":list(dict.fromkeys(problems))
              })
              for problem in dict.fromkeys(problems):
                  flags.append({"chapter":chapter,"problem":problem})
          if seen != set(originals):
              flags.append({"problem":"missing original canonical manuscripts","count":len(set(originals)-seen)})
          count = Counter(f["problem"].split("=",1)[0] for f in flags)
          summary = {
              "status":"FULL_CANON_NATIVE_GROUP_TO_MODERN_DRAFT_DIAGNOSTIC_NOT_EDITORIAL_APPROVAL",
              "chapters_expected":len(originals),
              "manuscripts_inspected":len(rows),
              "native_numbered_K_authorial_units":sum(len(c["original_units"]) for c in originals.values()),
              "modern_prose_expositions":sum(r["modern_expositions"] for r in rows),
              "original_intro_only_chapters":sum(r["source_original_intro_only"] for r in rows),
              "native_occupied_K_addresses":sum(r["original_native_occupied_K_keys"] for r in rows),
              "total_modern_exposition_words":sum(r["modern_exposition_words"] for r in rows),
              "affected_chapters":sum(bool(r["problems"]) for r in rows),
              "diagnostic_flags":flags,
              "flag_counts_by_type":dict(sorted(count.items())),
              "original_full_semantic_meaning_verified":False,
              "original_native_footnotes_references_quotation_and_layout_verified":False,
              "independent_editorial_signoff":False,
              "automatic_edits_made":False,
              "chapters":rows
          }
          output = Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-full-canon-source-group-diagnostic.json"
          output.write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("FULL_CANON_GROUP_DIAGNOSTIC manuscripts="+str(summary["manuscripts_inspected"])+
                " source_K_groups="+str(summary["native_numbered_K_authorial_units"])+
                " intro_only="+str(summary["original_intro_only_chapters"])+
                " modern_expositions="+str(summary["modern_prose_expositions"])+
                " affected_chapters="+str(summary["affected_chapters"])+
                " flags="+str(len(flags)))
          topology = [{
              "chapter":r["chapter"],
              "original_K_groups":r["source_original_K_groups"],
              "original_intro_only":r["source_original_intro_only"],
              "modern_expositions":r["modern_expositions"],
              "source_versification_issues":[f for f in r["problems"]
                  if "verse scope differs" in f]
          } for r in rows if (
              r["modern_expositions"] !=
              r["source_original_K_groups"] + (1 if r["source_original_intro_only"] else 0)
              or any("verse scope differs" in f for f in r["problems"])
          )]
          print("FULL_CANON_TOPOLOGY_DEVIATIONS "+json.dumps(topology,sort_keys=True))
          print("FULL_CANON_FLAG_COUNTS "+json.dumps({
              "topology_deviation_chapters":len(topology),
              "no_heading_scope_claims":sum("no parseable verse-scope heading" in f["problem"] for f in flags),
              "short_prose_sections_lt_25_words":sum(" has " in f["problem"] and
                  f["problem"].endswith(" words") for f in flags),
              "raw_diagnostic_flags":len(flags)},sort_keys=True))
          for problem in flags[:90]:
              print("FULL_CANON_FLAG "+json.dumps(problem,sort_keys=True))
          print("Metadata-only diagnostic: source meaning, native refs and notes NOT approved.")
          # This is triage, never a semantic/editorial approval gate.
          assert len(rows)==len(originals), "Canonical chapter manuscript missing"
          PY
      - name: Build private Leviticus 19 and Psalm 108 I-only linked chapter previews
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_ionly_preview.py \
            --manifest work/mhcc-modern/production/IONLY_CHAPTER_LINK_PREVIEW.json \
            --source-receipt "$RUNNER_TEMP/mhcc-modern-whole-canon-native-receipt.json" \
            --osis "$RUNNER_TEMP/mhcc-ionly-preview.xml" \
            --report "$RUNNER_TEMP/mhcc-ionly-preview-report.json" \
            --temp-module-id MHCCIONLY
          mkdir -p "$RUNNER_TEMP/mhcc-ionly-root/mods.d"
          mkdir -p "$RUNNER_TEMP/mhcc-ionly-root/modules/comments/zcom/mhccionly"
          osis2mod "$RUNNER_TEMP/mhcc-ionly-root/modules/comments/zcom/mhccionly" \
            "$RUNNER_TEMP/mhcc-ionly-preview.xml" -z z -b 3 \
            > "$RUNNER_TEMP/mhcc-ionly-build.log" 2>&1
          cat > "$RUNNER_TEMP/mhcc-ionly-root/mods.d/mhccionly.conf" <<'EOF'
          [MHCCIONLY]
          Description=Unvalidated temporary whole-chapter I-only link transport proof
          DataPath=./modules/comments/zcom/mhccionly/
          ModDrv=zCom
          CompressType=ZIP
          BlockType=CHAPTER
          Lang=en
          Versification=KJV
          SourceType=OSIS
          DistributionLicense=Private
          EOF
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_index.cpp \
            -o "$RUNNER_TEMP/mhcc-ionly-native-index" -lsword
          SWORD_PATH="$RUNNER_TEMP/mhcc-ionly-root" \
            "$RUNNER_TEMP/mhcc-ionly-native-index" MHCCIONLY --chapter-registry \
            > "$RUNNER_TEMP/mhcc-ionly-chapter-registry.txt"
          SWORD_PATH="$RUNNER_TEMP/mhcc-ionly-root" \
            "$RUNNER_TEMP/mhcc-ionly-native-index" MHCCIONLY --adjacent-links \
            > "$RUNNER_TEMP/mhcc-ionly-native-links.txt"
          for key in 'Leviticus 19:1' 'Leviticus 19:37' 'Psalms 108:1' 'Psalms 108:13'; do
            SWORD_PATH="$RUNNER_TEMP/mhcc-ionly-root" \
              diatheke -b MHCCIONLY -f OSIS -k "$key" \
              > "$RUNNER_TEMP/mhcc-ionly-diath-$(echo "$key" | tr ' :' '__').txt"
          done
          python - <<'PY'
          from collections import defaultdict
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus

          temp=Path(os.environ["RUNNER_TEMP"])
          report=json.loads((temp/"mhcc-ionly-preview-report.json").read_text())
          assert report["status"] == "PRIVATE_UNVALIDATED_IONLY_SWORD_TRANSPORT_PREVIEW"
          assert not report["sword_publication_authorized"]
          expected={"Lev.19":37,"Ps.108":13}
          assert {x["chapter"]:x["expected_compiled_linked_verse_keys"]
                  for x in report["chapters"]} == expected
          registry=(temp/"mhcc-ionly-chapter-registry.txt").read_text().splitlines()
          actual={}
          for row in registry:
              fields=row.split("\t")
              if len(fields)==3 and fields[0]=="R" and fields[1] in expected:
                  actual[fields[1]]=int(fields[2])
          assert actual==expected, ("Declared range does not match actual native KJV registry",actual)

          linked=(temp/"mhcc-ionly-native-links.txt").read_text().splitlines()
          seen_pairs=defaultdict(set)
          for row in linked:
              fields=row.split("\t")
              if len(fields)!=4 or fields[0]!="L":
                  continue
              before,after,flag=fields[1:]
              chapter=before.rsplit(".",1)[0]
              assert chapter in expected and after.startswith(chapter+".")
              assert flag=="1", ("A verse key has an independently stored duplicate body", before, after)
              seen_pairs[chapter].add((before,after))
          for chapter,count in expected.items():
              pairs={(f"{chapter}.{v}",f"{chapter}.{v+1}") for v in range(1,count)}
              assert seen_pairs[chapter]==pairs, (chapter,"missing or extra native links")
          assert linked[-1]=="S\t48\t48\t0", ("Incorrect native isLinked summary",linked[-1])

          env=os.environ.copy()
          env["SWORD_PATH"]=str((temp/"mhcc-ionly-root").resolve())
          proc=subprocess.Popen([str(temp/"commentary-modern-source-raw"),"MHCCIONLY"],
              env=env,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
          source_raw=defaultdict(dict)
          intro_raw={}
          try:
              assert proc.stdout
              def collect(kind,ref,raw):
                  if kind=="K":
                      chapter=ref.rsplit(".",1)[0]
                      if chapter not in expected:
                          raise ValueError("Unexpected populated verse in the private module")
                      source_raw[chapter][ref]=hashlib.sha256(raw).hexdigest()
                  elif kind=="I":
                      intro_raw[ref]=raw
              counters,numbered,_,_=parse_native_raw_corpus(proc.stdout,on_entry=collect)
              proc.stdout.close()
              assert proc.wait(timeout=30)==0
          finally:
              if proc.poll() is None:
                  proc.kill()
                  proc.wait()
          assert counters["actual_occupied_numbered_entry_count"]==50
          assert len(numbered)==50
          for chapter,count in expected.items():
              assert set(source_raw[chapter])=={f"{chapter}.{v}" for v in range(1,count+1)}
              assert len(set(source_raw[chapter].values()))==1
          # Do not present the same modern body both as a native I introduction
          # and again through K aliases.
          for raw in intro_raw.values():
              assert b"This chapter includes a few ceremonial regulations" not in raw
              assert b"We can help our worship" not in raw
          samples=list(temp.glob("mhcc-ionly-diath-*.txt"))
          assert len(samples)==4
          for sample in samples:
              rendered=sample.read_text(encoding="utf-8")
              assert ("This chapter includes a few ceremonial regulations" in rendered
                      or "We can help our worship" in rendered), sample.name
          print("I_ONLY_SWORD_NATIVE_LINK_PASS chapters=2 linked_verse_keys=50 "+
                "adjacent_isLinked_pairs=48 independent_authorial_sections=2")
          print("Real temporary SWORD readback proved the transport only; "+
                "original headings/meaning, independent readers, licensing and release remain unapproved")
          PY
