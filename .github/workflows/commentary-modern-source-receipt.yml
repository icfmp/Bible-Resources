              "-k","Mark 1:1"],env=env,capture_output=True,text=True,timeout=30)
          if check.returncode!=0 or len(check.stdout.strip())<80:
              raise ValueError("Real reader failed on private source-linked book introduction")
          print("PRIVATE ORIGINAL BOOK-INTRO SOURCE-LINK SWORD PASS: "+
                str(sum(map(len,expected.values())))+" recovered original K citations in intro, "+
                str(sum(found_notes.values()))+" still K notes, 28792 K keys, real reader PASS; no release")
          PY
