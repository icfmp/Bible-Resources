          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,subprocess,sys,unicodedata
          from collections import Counter,defaultdict
          from pathlib import Path
          from lxml import etree
          sys.path.insert(0,"scripts")
          from commentary_private_text_compare import _original_source_markers
          from commentary_nonlink_word_alignment import plain_word_alignment
          from commentary_modern_draft_osis_preview import (
