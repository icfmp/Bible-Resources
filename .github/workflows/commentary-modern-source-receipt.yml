              "*-book-introduction.CANDIDATE.md")))
          assert len(candidates)==56
          candidates_by_book={}
          for path in candidates:
              meta,modern=_modern_front(path)
              book=meta["book_osis"]
              if (book in candidates_by_book or book not in _CANON
                      or meta["source_native_corpus_sha256"]!=_SOURCE_CORPUS):
                  raise ValueError("Duplicate, foreign or stale book introduction")
              candidates_by_book[book]=(path,meta,modern)
          source_attested={
              book for book,(_p,meta,_text) in candidates_by_book.items()
              if meta.get("source_native_intro_key")=="I:"+book+".1"}
          assert source_attested=={"2John","3John","Jude","Obad","Phlm"}
          review=set(candidates_by_book)-source_attested
          assert len(review)==51
          expected={}
          for book in review:
              original_units=source["chapters"][book+".1"]["original_units"]
              if not original_units:
                  raise ValueError("Unresolved book lacks numbered original K: "+book)
              first=original_units[0]["first_key"]
              expected[first]=(book,original_units[0]["source_unit_sha256"])
          if len(expected)!=51:
              raise ValueError("Book prefatory original K owners are not unique")
          observed={}
          env=os.environ.copy()
          env["SWORD_PATH"]=str((base/"mhcc-source-root").resolve())
          def observe(kind,key,raw):
              if kind!="K" or key not in expected:
                  return
              book,digest=expected[key]
              if key in observed or hashlib.sha256(raw).hexdigest()!=digest:
                  raise ValueError("Original first-K book source hash mismatch: "+book)
              fragment=etree.fromstring(
                  b"<native>"+raw+b"</native>",
                  parser=etree.XMLParser(resolve_entities=False,no_network=True,
                                         load_dtd=False,recover=False))
              observed[key]=words("".join(fragment.itertext()))
          proc=subprocess.Popen([
              str((base/"commentary-modern-source-raw").resolve()),"MHCC"],
              stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,env=env)
          try:
              native,*_=parse_native_raw_corpus(proc.stdout,on_entry=observe)
              proc.stdout.close()
              if proc.wait(timeout=120)!=0:
                  raise ValueError("Original native introduction K scan failed")
          finally:
              if proc.poll() is None:
                  proc.kill();proc.wait()
          if (native["all_native_raw_entries_ordered_sha256"]!=_SOURCE_CORPUS
                  or set(observed)!=set(expected)):
              raise ValueError("Incomplete original K book-intro survey")

          report=[]
          for book in sorted(review):
              path,meta,modern=candidates_by_book[book]
              sections=bybook.get(book,[])
              source_blocks=[p for p in sections if len(p["prefix_words"])>=15]
              original_first=source["chapters"][book+".1"]["original_units"][0]["first_key"]
              actual=observed[original_first]
              presence=[]
              for block in source_blocks:
                  needle=block["prefix_words"][:min(20,len(block["prefix_words"]))]
                  found=any(actual[i:i+len(needle)]==needle
                            for i in range(len(actual)-len(needle)+1))
                  presence.append(found)
              lexical_matches=[]
              for block in all_div1_prefaces:
                  needle=block["prefix_words"][:20]
                  locations=[ix for ix in range(
                      min(500,len(actual))-len(needle)+1)
                      if actual[ix:ix+len(needle)]==needle]
                  if len(locations)==1:
                      lexical_matches.append((block,locations[0]))
              if len(source_blocks)==1 and presence[0]:
                  result="CCEL_BOOK_PREFACE_WORDS_MATCH_ORIGINAL_FIRST_K"
              elif len(lexical_matches)==1:
                  result="CCEL_BOOK_PREFACE_UNIQUE_LEXICAL_FIRST_K_MATCH_CROSS_DIV1"
              elif len(lexical_matches)>1:
                  result="MULTIPLE_DIFFERENT_CCEL_PREFACES_IN_ORIGINAL_FIRST_K"
