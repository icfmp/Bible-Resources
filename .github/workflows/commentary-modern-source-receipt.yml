          DataPath=./modules/comments/zcom/mhcccompact/
          ModDrv=zCom
          CompressType=ZIP
          BlockType=CHAPTER
          Lang=en
          Versification=KJV
          SourceType=OSIS
          DistributionLicense=Private
          EOF
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree as ET
          sys.path.insert(0,"scripts")
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          base=Path(os.environ["RUNNER_TEMP"])
          all_reports=json.loads(
              (base/"mhcc-modern-complete-bounded-linked-osis-structure.json").read_text())
          comp=all_reports["private_exact_compact_reference_recovery"]
          fallback=all_reports["private_compact_remaining_source_notes"]
          expected={}
          for row in comp["placements"]:
              expected.setdefault(row["source_first_key"],[]).append((
                  row["original_literal_target_sha256"],
                  row["linked_visible_token_sha256"]))
          fallback_by_K={
              r["source_first_key"]:r["original_source_reference_hashes"]
              for r in fallback["note_source_K_reference_hashes_for_private_native_readback"]}
          seen={}
          fallback_seen={}
          def observe(kind,key,raw):
              if kind!="K" or key not in expected and key not in fallback_by_K:
                  return
              if key in seen:
                  raise ValueError("Repeated restored compact original source K")
              node=ET.fromstring(b"<native>"+raw+b"</native>")
              notes=[n for n in node.iter() if isinstance(n.tag,str)
                     and n.tag.rsplit("}",1)[-1]=="note"]
              if key in expected:
                  in_prose=[]
                  for ref in node.iter():
                      if not isinstance(ref.tag,str) or ref.tag.rsplit("}",1)[-1]!="reference":
                          continue
                      if any(ref in list(n.iter()) for n in notes):
                          continue
                      in_prose.append((
                          hashlib.sha256(ref.get("osisRef").encode()).hexdigest(),
                          hashlib.sha256("".join(ref.itertext()).encode()).hexdigest()))
                  counts=Counter(in_prose)
                  for item in expected[key]:
                      if counts[item]<=0:
                          raise ValueError("Restored original compact verse source link lost in compiled SWORD")
                      counts[item]-=1
              if key in fallback_by_K:
                  source_notes=[n for n in notes if "Unplaced links from original edition"
                                in "".join(n.itertext())]
                  if len(source_notes)!=1:
                      raise ValueError("One source original fallback note missing")
                  actual=[(
                      hashlib.sha256(r.get("osisRef").encode()).hexdigest(),
                      hashlib.sha256("".join(r.itertext()).encode()).hexdigest())
                      for r in source_notes[0].iter()
                      if isinstance(r.tag,str) and r.tag.rsplit("}",1)[-1]=="reference"]
                  wanted=[(
                      x["source_original_literal_target_sha256"],
                      x["supplement_display_sha256"])
                      for x in fallback_by_K[key]]
                  if actual!=wanted:
                      raise ValueError("Remaining source-only crossreference note drift")
                  fallback_seen[key]=len(actual)
              seen[key]=True
          env=os.environ.copy()
          env["SWORD_PATH"]=str((base/"mhcc-compact-root").resolve())
