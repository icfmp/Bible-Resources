              row["source_first_key"]:row["source_note_reference_hashes"]
              for row in receipt["remaining_notes_by_original_first_K"]}
          found={}
          found_notes={}
          def observe(kind,key,raw):
              if kind not in ("I","K"):
                  return
              if kind=="I":
                  if key.endswith(".0.0"):
                      return
                  chapter=key[:-2] if key.endswith(".0") else key
              else:
                  chapter=key.rsplit(".",1)[0]
              if chapter not in expected and key not in notes:
                  return
              node=ET.fromstring(b"<native>"+raw+b"</native>")
              all_notes=[n for n in node.iter() if isinstance(n.tag,str)
                         and n.tag.rsplit("}",1)[-1]=="note"]
              if chapter in expected:
                  hashes=Counter((
                      hashlib.sha256(r.get("osisRef").encode()).hexdigest(),
                      hashlib.sha256("".join(r.itertext()).encode()).hexdigest())
                      for r in node.iter() if isinstance(r.tag,str)
                      and r.tag.rsplit("}",1)[-1]=="reference"
                      and not any(r in list(n.iter()) for n in all_notes))
                  found.setdefault(chapter,Counter()).update(hashes)
              if kind=="K" and key in notes:
                  source_notes=[n for n in all_notes
                      if "Unplaced links from original edition" in "".join(n.itertext())]
                  if len(source_notes)!=1:
                      raise ValueError("Source K note missing from prefaced module")
                  original=[(
                      hashlib.sha256(r.get("osisRef").encode()).hexdigest(),
                      hashlib.sha256("".join(r.itertext()).encode()).hexdigest())
                      for r in source_notes[0].iter()
                      if isinstance(r.tag,str) and r.tag.rsplit("}",1)[-1]=="reference"]
                  wanted=[(
                      x["source_original_literal_target_sha256"],
                      x["supplement_display_sha256"]) for x in notes[key]]
                  if original!=wanted:
                      raise ValueError("Source K note ref literal/display corrupted in prefaced module")
                  found_notes[key]=len(original)
          env=os.environ.copy()
          env["SWORD_PATH"]=str((base/"mhcc-preface-refs-root").resolve())
          proc=subprocess.Popen([
              str((base/"commentary-modern-source-raw").resolve()),"MHCCPREFACEREFS"],
              env=env,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
          try:
              _,keys,_,_=parse_native_raw_corpus(proc.stdout,on_entry=observe)
              proc.stdout.close()
              if proc.wait(timeout=120)!=0:
                  raise ValueError("Stock native book-preface crossref SWORD scan failed")
          finally:
              if proc.poll() is None:
                  proc.kill()
                  proc.wait()
          if (len(keys)!=28792 or set(found_notes)!=set(notes)
                  or sum(found_notes.values())!=
                     receipt["original_K_source_only_note_occurrences_remaining"]):
              raise ValueError("Original K first-link/verse coverage changed")
          for chapter,refs in expected.items():
              n=found.get(chapter,Counter())
              for ref in refs:
                  if n[ref]<=0:
                      raise ValueError("Exact source-target book-intro link lost in compiled SWORD: "+chapter)
                  n[ref]-=1
