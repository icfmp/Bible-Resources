              "pinned_AndBible_JSword_commit":checked.stdout.strip(),
              "independent_real_native_readback_numbered_keys":len(keys),
              "native_confirmed_sample_entries_tested_in_JSword":len(sample),
              "native_link_bearing_groups_with_Jsword_parity":len(qualified),
              "jsword_junit_counts":counts,
              "engine_only_not_Android_app":True,
              "android_GUI_passed":False,
              "xiphos_GUI_approved":False,
              "source_text_or_Java_test_log_uploaded":False,
              "editorial_and_rights_approved":False,
              "published":False,
          }
          (base/"mhcc-modern-private-andbible-jsword-engine-metadata.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("PRIVATE HMCC MODERN ANDBIBLE JSWORD ENGINE PASS: pinned Java source, "
                "4 real JUnit tests, 7 source-native passages and "+
                str(len(qualified))+" original K source link specimens; "
                "no Android UI or release authorization")
