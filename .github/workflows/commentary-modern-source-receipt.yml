              stderr=subprocess.DEVNULL)
          try:
              output,keys,_,_=parse_native_raw_corpus(process.stdout,on_entry=observe)
              process.stdout.close()
              if process.wait(timeout=120)!=0:
                  raise ValueError("Private restored compact SWORD scan failed")
          finally:
              if process.poll() is None:
                  process.kill()
                  process.wait()
          if (len(keys)!=28792 or set(seen)!=set(expected)|set(fallback_by_K)
                  or set(fallback_seen)!=set(fallback_by_K)
                  or sum(fallback_seen.values())!=
                     comp["original_valid_link_positions_still_unplaced"]):
              raise ValueError("Private restored compact SWORD integrity mismatch")
          if sum(map(len,expected.values()))!=comp["original_exact_compact_verse_links_restored"]:
              raise ValueError("Original compact verse recovered count changed")
          check=subprocess.run([
              "diatheke","-b","MHCCCOMPACT","-f","OSIS","-k",
              "1 Corinthians 13:8"],env=env,text=True,capture_output=True,timeout=30)
          if check.returncode!=0 or len(check.stdout.strip())<80:
              raise ValueError("Real diatheke did not render the restored commentary K")
          print("PRIVATE COMPACT SWORD PASS: restored="+
                str(comp["original_exact_compact_verse_links_restored"])+
                " distinct authorial inline verse links, source-only fallback="+
                str(sum(fallback_seen.values()))+
                ", 28792 K keys, diatheke nonempty render and separate raw-SWORD target/label proof; NO release")
