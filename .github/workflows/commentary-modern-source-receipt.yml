                        "INSERTED_SEPARATE_MODERN_INTRO_FROM_VERIFIED_ORIGINAL_K"}
          assert len(expected)==proof["new_book_intros_inserted_as_separate_introduction_OSIS"]
          ns=f"{{{NS}}}"
          originals=ET.parse(
              base/"mhcc-modern-original-book-prefaces-restored.osis.xml").getroot()
          def normalized(s):
              return " ".join(unicodedata.normalize("NFC",s).split())
          in_osis={}
          for chapter in originals.iter():
              if chapter.tag!=ns+"chapter" or chapter.get("osisID") not in expected:
                  continue
              key=chapter.get("osisID")
              divs=[x for x in chapter.findall(f"./{ns}div") if
                    x.get("resp")=="BibleResourcesModernRelocatedFirstNativeKBookPreface"]
              if len(divs)!=1:
                  raise ValueError("Missing unique modern book preface in OSIS: "+key)
              content=normalized("".join("".join(x.itertext())
                                         for x in list(divs[0])
                                         if x.tag!=ns+"title"))
              digest=hashlib.sha256(content.encode()).hexdigest()
              if digest!=expected[key]:
                  raise ValueError("Modern first-K preface OSIS changed: "+key)
              in_osis[key]=content
          if set(in_osis)!=set(expected):
              raise ValueError("Some native-K-verified prefaces missing in final OSIS")
          seen_I={}
          all_references=0
          def observe(kind,key,raw):
              nonlocal_dummy=None
              # Inspect each compiled I once and each original K body once.
              if kind=="I":
                  if key not in expected:
                      return
                  if key in seen_I:
                      raise ValueError("Duplicate modern preface I entry")
                  fragment=ET.fromstring(b"<compiled>"+raw+b"</compiled>")
                  matches=[x for x in fragment.iter() if isinstance(x.tag,str)
                           and x.tag.rsplit("}",1)[-1]=="div" and
                           x.get("resp")==
                              "BibleResourcesModernRelocatedFirstNativeKBookPreface"]
                  def word_stream(value):
                      return re.findall(r"[^\W_]+",unicodedata.normalize(
                          "NFKC",value).casefold())
                  # osis2mod can change which div attributes survive and wrap
                  # chapter-I content. Verify the complete authored modern
                  # preface word stream INSIDE this original first-chapter I
                  # entry, without relying on derived XML resp persistence.
                  needle=word_stream(in_osis[key])
                  actual=word_stream("".join(fragment.itertext()))
                  locations=[i for i in range(len(actual)-len(needle)+1)
                             if actual[i:i+len(needle)]==needle]
                  if len(locations)!=1:
                      raise ValueError("SWORD chapter I did not preserve exactly "
                                       "one complete modern book preface word stream at "+key)
                  seen_I[key]=True
          env=os.environ.copy()
          env["SWORD_PATH"]=str((base/"mhcc-prefaces-root").resolve())
          proc=subprocess.Popen([
              str((base/"commentary-modern-source-raw").resolve()),
              "MHCCPREFACES"],env=env,stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL)
          try:
              result,numbered,_,_=parse_native_raw_corpus(proc.stdout,on_entry=observe)
              proc.stdout.close()
              if proc.wait(timeout=120)!=0:
                  raise ValueError("Private book-preface SWORD reader failed")
          finally:
              if proc.poll() is None:
                  proc.kill();proc.wait()
          assert set(seen_I)==set(expected)
          assert len(numbered)==28792
          assert links["modern_inline_links_inserted"]==(39 + links["automatic_source_matched_references"]["automatically_inserted"])
          assert links["private_source_note_alternative"][
              "original_link_occurrences_preserved_only_in_separate_source_notes"]==(
                  links["source_original_link_review_ledger"]["source_original_links_still_requiring_placement_review"]-4)
          assert links["private_unapproved_errata_navigation_preview"][
              "derived_navigation_links_from_corroborating_witnesses"]==13
          print("PRIVATE RESTORED BOOK PREFACES SWORD READBACK PASS: " +
                str(len(expected))+" independently source-K-attested " +
                "introductions in real chapter-I keys; 1 existing Genesis " +
                "not duplicated; 28792 exact keys; NO release")
          PY
