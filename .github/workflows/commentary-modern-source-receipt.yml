name: Modern commentary source-native receipt (metadata-only)
on:
  pull_request:
    paths:
      - '.github/workflows/commentary-modern-source-receipt.yml'
      - 'scripts/commentary_modern_source_receipt.py'
      - 'scripts/commentary_modern_reference_gate.py'
      - 'scripts/commentary_modern_linked_candidate_preview.py'
      - 'tests/test_commentary_modern_linked_candidate_preview.py'
      - 'tests/test_commentary_modern_reference_gate.py'
      - 'tests/test_commentary_modern_source_receipt.py'
      - 'work/mhcc-modern/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modern-source-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-native and draft-coverage guards on synthetic fixtures
        run: python -m unittest tests/test_commentary_modern_source_receipt.py tests/test_commentary_modern_draft_guard.py tests/test_commentary_modern_draft_osis_preview.py tests/test_commentary_modern_reference_gate.py tests/test_commentary_modern_linked_candidate_preview.py -v
      - name: Install real SWORD source reader
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y libsword-dev libsword-utils diatheke
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "${RUNNER_TEMP}/commentary-modern-source-raw" -lsword
      - name: Fetch the exact released and SHA-pinned MHCC 0.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --max-time 90 \
            'https://github.com/icfmp/Bible-Resources/releases/download/mhcc-0.1.1/MHCC-0.1.1.zip' \
            --output "${RUNNER_TEMP}/mhcc-0.1.1.zip"
          printf '%s  %s\n' \
            'a0639201b57b9a6ec843fca70ffc08f75e179a24130a22ce1fd43be8ca42c746' \
            "${RUNNER_TEMP}/mhcc-0.1.1.zip" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import zipfile
          root = Path(os.environ["RUNNER_TEMP"]) / "mhcc-source-root"
          root.mkdir()
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"])/"mhcc-0.1.1.zip") as zf:
              names = zf.namelist()
              assert "mods.d/mhcc.conf" in names
              assert len(names) <= 32
              for info in zf.infolist():
                  name = PurePosixPath(info.filename)
                  assert name.parts and not name.is_absolute() and ".." not in name.parts
                  assert not (info.external_attr >> 16) & 0o170000 == 0o120000
                  target = root.joinpath(*name.parts)
                  assert target.resolve().is_relative_to(root.resolve())
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      assert info.file_size <= 3 * 1024 * 1024
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as r, target.open("xb") as w:
                          w.write(r.read())
          print("Exact SHA-pinned published commentary installed only in an isolated temporary root")
          PY
      - name: Inventory full corrected original and Genesis 1 without exporting source text
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_source_receipt.py \
            --native-reader "${RUNNER_TEMP}/commentary-modern-source-raw" \
            --module-directory "${RUNNER_TEMP}/mhcc-source-root" \
            --module-id MHCC \
            --expected-corpus-sha256 \
            '2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e' \
            --chapters Gen.1 \
            --report "${RUNNER_TEMP}/mhcc-modern-source-native-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-source-native-receipt.json"
          r=json.loads(path.read_text())
          assert r["source_prose_or_original_markup_exported"] is False
          assert r["semantic_translation_independently_approved"] is False
          assert r["complete_native_counts"] == {"K":28742,"I":1255,"TOP":2}
          for ch,x in r["chapters"].items():
              assert x["original_native_numbered_keys"] > 0
              assert x["distinct_original_raw_units"] > 0
              print(ch+": "+str(x["distinct_original_raw_units"])+
                    " distinct source bodies / "+str(x["original_native_numbered_keys"])+
                    " occupied native verse keys / "+
                    str(len(x["native_introductions_not_assumed_to_be_exposition"]))+
                    " independently retained introduction keys")
          for ch,x in r["chapters"].items():
              for u in x["original_units"]:
                  print("ORIGINAL_UNIT "+ch+" first_key="+u["first_key"]+
                        " keys="+",".join(u["keys"])+
                        " sha256="+u["source_unit_sha256"]+
                        " markup="+json.dumps(u["markup"],sort_keys=True))
              for u in x["native_introductions_not_assumed_to_be_exposition"]:
                  print("ORIGINAL_INTRO "+ch+" key="+u["key"]+
                        " sha256="+u["raw_sha256"]+
                        " markup="+json.dumps(u["markup"],sort_keys=True))
          print("Full source-native gate PASS (not independent semantic or build acceptance)")
          PY
      - name: Verify Genesis 1 native original scripture link identities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_reference_gate.py \
            --native-reader "${RUNNER_TEMP}/commentary-modern-source-raw" \
            --module-directory "${RUNNER_TEMP}/mhcc-source-root" \
            --module-id MHCC \
            --source-map work/mhcc-modern/production/genesis-01.SOURCE_MAP.json \
            --expected-references work/mhcc-modern/production/genesis-01.REFERENCE_EXPECTATIONS.json \
            --modern-candidate work/mhcc-modern/production/genesis-01.CANDIDATE.md \
            --report "${RUNNER_TEMP}/mhcc-modern-genesis01-native-reference-proof.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-genesis01-native-reference-proof.json").read_text())
          assert report["source_unique_units_checked"]==8
          assert report["original_reference_links_checked"]==2
          assert report["original_intro_units_found"]==2
          for key,intro in report["per_intro_unit"].items():
              print("ORIGINAL_INTRO_PROSE_PROFILE "+key+" words="+str(intro["source_visible_word_count"]))
          assert report["original_osisRef_literal_values_exported"] is False
          assert report["new_modern_osis_reference_targets_embedded"] is False
          print("Exact Genesis 1 native source link identities verified; final OSIS mapping unapproved")
          PY
      - name: Compare committed 24 draft section labels and source pins with attested native metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_draft_guard.py \
            --root work/mhcc-modern \
            --native-map work/mhcc-modern/evidence/MHCC_0.1.1_24_CHAPTER_NATIVE_MAP.json \
            --report "${RUNNER_TEMP}/mhcc-modern-draft-coverage-report.json"
      - name: Compile disposable annotated OSIS preview and read it with a real SWORD engine
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_draft_osis_preview.py \
            --root work/mhcc-modern \
            --native-map work/mhcc-modern/evidence/MHCC_0.1.1_24_CHAPTER_NATIVE_MAP.json \
            --osis "${RUNNER_TEMP}/mhcc-modern-preview.osis.xml" \
            --report "${RUNNER_TEMP}/mhcc-modern-preview-structure.json" \
            --temp-module-id MHCCWORK
          mkdir -p "${RUNNER_TEMP}/mhcc-work-sword/mods.d"
          mkdir -p "${RUNNER_TEMP}/mhcc-work-sword/modules/comments/zcom/mhccwork"
          osis2mod "${RUNNER_TEMP}/mhcc-work-sword/modules/comments/zcom/mhccwork" \
            "${RUNNER_TEMP}/mhcc-modern-preview.osis.xml" -z z -b 3 \
            > "${RUNNER_TEMP}/mhcc-osis2mod-build.log" 2>&1
          cat > "${RUNNER_TEMP}/mhcc-work-sword/mods.d/mhccwork.conf" <<'EOF'
          [MHCCWORK]
          Description=Private unvalidated temporary MHCC Modern English layout preview
          DataPath=./modules/comments/zcom/mhccwork/
          ModDrv=zCom
          CompressType=ZIP
          BlockType=CHAPTER
          Lang=en
          Versification=KJV
          SourceType=OSIS
          DistributionLicense=Private
          EOF
          SWORD_PATH="${RUNNER_TEMP}/mhcc-work-sword" \
            diatheke -b MHCCWORK -f OSIS -k "Psalm 134:1" \
            > "${RUNNER_TEMP}/mhcc-work-rendered-sample.txt"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          root=Path(os.environ["RUNNER_TEMP"])
          temp_module=root/"mhcc-work-sword"
          meta=json.loads((root/"mhcc-modern-preview-structure.json").read_text())
          assert meta["status"]=="TECHNICAL_ONLY_UNVALIDATED_OSIS_PREVIEW"
          assert meta["modern_chapter_count"]==24
          assert meta["annotated_commentary_sections"]==54
          assert not meta["original_inline_reference_or_note_fidelity_approved"]
          actual_text=(root/"mhcc-work-rendered-sample.txt").read_text()
          assert "stir ourselves" in actual_text or "give glory to God" in actual_text, (
              "Real SWORD reader did not return the expected Psalm 134 prose")
          env=os.environ.copy()
          env["SWORD_PATH"]=str(temp_module.resolve())
          p=subprocess.Popen([str(root/"commentary-modern-source-raw"),"MHCCWORK"],
                             env=env,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
          try:
              assert p.stdout
              original_keys=set()
              def on_entry(kind,ref,raw):
                  if kind=="K":
                      original_keys.add(ref)
              result,*_=parse_native_raw_corpus(p.stdout,on_entry=on_entry)
              p.stdout.close()
              assert p.wait(timeout=25)==0
          finally:
              if p.poll() is None:
                  p.kill()
                  p.wait()
          ledger=json.loads(Path("work/mhcc-modern/evidence/MHCC_0.1.1_24_CHAPTER_NATIVE_MAP.json").read_text())
          expected=set(k for chapter in ledger["chapters"].values()
                         for unit in chapter["units"] for k in unit["native_keys"])
          assert original_keys==expected, (
              "Compiled temporary commentary changed the original chapter/section K-key scope")
          assert result["actual_occupied_numbered_entry_count"]==254
          print("DISPOSABLE OSIS SWORD PREVIEW PASS: 24 chapters, 54 source anchors, "
                "254 exact numbered keys, real diatheke reading, "
                "no semantic or source-reference acceptance; no release")
          PY
      - name: Compile the Genesis 1 production candidate as a separate disposable SWORD preview
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_draft_osis_preview.py \
            --root work/mhcc-modern/production \
            --single-chapter-source-map work/mhcc-modern/production/genesis-01.SOURCE_MAP.json \
            --include-production-candidates \
            --osis "${RUNNER_TEMP}/mhcc-genesis01-candidate-preview.osis.xml" \
            --report "${RUNNER_TEMP}/mhcc-genesis01-candidate-preview.json" \
            --temp-module-id MHCCGENP
          mkdir -p "${RUNNER_TEMP}/mhcc-genp-sword/mods.d"
          mkdir -p "${RUNNER_TEMP}/mhcc-genp-sword/modules/comments/zcom/mhccgenp"
          osis2mod "${RUNNER_TEMP}/mhcc-genp-sword/modules/comments/zcom/mhccgenp" \
            "${RUNNER_TEMP}/mhcc-genesis01-candidate-preview.osis.xml" -z z -b 3 \
            > "${RUNNER_TEMP}/mhcc-genesis01-preview-build.log" 2>&1
          cat > "${RUNNER_TEMP}/mhcc-genp-sword/mods.d/mhccgenp.conf" <<'EOF'
          [MHCCGENP]
          Description=Unvalidated disposable Genesis 1 modern candidate
          DataPath=./modules/comments/zcom/mhccgenp/
          ModDrv=zCom
          CompressType=ZIP
          BlockType=CHAPTER
          Lang=en
          Versification=KJV
          SourceType=OSIS
          DistributionLicense=Private
          EOF
          SWORD_PATH="${RUNNER_TEMP}/mhcc-genp-sword" \
            diatheke -b MHCCGENP -f OSIS -k "Genesis 1:3" \
            > "${RUNNER_TEMP}/mhcc-genesis01-reader-v3.txt"
          SWORD_PATH="${RUNNER_TEMP}/mhcc-genp-sword" \
            diatheke -b MHCCGENP -f OSIS -k "Genesis 1:31" \
            > "${RUNNER_TEMP}/mhcc-genesis01-reader-v31.txt"
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          temp=Path(os.environ["RUNNER_TEMP"])
          report=json.loads((temp/"mhcc-genesis01-candidate-preview.json").read_text())
          assert report["modern_chapter_count"]==1
          assert report["annotated_commentary_sections"]==8
          assert report["new_reading_paragraphs"]>=45
          assert report["original_book_and_chapter_introductions_included"] is False
          assert report["original_inline_reference_or_note_fidelity_approved"] is False
          assert report["semantic_translation_independently_approved"] is False
          assert report["sword_publication_authorized"] is False
          a=(temp/"mhcc-genesis01-reader-v3.txt").read_text()
          b=(temp/"mhcc-genesis01-reader-v31.txt").read_text()
          assert "Let there be light" in a
          assert "new heavens" in b
          env=os.environ.copy()
          env["SWORD_PATH"]=str((temp/"mhcc-genp-sword").resolve())
          proc=subprocess.Popen([str(temp/"commentary-modern-source-raw"),"MHCCGENP"],
                                stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,env=env)
          try:
              assert proc.stdout
              proof,numbered,_,_=parse_native_raw_corpus(proc.stdout)
              proc.stdout.close()
              assert proc.wait(timeout=20)==0
          finally:
              if proc.poll() is None:
                  proc.kill()
                  proc.wait()
          assert len(numbered)==31
          assert all(r.startswith("Gen.1.") for r in numbered)
          assert proof["actual_occupied_numbered_entry_count"]==31
          print("Genesis 1 temporary candidate OSIS/native readback PASS: 8 source divisions, 31 native positions; source ref/introduction fidelity and semantic signoff still pending")
          PY
      - name: Build Genesis 1 candidate preview with the original source's exact verified links and a separate modern book introduction
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_linked_candidate_preview.py \
            --root work/mhcc-modern/production \
            --source-map work/mhcc-modern/production/genesis-01.SOURCE_MAP.json \
            --expected-references work/mhcc-modern/production/genesis-01.REFERENCE_EXPECTATIONS.json \
            --book-intro-candidate work/mhcc-modern/production/genesis-book-introduction.CANDIDATE.md \
            --chapter-candidate work/mhcc-modern/production/genesis-01.CANDIDATE.md \
            --native-reader "${RUNNER_TEMP}/commentary-modern-source-raw" \
            --module-directory "${RUNNER_TEMP}/mhcc-source-root" \
            --module-id MHCC \
            --temp-module-id MHCCGENL \
            --osis "${RUNNER_TEMP}/mhcc-genesis01-linked-preview.xml" \
            --report "${RUNNER_TEMP}/mhcc-genesis01-linked-preview-metadata.json"
          mkdir -p "${RUNNER_TEMP}/mhcc-genl-sword/mods.d"
          mkdir -p "${RUNNER_TEMP}/mhcc-genl-sword/modules/comments/zcom/mhccgenl"
          osis2mod "${RUNNER_TEMP}/mhcc-genl-sword/modules/comments/zcom/mhccgenl" \
            "${RUNNER_TEMP}/mhcc-genesis01-linked-preview.xml" -z z -b 3 \
            > "${RUNNER_TEMP}/mhcc-genesis01-linked-build.log" 2>&1
          cat > "${RUNNER_TEMP}/mhcc-genl-sword/mods.d/mhccgenl.conf" <<'EOF'
          [MHCCGENL]
          Description=Temporary source-linked, semantically unapproved MHCC Modern Genesis 1
          DataPath=./modules/comments/zcom/mhccgenl/
          ModDrv=zCom
          CompressType=ZIP
          BlockType=CHAPTER
          Lang=en
          Versification=KJV
          SourceType=OSIS
          DistributionLicense=Private
          EOF
          SWORD_PATH="${RUNNER_TEMP}/mhcc-genl-sword" \
            diatheke -b MHCCGENL -f OSIS -k "Genesis 1:3" \
            > "${RUNNER_TEMP}/mhcc-genesis01-linked-v3.txt"
          SWORD_PATH="${RUNNER_TEMP}/mhcc-genl-sword" \
            diatheke -b MHCCGENL -f OSIS -k "Genesis 1:26" \
            > "${RUNNER_TEMP}/mhcc-genesis01-linked-v26.txt"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          base=Path(os.environ["RUNNER_TEMP"])
          m=json.loads((base/"mhcc-genesis01-linked-preview-metadata.json").read_text())
          assert m["status"]=="DISPOSABLE_SOURCE_LINKED_CANDIDATE_LAYOUT_NOT_EDITORIALLY_APPROVED"
          assert m["annotated_commentary_sections"]==8
          assert m["original_source_link_target_count"]==2
          assert m["original_source_link_targets_embedded_exactly"] is True
          assert m["modern_book_introduction_paragraphs_included"]>=3
          assert m["original_chapter_outline_tables_preserved"] is True
          assert m["original_chapter_outline_tables_retained"]==8
          assert m["original_chapter_outline_cell_text_exactly_preserved"] is True
          assert m["original_chapter_intro_native_markup_preserved"] is False
          assert m["sword_publication_authorized"] is False
          ns={"o":"http://www.bibletechnologies.net/2003/OSIS/namespace"}
          root=ET.parse(base/"mhcc-genesis01-linked-preview.xml").getroot()
          links=root.findall(".//o:reference",ns)
          intros=root.findall(".//o:div[@type='introduction']",ns)
          assert len(links)==2 and len(intros)==1
          a=(base/"mhcc-genesis01-linked-v3.txt").read_text()
          b=(base/"mhcc-genesis01-linked-v26.txt").read_text()
          def rendered_flags(value):
              markers=("The Bible's opening verse","Let there be light",
                       "1 John 5:20","Let us make man",
                       "Ecclesiastes 7:29","Nothing in the most ancient",
                       "Genesis 1","Genesis")
              return {marker:(marker in value) for marker in markers}
          print("GEN1_LINKED_READER_MARKER_DIAGNOSTIC"+
                " verse3="+str(rendered_flags(a))+
                " verse26="+str(rendered_flags(b))+
                " v3_bytes="+str(len(a.encode()))+
                " v26_bytes="+str(len(b.encode())))
          assert "1 John 5:20" in a and "Ecclesiastes 7:29" in b
          print("Source-linked Genesis 1 temp build: 2 exact original targets, separate modern book introduction and reader visible markers PASS; historic source outline/chapter intro and independent semantic acceptance pending")
          PY
      - name: Upload metadata-only bounded audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhcc-modern-0.1.1-source-native-receipt
          path: |
            ${{ runner.temp }}/mhcc-modern-source-native-receipt.json
            ${{ runner.temp }}/mhcc-modern-draft-coverage-report.json
            ${{ runner.temp }}/mhcc-modern-preview-structure.json
          if-no-files-found: ignore
          retention-days: 60
