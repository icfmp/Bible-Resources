          from commentary_modern_reference_gate import _ENGLISH_NAME_BY_OSIS

          base=Path(os.environ["RUNNER_TEMP"])
          source=json.loads((base/"mhcc-modern-whole-canon-native-receipt.json").read_text())
          assert source["original_compiled_corpus_sha256"]==_SOURCE_CORPUS
          source_bytes=(base/"mhcc-independent-ccel.xml").read_bytes()
          assert hashlib.sha256(source_bytes).hexdigest()==(
              "4a5509ba5064b54572397ae1a796561ff6ce4a1e18f366af0141a09c5d06fcd6")
          units,_metadata=_original_source_markers(source_bytes)
          raw_root=etree.fromstring(
              source_bytes,parser=etree.XMLParser(
                  resolve_entities=False,no_network=True,load_dtd=False,
                  recover=False,huge_tree=False,remove_blank_text=False))
          div1=[v for v in raw_root.iter() if
                isinstance(v.tag,str) and v.tag.rsplit("}",1)[-1]=="div1"]
          owned=defaultdict(set)
          for start,records in units.items():
              book=start.split(".",1)[0]
              for record in records:
                  owned[record["private_original_enclosing_div1_document_ordinal"]].add(book)
          bybook=defaultdict(list)
          all_div1_prefaces=[]
          def words(text):
              return re.findall(r"[^\W_]+",unicodedata.normalize(
                  "NFKC",text).casefold())
          for i,node in enumerate(div1,1):
              codes=owned.get(i,set())
              book=(next(iter(codes)) if len(codes)==1 and
                    next(iter(codes)) in _CANON else None)
              first_chapter=next((n for n,v in enumerate(node)
                  if isinstance(v.tag,str) and
                  v.tag.rsplit("}",1)[-1]=="div2"),None)
              if first_chapter is None:
                  continue
              # Only direct-book prose ahead of its first chapter, NEVER
              # annex chapter titles, verses, or any later commentary.
              prefix=[]
              for child in list(node)[:first_chapter]:
                  if isinstance(child.tag,str) and child.tag.rsplit("}",1)[-1] in (
                      "title","h1","h2","h3","h4"):
                      continue
                  prefix.append("".join(child.itertext()))
              passage=" ".join(prefix)
              block={
                  "source_div1_ordinal":i,
                  "prefix_words":words(passage),
                  "prefix_sha256":hashlib.sha256(passage.encode()).hexdigest(),
              }
              if len(block["prefix_words"])>=15:
                  all_div1_prefaces.append(block)
              if book is not None:
                  bybook[book].append(block)

