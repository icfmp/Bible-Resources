name: Modern commentary source-native receipt (metadata-only)
on:
  # Scoped push trigger for this PR's fail-closed GUI validation.
  push:
    branches: [feature/mhcc-modern-english]
  pull_request:
    paths:
      - '.github/workflows/commentary-modern-source-receipt.yml'
      - 'scripts/commentary_modern_source_receipt.py'
      - 'scripts/commentary_xiphos_dual_reader.py'
      - 'scripts/commentary_modern_native_witness_probe.py'
      - 'tests/test_commentary_modern_native_witness_probe.py'
      - 'scripts/commentary_modern_ionly_preview.py'
      - 'scripts/commentary_modern_k_scope_preview.py'
      - 'tests/test_commentary_modern_k_scope_preview.py'
      - 'scripts/sword_native_commentary_index.cpp'
      - 'scripts/commentary_modern_reference_gate.py'
      - 'scripts/commentary_modern_linked_candidate_preview.py'
      - 'tests/test_commentary_modern_linked_candidate_preview.py'
      - 'tests/test_commentary_modern_reference_gate.py'
      - 'tests/test_commentary_modern_source_receipt.py'
      - 'tests/test_commentary_modern_ionly_preview.py'
      - 'tests/java/org/icfmp/research/CommentaryCandidateJSwordParityTest.java'
      - 'work/mhcc-modern/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modern-source-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source_metadata:
    # Source-native validation is independent of optional Xiphos display packages.
    # Match the runner that already passed real MHC Xiphos GTK GUI tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-native and draft-coverage guards on synthetic fixtures
        run: python -m unittest tests/test_commentary_modern_source_receipt.py tests/test_commentary_modern_ionly_preview.py tests/test_commentary_modern_draft_guard.py tests/test_commentary_modern_draft_osis_preview.py tests/test_commentary_modern_reference_gate.py tests/test_commentary_modern_linked_candidate_preview.py tests/test_commentary_modern_native_witness_probe.py tests/test_commentary_modern_k_scope_preview.py -v
      - name: Test fail-closed real-Xiphos GUI harness before any SWORD build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt
          PYTHONPATH=scripts python -m unittest tests/test_commentary_xiphos_dual_reader.py -v
      - name: Install real SWORD source reader
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 26.04 GitHub runners can download these stock packages
          # slowly from archive.ubuntu.com even after apt update succeeds.
          # Keep a hard upper bound, but allow the verified SWORD runtime to
          # finish instead of aborting partway through its dependencies.
          timeout 150s sudo apt-get -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 480s sudo apt-get -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 install -y libsword-dev libsword-utils diatheke
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "${RUNNER_TEMP}/commentary-modern-source-raw" -lsword
      - name: Fetch the exact released and SHA-pinned MHCC 0.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --max-time 90 \
            'https://github.com/icfmp/Bible-Resources/releases/download/mhcc-0.1.1/MHCC-0.1.1.zip' \
            --output "${RUNNER_TEMP}/mhcc-0.1.1.zip"
          printf '%s  %s\n' \
            'a0639201b57b9a6ec843fca70ffc08f75e179a24130a22ce1fd43be8ca42c746' \
            "${RUNNER_TEMP}/mhcc-0.1.1.zip" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import zipfile
          root = Path(os.environ["RUNNER_TEMP"]) / "mhcc-source-root"
          root.mkdir()
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"])/"mhcc-0.1.1.zip") as zf:
              names = zf.namelist()
              assert "mods.d/mhcc.conf" in names
              assert len(names) <= 32
              for info in zf.infolist():
                  name = PurePosixPath(info.filename)
                  assert name.parts and not name.is_absolute() and ".." not in name.parts
                  assert not (info.external_attr >> 16) & 0o170000 == 0o120000
                  target = root.joinpath(*name.parts)
                  assert target.resolve().is_relative_to(root.resolve())
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      assert info.file_size <= 3 * 1024 * 1024
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as r, target.open("xb") as w:
                          w.write(r.read())
          print("Exact SHA-pinned published commentary installed only in an isolated temporary root")
          PY
      - name: Inventory full corrected original and Genesis 1–24 without exporting source text
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_source_receipt.py \
            --native-reader "${RUNNER_TEMP}/commentary-modern-source-raw" \
            --module-directory "${RUNNER_TEMP}/mhcc-source-root" \
            --module-id MHCC \
            --expected-corpus-sha256 \
            '2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e' \
            --chapters Gen.1 Gen.2 Gen.3 Gen.4 Gen.5 Gen.6 Gen.7 Gen.8 Gen.9 Gen.10 Gen.11 Gen.12 Gen.13 Gen.14 Gen.15 Gen.16 Gen.17 Gen.18 Gen.19 Gen.20 Gen.21 Gen.22 Gen.23 Gen.24 \
            --report "${RUNNER_TEMP}/mhcc-modern-source-native-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-source-native-receipt.json"
          r=json.loads(path.read_text())
          assert set(r["chapters"]) == {f"Gen.{i}" for i in range(1, 25)}
          assert r["source_prose_or_original_markup_exported"] is False
          assert r["semantic_translation_independently_approved"] is False
          assert r["complete_native_counts"] == {"K":28742,"I":1255,"TOP":2}
          for ch,x in r["chapters"].items():
              assert x["original_native_numbered_keys"] > 0
              assert x["distinct_original_raw_units"] > 0
              print(ch+": "+str(x["distinct_original_raw_units"])+
                    " distinct source bodies / "+str(x["original_native_numbered_keys"])+
                    " occupied native verse keys / "+
                    str(len(x["native_introductions_not_assumed_to_be_exposition"]))+
                    " independently retained introduction keys")
          for ch,x in r["chapters"].items():
              for u in x["original_units"]:
                  print("ORIGINAL_UNIT "+ch+" first_key="+u["first_key"]+
                        " keys="+",".join(u["keys"])+
                        " sha256="+u["source_unit_sha256"]+
                        " markup="+json.dumps(u["markup"],sort_keys=True))
              for u in x["native_introductions_not_assumed_to_be_exposition"]:
                  print("ORIGINAL_INTRO "+ch+" key="+u["key"]+
                        " sha256="+u["raw_sha256"]+
                        " markup="+json.dumps(u["markup"],sort_keys=True))
          print("Full source-native gate PASS (not independent semantic or build acceptance)")
          PY
      - name: Inventory all 1,189 canonical chapters against the original native SWORD source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          root=Path("work/mhcc-modern/production/accepted")
          files=sorted(root.glob("*.md"))
          assert len(files)==1189, "Canonical manuscript inventory is incomplete"
          refs=[]
          for path in files:
              front=path.read_text(encoding="utf-8").split("\n---\n", 1)[0]
              found=re.search(r'^chapter_osis: "([^"]+)"$',front,re.M)
              assert found, "Chapter missing its canonical OSIS identity: "+str(path)
              assert 'source_zip_sha256: "a0639201b57b9a6ec843fca70ffc08f75e179a24130a22ce1fd43be8ca42c746"' in front
              assert 'source_native_corpus_sha256: "2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e"' in front
              assert 'publication_status: "NOT RELEASED' in front
              refs.append(found.group(1))
          assert len(set(refs))==1189, "Duplicate manuscript chapter identity"
          assert len({x.split(".",1)[0] for x in refs})==66, "Wrong canonical book coverage"
          path=Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-canonical-chapters.txt"
          path.write_text("\n".join(refs)+"\n",encoding="utf-8")
          print("CANONICAL_MANUSCRIPT_INPUT: 1,189 distinct chapter identifiers, 66 books, pinned to original MHCC 0.1.1; NOT RELEASED")
          PY
          mapfile -t requested < "$RUNNER_TEMP/mhcc-modern-canonical-chapters.txt"
          python scripts/commentary_modern_source_receipt.py \
            --native-reader "$RUNNER_TEMP/commentary-modern-source-raw" \
            --module-directory "$RUNNER_TEMP/mhcc-source-root" \
            --module-id MHCC \
            --expected-corpus-sha256 \
            '2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e' \
            --chapters "${requested[@]}" \
            --report "$RUNNER_TEMP/mhcc-modern-whole-canon-native-receipt.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          native=json.loads((temp/"mhcc-modern-whole-canon-native-receipt.json").read_text())
          requested=set((temp/"mhcc-modern-canonical-chapters.txt").read_text().splitlines())
          chapters=native["chapters"]
          assert set(chapters)==requested and len(chapters)==1189
          assert native["complete_native_counts"]=={"K":28742,"I":1255,"TOP":2}
          assert not native["source_prose_or_original_markup_exported"]
          assert not native["semantic_translation_independently_approved"]
          assert not native["structured_derivative_readback_tested"]
          groups=sum(x["distinct_original_raw_units"] for x in chapters.values())
          keys=sum(x["original_native_numbered_keys"] for x in chapters.values())
          print(f"CANONICAL_NATIVE_TOTAL chapters={len(chapters)} original_groups={groups} numbered_keys={keys} published_native_K={native['complete_native_counts']['K']}")
          assert keys==native["complete_native_counts"]["K"], (
              "Some source K addresses are not covered by canonical chapter inventory")
          for chapter in sorted(chapters):
              entry=chapters[chapter]
              anchors=";".join(u["first_key"]+":"+u["keys"][-1]+":"+u["source_unit_sha256"]
                               for u in entry["original_units"])
              print("CANONICAL_NATIVE "+chapter+" groups="+str(entry["distinct_original_raw_units"])+
                    " keys="+str(entry["original_native_numbered_keys"])+
                    " source_sha_anchors="+anchors)
          print("COMPLETE NATIVE KEY RECEIPT PASS — metadata only; no draft semantics, links, notes or compiled derivative approved")
          PY
      - name: Check authentic chapter-I preface placement in modern candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt = Path(os.environ["RUNNER_TEMP"]) / "mhcc-modern-whole-canon-native-receipt.json"
          original = json.loads(receipt.read_text(encoding="utf-8"))
          assert original["status"] == "SOURCE_NATIVE_RECEIPT_ONLY_NOT_TRANSLATION_APPROVAL"
          assert original["original_compiled_corpus_sha256"] == (
              "2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e")
          assert original["source_prose_or_original_markup_exported"] is False

          # Discover chapter-I prose from the authenticated source, not hard-coded books.
          # Do not confuse short book-I titles with source-authored chapter-I prefaces.
          expected = {}
          for chapter, data in original["chapters"].items():
              if not data["original_units"]:
                  continue  # Pure chapter-I cases are a separate transport policy.
              for intro in data["native_introductions_not_assumed_to_be_exposition"]:
                  if intro["key"] == chapter and intro["visible_word_tokens"] > 0:
                      book = chapter.rsplit(".", 1)[0]
                      assert book not in expected, "Ambiguous repeated chapter-I preface"
                      expected[book] = intro
          assert expected, "No source chapter-I prefaces found"

          observed = set()
          for candidate in Path("work/mhcc-modern/production").glob(
                  "*-book-introduction.CANDIDATE.md"):
              front = candidate.read_text(encoding="utf-8").split("\n---\n", 1)[0]
              fields = {}
              for line in front.splitlines():
                  match = re.fullmatch(r'([a-z0-9_]+): "([^"]*)"', line)
                  if match:
                      assert match[1] not in fields
                      fields[match[1]] = match[2]
              if "source_native_intro_key" not in fields:
                  continue  # Other original prefaces can be embedded in numbered K.
              book = fields.get("book_osis")
              assert book in expected and book not in observed
              intro = expected[book]
              assert fields.get("source_module") == "MHCC 0.1.1"
              assert fields["source_native_intro_key"] == "I:" + intro["key"]
              assert fields.get("source_native_book_title_key") == "I:" + book
              assert fields.get("source_native_intro_raw_sha256") == intro["raw_sha256"]
              assert fields.get("source_native_intro_visible_word_tokens") == str(
                  intro["visible_word_tokens"])
              assert fields.get("status", "").startswith(
                  "PRODUCTION CANDIDATE — NATIVE CHAPTER-I PLACEMENT VERIFIED")
              title_slots = [
                  entry for entry in original["chapters"][book + ".1"][
                      "native_introductions_not_assumed_to_be_exposition"]
                  if entry["key"] == book
              ]
              assert len(title_slots) == 1
              assert title_slots[0]["raw_sha256"] != intro["raw_sha256"]
              observed.add(book)
          assert observed == set(expected), "Missing or extra I-preface candidate"
          print("NATIVE_CHAPTER_I_PREFACE_OWNERSHIP_PASS source_intro_units=" +
                str(len(expected)) + " modern_candidates=" + str(len(observed)) +
                "; native location only; no semantic or derivative approval")
          PY
      - name: Authenticate all original numbered-K Bible link attributes in source order
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_reference_gate.py \
            --native-reader "$RUNNER_TEMP/commentary-modern-source-raw" \
            --module-directory "$RUNNER_TEMP/mhcc-source-root" \
            --module-id MHCC \
            --whole-native-receipt "$RUNNER_TEMP/mhcc-modern-whole-canon-native-receipt.json" \
            --report "$RUNNER_TEMP/mhcc-modern-all-original-link-identity-sha.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
              "mhcc-modern-all-original-link-identity-sha.json").read_text())
          assert report["status"] == (
              "SOURCE_NATIVE_ALL_K_REFERENCE_IDENTITIES_NOT_MODERN_LINK_PARITY")
          assert report["whole_native_source_sha256"] == (
              "2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e")
          assert report["original_unique_K_bodies_verified"] == 4047
          assert report["original_numbered_K_keys_verified"] == 28742
          assert report["original_reference_elements_verified"] == 1204
          assert report["original_link_bearing_K_bodies"] == 669
          assert len(report["source_link_groups"]) == 669
          assert sum(g["reference_count"] for g in report["source_link_groups"]) == 1204
          assert all(len(g["original_osisRef_sha256_in_document_order"]) ==
                     len(g["original_visible_link_label_sha256_in_document_order"]) ==
                     g["reference_count"] for g in report["source_link_groups"])
          assert report["original_link_destinations_only_sha256_not_exported"] is True
          assert report["original_visible_link_text_only_sha256_not_exported"] is True
          assert report["original_source_prose_or_XML_exported"] is False
          assert report["modern_manuscript_reference_presence_approved"] is False
          assert report["modern_osisRef_targets_or_order_verified"] is False
          assert report["modern_module_built_or_published"] is False
          print("ALL_ORIGINAL_LINK_IDENTITIES_PASS K=28742 units=4047 "
                "original_links=1204 linked_units=669; modern fidelity unapproved")
          PY
      - name: Check proposed original cross-reference error dispositions against modern manuscripts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_reference_gate.py \
            --native-reader "$RUNNER_TEMP/commentary-modern-source-raw" \
            --module-directory "$RUNNER_TEMP/mhcc-source-root" \
            --module-id MHCC \
            --native-receipt "$RUNNER_TEMP/mhcc-modern-whole-canon-native-receipt.json" \
            --original-link-identity-report "$RUNNER_TEMP/mhcc-modern-all-original-link-identity-sha.json" \
            --disposition-manifest work/mhcc-modern/production/GENESIS_EXODUS_REFERENCE_DISPOSITIONS.json \
            --repository-root . \
            --report "$RUNNER_TEMP/mhcc-modern-proposed-link-correction-dispositions.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) /
              "mhcc-modern-proposed-link-correction-dispositions.json").read_text())
          assert result["status"] == (
              "PINNED_SOURCE_AND_MODERN_CORRECTION_CANDIDATES_CHECKED_NOT_RELEASED")
          assert result["reviewed_source_link_groups"] == 14
          assert result["reviewed_original_hyperlink_elements_in_groups"] == 59
          assert result["source_links_proposed_to_omit"] == 9
          assert result["source_links_proposed_to_retarget"] == 8
          assert result["secondary_witness_links_proposed_to_add"] == 1
          assert result["original_link_proposal_actions_reviewed"] == 17
          assert result["source_link_target_and_label_hashes_checked_in_original_order"]
          assert result["modern_section_scope_and_marker_presence_checked"]
          assert not result["real_native_source_changes"]
          assert not result["derived_SWORD_link_placements_or_native_readbacks_tested"]
          assert not result["editorial_translation_approved"]
          assert not result["release_authorized"]
          print("PROPOSED_SOURCE_LINK_ANOMALY_DISPOSITIONS_PASS 17 bad published "
                "link elements, 9 list-number omissions, 8 corrected reference "
                "target, 1 witness-backed missing link; NO release")
          PY
      - name: Generate and audit one full-canon unpublished modern-English OSIS candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_modern_draft_osis_preview.py \
            --root work/mhcc-modern/production/accepted \
            --accepted-native-receipt "$RUNNER_TEMP/mhcc-modern-whole-canon-native-receipt.json" \
            --source-topology-manifest work/mhcc-modern/production/MODERN_OSIS_TOPOLOGY_EXCEPTIONS.json \
            --ionly-manifest work/mhcc-modern/production/IONLY_CHAPTER_LINK_PREVIEW.json \
            --book-intro-candidate-root work/mhcc-modern/production \
            --osis "$RUNNER_TEMP/mhcc-modern-complete-unlinked.osis.xml" \
            --report "$RUNNER_TEMP/mhcc-modern-complete-unlinked-osis-structure.json" \
            --temp-module-id MHCCFULLTMP
          python - <<'PY'
          import json,os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          base=Path(os.environ["RUNNER_TEMP"])
          proof=json.loads((base/"mhcc-modern-complete-unlinked-osis-structure.json").read_text())
          assert proof["status"] == (
              "FULL_CANON_UNLINKED_MODERN_ENGLISH_OSIS_TECHNICAL_CANDIDATE_NOT_RELEASE")
          assert proof["books"] == 66
          assert proof["chapters"] == 1189
          assert proof["original_K_authorial_bodies"] == 4047
          assert proof["source_I_only_chapter_bodies"] == 2
          assert proof["annotated_sections"] == 4049
          assert proof["modern_topical_expositions"] == 4052
          assert proof["total_source_and_I_only_verse_alias_keys"] == 28792
          assert proof["authenticated_chapter_I_prefaces_included"] == 5
          assert proof["unplaced_book_preface_candidates_quarantined"] == 51
          assert proof["original_K_embedded_book_preface_duplication_not_auto_resolved"]
          assert proof["source_topology_exceptions_used"] == [
              "1Sam.25","Deut.20","John.3","Ps.95","Zech.9"]
          assert proof["paragraphs"] > 10000
          assert proof["tables"] >= 800
          assert not proof["original_1204_reference_links_transferred"]
          assert not proof["original_native_inline_markup_and_notes_verified"]
          assert not proof["independent_semantic_signoff"]
          assert not proof["sword_publication_authorized"]
          assert not proof["original_sword_changed"]
          ns={"o":"http://www.bibletechnologies.net/2003/OSIS/namespace"}
          root=ET.parse(base/"mhcc-modern-complete-unlinked.osis.xml").getroot()
          books=root.findall(".//o:div[@type='book']",ns)
          chapters=root.findall(".//o:chapter",ns)
          sections=root.findall(".//o:div[@annotateType='commentary']",ns)
          assert len(books)==66 and len(chapters)==1189 and len(sections)==4049
          assert len({c.attrib["osisID"] for c in chapters})==1189
          assert len(root.findall(".//o:reference",ns))==0, (
              "No original link may be silently guessed or asserted by this draft")
          print("UNPUBLISHED MODERN OSIS TECHNICAL STRUCTURE PASS "
                "books=66 chapters=1189 K=4047 I-only=2 sections=4049 "
                "modern_leaf_headings=4052 native_keys_plus_I_transport=28792 "
                "source_html_links=UNLINKED no semantic or publisher approval")
          PY
      - name: Compile private whole-canon modern OSIS in disposable SWORD and smoke-read chapters
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/mhcc-modern-complete-unlinked.osis.xml"
          mkdir -p "$RUNNER_TEMP/mhcc-complete-private-root/mods.d"
          mkdir -p "$RUNNER_TEMP/mhcc-complete-private-root/modules/comments/zcom/mhccfulltmp"
          timeout 240s osis2mod \
            "$RUNNER_TEMP/mhcc-complete-private-root/modules/comments/zcom/mhccfulltmp" \
            "$RUNNER_TEMP/mhcc-modern-complete-unlinked.osis.xml" \
            -z z -b 3 \
            > "$RUNNER_TEMP/mhcc-complete-private-osis2mod.log" 2>&1
          cat > "$RUNNER_TEMP/mhcc-complete-private-root/mods.d/mhccfulltmp.conf" <<'EOF'
          [MHCCFULLTMP]
          Description=Unlinked whole-canon MHCC Modern English disposable OSIS check
          DataPath=./modules/comments/zcom/mhccfulltmp/
          ModDrv=zCom
          CompressType=ZIP
          BlockType=CHAPTER
          Lang=en
          Versification=KJV
          SourceType=OSIS
          DistributionLicense=Private
          EOF
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])
          env=os.environ.copy()
          env["SWORD_PATH"]=str((base/"mhcc-complete-private-root").resolve())
          probes=["Genesis 1:1","Leviticus 19:37","Psalms 108:13",
                  "Matthew 13:31","Acts 2:14","2 John 1:13"]
          rows=[]
          for scope in probes:
              result=subprocess.run(["diatheke","-b","MHCCFULLTMP","-f","OSIS",
                                     "-k",scope],env=env,text=True,
                                    stdout=subprocess.PIPE,
                                    stderr=subprocess.PIPE,timeout=30)
              if result.returncode != 0 or len(result.stdout.strip()) < 50:
                  raise ValueError("Disposable whole-canon native SWORD readback failed "
                                   "for audited representative key: "+scope)
              rows.append({"probe":scope,"rendered_nonempty":True,
                           "rendered_character_count":len(result.stdout)})
          summary={
              "status":"DISPOSABLE_FULL_CANON_OSIS_TO_SWORD_SMOKE_NOT_PUBLISHABLE",
              "private_compiled_work":"MHCCFULLTMP",
              "chapter_probes":rows,
              "source_semantic_and_authorial_links_verified":False,
              "original_source_changed":False,
              "distribution_or_publication_authorized":False,
              "compiled_module_or_osis_content_exported":False
          }
          (base/"mhcc-modern-complete-private-sword-smoke.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("PRIVATE WHOLE-CANON MHCC SWORD SMOKE PASS: "
                +str(len(probes))+" readback probes; no source/derived publication")
