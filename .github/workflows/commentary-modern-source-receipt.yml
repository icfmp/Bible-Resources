          unchecked=re.findall(r"(?m)^- \[ \] (.+?)\s*$",archive)
          assert len(unchecked)==69 and len(set(unchecked))==69, (
              "Historical issue #270 no longer has exactly 69 distinct unchecked chapter rows")
          all_manuscripts=sorted((base/"accepted").glob("*.md"))
          assert len(all_manuscripts)==1189, "Canonical draft inventory changed"
          native=json.loads((Path(os.environ["RUNNER_TEMP"])/
              "mhcc-modern-whole-canon-native-receipt.json").read_text(encoding="utf-8"))
          assert native["status"]=="SOURCE_NATIVE_RECEIPT_ONLY_NOT_TRANSLATION_APPROVAL"
          assert not native["source_prose_or_original_markup_exported"]
          assert not native["semantic_translation_independently_approved"]
          titles={}
          for path in all_manuscripts:
              raw=path.read_text(encoding="utf-8")
              title=re.search(r"(?m)^# (.+?) — Modern English\s*$",raw)
              if title:
                  if title[1] in titles:
                      raise ValueError("Duplicate chapter title: "+title[1])
                  titles[title[1]]=(path,raw)
          reports=[]
          issues=[]
          section_digest_owner={}
          token=re.compile(r"\b[\w’-]+\b",re.UNICODE)
          verse_heading=re.compile(
              r"\(verses?\s+(\d{1,3})(?:\s*(?:[–—-]|and|,)\s*(\d{1,3}))?\)",
              re.IGNORECASE)
          for original_label in unchecked:
              chapter_issues=[]
              entry=titles.get(original_label)
              if entry is None:
                  issues.append({"chapter":original_label,"problem":"missing full modern manuscript"})
                  continue
              path,raw=entry
              if not raw.startswith("---\n") or "\n---\n" not in raw[4:]:
                  issues.append({"chapter":original_label,"problem":"invalid source frontmatter"})
                  continue
              front,rest=raw[4:].split("\n---\n",1)
              fields=dict(re.findall(r'(?m)^([a-z_][a-z0-9_]*): "([^"\n]*)"$',front))
              chapter=fields.get("chapter_osis","")
              original=native["chapters"].get(chapter)
              if original is None:
                  issues.append({"chapter":original_label,"problem":"no original native source chapter mapping"})
                  continue
              if (fields.get("source_module")!="MHCC 0.1.1"
                  or fields.get("source_zip_sha256")!="a0639201b57b9a6ec843fca70ffc08f75e179a24130a22ce1fd43be8ca42c746"
                  or fields.get("source_native_corpus_sha256")!="2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e"
                  or not fields.get("publication_status","").startswith("NOT RELEASED")):
                  chapter_issues.append("wrong original-source pin or false release claim")
              if "\n---\n" not in rest:
                  chapter_issues.append("missing prose/editorial boundary")
                  main=rest
                  review=""
              else:
                  main,review=rest.split("\n---\n",1)
              if not re.search(r"(?m)^## (?:Editorial|Source) (?:review|audit|verification)",review,re.I):
                  chapter_issues.append("missing separate original-witness review notes")
              headings=list(re.finditer(r"(?m)^## ([^\n]+)$",main))
              source_outline=[h for h in headings if "original chapter outline" in h[1].lower()]
              if len(source_outline)!=1:
                  chapter_issues.append("missing or multiple source-outline sections")
              sections=[h for h in headings
                        if "original chapter outline" not in h[1].lower()]
              original_units=original["original_units"]
              if not original_units or original["source_placement"]!="NUMBERED_KEYS_WITH_SEPARATE_INTRO":
                  chapter_issues.append("original source is not supported numbered-K commentary")
              if len(sections)!=len(original_units):
                  chapter_issues.append(
                      f"original K bodies={len(original_units)}, modern exposition sections={len(sections)}")
              source_verses=set()
              for u in original_units:
                  for key in u["keys"]:
                      if not key.startswith(chapter+"."):
                          chapter_issues.append("original source key in wrong chapter")
                      if key in source_verses:
                          chapter_issues.append("duplicate original numbered K key")
                      source_verses.add(key)
              if len(source_verses)!=original["original_native_numbered_keys"]:
                  chapter_issues.append("inconsistent native source occupied-key tally")
              modern_section_info=[]
              for i,h in enumerate(sections):
                  next_head=headings[headings.index(h)+1] if headings.index(h)+1<len(headings) else None
                  exposition=main[h.end():next_head.start() if next_head else len(main)]
                  words=len(token.findall(exposition))
                  marker=verse_heading.search(h[1])
                  claimed=(int(marker[1]),int(marker[2] or marker[1])) if marker else None
                  original_bounds=None
                  if i<len(original_units):
                      nums=[int(key.rsplit(".",1)[1]) for key in original_units[i]["keys"]]
                      original_bounds=(min(nums),max(nums)) if nums else None
                  if not marker:
                      chapter_issues.append(f"section {i+1}: no explicit verse bounds")
                  elif original_bounds and claimed!=original_bounds:
                      chapter_issues.append(
                          f"section {i+1}: modern verse bounds {claimed} differ from original {original_bounds}")
                  if words<25:
                      chapter_issues.append(f"section {i+1}: missing/too-short actual translation ({words} words)")
                  if re.search(r"(?i)\b(?:TODO|TBD|PLACEHOLDER|NOT YET TRANSLATED|LOREM IPSUM)\b",exposition):
                      chapter_issues.append(f"section {i+1}: unfinished draft marker")
                  digest=hashlib.sha256(exposition.strip().encode("utf-8")).hexdigest()
                  owner=section_digest_owner.setdefault(digest,(chapter,i+1))
                  if owner!=(chapter,i+1) and words>=50:
                      chapter_issues.append(f"section {i+1}: possible copied duplicate of {owner}")
                  modern_section_info.append({
                      "section_number":i+1,
                      "modern_words":words,
                      "claimed_verse_bounds":list(claimed) if claimed else None,
                      "original_native_verse_bounds":list(original_bounds) if original_bounds else None,
                      "original_unit_sha256":original_units[i]["source_unit_sha256"] if i<len(original_units) else None
                  })
              reports.append({
                  "historical_issue_label":original_label,
                  "chapter_osis":chapter,
                  "manuscript":path.as_posix(),
                  "manuscript_sha256":hashlib.sha256(raw.encode("utf-8")).hexdigest(),
                  "original_numbered_K_keys":original["original_native_numbered_keys"],
                  "original_K_source_units":len(original_units),
                  "modern_exposition_sections":len(sections),
                  "modern_exposition_word_count":sum(s["modern_words"] for s in modern_section_info),
                  "original_separate_introduction_keys":len(original["native_introductions_not_assumed_to_be_exposition"]),
                  "section_comparison":modern_section_info,
                  "machine_detected_structural_problems":chapter_issues,
                  "original_full_prose_meaning_independently_verified":False
              })
              if chapter_issues:
                  issues.append({"chapter":chapter,"problem":"; ".join(chapter_issues)})
          receipt={
              "status":"HISTORICALLY_UNCHECKED_DRAFT_SOURCE_UNIT_SCREEN_NOT_EDITORIAL_APPROVAL",
              "historical_unchecked_rows":len(unchecked),
              "complete_modern_manuscript_paths_read":len(reports),
              "original_source_edition":"MHCC 0.1.1",
              "native_corpus_sha256":native["original_compiled_corpus_sha256"],
              "original_numbered_source_units":sum(r["original_K_source_units"] for r in reports),
              "original_occupied_K_keys":sum(r["original_numbered_K_keys"] for r in reports),
              "modern_exposition_sections":sum(r["modern_exposition_sections"] for r in reports),
              "modern_exposition_words":sum(r["modern_exposition_word_count"] for r in reports),
              "structural_flags":issues,
              "chapters":reports,
              "source_full_prose_meaning_independently_approved":False,
              "published_derivative_module_built_or_validated":False,
              "source_original_prose_or_xml_exported":False
          }
          report_path=Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-historical-69-translation-coverage.json"
          report_path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("HISTORICAL_69_SCOPE original_rows=69 modern_manuscripts="+str(len(reports))+
                " original_K_units="+str(receipt["original_numbered_source_units"])+
                " modern_sections="+str(receipt["modern_exposition_sections"])+
                " original_occupied_K_keys="+str(receipt["original_occupied_K_keys"])+
                " modern_exposition_words="+str(receipt["modern_exposition_words"])+
                " problems="+str(len(issues)))
          for x in reports:
              print("HISTORICAL_69_CHAPTER "+x["chapter_osis"]+
                    " source_units="+str(x["original_K_source_units"])+
                    " modern_units="+str(x["modern_exposition_sections"])+
                    " words="+str(x["modern_exposition_word_count"])+
                    " native_K="+str(x["original_numbered_K_keys"]))
          for issue in issues:
              print("HISTORICAL_69_UNRESOLVED "+issue["chapter"]+": "+issue["problem"])
          print("Only original native section/key coverage and real modern prose checked; "+
                "not native-to-modern authorial meaning, notes, reference targets, or publication rights")
          assert not issues and len(reports)==69, "Historical 69 source-unit coverage NOT fully demonstrated"
          PY
      - name: Screen all 1189 modern prose sections against verified native source K and I group topology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import re
          base = Path("work/mhcc-modern/production/accepted")
          native = json.loads((Path(os.environ["RUNNER_TEMP"]) /
              "mhcc-modern-whole-canon-native-receipt.json").read_text(encoding="utf-8"))
          assert native["status"] == "SOURCE_NATIVE_RECEIPT_ONLY_NOT_TRANSLATION_APPROVAL"
          assert native["original_compiled_corpus_sha256"] == (
              "2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e")
          assert native["source_prose_or_original_markup_exported"] is False
          assert native["semantic_translation_independently_approved"] is False
          originals = native["chapters"]
          files = sorted(base.glob("*.md"))
          assert len(files) == len(originals) == 1189
          token = re.compile(r"\b[\w’-]+\b", re.UNICODE)
          heading = re.compile(r"(?m)^(#{2,5}) ([^\n]+)\s*$")
          quoted = re.compile(r'(?m)^([a-z_][a-z0-9_]*): "([^"\n]*)"$')
          verse_marker = re.compile(r"\(\s*verses?\s+([^)]+)\)\s*$", re.IGNORECASE)
          flags = []
          rows = []
          seen = set()
          for path in files:
              problems = []
              source = path.read_text(encoding="utf-8")
              if not source.startswith("---\n") or "\n---\n" not in source[4:]:
                  flags.append({"manuscript":path.name, "problem":"invalid frontmatter"})
                  continue
              front, rest = source[4:].split("\n---\n", 1)
              fields = dict(quoted.findall(front))
              chapter = fields.get("chapter_osis","")
              if chapter not in originals or chapter in seen:
                  flags.append({"manuscript":path.name, "problem":"unmapped or duplicate chapter_osis"})
                  continue
              seen.add(chapter)
              if (fields.get("source_module") != "MHCC 0.1.1"
                  or fields.get("source_native_corpus_sha256") != native["original_compiled_corpus_sha256"]
                  or fields.get("source_zip_sha256") !=
                     "a0639201b57b9a6ec843fca70ffc08f75e179a24130a22ce1fd43be8ca42c746"
                  or not fields.get("publication_status","").startswith("NOT RELEASED")):
                  problems.append("source identity/publication status not pinned")
              if "\n---\n" not in rest:
                  problems.append("no clear modern prose versus editorial notes boundary")
                  main = rest
              else:
                  main, _ = rest.split("\n---\n", 1)
              heads = list(heading.finditer(main))
              prose_units = []
              for idx, match in enumerate(heads):
                  title = match[2].strip()
                  low = title.lower()
                  if low.startswith("original ") or "book introduction" in low:
                      continue
                  # A ## heading containing ### authorial sections is a
                  # navigation/container label, not an extra authored K body.
                  # Preserve the parent prose separately for human review.
                  level = len(match[1])
                  if idx + 1 < len(heads) and len(heads[idx + 1][1]) > level:
                      continue
                  section = main[match.end():heads[idx + 1].start() if idx + 1 < len(heads)
                                 else len(main)]
                  prose_units.append((title, len(token.findall(section))))
              src = originals[chapter]
              source_units = src["original_units"]
              is_intro_only = src["source_placement"] == "INTRO_ONLY_NEEDS_INDEPENDENT_REVIEW"
              expected = 1 if is_intro_only else len(source_units)
              if is_intro_only:
                  intros = [i for i in src["native_introductions_not_assumed_to_be_exposition"]
                            if i["key"] in (chapter,chapter+".0") and i["visible_word_tokens"] > 0]
                  if len(intros) != 1 or source_units or src["original_native_numbered_keys"] != 0:
                      problems.append("intro-only original ownership not proven")
              elif src["source_placement"] != "NUMBERED_KEYS_WITH_SEPARATE_INTRO" or not source_units:
                  problems.append("unknown original source storage pattern")
              if len(prose_units) != expected:
                  problems.append(f"original authorial groups={expected}; modern prose sections={len(prose_units)}")
              for index, (title, words) in enumerate(prose_units):
                  if words < 25:
                      problems.append(f"modern exposition {index+1} has {words} words")
                  if re.search(r"\b(?:TODO|TBD|PLACEHOLDER|NOT YET TRANSLATED)\b",
                               main, re.IGNORECASE):
                      problems.append("untranslated marker in draft")
                      break
                  if index < len(source_units):
                      nums = [int(k.rsplit(".",1)[1]) for k in source_units[index]["keys"]]
                      m = verse_marker.search(title)
                      if not m:
                          problems.append(f"modern exposition {index+1} has no parseable verse-scope heading")
                      else:
                          bound = [int(t) for t in re.findall(r"\d+",m[1])]
                          if not bound or (bound[0],bound[-1]) != (min(nums),max(nums)):
                              problems.append(f"modern exposition {index+1} verse scope differs from native group")
              rows.append({
                  "chapter":chapter,
                  "manuscript":path.name,
                  "source_original_K_groups":len(source_units),
                  "source_original_intro_only":is_intro_only,
                  "modern_expositions":len(prose_units),
                  "modern_exposition_words":sum(w for _,w in prose_units),
                  "original_native_occupied_K_keys":src["original_native_numbered_keys"],
                  "problems":list(dict.fromkeys(problems))
              })
              for problem in dict.fromkeys(problems):
                  flags.append({"chapter":chapter,"problem":problem})
          if seen != set(originals):
              flags.append({"problem":"missing original canonical manuscripts","count":len(set(originals)-seen)})
          count = Counter(f["problem"].split("=",1)[0] for f in flags)
          summary = {
              "status":"FULL_CANON_NATIVE_GROUP_TO_MODERN_DRAFT_DIAGNOSTIC_NOT_EDITORIAL_APPROVAL",
              "chapters_expected":len(originals),
              "manuscripts_inspected":len(rows),
              "native_numbered_K_authorial_units":sum(len(c["original_units"]) for c in originals.values()),
              "modern_prose_expositions":sum(r["modern_expositions"] for r in rows),
              "original_intro_only_chapters":sum(r["source_original_intro_only"] for r in rows),
              "native_occupied_K_addresses":sum(r["original_native_occupied_K_keys"] for r in rows),
              "total_modern_exposition_words":sum(r["modern_exposition_words"] for r in rows),
              "affected_chapters":sum(bool(r["problems"]) for r in rows),
              "diagnostic_flags":flags,
              "flag_counts_by_type":dict(sorted(count.items())),
              "original_full_semantic_meaning_verified":False,
              "original_native_footnotes_references_quotation_and_layout_verified":False,
              "independent_editorial_signoff":False,
              "automatic_edits_made":False,
              "chapters":rows
          }
          output = Path(os.environ["RUNNER_TEMP"])/"mhcc-modern-full-canon-source-group-diagnostic.json"
          output.write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("FULL_CANON_GROUP_DIAGNOSTIC manuscripts="+str(summary["manuscripts_inspected"])+
                " source_K_groups="+str(summary["native_numbered_K_authorial_units"])+
                " intro_only="+str(summary["original_intro_only_chapters"])+
                " modern_expositions="+str(summary["modern_prose_expositions"])+
                " affected_chapters="+str(summary["affected_chapters"])+
                " flags="+str(len(flags)))
          topology = [{
              "chapter":r["chapter"],
              "original_K_groups":r["source_original_K_groups"],
              "original_intro_only":r["source_original_intro_only"],
              "modern_expositions":r["modern_expositions"],
              "source_versification_issues":[f for f in r["problems"]
                  if "verse scope differs" in f]
          } for r in rows if (
              r["modern_expositions"] !=
              r["source_original_K_groups"] + (1 if r["source_original_intro_only"] else 0)
              or any("verse scope differs" in f for f in r["problems"])
          )]
          print("FULL_CANON_TOPOLOGY_DEVIATIONS "+json.dumps(topology,sort_keys=True))
          print("FULL_CANON_FLAG_COUNTS "+json.dumps({
              "topology_deviation_chapters":len(topology),
              "no_heading_scope_claims":sum("no parseable verse-scope heading" in f["problem"] for f in flags),
              "short_prose_sections_lt_25_words":sum(" has " in f["problem"] and
                  f["problem"].endswith(" words") for f in flags),
              "raw_diagnostic_flags":len(flags)},sort_keys=True))
          for problem in flags[:90]:
              print("FULL_CANON_FLAG "+json.dumps(problem,sort_keys=True))
          print("Metadata-only diagnostic: source meaning, native refs and notes NOT approved.")
          # This is triage, never a semantic/editorial approval gate.
          assert len(rows)==len(originals), "Canonical chapter manuscript missing"
          PY
      - name: Build private Leviticus 19 and Psalm 108 I-only linked chapter previews
