      - name: Install real Xiphos GUI in an isolated virtual display for HMCC Modern
        id: xiphos_deps
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          # Reuse the proven MHC Xiphos GUI runner package source strategy.
          # A regional EC2 mirror previously stalled WebKit dependencies.
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources \
              /etc/apt/apt-mirrors.txt /etc/apt/mirrors.txt; do
            if sudo test -f "$sources" && sudo grep -q 'us-east-2.ec2.archive.ubuntu.com' "$sources"; then
              sudo sed -i \
                -e 's|http://us-east-2.ec2.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://us-east-2.ec2.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$sources"
            fi
          done
          if sudo test -d /etc/apt/mirrors; then
            for sources in /etc/apt/mirrors/*; do
              if sudo test -f "$sources" && sudo grep -q 'us-east-2.ec2.archive.ubuntu.com' "$sources"; then
                sudo sed -i 's|us-east-2.ec2.archive.ubuntu.com|archive.ubuntu.com|g' "$sources"
              fi
            done
          fi
          export DEBIAN_FRONTEND=noninteractive
          timeout 120s sudo apt-get -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          timeout 660s sudo -E apt-get -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=15 install -y --no-install-recommends \
            xiphos xvfb xdotool xclip dbus-x11
          for binary in xiphos Xvfb xdotool xclip dbus-run-session; do
            command -v "$binary" >/dev/null || exit 1
          done
