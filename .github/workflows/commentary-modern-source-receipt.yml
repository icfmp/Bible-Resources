          assert len(native_firsts)==4049
          root=ET.parse(base/"mhcc-modern-complete-bounded-linked.osis.xml").getroot()
          sections=[x for x in root.iter()
                    if x.tag==ns+"div" and x.get("annotateType")=="commentary"]
          expected={}
          for section in sections:
              ref=section.get("annotateRef","")
              first=ref.split(" ",1)[0].split("-",1)[0]
              assert re.fullmatch(r"[1-4]?[A-Za-z][A-Za-z0-9]*\.\d+\.\d+", first)
              assert first not in expected
              authored="".join(section.itertext())
              assert authored.strip(), "Empty modern authorial section: "+first
              expected[first]=authored
          assert set(expected)==native_firsts and len(expected)==4049
          def normalized(value):
              return re.sub(r"\s+"," ",unicodedata.normalize("NFC",value)).strip()
          counts=Counter()
          first_review=[]
          wrapper_cases=[]
          seen=set()
          def compare(kind,key,raw):
              if kind!="K" or key not in expected:
                  return
              if key in seen:
                  raise ValueError("Same first-K modern body read more than once")
              seen.add(key)
              try:
                  compiled="".join(ET.fromstring(
                      b"<compiled>"+raw+b"</compiled>").itertext())
              except ET.ParseError:
                  counts["native_XML_parse_errors"]+=1
                  if len(first_review)<12:first_review.append(key)
                  return
              authored=expected[key]
              if compiled==authored:
                  counts["exact_visible_unicode_matches"]+=1
              elif normalized(compiled)==normalized(authored):
                  counts["NFC_and_whitespace_only_matches"]+=1
              elif normalized(authored) in normalized(compiled):
                  counts["authored_visible_content_contiguous_in_wrapper"]+=1
                  text_normal=normalized(compiled)
                  authored_normal=normalized(authored)
                  offset=text_normal.index(authored_normal)
                  wrapper_cases.append({
                      "first_native_key":key,
                      "extra_visible_prefix_unicode_characters":offset,
                      "extra_visible_suffix_unicode_characters":
                          len(text_normal)-offset-len(authored_normal),
                  })
              else:
                  counts["unmatched_visible_text_needs_investigation"]+=1
                  if len(first_review)<12:first_review.append(key)
          env=os.environ.copy()
          env["SWORD_PATH"]=str((base/"mhcc-bounded-linked-root").resolve())
          proc=subprocess.Popen(
              [str((base/"commentary-modern-source-raw").resolve()),"MHCCLINKTMP"],
              env=env,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
          try:
              native,numbered,_,_=parse_native_raw_corpus(
                  proc.stdout,on_entry=compare)
              proc.stdout.close()
              if proc.wait(timeout=120)!=0:
                  raise ValueError("Private SWORD native text roundtrip did not complete")
          finally:
              if proc.poll() is None:
                  proc.kill();proc.wait()
          assert seen==set(expected), "First-K body omitted in actual SWORD index"
          assert len(numbered)==28792
          assert sum(counts.values())==4049
          failures=counts["native_XML_parse_errors"]+counts[
              "unmatched_visible_text_needs_investigation"]
          report={
              "status":("PRIVATE_FULL_CANON_TEXT_ROUNDTRIP_VISIBLE_BODY_PASS"
                        if failures==0 else
                        "PRIVATE_FULL_CANON_TEXT_ROUNDTRIP_DIAGNOSTIC_REVIEW_REQUIRED"),
              "whole_canon_modern_OSIS_groups_compared":len(expected),
              "exact_indexed_native_first_K_groups_present":len(seen),
              "all_numbered_native_verse_keys_present":len(numbered),
              "observed_visible_text_comparison_categories":dict(counts),
              "first_K_groups_with_additional_wrapping_visible_text":wrapper_cases,
              "unmatched_or_unparseable_first_K_keys_for_manual_diagnosis":first_review,
              "visible_text_content_is_not_exported":True,
              "editorial_translation_review_restarted":False,
              "original_source_module_mutated":False,
              "source_native_markup_and_link_parity_approved":False,
              "publication_authorized":False,
          }
          (base/"mhcc-modern-compiled-body-text-parity-diagnostic.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("PRIVATE WHOLE-CANON MODERN OSIS->SWORD VISIBLE TEXT DIAGNOSTIC "
                f"units={len(expected)}, exact={counts['exact_visible_unicode_matches']}, "
                f"whitespace={counts['NFC_and_whitespace_only_matches']}, "
                f"wrapper={counts['authored_visible_content_contiguous_in_wrapper']}, "
                f"nonmatching={failures}; ORIGINAL/MODERN NOT PUBLISHED")
          if failures:
              raise ValueError("Full 4049 modern authorial bodies lost or altered "
                               "visible text in compiled SWORD; examine private report")
          PY
