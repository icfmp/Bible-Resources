                  "actual_tests":counts,
                  "failed_test_names":names[:3],
                  "matched_reviewed_assertion":reason,
                  "java_exit":run.returncode},sort_keys=True))
              raise ValueError("Real pinned AndBible Java engine parity test failed: "+
