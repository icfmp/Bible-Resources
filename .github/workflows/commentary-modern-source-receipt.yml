          checked=subprocess.run(["git","-C",str(jsword),"rev-parse","HEAD"],
                  capture_output=True,text=True,timeout=15)
          if checked.returncode or checked.stdout.strip()!=(
                  "6ebd10a005fa7761e611c048ececea1430e22546"):
              raise ValueError("AndBible JSword revision no longer matches pinned stable")
          sample=["Genesis 1:1","Matthew 3:7","Leviticus 19:1",
                  "Psalms 95:1","1 Samuel 25:32","Psalms 108:1",
                  "Revelation 22:2"]
          env=os.environ.copy()
          env["SWORD_PATH"]=str(candidate.resolve())
          for ref in sample:
              result=subprocess.run(["diatheke","-b",module,"-f","plain","-k",ref],
                  env=env,capture_output=True,timeout=25)
              if result.returncode or len(result.stdout.strip())<80:
                  raise ValueError("Candidate native engine has no substantial sample: "+ref)
          book_names={"Gen":"Genesis","Exod":"Exodus","Matt":"Matthew",
                      "Mark":"Mark","Luke":"Luke","John":"John",
                      "Acts":"Acts","Rom":"Romans","Rev":"Revelation"}
          specimens={}
          def witness(kind,key,raw):
              if kind!="K":
                  return
              m=re.fullmatch(r"([1-4]?[A-Za-z]+)\.([1-9][0-9]*)\.([1-9][0-9]*)",key)
              if m is None or m.group(1) not in book_names:
                  return
              book=m.group(1)
              if book in specimens:
                  return
              xml=ET.fromstring(b"<entry>"+raw+b"</entry>")
              targets=[n.get("osisRef") for n in xml.iter()
                  if isinstance(n.tag,str) and n.tag.rsplit("}",1)[-1]=="reference"
                  and n.get("osisRef")]
              if 1<=len(targets)<=64:
                  specimens[book]=(book_names[book]+" "+m.group(2)+":"+m.group(3),
                                   [hashlib.sha256(x.encode()).hexdigest() for x in targets])
          proc=subprocess.Popen([str((base/"commentary-modern-source-raw").resolve()),
                                 module],env=env,stdout=subprocess.PIPE,
                                stderr=subprocess.DEVNULL)
          try:
              _,keys,_,_=parse_native_raw_corpus(proc.stdout,on_entry=witness)
              proc.stdout.close()
              if proc.wait(timeout=180)!=0 or len(keys)!=28792:
                  raise ValueError("AndBible witness source native corpus incomplete")
          finally:
              if proc.poll() is None:
                  proc.kill();proc.wait()
          qualified=[]
          for book in ["Gen","Matt","Exod","John","Mark","Luke","Acts","Rom","Rev"]:
              if book not in specimens:
                  continue
              ref,hashes=specimens[book]
              result=subprocess.run(["diatheke","-b",module,"-f","plain","-k",ref],
                                    env=env,capture_output=True,timeout=25)
              if result.returncode==0 and len(result.stdout.strip())>80:
                  qualified.append(ref+"|"+",".join(hashes))
              if len(qualified)==4:
                  break
          if len(qualified)<2:
              raise ValueError("Fewer than two independent source-linked K specimens")
