          if not java_test.is_file() or java_test.is_symlink() or target.exists():
              raise ValueError("Unreviewed JSword test or upstream file collision")
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(java_test,target)
          home=base/"hmcc-modern-jsword-home"
          gradle=base/"hmcc-modern-jsword-gradle-cache"
          home.mkdir(mode=0o700);gradle.mkdir(mode=0o700)
          java_env={**env,
              "CANDIDATE_JSWORD_PRIVATE_ROOT":str(candidate.resolve()),
              "CANDIDATE_JSWORD_MODULE_ID":module,
              "CANDIDATE_JSWORD_SAMPLES":";".join(sample),
              "CANDIDATE_JSWORD_NATIVE_LINK_SHA256_WITNESSES":";".join(qualified),
              "HOME":str(home),"GRADLE_USER_HOME":str(gradle),
              "JAVA_TOOL_OPTIONS":"-Duser.home="+str(home),
              "LC_ALL":"C.UTF-8","LANG":"C.UTF-8"}
          logfile=base/"hmcc-modern-andbible-jsword-private-build.log"
          with logfile.open("xb") as output:
              try:
                  run=subprocess.run(["bash",str(jsword/"gradlew"),
                      "--no-daemon","--console=plain","test","--tests",
                      "org.icfmp.research."+java_name],cwd=jsword,env=java_env,
                      stdout=output,stderr=subprocess.STDOUT,timeout=720)
              except subprocess.TimeoutExpired:
                  raise ValueError("Pinned JSword Gradle engine build timed out") from None
          if logfile.stat().st_size>4_000_000:
              raise ValueError("Unbounded private Java engine logs")
          junit=jsword/"build/test-results/test"/(
              "TEST-org.icfmp.research."+java_name+".xml")
          if not junit.is_file() or junit.is_symlink() or junit.stat().st_size>500_000:
              raise ValueError("No bounded actual Java engine JUnit output")
          suite=ET.parse(junit).getroot()
          if suite.tag!="testsuite":
              raise ValueError("Invalid AndBible JSword JUnit report")
          counts={k:int(suite.get(k,0)) for k in
                  ("tests","errors","failures","skipped")}
