# Temporary cleanup workflow; remove before calculating tracked references.
name: Refresh extracted commentary tool registry once
on:
  push:
    branches:
      - maintenance/commentary-scope-evidence-extraction-20261121
    paths:
      - '.github/workflows/commentary-scope-registry-once.yml'
permissions:
  contents: write
  actions: write
jobs:
  inventory:
    if: ${{ github.repository == 'icfmp/Bible-Resources' && github.ref == 'refs/heads/maintenance/commentary-scope-evidence-extraction-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove helper and regenerate source-bound evidence
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/commentary-scope-registry-once.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git commit -m 'chore: refresh inventory after commentary scope extraction'
          git push origin HEAD:refs/heads/maintenance/commentary-scope-evidence-extraction-20261121
