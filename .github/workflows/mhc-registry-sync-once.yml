name: One-time MHC registry cleanup and self-retirement
# Temporary cleanup: remove this workflow from the same trusted feature branch
# and regenerate the tracked tool registry atomically, then self-retire.
on:
  push:
    branches: [feature/mhc-crosswire-intake]
    paths:
      - '.github/workflows/mhc-registry-sync-once.yml'
permissions:
  contents: write
concurrency:
  group: mhc-one-time-tool-registry-sync
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'icfmp/Bible-Resources' && github.ref == 'refs/heads/feature/mhc-crosswire-intake'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate registry from the exact tracked branch tree
        run: |
          set -euo pipefail
          rm -- .github/workflows/mhc-registry-sync-once.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
      - name: Commit only the generated metadata, never any source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- .github/workflows/mhc-registry-sync-once.yml
          git add -- docs/TOOL_REGISTRY.json docs/TOOL_REGISTRY.md
          if git diff --cached --quiet; then
            echo 'Registry already current'
            exit 0
          fi
          git commit -m 'chore(registry): regenerate inventory and retire one-off MHC sync job'
          git push origin HEAD:refs/heads/feature/mhc-crosswire-intake
