name: Derive Darby version-only release receipt
on:
  push:
    branches: [release/darby-2024-1.0.0]
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authenticate previous release and compute candidate bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, os, shutil, sys, tempfile, urllib.request, zipfile
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from stable_sword_refs import module_payload_digest
          module=Path("modules/darby-jnd-2024")
          sha=lambda b:hashlib.sha256(b).hexdigest()
          load=lambda p:json.loads(p.read_text())
          old=load(module/"RELEASE_PROVENANCE.json")
          proof=load(module/"SWORD_COMPATIBILITY.json")
          assert module_payload_digest(module)==proof["module_payload_sha256"]
          files={p.relative_to(module/"payload").as_posix():p.read_bytes() for p in (module/"payload").rglob("*") if p.is_file()}
          assert len(files)==7 and {k:sha(v) for k,v in files.items()}==old["complete_release_member_sha256"]
          url="https://github.com/icfmp/Bible-Resources/releases/download/darby-jnd-2024-0.1.2/BRJND2024-0.1.2.zip"
          with urllib.request.urlopen(url,timeout=60) as response:
              previous=response.read(3000000)
          assert len(previous)==1960800 and sha(previous)=="009af5d19795797337cfa25b68ce96d593fe60f93770d01c44942455d6827e5d"
          with zipfile.ZipFile(io.BytesIO(previous)) as z:
              assert len(z.namelist())==7 and {k:z.read(k) for k in z.namelist()}==files
          key="mods.d/brjnd2024.conf"
          assert files[key].count(b"Version=0.1.2\n")==1
          assert b"Abbreviation=DARBY2024\n" in files[key]
          files[key]=files[key].replace(b"Version=0.1.2\n",b"Version=1.0.0\n")
          with tempfile.TemporaryDirectory() as tmp:
              target=Path(tmp)
              for k,v in files.items():
                  p=target/"payload"/k
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(v)
              new_digest=module_payload_digest(target)
          buff=io.BytesIO()
          with zipfile.ZipFile(buff,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for k,v in sorted(files.items()):
                  info=zipfile.ZipInfo(k,(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,v)
          package=buff.getvalue()
          receipt={"schema_version":1,"base_commit":os.environ["GITHUB_SHA"],"prior_zip_sha256":sha(previous),"prior_zip_size_bytes":len(previous),"candidate_zip_sha256":sha(package),"candidate_zip_size_bytes":len(package),"candidate_payload_sha256":new_digest,"candidate_member_sha256":{k:sha(v) for k,v in sorted(files.items())},"only_changed_member":key,"six_native_members_unchanged":True,"source_osis_sha256":proof["source_osis_sha256"],"sword_id":"BRJND2024","abbreviation":"DARBY2024","version":"1.0.0"}
          out=Path(os.environ["RUNNER_TEMP"])/"darby-version-receipt.json"
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("DARBY_VERSION_RECEIPT",json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: darby-version-receipt
          path: ${{ runner.temp }}/darby-version-receipt.json
          if-no-files-found: error
