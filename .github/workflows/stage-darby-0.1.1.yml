name: Stage exact approved Darby 0.1.1 candidate for protected release PR

on:
  push:
    branches: [release/darby-2024-0.1.1-stage]
    paths:
      - ".github/workflows/stage-darby-0.1.1.yml"
      - "scripts/stage_darby_011_release.py"
      - "config/darby-0.1.1-release-authorization.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
concurrency:
  group: darby-011-approved-staging
  cancel-in-progress: false

jobs:
  staged-rebuild:
    if: github.ref == 'refs/heads/release/darby-2024-0.1.1-stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bounded source audit dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_probe_darby_011_final_android.py -v
          python -m unittest discover -s tests -p test_reader_xiphos_reference_navigation.py -v
      - name: Run established source-only technical repair tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_repair_osis_note_links.py' -v
          python -m unittest discover -s tests -p 'test_repair_osis_inline_markup.py' -v
          python -m unittest discover -s tests -p 'test_repair_osis_source_bytes.py' -v
          python -m unittest discover -s tests -p 'test_repair_osis_division_markers.py' -v
          python -m unittest discover -s tests -p 'test_prepare_darby_011_private_release_candidate.py' -v
          python -m unittest discover -s tests -p 'test_repair_osis_paragraph_indentation.py' -v
          python -m unittest discover -s tests -p 'test_source_native_division_markers.py' -v
          python -m unittest discover -s tests -p 'test_audit_omitted_verse_notes.py' -v
          python -m unittest discover -s tests -p 'test_publisher_osis_sword_candidate.py' -v
      - name: Install standard SWORD readback and pinned r3918 compiler prerequisites
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s sudo apt-get -o Acquire::Retries=1 update -qq
          timeout 180s sudo apt-get -o Acquire::Retries=1 install -y \
            libsword-dev libsword-utils diatheke subversion cmake ninja-build \
            zlib1g-dev libbz2-dev liblzma-dev libicu-dev libcurl4-openssl-dev             xiphos xvfb dbus-x11 xdotool locales imagemagick
          sudo sed -i 's/^# *fr_FR.UTF-8 UTF-8/fr_FR.UTF-8 UTF-8/' /etc/locale.gen
          sudo locale-gen fr_FR.UTF-8
          echo 'LANG=fr_FR.UTF-8' >> "$GITHUB_ENV"
          echo 'LC_ALL=fr_FR.UTF-8' >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/darby-private-native"
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_index.cpp \
            -o "$RUNNER_TEMP/darby-private-native/native-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_raw_corpus.cpp \
            -o "$RUNNER_TEMP/darby-private-native/native-raw" -lsword
      - name: Build full exact upstream CrossWire SWORD r3918 osis2mod
        shell: bash
        run: |
          set -euo pipefail
          svn export --non-interactive --quiet -r 3918 \
            https://crosswire.org/svn/sword/trunk "$RUNNER_TEMP/darby-private-native/sword-r3918"
          cmake -S "$RUNNER_TEMP/darby-private-native/sword-r3918" \
            -B "$RUNNER_TEMP/darby-private-native/sword-r3918-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DSWORD_BUILD_UTILS=YES \
            -DSWORD_BUILD_TESTS=NO -DSWORD_BUILD_EXAMPLES=NO
          cmake --build "$RUNNER_TEMP/darby-private-native/sword-r3918-build" \
            --target osis2mod --parallel 4
          compiler="$(find "$RUNNER_TEMP/darby-private-native/sword-r3918-build" \
            -type f -name osis2mod -perm /111 -print -quit)"
          test -n "$compiler"
          test -x "$compiler"
          echo "PINNED_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Verify exact official CrossWire OSIS schema
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch_reviewed_schema.py \
            --directory "$RUNNER_TEMP/darby-private-native/schema"
      - name: Recreate private source and run whole-corpus native SWORD fidelity gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_private_repaired_darby_sword.py \
            --osis2mod "$PINNED_COMPILER" \
            --native-index "$RUNNER_TEMP/darby-private-native/native-index" \
            --native-raw "$RUNNER_TEMP/darby-private-native/native-raw" \
            --diatheke "$(command -v diatheke)" \
            --schema "$RUNNER_TEMP/darby-private-native/schema/osisCore.2.1.1-cw-latest.xsd" \
            --link-plan config/publisher-osis/frajnd-2024-note-link-research.json \
            --inline-plan config/publisher-osis/frajnd-2024-inline-markup-research.json \
            --division-overlay \
            --report "$RUNNER_TEMP/darby-private-native/report.json" \
            --attested-preview-export "$RUNNER_TEMP/darby-private-native/private-source-audited.zip"
      - name: Verify exact final BRJND2024 0.1.1 module identity and native source index
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_darby_011_private_release_candidate.py \
            --audit "$RUNNER_TEMP/darby-private-native/report.json" \
            --private-research-zip "$RUNNER_TEMP/darby-private-native/private-source-audited.zip" \
            --old-release-provenance modules/darby-jnd-2024/RELEASE_PROVENANCE.json \
            --final-conf config/darby-0.1.1.conf \
            --native-index "$RUNNER_TEMP/darby-private-native/native-index" \
            --private-output-dir "$RUNNER_TEMP/darby-private-native/final-011-candidate"
          grep -Fx 'Version=0.1.0' modules/darby-jnd-2024/payload/mods.d/brjnd2024.conf
          echo "Existing 0.1.0 remains untouched; candidate ZIP is private."
      - name: Verify original 0.1.0 asset is immutable on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/darby-private-native/original-release"
          gh release download darby-jnd-2024-0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern BRJND2024-0.1.0.zip \
            --dir "$RUNNER_TEMP/darby-private-native/original-release"
          echo "5910669e5eeb85d2ba06a4602918ce71d6773f36d64502bbdf7f96fff0585f15  $RUNNER_TEMP/darby-private-native/original-release/BRJND2024-0.1.0.zip" | sha256sum -c
      - name: Verify owner release authorization exists in public issue #241
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/6875143143" \
            --jq '.user.login + "\n" + .body' > "$RUNNER_TEMP/darby-private-native/owner-authorization.txt"
          grep -Fx 'icfmp' "$RUNNER_TEMP/darby-private-native/owner-authorization.txt"
          grep -F 'Owner authorization' "$RUNNER_TEMP/darby-private-native/owner-authorization.txt"
          grep -F '0.1.1' "$RUNNER_TEMP/darby-private-native/owner-authorization.txt"
      - name: Stage exact source-attested 0.1.1 and canonical catalogue for protected review
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_darby_011_release.py \
            --repo . \
            --private-final-zip "$RUNNER_TEMP/darby-private-native/final-011-candidate/BRJND2024-0.1.1.zip" \
            --private-receipt "$RUNNER_TEMP/darby-private-native/final-011-candidate/metadata-only-report.json" \
            --native-audit "$RUNNER_TEMP/darby-private-native/report.json" \
            --canonical-dist "$RUNNER_TEMP/darby-private-native/canonical-dist" \
            --receipt "$RUNNER_TEMP/darby-private-native/staged-receipt.json"
          python scripts/validate.py
          python scripts/build.py --output dist \
            --base-url https://icfmp.github.io/Bible-Resources/
          python scripts/smoke.py
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          expected=json.loads(Path('modules/darby-jnd-2024/RELEASE_PROVENANCE.json').read_text())['release_zip_sha256']
          assert sha256(Path('dist/sword/packages/BRJND2024.zip').read_bytes()).hexdigest()==expected
          public=json.loads(Path('catalog/v1/catalog.json').read_text())
          rebuilt=json.loads(Path('dist/catalog/v1/catalog.json').read_text())
          assert public==rebuilt
          assert len([m for m in rebuilt['modules'] if m['sword_id']=='BRJND2024' and m['version']=='0.1.1'])==1
          print('Staged complete source-attested payload, internal catalogue and canonical ZIP are identical')
          PY
      - name: Commit ONLY updated Darby payload and approved catalogue on the release staging branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/release/darby-2024-0.1.1-stage"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- modules/darby-jnd-2024/ catalog/v1/catalog.json \
            docs/releases/DARBY-JND-2024-0.1.1.md
          git diff --cached --name-only | python -c '
          import sys
          paths=[x.strip() for x in sys.stdin if x.strip()]
          assert len(paths)>9 and all(
              x.startswith("modules/darby-jnd-2024/")
              or x=="catalog/v1/catalog.json"
              or x=="docs/releases/DARBY-JND-2024-0.1.1.md"
              for x in paths), "Unapproved staged file path"
          print("Scoped staged file count:",len(paths))
          '
          git diff --cached --quiet && { echo "No reviewed release files staged"; exit 1; }
          git commit -m "Stage owner-authorized Darby 2024 0.1.1, source proofs and catalogue"
          git push origin HEAD:refs/heads/release/darby-2024-0.1.1-stage
          echo "Staged release content pushed to topic branch ONLY. No GitHub Release or Pages deployment."
      - name: Retain text-free release staging checksum receipt
        uses: actions/upload-artifact@v4
        with:
          name: darby-011-release-stage-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/darby-private-native/staged-receipt.json
          retention-days: 30
          if-no-files-found: error
