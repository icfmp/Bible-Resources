name: Prepare isolated source-attested LSG table repair
on:
  push:
    branches: [research/lsg-source-layout-repair]
    paths: ['.github/workflows/lsg-source-layout-repair.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Prove exact source-cell restoration and table segmentation
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from itertools import accumulate
          import json,re,zipfile,os
          from lxml import etree
          from pilot_preflight import inspect_archive
          from approved_osis_sword_candidate import approved_source_for
          from source_osis_inventory import _source_tree,OSIS
          from research.bible.source_osis_verse_notes import original_osis_verses_and_notes
          from research.bible.original_authorial_content_parity import parse_usfx
          def folded(s):return ' '.join(s.split())
          def local(n):return etree.QName(n).localname
          source=Path('sources/original/bibles/fr/lsg-1910')
          p=json.loads((source/'PROVENANCE.json').read_text())
          w=p['additional_original_witness']
          archive=source/w['filename']
          proof=inspect_archive(archive,source_kind='authored')
          assert proof['archive_sha256']==w['sha256'] and proof['archive_bytes']==w['size_bytes']
          with zipfile.ZipFile(archive) as z: root=parse_usfx(z.read('fraLSG_usfx.xml'))
          _,xml=approved_source_for(p['resource_id'])
          assert sha256(xml).hexdigest()=='cf867c35a55208726f5e0d57c15555b2947f6e799ecbc1996204e5120f3235f0'
          osis=_source_tree(xml)
          mapping={x['usfm']:x['osis'] for x in json.loads(Path('config/standard_usfm_osis_66.json').read_text())['books']}
          src={mapping[n.get('id')]:n for n in root.iter('book')}
          dst={n.get('osisID'):n for n in osis.iter(OSIS+'div') if n.get('type')=='book'}
          assert set(src)==set(dst)
          def tables(book,source):
              result=[]
              for table in book.iter('table' if source else OSIS+'table'):
                  rows=[]
                  for row in table:
                      assert local(row)==('tr' if source else 'row')
                      cells=[]
                      for cell in row:
                          assert local(cell) in ({'tc','th'} if source else {'cell'})
                          cells.append((folded(''.join(cell.itertext())),cell))
                      rows.append(cells)
                  result.append((table,rows))
              return result
          patches=[]; repairs=[]; splits=[]
          raw_matches=list(re.finditer(rb'<table(?=[\s>])[^>]*>.*?</table>',xml,re.S))
          nodes=list(osis.iter(OSIS+'table'))
          assert len(raw_matches)==len(nodes)
          by_node=dict(zip(nodes,raw_matches,strict=True))
          for book in src:
              st,dt=tables(src[book],True),tables(dst[book],False)
              sr=[row for _,rows in st for row in rows];dr=[row for _,rows in dt for row in rows]
              assert len(sr)==len(dr),(book,'row count')
              for i,(a,b) in enumerate(zip(sr,dr,strict=True),1):
                  assert len(a)==len(b),(book,i,'cell count')
                  for j,((old,on),(new,nn)) in enumerate(zip(a,b,strict=True),1):
                      assert (local(on)=='th')==(nn.get('role')=='label'),(book,i,j,'header role')
                      if old==new:continue
                      assert r'\i' in new and folded(new.replace(r'\i',''))==old,(book,i,j,'unexplained source-cell difference')
                      row=nn.getparent();table=row.getparent();raw=by_node[table]
                      rid=list(table).index(row);cid=list(row).index(nn)
                      rm=list(re.finditer(rb'<row(?=[\s>])[^>]*>.*?</row>',raw.group(),re.S))
                      assert len(rm)==len(table)
                      cm=list(re.finditer(rb'<cell(?=[\s>])[^>]*>.*?</cell>',rm[rid].group(),re.S))
                      assert len(cm)==len(row)
                      offsets=[]
                      for seg in re.finditer(rb'(?<=>)[^<]+(?=<)',cm[cid].group()):
                          offsets.extend(seg.start()+m.start() for m in re.finditer(rb'\\i',seg.group()))
                      assert len(offsets)==new.count(r'\i')
                      for offset in offsets:
                          absolute=raw.start()+rm[rid].start()+cm[cid].start()+offset
                          assert xml[absolute:absolute+2]==b'\\i'
                          patches.append((absolute,b'\\i',b''))
                      repairs.append({'book':book,'row':i,'cell':j,'controls':len(offsets),'source_folded_sha256':sha256(old.encode()).hexdigest()})
              expected=list(accumulate(len(rows) for _,rows in st))
              actual=list(accumulate(len(rows) for _,rows in dt))
              assert not set(actual)-set(expected),(book,'unexpected table boundary')
              for boundary in sorted(set(expected)-set(actual)):
                  previous=0
                  for table,rows in dt:
                      if previous<boundary<previous+len(rows):
                          raw=by_node[table]
                          assert not table.attrib,'Unsupported table attributes'
                          rm=list(re.finditer(rb'<row(?=[\s>])[^>]*>.*?</row>',raw.group(),re.S))
                          assert len(rm)==len(rows)
                          offset=raw.start()+rm[boundary-previous].start()
                          patches.append((offset,b'',b'</table><table>'))
                          splits.append({'book':book,'after_source_row':boundary,'original_table_rows':len(rows)})
                          break
                      previous+=len(rows)
                  else:raise AssertionError('Unresolved source table boundary')
          assert sum(x['controls'] for x in repairs)==3 and len(splits)==1
          patches.sort()
          assert len({x[0] for x in patches})==len(patches)
          cursor=0;chunks=[];receipt=[]
          for offset,old,new in patches:
              assert offset>=cursor and xml[offset:offset+len(old)]==old
              chunks.append(xml[cursor:offset]);new_offset=sum(map(len,chunks));chunks.append(new)
              receipt.append({'source_byte_offset':offset,'candidate_byte_offset':new_offset,'old_utf8':old.decode(),'new_utf8':new.decode()})
              cursor=offset+len(old)
          chunks.append(xml[cursor:]);candidate=b''.join(chunks)
          inverse=candidate
          for edit in reversed(receipt):
              i=edit['candidate_byte_offset'];old=edit['old_utf8'].encode();new=edit['new_utf8'].encode()
              assert inverse[i:i+len(new)]==new
              inverse=inverse[:i]+old+inverse[i+len(new):]
          assert inverse==xml
          newroot=_source_tree(candidate)
          newbooks={n.get('osisID'):n for n in newroot.iter(OSIS+'div') if n.get('type')=='book'}
          for book in src:
              a,b=tables(src[book],True),tables(newbooks[book],False)
              assert [[[(v,local(n)=='th') for v,n in row] for row in rows] for _,rows in a]==[[[(v,n.get('role')=='label') for v,n in row] for row in rows] for _,rows in b],(book,'restored table mismatch')
          a,an,am=original_osis_verses_and_notes(xml);b,bn,bm=original_osis_verses_and_notes(candidate)
          assert a==b and an==bn and am==bm
          assert [(dict(n.attrib),''.join(n.itertext())) for n in osis.iter(OSIS+'w')]==[(dict(n.attrib),''.join(n.itertext())) for n in newroot.iter(OSIS+'w')]
          result={'source_sha256':sha256(xml).hexdigest(),'candidate_sha256':sha256(candidate).hexdigest(),'original_usfx_sha256':w['sha256'],'source_cell_repairs':repairs,'table_splits':splits,'edits':receipt,'inverse_exact':True,'all_source_table_cells_and_row_boundaries_equal':True,'numbered_prose_notes_exact':True,'all_word_annotations_exact':True,'scope':'isolated table candidate only; no paragraph correction, schema, native reader or publication approval'}
          t=Path(os.environ['RUNNER_TEMP'])
          (t/'lsg-intro-table-candidate.osis.xml').write_bytes(candidate)
          (t/'lsg-intro-table-receipt.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('LSG_TABLE_CANDIDATE',json.dumps(result,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reversible-lsg-table-repair-receipt
          path: ${{ runner.temp }}/lsg-intro-table-receipt.json
          retention-days: 30
      - name: Check restored table cells against source editorial inline spans
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json,zipfile,os
          from lxml import etree
          from source_osis_inventory import _source_tree,OSIS
          from research.bible.original_authorial_content_parity import parse_usfx
          def local(n):return etree.QName(n).localname if isinstance(n.tag,str) else ''
          def ns(s):return ''.join((s or '').split())
          with zipfile.ZipFile('sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip') as z:src=parse_usfx(z.read('fraLSG_usfx.xml'))
          dst=_source_tree((Path(os.environ['RUNNER_TEMP'])/'lsg-intro-table-candidate.osis.xml').read_bytes())
          mapping={x['usfm']:x['osis'] for x in json.loads(Path('config/standard_usfm_osis_66.json').read_text())['books']}
          books={n.get('osisID'):n for n in dst.iter(OSIS+'div') if n.get('type')=='book'}
          def cell_spans(cell,source):
              pos=0;rows=[];unknown=Counter()
              def append(v):
                  nonlocal pos
                  pos+=len(ns(v))
              def walk(n):
                  k=local(n)
                  if not k:return
                  start=pos
                  if n is cell:kind=None
                  elif source and k in {'it','bd','ord','wj'}:kind={'it':'italic','bd':'bold','ord':'super','wj':'quotation'}[k]
                  elif not source and k=='hi':kind=n.get('type')
                  elif not source and k=='q':kind='quotation'
                  else:
                      unknown[k]+=1;kind=None
                  append(n.text)
                  for c in n:walk(c);append(c.tail)
                  if kind:rows.append((kind,start,pos))
              walk(cell)
              return rows,unknown
          counts=Counter();unknown_source=Counter();unknown_target=Counter();findings=[]
          for b in src.iter('book'):
              ident=mapping[b.get('id')]
              sc=[c for t in b.iter('table') for row in t for c in row]
              tc=[c for t in books[ident].iter(OSIS+'table') for row in t for c in row]
              assert len(sc)==len(tc)
              for i,(a,b) in enumerate(zip(sc,tc,strict=True),1):
                  aa,au=cell_spans(a,True);bb,bu=cell_spans(b,False)
                  counts['cells']+=1;counts['source_inline_spans']+=len(aa);counts['target_inline_spans']+=len(bb)
                  unknown_source.update(au);unknown_target.update(bu)
                  if aa==bb:counts['inline_spans_equal']+=1
                  elif len(findings)<30:findings.append({'book':ident,'cell':i,'source_spans':aa,'target_spans':bb})
          print('LSG_TABLE_INLINE_DIAGNOSTIC',json.dumps({'counts':dict(counts),'unknown_source':dict(unknown_source),'unknown_target':dict(unknown_target),'findings':findings},sort_keys=True),flush=True)
          assert counts['cells']==counts['inline_spans_equal'] and not unknown_source and not unknown_target
          PY
      - name: Locate actual source paragraph starts and candidate XML insertion boundaries
        if: always()
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from collections import Counter,defaultdict
          import json,zipfile
          from lxml import etree
          from approved_osis_sword_candidate import approved_source_for
          from source_osis_inventory import _source_tree,OSIS
          from research.bible.original_authorial_content_parity import parse_usfx
          def local(n):return etree.QName(n).localname if isinstance(n.tag,str) else ''
          def ns(s):return ''.join((s or '').split())
          NOTE={'x','f','fe','ef','ex'}
          TITLE={'s','s1','s2','s3','s4','r','sr','mr','ms','ms1','ms2','ms3','mt','mt1','mt2','mt3','imt','imt1','imt2','imt3','is','is1','is2'}
          mapping={x['usfm']:x['osis'] for x in json.loads(Path('config/standard_usfm_osis_66.json').read_text())['books']}
          with zipfile.ZipFile('sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip') as z:root=parse_usfx(z.read('fraLSG_usfx.xml'))
          _,xml=approved_source_for('lsg-1910'); target=_source_tree(xml)
          def scan(book,source):
              pos=0;ref=None;chapter=None;last=None
              starts=[];spans=[];events=defaultdict(list);style_counts=Counter()
              def append(s,owner,field):
                  nonlocal pos
                  if ref and ns(s):
                      start=pos;pos+=len(ns(s))
                      spans.append((start,pos,local(owner),field,ref,owner))
              def walk(n):
                  nonlocal ref,chapter,last
                  k=local(n)
                  if not k:return
                  style=n.get('sfm') or n.get('style') or k
                  if source and (k in NOTE|{'id','h','toc'}|TITLE or k=='p' and style in TITLE) or not source and k in {'note','title','header'}:return
                  if source and k=='c':chapter=n.get('id')
                  if source and k=='v':ref=chapter+'.'+n.get('id');last=ref
                  if source and k=='ve':ref=None
                  if not source and k=='verse':
                      if n.get('eID'):ref=None
                      else:ref=n.get('osisID').split('.',1)[1];last=ref
                  # Include every paragraph style in the census, including non-p containers.
                  if source and k in {'p','q','m','b','pi','pi1','li','li1'}:
                      style_counts[k+'|'+style]+=1
                  if source and k=='p' or not source and (k=='p' or k=='lb' and n.get('type')=='x-p'):
                      if pos>0:
                          starts.append((pos,last,style if source else n.get('type'),n))
                  if pos>0 and not source:
                      parent=n.getparent()
                      events[pos].append({'edge':'open','tag':k,'parent':local(parent),'attributes':{a:n.get(a) for a in ('type','level','subType','sID','eID','osisID') if n.get(a) is not None}})
                  append(n.text,n,'text')
                  for c in n:
                      walk(c);append(c.tail,c,'tail')
                  if pos>0 and not source:
                      events[pos].append({'edge':'close','tag':k,'parent':local(n.getparent()) if n.getparent() is not None else None})
                  if not source and k=='verse' and n.get('osisID') and not n.get('sID'):ref=None
              walk(book)
              return starts,spans,events,style_counts
          reports={}
          target_books={n.get('osisID'):n for n in target.iter(OSIS+'div') if n.get('type')=='book'}
          for book in root.iter('book'):
              ident=mapping[book.get('id')]
              a,_,_,styles=scan(book,True)
              b,spans,events,_=scan(target_books[ident],False)
              # Classify explicitly known body paragraph styles only.
              aa=[x for x in a if x[2] in {'p','m','pi','pi1','pi2','pi3'}]
              x=Counter(v[0] for v in aa);y=Counter(v[0] for v in b)
              if not x-y and not y-x:continue
              result={'source_style_counts':dict(styles),'missing':[],'extra':[]}
              for offset,ref,style,node in aa:
                  if offset not in x-y:continue
                  near=[v for v in spans if v[0]<=offset<=v[1]]
                  anchors=[]
                  for s,e,k,field,r,n in near:
                      anchors.append({'start':s,'end':e,'field':field,'node':k,'ref':r,'ancestors':[local(p) for p in list(n.iterancestors())[:5]],'interior':s<offset<e})
                  result['missing'].append({'offset':offset,'ref':ref,'style':style,'source_parent':local(node.getparent()),'source_first_child':local(node[0]) if len(node) else None,'candidate_anchors':anchors[:8],'candidate_events':events[offset][:16]})
              for offset,ref,style,node in b:
                  if offset not in y-x:continue
                  result['extra'].append({'offset':offset,'ref':ref,'style':style,'tag':local(node),'parent':local(node.getparent()),'preceding':local(node.getprevious()) if node.getprevious() is not None else None,'following':local(node.getnext()) if node.getnext() is not None else None})
              reports[ident]=result
          print('LSG_PARAGRAPH_ANCHORS',json.dumps(reports,sort_keys=True),flush=True)
          PY
      - name: Construct reversible source-attested paragraph candidate
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from collections import Counter,defaultdict
          from hashlib import sha256
          import json,zipfile,os
          from xml.parsers import expat
          from lxml import etree
          from source_osis_inventory import _source_tree,OSIS
          from research.bible.original_authorial_content_parity import parse_usfx
          from research.bible.source_osis_verse_notes import original_osis_verses_and_notes
          t=Path(os.environ['RUNNER_TEMP'])
          raw=(t/'lsg-intro-table-candidate.osis.xml').read_bytes()
          receipt=json.loads((t/'lsg-intro-table-receipt.json').read_text())
          assert sha256(raw).hexdigest()==receipt['candidate_sha256']
          assert receipt['inverse_exact'] and receipt['all_source_table_cells_and_row_boundaries_equal']
          root=_source_tree(raw)
          with zipfile.ZipFile('sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip') as z:
              source=parse_usfx(z.read('fraLSG_usfx.xml'))
          mapping={x['usfm']:x['osis'] for x in json.loads(Path('config/standard_usfm_osis_66.json').read_text())['books']}
          def local(n):return etree.QName(n).localname if isinstance(n.tag,str) else ''
          def ns(s):return ''.join((s or '').split())
          # Use actual XML parser byte positions, not a regular expression for nesting.
          parser=expat.ParserCreate(namespace_separator='|')
          begins=[];ends=[];stack=[]
          def start(name,attrs):
              i=len(begins);begins.append((name.split('|')[-1],parser.CurrentByteIndex));ends.append(None);stack.append(i)
          def end(name):
              i=stack.pop();assert begins[i][0]==name.split('|')[-1];ends[i]=parser.CurrentByteIndex
          parser.StartElementHandler=start;parser.EndElementHandler=end
          parser.Parse(raw,True)
          nodes=[n for n in root.iter() if isinstance(n.tag,str)]
          assert len(nodes)==len(begins)==len(ends) and not stack
          positions={}
          for node,(tag,offset),end_offset in zip(nodes,begins,ends,strict=True):
              assert local(node)==tag
              positions[node]=(offset,end_offset)
          NOTE={'x','f','fe','ef','ex'}
          TITLE={'s','s1','s2','s3','s4','r','sr','mr','ms','ms1','ms2','ms3','mt','mt1','mt2','mt3','imt','imt1','imt2','imt3','is','is1','is2'}
          SRC_STYLE={'p':None,'m':'x-noindent','pi':'x-indented-1','pi1':'x-indented-1'}
          def scan(book,src):
              pos=0;ref=None;chapter=None;last=None
              starts=[];spans=[];events=defaultdict(list)
              def append(s,owner,field):
                  nonlocal pos
                  if ref and ns(s):
                      begin=pos;pos+=len(ns(s));spans.append((begin,pos,owner,field,ref,s))
              def walk(n):
                  nonlocal ref,chapter,last
                  k=local(n)
                  if not k:return
                  style=n.get('sfm') or n.get('style') or k
                  if src and (k in NOTE|{'id','h','toc'}|TITLE or k=='p' and style in TITLE) or not src and k in {'note','title','header'}:
                      if not src and k=='note' and ref:events[pos].append(n)
                      return
                  if src and k=='c':chapter=n.get('id')
                  if src and k=='v':ref=chapter+'.'+n.get('id');last=ref
                  if src and k=='ve':ref=None
                  if not src and k=='verse':
                      if n.get('eID'):ref=None
                      else:ref=n.get('osisID').split('.',1)[1];last=ref
                  if src and k=='p' and style in SRC_STYLE and pos>0:
                      starts.append((pos,SRC_STYLE[style],n,last))
                  if not src and k=='p' and pos>0:
                      assert n.get('type') in set(SRC_STYLE.values())
                      starts.append((pos,n.get('type'),n,last))
                  if not src and pos>0:events[pos].append(n)
                  append(n.text,n,'text')
                  for c in n:
                      walk(c);append(c.tail,c,'tail')
                  if not src and k=='verse' and n.get('osisID') and not n.get('sID'):ref=None
              walk(book)
              return starts,spans,events
          books={n.get('osisID'):n for n in root.iter(OSIS+'div') if n.get('type')=='book'}
          patches=[];report=[];expected={}
          for book in source.iter('book'):
              ident=mapping[book.get('id')]
              a,_,_=scan(book,True);b,spans,events=scan(books[ident],False)
              expected[ident]=[(pos,style) for pos,style,_,_ in a]
              x=Counter((pos,style) for pos,style,_,_ in a);y=Counter((pos,style) for pos,style,_,_ in b)
              # Distinguish repeated equivalent positions rather than silently skipping them.
              missing=x-y;extra=y-x
              for offset,style,node,ref in b:
                  key=(offset,style)
                  if extra[key]<=0:continue
                  extra[key]-=1
                  prev=node.getprevious()
                  # Moving a boundary may only remove a direct adjacent paragraph pair.
                  assert local(prev)=='p' and prev.getparent() is node.getparent(),(ident,ref,'nonadjacent paragraph')
                  assert set(node.attrib)<= {'type'} and set(prev.attrib)<= {'type'}
                  op,end=positions[node];prev_end=positions[prev][1]
                  assert raw[prev_end:prev_end+4]==b'</p>'
                  opening=raw[op:raw.index(b'>',op)+1]
                  assert opening in (b'<p>',b'<p type="x-noindent">',b'<p type="x-indented-1">')
                  patches.extend([(prev_end,b'</p>',b''),(op,opening,b'')])
                  report.append({'kind':'remove_displaced_boundary','book':ident,'ref':ref,'nonspace_offset':offset,'style':style})
              assert not +extra
              for offset,style,node,ref in a:
                  key=(offset,style)
                  if missing[key]<=0:continue
                  missing[key]-=1
                  first=next((n for n in node if isinstance(n.tag,str)),None)
                  assert first is not None
                  name=local(first)
                  desired={'w':'w','wj':'q','it':'hi','x':'note'}.get(name)
                  assert desired,(ident,ref,'unsupported source boundary child',name)
                  # Prefer the exact direct child (including source-first note).
                  candidates=[]
                  for n in events[offset]:
                      if local(n)!=desired or local(n.getparent())!='p':continue
                      if desired=='note' and n.get('n')!=first.get('caller'):continue
                      candidates.append(n)
                  if candidates:
                      assert len(candidates)==1,(ident,ref,'ambiguous direct-child anchor')
                      point=positions[candidates[0]][0]
                  else:
                      # A paragraph start can bisect unannotated prose in a
                      # direct child tail, without changing either text stream.
                      tails=[(lo,hi,n,s) for lo,hi,n,field,r,s in spans if lo<offset<hi and field=='tail' and local(n.getparent())=='p']
                      assert desired=='w' and len(tails)==1,(ident,ref,'no exact safe paragraph anchor',desired)
                      lo,hi,n,s=tails[0]
                      count=0;idx=0
                      while idx<len(s) and count<offset-lo:
                          if not s[idx].isspace():count+=1
                          idx+=1
                      while idx<len(s) and s[idx].isspace():idx+=1
                      assert count==offset-lo and idx<len(s)
                      endpos=positions[n][1]
                      close=b'</'+local(n).encode()+b'>'
                      assert raw[endpos:endpos+len(close)]==close
                      tail_start=endpos+len(close)
                      encoded=s.encode('utf-8')
                      assert raw[tail_start:tail_start+len(encoded)]==encoded,(ident,ref,'nonliteral XML tail')
                      point=tail_start+len(s[:idx].encode('utf-8'))
                  opening=b'<p>' if style is None else b'<p type="'+style.encode()+b'">'
                  patches.append((point,b'',b'</p>'+opening))
                  report.append({'kind':'restore_source_boundary','book':ident,'ref':ref,'nonspace_offset':offset,'style':style,'anchor_kind':desired})
              assert not +missing
          # All edits are exact, scoped paragraph-tag insertions/deletions.
          assert patches and len({p[0] for p in patches})==len(patches)
          cursor=0;chunks=[];inverse_edits=[]
