          import org.crosswire.jsword.versification.system.Versifications;
          import org.junit.Test;
          import static org.junit.Assert.*;
          
          public final class ApprovedBibleFullIndexProbeTest {
              static String hash(String s) throws Exception {
                  byte[] b=MessageDigest.getInstance("SHA-256").digest(s.getBytes(StandardCharsets.UTF_8));
                  StringBuilder out=new StringBuilder();
                  for(byte v:b) out.append(String.format("%02x",v&255));
                  return out.toString();
              }
              static String compact(String s) {
                  StringBuilder out=new StringBuilder();
                  s.codePoints().filter(c -> !Character.isWhitespace(c) && !Character.isSpaceChar(c)).forEach(out::appendCodePoint);
                  return out.toString();
              }
              @Test public void independentlyReadExactPublishedBibleIndexes() throws Exception {
                  File root=new File(System.getenv("BIBLE_PROBE_ROOT")).getCanonicalFile();
                  assertTrue(root.isDirectory() && root.getName().equals("private-approved-bible-reader-root"));
                  SwordBookPath.setAugmentPath(new File[]{root});
                  List<String> modules=Files.readAllLines(Paths.get(System.getenv("BIBLE_PROBE_PLAN")),StandardCharsets.US_ASCII);
                  assertEquals(1,modules.size());
                  int failures=0;
                  for(String line:modules) {
                      String[] spec=line.split("\t");
                      String id=spec[0], v11n=spec[1];
                      Book bible=Books.installed().getBook(id);
                      if(bible==null){System.out.println("BIBLE_JSWORD_RESULT "+id+" unavailable");failures++;continue;}
                      assertEquals(id,bible.getInitials());
                      Versification v=Versifications.instance().getVersification(v11n);
                      if(v==null){System.out.println("BIBLE_JSWORD_RESULT "+id+" versification_unavailable");failures++;continue;}
                      assertEquals(v11n,bible.getBookMetaData().getProperty(BookMetaData.KEY_VERSIFICATION));
                      Set<String> expected=new HashSet<>();
                      int missing=0, rawExact=0, rawCompact=0, rawRead=0, badKeys=0, structured=0, structuredExpected=0, structuredExact=0;
                      List<String> rawDiff=new ArrayList<>(),missingRefs=new ArrayList<>(),sampleDiff=new ArrayList<>();
                      for(String row:Files.readAllLines(Paths.get(spec[2]),StandardCharsets.US_ASCII)){
                          String[] cols=row.split("\t",-1);
                          String ref=cols[0];assertTrue(expected.add(ref));
                          String[] parts=ref.split("\\.");
                          BibleBook b=BibleBook.fromExactOSIS(parts[0]);assertNotNull(b);
                          Verse k=new Verse(v,b,Integer.parseInt(parts[1]),Integer.parseInt(parts[2]));
                          if(!ref.equals(k.getOsisRef())){badKeys++;continue;}
                          if(!bible.contains(k)){missing++;if(missingRefs.size()<20)missingRefs.add(ref);continue;}
                          String raw=bible.getRawText(k);
                          if(raw!=null){
                              rawRead++;
                              if(hash(raw).equals(cols[1]))rawExact++;
                              else if(rawDiff.size()<20)rawDiff.add(ref);
                              if(hash(compact(raw)).equals(cols[2]))rawCompact++;
                          }
                          if(!cols[3].isEmpty()){
                              structuredExpected++;
                              String prose=OSISUtil.getCanonicalText(new BookData(bible,k).getOsisFragment());
                              if(prose!=null && !prose.trim().isEmpty()){
                                  structured++;
                                  if(hash(compact(prose)).equals(cols[3])) structuredExact++;
                                  else if(sampleDiff.size()<20)sampleDiff.add(ref);
                              }
                          }
                      }
                      int extra=0;
                      for(Key key:bible.getScope()){
                          if(!(key instanceof Verse))continue;
                          Verse x=(Verse)key;
                          if(x.getChapter()>0 && x.getVerse()>0 && !expected.contains(x.getOsisRef()) && bible.contains(x))extra++;
                      }
                      System.out.println("BIBLE_JSWORD_RESULT "+id+" expected="+expected.size()+" missing="+missing+" extra="+extra+" changed_keys="+badKeys+" raw_read="+rawRead+" raw_exact="+rawExact+" raw_nonspace="+rawCompact+" structured_samples="+structured+" structured_expected="+structuredExpected+" structured_exact="+structuredExact);
                      System.out.println("BIBLE_JSWORD_DIFFERENCES "+id+" missing="+missingRefs+" raw="+rawDiff+" structured="+sampleDiff);
                      if(missing!=0 || extra!=0 || badKeys!=0 || rawRead!=expected.size() || rawCompact!=expected.size() || structuredExpected<2 || structured!=structuredExpected || structuredExact!=structuredExpected) failures++;
                  }
                  assertEquals("At least one independent Bible engine retrieval/index check failed",0,failures);
              }
          }
          JAVA
