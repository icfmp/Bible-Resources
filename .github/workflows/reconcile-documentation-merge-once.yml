# Temporary workflow for reconciling the audited PR merge; it removes itself.
name: Reconcile documentation merge and run full validation
on:
  push:
    branches:
      - docs/physical-taxonomy-layout-20261120
    paths:
      - '.github/workflows/reconcile-documentation-merge-once.yml'
permissions:
  contents: write
  actions: write
jobs:
  regenerate-and-validate:
    if: ${{ github.repository == 'icfmp/Bible-Resources' && github.ref == 'refs/heads/docs/physical-taxonomy-layout-20261120' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate accurate script inventory and remove dispatcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm -- .github/workflows/reconcile-documentation-merge-once.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git commit -m 'chore: reconcile package-aware tool inventory after merging main'
          git push origin HEAD:refs/heads/docs/physical-taxonomy-layout-20261120
          gh workflow run validate.yml --ref docs/physical-taxonomy-layout-20261120
          gh workflow run tool-registry-maintenance.yml --ref docs/physical-taxonomy-layout-20261120
