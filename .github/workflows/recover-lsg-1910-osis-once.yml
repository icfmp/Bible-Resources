name: Recover exact LSG 1910 approved OSIS from historical pinned pipeline
on:
  push:
    branches: [recovery/lsg-1910-clean-osis]
    paths: [.github/workflows/recover-lsg-1910-osis-once.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.repository == 'icfmp/Bible-Resources'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original source pipeline Python dependencies
        run: python -m pip install -r requirements.txt -q
      - name: Retrieve source-bound historical build scripts at exact reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --no-checkout https://github.com/icfmp/Bible-Resources.git "$RUNNER_TEMP/lsg-historical"
          git -C "$RUNNER_TEMP/lsg-historical" checkout -q --detach 7f675b4d621e5c0aba5fd78f0cb3cb468eb2cd26
          test "$(git -C "$RUNNER_TEMP/lsg-historical" rev-parse HEAD)" = 7f675b4d621e5c0aba5fd78f0cb3cb468eb2cd26
          git clone -q https://github.com/adyeths/u2o.git "$RUNNER_TEMP/u2o"
          git -C "$RUNNER_TEMP/u2o" checkout -q --detach dde28bc545e8d8697fa5496c243187847ec55d31
          test "$(git -C "$RUNNER_TEMP/u2o" rev-parse HEAD)" = dde28bc545e8d8697fa5496c243187847ec55d31
      - name: Prepare exactly authorized official USFM and USFX source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lsg-original" "$RUNNER_TEMP/u2o-reviewed" "$RUNNER_TEMP/lsg-reviewed-osis"
          cp sources/original/bibles/fr/lsg-1910/fraLSG_usfm.zip "$RUNNER_TEMP/lsg-original/usfm.zip"
          curl -fLsS --retry 2 --connect-timeout 25 --max-time 180 \
            https://ebible.org/Scriptures/fraLSG_usfx.zip \
            -o "$RUNNER_TEMP/lsg-original/usfx.zip"
          echo "64c4fe2a84d92f958deb0d1add4247d126a21c8a51e5b3058338f661a42d4900  $RUNNER_TEMP/lsg-original/usfm.zip" | sha256sum --check --status
          echo "fe059525d3167c70c22777e6cb6d578eb1e63095904f61fed0a857c4f643ac0e  $RUNNER_TEMP/lsg-original/usfx.zip" | sha256sum --check --status
          python "$RUNNER_TEMP/lsg-historical/scripts/patch_u2o_intro.py" \
            --original "$RUNNER_TEMP/u2o/u2o.py" --output "$RUNNER_TEMP/u2o-reviewed/u2o.py"
          cd "$RUNNER_TEMP/lsg-historical"
          python scripts/fetch_reviewed_schema.py --directory "$RUNNER_TEMP/lsg-reviewed-osis"
      - name: Regenerate and identify exact formerly approved corrected OSIS
        shell: bash
        env:
          LSG_RECOVERED_OSIS_PATH: ${{ github.workspace }}/sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"lsg-historical/scripts/lsg_stable_source_trial.py"
          content=p.read_text()
          marker='        inspector=os.environ.get("LSG_STOCK_RAW_INSPECTOR")'
          if content.count(marker)!=1:
              raise SystemExit("Original pinned LSG pipeline has changed unexpectedly")
          source_lines=[
            '# Source-only recovery from original verified published compiler input',
            'if os.environ.get("LSG_RECOVERED_OSIS_PATH"):',
            '    source_bytes=labeled.read_bytes()',
            '    verified=hashlib.sha256(source_bytes).hexdigest()',
            '    if verified!="d6abd7416d026c86ce2e9577e3bfe7a10159c5c78d236913359c7fab013449d0":',
            '        raise PilotError("Historical cleaned OSIS differs from published source SHA")',
            '    dest=Path(os.environ["LSG_RECOVERED_OSIS_PATH"])',
            '    if dest.exists():raise PilotError("Refuse to overwrite source")',
            '    dest.parent.mkdir(parents=True)',
            '    dest.write_bytes(source_bytes)',
            '    report["status"]="exact_historical_published_cleaned_osis_recovered"',
            '    print("Recovered LSG source",verified,len(source_bytes))',
            '    return report',
          ]
          new=chr(10).join('        '+line for line in source_lines)+chr(10)
          # Preserve original code and all upstream transformations unmodified
          # except a terminal, SHA-enforcing extraction gate at the precise
          # source-to-compiled boundary.
          content=content.replace(marker,new.rstrip()+chr(10)+marker)
          p.write_text(content)
          PY
          cd "$RUNNER_TEMP/lsg-historical"
          export PYTHONPATH=scripts
          python scripts/lsg_stable_source_trial.py \
            --usfm-zip "$RUNNER_TEMP/lsg-original/usfm.zip" \
            --usfx-zip "$RUNNER_TEMP/lsg-original/usfx.zip" \
            --converter "$RUNNER_TEMP/u2o-reviewed/u2o.py" \
            --schema "$RUNNER_TEMP/lsg-reviewed-osis/osisCore.2.1.1-cw-latest.xsd" \
            --report "$RUNNER_TEMP/lsg-recovery.json" || { python -c 'import json,os; p=os.environ["RUNNER_TEMP"]+"/lsg-recovery.json"; r=json.load(open(p)); print("RECOVERY_BLOCKER",r.get("category"),r.get("detail"),r.get("status"))'; exit 1; }
      - name: Verify publisher witness and commit approved cleaned OSIS
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/lsg-original/usfx.zip" sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("sources/cleaned/bibles/fr/lsg-1910")
          src=root/"lsg-1910.osis.xml"
          source=src.read_bytes()
          sha=hashlib.sha256(source).hexdigest()
          release=json.loads(Path("config/catalogue-import-lsg-0.1.0.json").read_text())
          assert sha==release["provenance"]["final_candidate_osis_sha256"]
          assert hashlib.sha256(Path("sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip").read_bytes()).hexdigest()==release["source_usfx_zip_sha256"]
          report=json.loads(Path(__import__("os").environ["RUNNER_TEMP"]+"/lsg-recovery.json").read_text())
          assert report["status"]=="exact_historical_published_cleaned_osis_recovered"
          assert report["osis_editorial_range_label"]["output_sha256"]==sha
          manifest={"schema_version":1,"resource_id":"lsg-1910","language":"fr","type":"bible",
            "status":"exact_published_0_1_0_editorial_compiler_source_recovered",
            "original_usfm_path":"sources/original/bibles/fr/lsg-1910/fraLSG_usfm.zip",
            "original_usfm_sha256":release["source_usfm_zip_sha256"],
            "original_usfx_path":"sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip",
            "original_usfx_sha256":release["source_usfx_zip_sha256"],
            "cleaned_osis_sha256":sha,"cleaned_osis_bytes":len(source),
            "historical_source_pipeline_commit":"7f675b4d621e5c0aba5fd78f0cb3cb468eb2cd26",
            "historical_u2o_converter_commit":"dde28bc545e8d8697fa5496c243187847ec55d31",
            "published_release_provenance":"config/catalogue-import-lsg-0.1.0.json",
            "prior_generated_osis_sha256":release["provenance"]["source_osis_sha256"],
            "retyped_parallel_heading_osis_sha256":release["provenance"]["retyped_markup_osis_sha256"],
            "final_candidate_osis_sha256":sha,
            "full_compiled_native_validation":"modules/lsg-1910/SOURCE_AUDIT.json",
            "recovery_replayed_existing_source_transforms":True,
            "original_script_modified_in_repository":False}
          (root/"CLEANUP_MANIFEST.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("LSG exact editorial source archived, checked against approved release",sha,len(source))
          PY
          git rm .github/workflows/recover-lsg-1910-osis-once.yml
          git add sources/cleaned/bibles/fr/lsg-1910/ sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip
          git diff --cached --check -- ':!sources/**/*.xml' ':!sources/**/*.zip'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover exact published LSG 1910 OSIS master and original USFX witness"
          git push origin HEAD:recovery/lsg-1910-clean-osis
