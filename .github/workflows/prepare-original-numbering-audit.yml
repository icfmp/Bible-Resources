name: Prepare original numbering audit
on:
  push:
    branches: [audit/original-authorial-key-inventory]
    paths: ['.github/workflows/prepare-original-numbering-audit.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Independent original archive numbering
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          import json,zipfile
          from pilot_preflight import inspect_archive
          from source_osis_inventory import source_inventory
          from approved_osis_sword_candidate import approved_source_for
          from research.bible.original_authorial_key_inventory import usfm,usfx,require,compare,summary
          crosswalk=json.loads(Path('config/standard_usfm_osis_66.json').read_text())
          mapping={x['usfm']:x['osis'] for x in crosswalk['books']}
          for manifest in sorted(Path('sources/original/bibles').glob('*/*/PROVENANCE.json')):
              p=json.loads(manifest.read_text())
              if p['format']!='USFM':continue
              a=manifest.parent/p['original_file']; witness=p.get('additional_original_witness',{})
              require(witness.get('format')=='USFX','Missing independent USFX witness')
              b=manifest.parent/witness['filename']
              for path,expected,size in [(a,p['original_sha256'],p['original_size_bytes']),(b,witness['sha256'],witness['size_bytes'])]:
                  receipt=inspect_archive(path,source_kind='authored')
                  require(receipt['archive_sha256']==expected and receipt['archive_bytes']==size,'Original archive pin mismatch')
              with zipfile.ZipFile(a) as z: fm,fm_markers=usfm(z)
              with zipfile.ZipFile(b) as z:
                  require(p.get('provider')=='eBible.org','No reviewed provider USFX member selector')
                  members=[m.filename for m in z.infolist() if not m.is_dir() and Path(m.filename).name.casefold().endswith('_usfx.xml')]
                  require(len(members)==1,'Ambiguous provider Scripture member')
                  fx,fx_markers=usfx(z,members[0])
              require(len(mapping)==len(crosswalk['books']) and len(set(mapping.values()))==len(mapping),'Ambiguous crosswalk')
              require(set(fm)<=set(mapping) and set(fx)<=set(mapping),'Original book ID missing reviewed crosswalk')
              _,xml=approved_source_for(p['resource_id'])
              keys,_=source_inventory(xml)
              osis={}
              for key in keys.splitlines():
                  book,c,v=key.split('.')
                  osis.setdefault(book,[]).append((c,v))
              report={'resource':p['resource_id'],'usfm':summary(fm),'usfx':summary(fx),'osis':summary(osis),'original_formats':compare(fm,fx),'usfm_vs_approved_osis':compare({mapping[k]:v for k,v in fm.items()},osis),'usfx_vs_approved_osis':compare({mapping[k]:v for k,v in fx.items()},osis),'verse_bridges_expanded':False,'text_or_note_parity_certified':False,'archive_pins_verified':True,'usfm_marker_counts':dict(fm_markers),'usfx_element_counts':dict(fx_markers)}
              print('ORIGINAL_SOURCE_KEY_INVENTORY',json.dumps(report,sort_keys=True),flush=True)
          PY
      - run: |
          python -m unittest discover -s tests -p test_original_authorial_key_inventory.py -v
          git rm .github/workflows/prepare-original-numbering-audit.yml
          python scripts/tool_registry.py --write
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          python scripts/tool_registry.py --check
          python -m unittest discover -s tests -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh registry for original numbering inventory'
          git push origin HEAD:refs/heads/audit/original-authorial-key-inventory
