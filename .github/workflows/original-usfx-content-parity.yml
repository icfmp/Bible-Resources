name: Compare original USFX verse text, notes and Strong word associations to approved OSIS
on:
  push:
    branches: [research/original-usfx-content-parity]
    paths: ['.github/workflows/original-usfx-content-parity.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Independent original verse and lexical comparison
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from collections import Counter,defaultdict
          from hashlib import sha256
          import json,re,zipfile
          from lxml import etree
          from pilot_preflight import inspect_archive
          from approved_osis_sword_candidate import approved_source_for
          from source_osis_inventory import _source_tree,OSIS
          from research.bible.source_osis_verse_notes import original_osis_verses_and_notes
          NOTE={'x','f','fe','ex','ef'}
          EXCLUDED={'fig','s','r','toc','h','id'}
          EXCLUDED_PARAGRAPH={'r','s','s1','s2','s3','s4','sr','h','toc1','toc2','toc3'}
          def local(n): return etree.QName(n).localname if isinstance(n.tag,str) else ""
          def ns(s): return ''.join(c for c in (s or '') if not c.isspace())
          def require(ok,reason):
              if not ok: raise ValueError(reason)
          def strong(value,osis=False):
              if not value: return ()
              if osis:
                  parts=value.split()
                  if any(not x.startswith(('strong:','lemma:')) for x in parts): return None
                  parts=[x[7:] for x in parts if x.startswith('strong:')]
              else: parts=[x for x in re.split(r'[\s,]+',value) if x]
              return tuple(parts) if all(re.fullmatch(r'[HG]\d+[a-z]?',x) for x in parts) else None
          def source_verses(root,mapping):
              verses={}; notes=defaultdict(list); words=defaultdict(list); outside=0; books=set()
              for book in root.iter():
                  if local(book)!='book': continue
                  code=book.get('id')
                  require(code in mapping and code not in books,'Unreviewed or duplicate book')
                  books.add(code)
                  chapter=None; key=None; position=0
                  def append(value):
                      nonlocal position
                      if key is not None and value:
                          verses[key].append(value)
                          position+=len(ns(value))
                  def walk(n):
                      nonlocal key,chapter,position,outside
                      kind=local(n)
                      if not kind: return
                      if kind=='c':
                          require(key is None and re.fullmatch(r'[1-9][0-9]*',n.get('id','')),'Unclosed verse or invalid chapter')
                          chapter=n.get('id')
                      elif kind=='v':
                          require(key is None and chapter and re.fullmatch(r'[0-9]+[a-z]?(?:-[0-9]+[a-z]?)?',n.get('id','')),'Unsupported opening')
                          key='.'.join((mapping[code],chapter,n.get('id')))
                          require(key not in verses,'Duplicate verse')
                          verses[key]=[];position=0
                      elif kind=='ve':
                          require(key is not None,'Unexpected verse end')
                          key=None
                      if kind in NOTE:
                          if key is None: outside+=1
                          else: notes[key].append((position,kind,n.get('caller'),ns(''.join(n.itertext()))))
                          return
                      if kind in EXCLUDED or (kind=='p' and (n.get('sfm') or n.get('style')) in EXCLUDED_PARAGRAPH):
                          return
                      word_key=key if kind=='w' else None
                      start=position
                      if word_key:
                          require(not any(local(x) in NOTE|{'w','v','ve','c'} for x in n.iterdescendants()),'Unsupported nested USFX word')
                      append(n.text)
                      for c in n:
                          walk(c);append(c.tail)
                      if word_key:
                          require(key==word_key and position>start,'Invalid USFX word scope')
                          words[word_key].append((start,position,ns(''.join(n.itertext())),strong(n.get('s'))))
                  walk(book)
                  require(key is None,'Unclosed verse at book boundary')
              return {k:''.join(v) for k,v in verses.items()},notes,outside,words
          def usfm_numbered_content(archive,mapping):
              marker=re.compile(r'\\(\+?[a-z][a-z0-9-]*)(\*|(?=\s|\\|$))|\\\*')
              # USFM paragraph/poetry markers start a new logical block.
              body_blocks={'p','m','pi1','q1','b','tr','tc1','tc2','tc3','th1','th2'}
              apparatus={'h','toc1','toc2','imt1','imt2','imt3','io1','io2','ip','ipi','ib','ie','is1','mt1','mt2','mr','ms1','ms2','s1','r'}
              inline={'wj','it','ord','qs','ior'}
              texts={}; words=defaultdict(list); note_rows=defaultdict(list); books=set()
              for member in archive.infolist():
                  if member.is_dir() or not member.filename.lower().endswith(('.usfm','.sfm')):continue
                  raw=archive.read(member).decode('utf-8-sig')
                  matches=list(marker.finditer(raw))
                  require(bool(matches) and not raw[:matches[0].start()].strip(),'USFM content before initial marker')
                  code=None; chapter=None; key=None; enabled=False
                  stack=[]; current_word=None; current_note=None
                  pos=0
                  def append(text):
                      nonlocal pos
                      if key and enabled:
                          texts[key].append(text);pos+=len(ns(text))
                  for i,m in enumerate(matches):
                      tag=m[1]; closing=bool(m[2])
                      tail=raw[m.end():matches[i+1].start() if i+1<len(matches) else len(raw)]
                      require(tag is not None,'Unsupported standalone USFM milestone close')
                      # A start marker consumes its single syntactic whitespace separator.
                      if not closing:
                          require(bool(tail) and tail[0].isspace(),'USFM start marker lacks separator')
                          tail=tail[1:]
                      if tag in {'id','c','v'}:
                          require(not closing and not stack and current_note is None and current_word is None,'Invalid USFM numbering scope')
                          match=re.match(r'([^\s]+)(?:[ \t]|\r?\n|$)',tail)
                          require(match is not None,'Missing USFM numbering label')
                          val=match[1]; rest=tail[match.end():]
                          if tag=='id':
                              require(code is None and val in mapping and val not in books,'Unknown or duplicate USFM book')
                              code=val;books.add(code);enabled=False
                          elif tag=='c':
                              require(code and re.fullmatch(r'[1-9][0-9]*',val),'Invalid USFM chapter')
                              chapter=val;key=None;enabled=False
                          else:
                              require(code and chapter and re.fullmatch(r'[0-9]+[a-z]?(?:-[0-9]+[a-z]?)?',val),'Unsupported USFM verse')
                              key='.'.join((mapping[code],chapter,val));require(key not in texts,'Duplicate USFM verse')
                              texts[key]=[];pos=0;enabled=True;append(rest)
                          continue
                      if tag in apparatus|body_blocks:
                          require(not closing and not stack and current_word is None and current_note is None,'Block inside inline scope')
                          # Headings/introductions end the current numbered content.
                          if tag in apparatus:enabled=False
                          # Tables preceding the first verse are not numbered text.
                          elif key:
                              # A paragraph can resume the same verse after an intervening section heading.
                              enabled=True;append(tail)
                          continue
                      if tag in NOTE:
                          require(current_word is None,'Note inside lexical word')
                          if not closing:
                              require(current_note is None,'Nested USFM note')
                              caller=re.match(r'(\S+)(?:\s|$)',tail)
                              require(caller is not None,'Missing USFM note caller')
                              current_note=[tag,caller[1],pos,[]]
                              if caller.end()<len(tail):current_note[3].append(caller.string[caller.end():])
                          else:
                              require(current_note is not None and current_note[0]==tag,'Unpaired USFM note')
                              if key and enabled:note_rows[key].append((current_note[2],tag,current_note[1],ns(''.join(current_note[3]))))
                              current_note=None;append(tail)
                          continue
                      if current_note is not None:
                          require(tag in {'xo','xt','fr','ft','fq','fqa','fk','fl','fp','fv','fdc','xq','xot','xnt','xdc'},'Unsupported note component')
                          current_note[3].append(tail);continue
                      if tag in {'w','+w'}:
                          if not closing:
                              require(current_word is None,'Nested USFM word')
                              parts=tail.split('|')
                              require(len(parts)==2,'Unsupported USFM word attribute syntax')
                              attrs=dict(re.findall(r'([a-z][a-z0-9-]*)="([^"]*)"',parts[1]))
                              # Reject unparsed attributes, not merely ignore them.
                              remaining=re.sub(r'[a-z][a-z0-9-]*="[^"]*"','',parts[1])
                              require(not remaining.strip(),'Unsupported USFM word attribute')
                              current_word=(tag,key if enabled else None,pos,parts[0],attrs)
                              append(parts[0])
                          else:
                              require(current_word is not None and current_word[0]==tag,'Unpaired USFM word')
                              _,word_key,start,surface,attrs=current_word
                              if word_key:
                                  require(key==word_key,'USFM word crosses verse')
                                  ids=strong(attrs.get('strong') or attrs.get('s'))
                                  words[key].append((start,pos,ns(surface),ids))
                              current_word=None;append(tail)
                          continue
                      if tag in inline:
                          require(current_word is None,'Inline marker inside word')
                          if closing:
                              require(stack and stack[-1]==tag,'Unpaired USFM inline marker');stack.pop()
                          else:stack.append(tag)
                          append(tail);continue
                      raise ValueError('Unreviewed USFM marker '+tag)
                  require(code and current_word is None and current_note is None and not stack,'Unclosed USFM structure')
              return {k:''.join(v) for k,v in texts.items()},words,note_rows
          def osis_numbered_words(root):
              rows=defaultdict(list); keys=set()
              for book in root.iter(OSIS+'div'):
                  if book.get('type')!='book':continue
                  key=None; pos=0
                  def append(value):
                      nonlocal pos
                      if key is not None:pos+=len(ns(value))
                  def visit(n):
                      nonlocal key,pos
                      kind=local(n)
                      if not kind or kind in {'note','title','header'}:return
                      container=False
                      if kind=='verse':
                          if n.get('eID'):
                              require(key==n.get('eID'),'OSIS closing mismatch')
                              key=None
                              return
                          require(key is None and n.get('osisID') and n.get('osisID') not in keys,'Invalid OSIS opening')
                          key=n.get('osisID');keys.add(key);pos=0
                          container=not bool(n.get('sID'))
                      word_key=key if kind=='w' else None
                      start=pos
                      if word_key:
                          require(not any(local(x) in {'w','verse','note','title'} for x in n.iterdescendants()),'Unsupported nested OSIS word')
                      append(n.text)
                      for child in n:
                          visit(child);append(child.tail)
                      if word_key:
                          require(key==word_key and pos>start,'Invalid OSIS word scope')
                          rows[word_key].append((start,pos,ns(''.join(n.itertext())),strong(n.get('lemma'),True)))
                      if container:key=None
                  visit(book)
                  require(key is None,'Unclosed OSIS verse')
              return rows,keys
          def scope(n,osis):
              for a in n.iterancestors():
                  t=local(a)
                  if t in ({"note"} if osis else NOTE): return 'note'
                  if osis and t=='title': return 'title'
              return 'other'
          def lexical(root,osis):
              rows=[]; unknown=Counter(); fields=Counter()
              for n in root.iter():
                  if local(n)!='w':continue
                  fields.update(etree.QName(a).localname for a in n.attrib)
                  ids=strong(n.get('lemma' if osis else 's'),osis)
                  if ids is None: unknown['unparsed_strong']+=1
                  rows.append((ns(''.join(n.itertext())),ids))
              return rows,unknown,fields
          crosswalk=json.loads(Path('config/standard_usfm_osis_66.json').read_text())
          mapping={x['usfm']:x['osis'] for x in crosswalk['books']}
          for manifest in sorted(Path('sources/original/bibles').glob('*/*/PROVENANCE.json')):
              p=json.loads(manifest.read_text())
              witness=p.get('additional_original_witness',{})
              if witness.get('format')!='USFX':continue
              require(p.get('provider')=='eBible.org','No reviewed provider member selector')
              b=manifest.parent/witness['filename']
              receipt=inspect_archive(b,source_kind='authored')
              require(receipt['archive_sha256']==witness['sha256'] and receipt['archive_bytes']==witness['size_bytes'],'Original pin mismatch')
              with zipfile.ZipFile(b) as z:
                  members=[m for m in z.infolist() if not m.is_dir() and Path(m.filename).name.casefold().endswith('_usfx.xml')]
                  require(len(members)==1,'Ambiguous Scripture member')
                  raw=z.read(members[0])
              require(not re.search(rb'<!DOCTYPE\b',raw,re.I),'Forbidden DTD')
              root=etree.fromstring(raw,etree.XMLParser(resolve_entities=False,load_dtd=False,no_network=True,recover=False))
              require(local(root)=='usfx' and not any(isinstance(x,etree._Entity) for x in root.iter()),'Invalid USFX root or entity')
              _,xml=approved_source_for(p['resource_id'])
              original,notes,outside,source_word_spans=source_verses(root,mapping)
              target,target_notes,meta=original_osis_verses_and_notes(xml)
              require(set(original)==set(target),'Numbered source and OSIS key mismatch')
              target_word_spans,word_keys=osis_numbered_words(_source_tree(xml))
              require(word_keys==set(target),'Independent OSIS word walker key mismatch')
              counts=Counter(); findings=defaultdict(list)
              # Reconcile only exact previously authorized source-bound repairs.
              # A reference match alone is not permission to ignore a text change.
              ledger_path=Path('sources/cleaned/bibles')/p['language']/p['resource_id']/'editorial'/'REVIEWED_REFERENCE_AND_INTRO_OVERLAY_2026-11-23.json'
              approved_repairs={}
              if ledger_path.is_file():
                  ledger=json.loads(ledger_path.read_text())
                  authorization=json.loads(Path('config/catalogue-import-lsg-1.0.0.json').read_text())
                  require(ledger['original_usfx_zip_sha256']==witness['sha256']==authorization['source_usfx_zip_sha256'],'Repair source binding mismatch')
                  require(authorization['editorial_approval']['approved_by']=='Bible Resources project owner','Missing owner authorization')
                  for edit in ledger['edits']:
                      if edit['type']!='cross_reference_fragment':continue
                      k=(edit['book']+'.'+edit['source_origin'],edit['source_note_caller'])
                      require(k not in approved_repairs,'Ambiguous reviewed note repair')
                      old_label,new_label=ns(edit['original_label']),ns(edit['new_label'])
                      require(old_label.count(ns(edit['old_fragment']))==1 and old_label.replace(ns(edit['old_fragment']),ns(edit['new_fragment']),1)==new_label,'Invalid exact repair ledger')
                      approved_repairs[k]=(old_label,new_label,edit['case_id'])
              matched_repairs=set()
              def check(kind,ok,ref):
                  counts[kind+'_compared']+=1
                  counts[kind+'_equal']+=bool(ok)
                  if not ok and len(findings[kind])<20: findings[kind].append(ref)
              for ref in original:
                  a,b=original[ref],target[ref]
                  check('verse_nonspace',ns(a)==ns(b),ref)
                  check('verse_folded_whitespace',' '.join(a.split())==' '.join(b.split()),ref)
                  sw,tw=source_word_spans[ref],target_word_spans[ref]
                  check('verse_word_span_count',len(sw)==len(tw),ref)
                  check('verse_ordered_word_spans',sw==tw and all(x[3] is not None for x in sw),ref)
                  for wi,(sl,tl) in enumerate(zip(sw,tw),1):
                      check('numbered_word_span_and_strong',sl==tl and sl[3] is not None,ref+'#'+str(wi))
                  x,y=notes[ref],target_notes[ref]
                  check('verse_note_count',len(x)==len(y),ref)
                  for i,(old,new) in enumerate(zip(x,y),1):
                      loc=ref+'#'+str(i)
                      check('note_body_nonspace',old[3]==ns(new['body']),loc)
                      repair_key=(ref,old[2])
                      repair=approved_repairs.get(repair_key)
                      if repair:
                          a_label,b_label,case_id=repair
                          require(old[3].count(a_label)==1 and old[3].replace(a_label,b_label,1)==ns(new['body']),'Reviewed repair does not explain exact entire note body')
                          require(new['caller']==old[2] and repair_key not in matched_repairs,'Ambiguous repair application')
                          matched_repairs.add(repair_key)
                      check('note_body_equal_or_exact_reviewed_repair',old[3]==ns(new['body']) or repair_key in matched_repairs,loc)
                      check('note_anchor_nonspace',old[0]==new['point'],loc)
                      check('note_caller',old[2]==new['caller'],loc)
                      if old[1]=='x': check('cross_reference_type',new['type']=='crossReference',loc)
                      else: counts['other_source_note_kind_unverified']+=1
              a,au,af=lexical(root,False); b,bu,bf=lexical(_source_tree(xml),True)
              for i,(left,right) in enumerate(zip(a,b),1):
                  check('global_word_nonspace',left[0]==right[0],i)
                  check('global_word_strong_association',left[0]==right[0] and left[1] is not None and right[1] is not None and left[1]==right[1],i)
              require(matched_repairs==set(approved_repairs),'Unaccounted authorized repair')
              report={'reviewed_note_repairs_verified':len(matched_repairs),'unexplained_note_body_differences':counts['note_body_equal_or_exact_reviewed_repair_compared']-counts['note_body_equal_or_exact_reviewed_repair_equal'],'repair_ledger_sha256':sha256(ledger_path.read_bytes()).hexdigest() if ledger_path.is_file() else None,'resource':p['resource_id'],'original_xml_sha256':sha256(raw).hexdigest(),'osis_sha256':sha256(xml).hexdigest(),'counts':dict(counts),'bounded_findings':dict(findings),'source_word_elements':len(a),'osis_word_elements':len(b),'source_word_attributes':dict(af),'osis_word_attributes':dict(bf),'source_unparsed_strong':dict(au),'osis_unparsed_strong':dict(bu),'source_notes_outside_verses':outside,'osis_notes_outside_verses':meta['publisher_notes_outside_numbered_verses'],'explicit_note_target_conversion_verified':False,'morphology_or_non_strong_lemma_parity_verified':False,'source_numbered_word_elements':sum(map(len,source_word_spans.values())),'osis_numbered_word_elements':sum(map(len,target_word_spans.values())),'global_word_order_not_per_verse_position_proof':True,'scope':'USFX original vs cleaned OSIS; not independent USFM prose or complete conversion certification'}
              print('ORIGINAL_USFX_CONTENT_DIAGNOSTIC',json.dumps(report,sort_keys=True),flush=True)
              # Audit the already published link representation; do not rewrite it.
              from normalize_bible_references import (_printed_book_aliases,
                  _complete_printed_destinations, _explicit_source_local_reference,
                  _origin_target, _one_child, _label)
              alias_path=Path('config')/(p['resource_id']+'-printed-book-aliases.json')
              if alias_path.is_file():
                  aliases,alias_sha=_printed_book_aliases(alias_path,mapping,witness['sha256'],root)
                  target_root=_source_tree(xml)
                  target_books={n.get('osisID'):n for n in target_root.iter(OSIS+'div') if n.get('type')=='book'}
                  verse_ids=set(target)
                  link_counts=Counter(); link_findings=defaultdict(list)
                  def link_check(kind,ok,ref):
                      link_counts[kind+'_compared']+=1
                      link_counts[kind+'_equal']+=bool(ok)
                      if not ok and len(link_findings[kind])<30: link_findings[kind].append(ref)
                  for book in root.iter('book'):
                      bid=mapping[book.get('id')]
                      src_notes=list(book.iter('x'))
                      dst_notes=[n for n in target_books[bid].iter(OSIS+'note') if n.get('type')=='crossReference']
                      require(len(src_notes)==len(dst_notes),'Cross-reference note count differs')
                      for old,new in zip(src_notes,dst_notes,strict=True):
                          xo,xt=_one_child(old,'xo'),_one_child(old,'xt')
                          origin=_label(xo); ref=_origin_target(origin,bid,verse_ids)
                          label=_label(xt)
                          repair=approved_repairs.get((ref,old.get('caller')))
                          if repair:
                              # The prior whole-note proof covers the repair.
                              edits=[e for e in ledger['edits'] if e.get('case_id')==repair[2]]
                              require(len(edits)==1 and ns(label)==repair[0],'Source destination repair mismatch')
                              label=' '.join(edits[0]['new_label'].split())
                          origins=[n for n in new if n.tag==OSIS+'reference' and n.get('type')=='annotateRef' and n.get('subType')=='x-origin']
                          destinations=[n for n in new if n.tag==OSIS+'reference' and n.get('type') is None and n.get('subType') is None]
                          link_check('origin_text_and_target',len(origins)==1 and _label(origins[0])==origin and origins[0].get('osisRef')==ref,ref)
                          link_check('caller',old.get('caller')==new.get('n'),ref)
                          link_check('destination_visible_symbols',ns(label)==ns(''.join(''.join(n.itertext())+(n.tail or '') for n in destinations)),ref)
                          expected,reason,_=_complete_printed_destinations(label,aliases,verse_ids,disambiguated_chapter_commas=True,named_single_chapter_refs=True)
                          if expected is None and reason=='compound_or_implicit_reference':
                              expected,reason=_explicit_source_local_reference(label,aliases,origin,bid,verse_ids)
                          actual=[token for n in destinations for token in (n.get('osisRef') or '').split()]
                          if xt.get('link-ref'):
                              link_counts['original_explicit_machine_targets']+=1
                              # Explicit source target literals need a separate format mapping.
                          if expected is not None:
                              link_counts['fully_parsed_notes']+=1
                              link_counts['expected_target_tokens']+=len(expected.split())
                              link_check('fully_parsed_ordered_targets',actual==expected.split(),ref)
                          else:
                              link_counts['unresolved_by_full_label_parser']+=1
                              if actual:
                                  link_counts['unresolved_but_linked']+=1
                                  if len(link_findings['unresolved_but_linked'])<30:link_findings['unresolved_but_linked'].append(ref)
                              else:link_counts['unresolved_and_unlinked']+=1
                          link_counts['actual_linked_notes']+=bool(actual)
                          link_counts['actual_target_tokens']+=len(actual)
                  print('ORIGINAL_USFX_REFERENCE_DIAGNOSTIC',json.dumps({'resource':p['resource_id'],'counts':dict(link_counts),'bounded_findings':dict(link_findings),'alias_sha256':alias_sha,'scope':'replay of reviewed full-label citation grammar against actual linked OSIS; separate explicit source machine targets and partial grammar review'},sort_keys=True),flush=True)
              if p['format']=='USFM':
                  fm_path=manifest.parent/p['original_file']
                  fm_receipt=inspect_archive(fm_path,source_kind='authored')
                  require(fm_receipt['archive_sha256']==p['original_sha256'] and fm_receipt['archive_bytes']==p['original_size_bytes'],'USFM archive pin mismatch')
                  with zipfile.ZipFile(fm_path) as archive:
                      fm_text,fm_words,fm_notes=usfm_numbered_content(archive,mapping)
                  require(set(fm_text)==set(original),'USFM and USFX verse keys differ')
                  fm_counts=Counter(); fm_findings=defaultdict(list)
                  def fm_check(kind,ok,ref):
                      fm_counts[kind+'_compared']+=1
                      fm_counts[kind+'_equal']+=bool(ok)
                      if not ok and len(fm_findings[kind])<30:fm_findings[kind].append(ref)
                  for ref in original:
                      fm_check('verse_nonspace',ns(fm_text[ref])==ns(original[ref]),ref)
                      fm_check('verse_folded_whitespace',' '.join(fm_text[ref].split())==' '.join(original[ref].split()),ref)
                      fm_check('note_rows',fm_notes[ref]==notes[ref],ref)
                      fm_check('word_span_and_strong_rows',fm_words[ref]==source_word_spans[ref] and all(x[3] is not None for x in fm_words[ref]),ref)
