name: One-shot commentary evidence helper inventory refresh
on:
  pull_request:
    paths:
      - .github/workflows/maintenance-commentary-evidence-registry.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/commentary-evidence-libraries-20261122
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove one-time workflow and regenerate exact static caller inventory
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintenance-commentary-evidence-registry.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync inventory after packaging five commentary evidence helpers'
          git push origin HEAD:maintenance/commentary-evidence-libraries-20261122
