name: Stage attested HMCC Modern public-release candidate
on:
  push:
    branches: [feature/mhcc-modern-english]
    paths:
      - '.github/workflows/stage-hmcc-modern-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  stage:
    if: github.repository == 'icfmp/Bible-Resources' && github.ref == 'refs/heads/feature/mhcc-modern-english'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/mhcc-modern-english
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact project validation dependencies and native reader
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y diatheke
      - name: Retrieve already-passed owner QA SWORD artifact
        uses: actions/download-artifact@v4
        with:
          name: hmcc-modern-owner-manual-qa
          run-id: 44695710957
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hmcc-modern-reviewed-qa
      - name: Stage the exact reviewed compiled binary and build immutable catalogue/release plan
        run: |
          set -euo pipefail
          python scripts/stage_hmcc_modern_release.py --qa-dir "${RUNNER_TEMP}/hmcc-modern-reviewed-qa"
          python scripts/tool_registry.py --write
      - name: Independent final prepublication source and archive gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/validate.py
          python -m unittest discover -s tests
          python scripts/build.py --output "${RUNNER_TEMP}/hmcc-modern-approved-public-build"
          python scripts/smoke.py --help >/dev/null || true
          python scripts/catalogue_release_coverage.py --built "${RUNNER_TEMP}/hmcc-modern-approved-public-build"
          python scripts/publish_reviewed_release.py \
            --built "${RUNNER_TEMP}/hmcc-modern-approved-public-build" \
            --repository "${GITHUB_REPOSITORY}" \
            --target-sha "${GITHUB_SHA}" \
            --verify-only
          python scripts/tool_registry.py --check
      - name: Commit only validated release payload, approved metadata and exact release proofs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            modules/hmcc-modern/ \
            config/commentary-rebuilds/hmcc-modern.json \
            config/release-plans/hmcc-modern-0.1.0.json \
            docs/releases/HMCC-Modern-0.1.0.md \
            docs/TOOL_REGISTRY.json docs/TOOL_REGISTRY.md \
            catalog/v1/catalog.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No new reviewed release files'; exit 1; }
          git commit -m "release: stage verified HMCC Modern 0.1.0 for source-gated publication"
          git push origin HEAD:refs/heads/feature/mhcc-modern-english
      - name: Owner review notes
        run: |
          echo "Validated release candidate committed to draft PR #272."
          echo "No GitHub Release or Pages publication was performed by this staging workflow."
          echo "Manual Xiphos note-marker navigation remains owner follow-up."
