name: Verify official SWORD Segond versification keys
on:
  pull_request:
    paths:
      - '.github/workflows/lsg-v11n-probe.yml'
      - 'scripts/probe_lsg_v11n.py'
      - 'tests/test_lsg_v11n_probe.py'
      - 'config/lsg-v11n-probes.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python source-parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Install SWORD's official compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsword-utils >/dev/null
          command -v osis2mod
      - name: Fetch publisher's source references to temporary storage
        run: |
          mkdir -p "${{ runner.temp }}/source"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from pilot_fetch import fetch
          url='https://ebible.org/Scriptures/fraLSG_usfx.zip'
          print(fetch(url,Path('${{ runner.temp }}/source/usfx.zip'),'lsg'))
          PY
      - name: Compile synthetic reference cases against NRSV and Segond
        run: |
          python scripts/probe_lsg_v11n.py \
            --usfx-zip "${{ runner.temp }}/source/usfx.zip" \
            --report reports/lsg-v11n-test.json
      - name: Upload only source-key diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsg-segond-versification-reference-audit
          path: reports/lsg-v11n-test.json
          if-no-files-found: warn
          retention-days: 30
      - name: Explain what this does NOT prove
        if: always()
        run: |
          echo '## NRSV vs official Segond versification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Uses only source-verified verse IDs and synthetic placeholder words.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No original Bible text was compiled, changed, distributed or published.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A corrected binary requires a separate authorized real-source import and full data fidelity checks.' >> "$GITHUB_STEP_SUMMARY"
