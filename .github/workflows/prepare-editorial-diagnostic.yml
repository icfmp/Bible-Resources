name: Prepare editorial diagnostic review branch
on:
  push:
    branches: [audit/osis-editorial-inline-parity]
    paths: ['.github/workflows/prepare-editorial-diagnostic.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: |
          python -m unittest discover -s tests -p test_source_native_osis_boundary_positions.py -v
          git rm .github/workflows/prepare-editorial-diagnostic.yml
          python scripts/tool_registry.py --write
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          python scripts/tool_registry.py --check
          python -m unittest discover -s tests -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh tool registry after editorial span audit'
          git push origin HEAD:refs/heads/audit/osis-editorial-inline-parity
