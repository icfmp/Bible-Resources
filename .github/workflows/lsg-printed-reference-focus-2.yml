name: LSG 1910 second printed reference selection (temporary visual evidence)
on:
  pull_request:
    paths:
      - .github/workflows/lsg-printed-reference-focus-2.yml
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install DjVu and PIL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install -q Pillow
      - name: Pin source and extract target print image margins
        run: |
          mkdir -p /tmp/lsg1910-focus
          curl -fLsS --retry 3 'https://upload.wikimedia.org/wikipedia/commons/1/17/La_Sainte_Bible%2C_trad._Segond%2C_ed._1910.djvu' -o /tmp/lsg1910-focus/source.djvu
          echo '67854882ec0e88defa5fea2d76a53ef479d2173467cdfa9b57f94a91c470643b  /tmp/lsg1910-focus/source.djvu' | sha256sum -c
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageEnhance,ImageOps
          from io import BytesIO
          import subprocess,base64
          folder=Path('/tmp/lsg1910-focus')
          # Distinct representative cases: both digital witnesses equal yet impossible,
          # digital conflict, suspicious historic typography. No editorial correction.
          cases={'017':572,'020':619,'021':627,'023':663,'025':791,'033':846,
                 '038':884,'039':899,'043':972,'045':989,'046':1001,'049':1017,'051':1022}
          for id,page in cases.items():
              tiff=folder/f'raw-{page}.tif'
              subprocess.run(['ddjvu','-page='+str(page),'-format=tiff',str(folder/'source.djvu'),str(tiff)],check=True)
              image=Image.open(tiff).convert('RGB')
              w,h=image.size
              # Wider than marginal typography to include note-callout and verse text alignment.
              x1,x2=int(w*.35),int(w*.61)
              region=image.crop((x1,int(h*.07),x2,int(h*.92)))
              region=ImageOps.grayscale(region)
              region=ImageEnhance.Contrast(region).enhance(1.6)
              region=region.resize((region.width*3,region.height*3),Image.Resampling.NEAREST)
              output=folder/f'1910-page{page}-case{id}-margin.png'
              region.save(output,format='PNG',optimize=True)
              content=output.read_bytes()
              print(f'LSG_PRINT_REF_FOCUS_{id}_BEGIN')
              print(base64.b64encode(content).decode('ascii'))
              print(f'LSG_PRINT_REF_FOCUS_{id}_END')
              tiff.unlink()
          (folder/'source.djvu').unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsg-1910-additional-13-marginal-callout-images
          path: /tmp/lsg1910-focus/*margin.png
          retention-days: 7
