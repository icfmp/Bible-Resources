name: Review exact private zCom MHCC candidate in real Xiphos (no release)

on:
  pull_request:
    paths:
      - '.github/workflows/commentary-private-candidate-xiphos-gui.yml'
      - 'scripts/commentary_private_candidate_xiphos_gui.py'
      - 'scripts/commentary_stock_candidate.py'
      - 'scripts/commentary_xiphos_dual_reader.py'
      - 'scripts/commentary_xiphos_heading_probe.py'
      - 'tests/test_commentary_xiphos_heading_probe.py'
      - 'scripts/sword_commentary_raw_key.cpp'
      - 'scripts/sword_native_commentary_raw_corpus.cpp'
      - 'tests/test_commentary_private_candidate_xiphos_gui.py'
      - 'modules/lsg-1910/payload/**'
      - 'config/catalogue-import-lsg-0.1.0.json'
      - 'config/commentary-intake/**'
  workflow_dispatch:
    inputs:
      resource_id:
        description: Original, byte-attested commentary research manifest
        type: string
        required: true
        default: mhcc-crosswire

permissions:
  contents: read
concurrency:
  group: private-candidate-xiphos-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private-candidate-and-bible-in-xiphos:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      RESOURCE_ID: ${{ github.event.inputs.resource_id || 'mhcc-crosswire' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python requirements and test strict review boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_commentary_private_candidate_xiphos_gui.py' -v
          python -m unittest discover -s tests -p 'test_commentary_xiphos_heading_probe.py' -v
          python -m unittest discover -s tests -p 'test_commentary_stock_candidate.py' -v
          python -m unittest discover -s tests -p 'test_commentary_xiphos_dual_reader.py' -v
      - name: Install real libSWORD, diatheke, Xiphos and isolated GUI tools
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update -qq
          timeout 180s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y \
            libsword-dev diatheke xiphos xvfb xdotool xclip dbus-x11
          command -v diatheke
          command -v xiphos
      - name: Build independent full native corpus and exact original key readback tools
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "$RUNNER_TEMP/private-native-stock-corpus" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_commentary_raw_key.cpp \
            -o "$RUNNER_TEMP/private-native-stock-key" -lsword
      - name: Prove full byte-preserving candidate then read five original passages in actual Xiphos
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_private_candidate_xiphos_gui.py \
            --resource-id "$RESOURCE_ID" \
            --native-full-corpus-binary "$RUNNER_TEMP/private-native-stock-corpus" \
            --native-single-key-binary "$RUNNER_TEMP/private-native-stock-key" \
            --seconds 12 \
            --report "$RUNNER_TEMP/private-candidate-xiphos-metadata.json"
      - name: Enforce candidate, original corpus, full private GUI and no-publication gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from sys import path
          path.insert(0,"scripts")
          from commentary_private_candidate_xiphos_gui import _gate_real_candidate_gui
          proof=json.loads((Path(os.environ["RUNNER_TEMP"])/"private-candidate-xiphos-metadata.json").read_text())
          manifest=json.loads((Path("config/commentary-intake")/(os.environ["RESOURCE_ID"]+".json")).read_text())
          assert proof["schema_version"]==1
          assert proof["resource_id"]==manifest["resource_id"]=="mhcc-crosswire"
          assert proof["upstream_sword_original_archive_sha256"]==manifest["archive_sha256"]
          assert proof["upstream_sword_original_conf_sha256"]==manifest["stock_conf_sha256"]
          assert proof["upstream_sword_original_module_id"]=="MHCC"
          assert proof["private_candidate_module_id"]=="BRMHCCReview"
          assert proof["full_native_unfiltered_raw_corpus_sha256"]==manifest["native_raw_corpus_sha256"]
          assert proof["total_native_keys"]==29975
          assert (proof["numbered_commentary_K_keys"],proof["intro_I_keys"],proof["opaque_TOP_keys"])==(28718,1255,2)
          assert proof["complete_stock_and_candidate_native_raw_corpus_sha256_equal"] is True
          assert proof["all_occupied_native_K_I_TOP_keys_and_order_identical"] is True
          assert proof["all_original_SWORD_compressed_files_byte_preserved"] is True
          assert proof["original_metadata_only_module_identity_and_data_path_changed"] is True
          assert proof["private_candidate_archive_destroyed_without_upload"] is True
          assert proof["no_unredacted_authorial_text_or_real_reference_names_in_report"] is True
          assert proof["CCEL_source_to_CrossWire_digital_edition_equivalence_proven"] is False
          assert proof["digital_transcription_rights_separately_approved"] is False
          assert proof["editorial_acceptance"] is False
          assert proof["published"] is False
          receipt=proof["independent_private_candidate_gui_receipt"]
          _gate_real_candidate_gui(receipt)
          intro=receipt["pinned_original_source_intro_keys_and_word_counts"]
          assert intro["source_full_native_raw_corpus_sha256_reconfirmed"] is True
          assert intro["source_native_I_entries_scanned"] == proof["intro_I_keys"]
          assert intro["source_native_I_entries_with_authored_word_tokens"] >= 0
          assert intro["source_native_I_entries_without_word_tokens"] >= 0
          assert intro["source_native_I_entries_unparseable_strict_XML"] >= 0
          assert (intro["source_native_I_entries_scanned"] ==
                  intro["source_native_I_entries_with_authored_word_tokens"] +
                  intro["source_native_I_entries_without_word_tokens"] +
                  intro["source_native_I_entries_unparseable_strict_XML"])
          assert intro["source_native_I_raw_byte_count"] > 0
          assert intro["no_original_intro_or_full_words_exported"] is True
          assert intro["unparseable_or_nonverifiable_intro_is_not_missing_commentary"] is True
          print("Original pinned full native I-key inventory (no title text): " +
                json.dumps({k:v for k,v in intro.items() if k not in {
                    "selected_Gen_native_I_word_token_counts"}}, sort_keys=True))
          heading=receipt["real_Xiphos_commentary_book_chapter_heading_context_menu"]
          assert heading["intro_data_or_clipboard_exported"] is False
          assert heading["no_heading_missing_from_source_inferred"] is True
          assert type(heading["heading_GUI_presentation_verified"]) is bool
          assert type(heading["original_intro_in_normal_chapter_GUI_verified"]) is bool
          assert set(heading["book_and_chapter_menu_observations"]) == {"book", "chapter"}
          allowed_normal = {
              "not_attempted", "no_authenticated_original_intro_key_for_this_scope",
              "commentary_pane_geometry_unavailable",
              "original_intro_prose_copied_from_normal_chapter_GUI",
              "normal_chapter_GUI_intro_not_proven",
              "real_GUI_normal_chapter_clipboard_unavailable",
          }
          assert all(
              row["normal_chapter_GUI_observation_class"] in allowed_normal
              for row in heading["book_and_chapter_menu_observations"].values()
          )
          assert heading["original_intro_in_normal_chapter_GUI_verified"] == any(
              row["normal_chapter_GUI_observation_class"]
              == "original_intro_prose_copied_from_normal_chapter_GUI"
              for row in heading["book_and_chapter_menu_observations"].values()
          )
          allowed = {
              "not_attempted", "no_authenticated_original_intro_key_for_this_scope",
              "commentary_pane_geometry_unavailable",
              "original_intro_prose_copied_from_real_GUI",
              "menu_action_attempted_but_intro_not_proven_in_clipboard",
              "real_GUI_menu_or_clipboard_action_unavailable",
          }
          assert all(
              r["GUI_menu_observation_class"] in allowed
              and type(r["original_intro_sha256_attested"]) is bool
              for r in heading["book_and_chapter_menu_observations"].values()
          )
          print("Xiphos original book/chapter intro: normal chapter rendering independently checked before context menu: " +
                json.dumps(heading["book_and_chapter_menu_observations"], sort_keys=True))
          print("Real normal chapter intro source words positively copied: " +
                str(heading["original_intro_in_normal_chapter_GUI_verified"]))
          assert receipt["status"]=="byte_exact_private_candidate_real_Xiphos_GUI_observation"
          assert receipt["authentic_original_reference_bearing_keys_count"]>=2
          assert receipt["original_words_links_screenshots_or_SWORD_archives_uploaded"] is False
          assert len(receipt["actual_substantive_sample_references"])==5
          assert all(type(v) is bool and v for v in receipt["commentary_clipboard_match_by_passage"].values())
          assert len(receipt["real_markup_rendering_observation_by_passage"])==5
          assert all(row["xiphos_link_click_target_and_navigation_verified"] is False
                     for row in receipt["real_markup_rendering_observation_by_passage"].values())
          assert len(json.dumps(proof))<40000
          print("Private BRMHCCReview + approved LSG: exact original/candidate 29975-entry parity, five real GUI readbacks and two original href targets; NO public release")
          PY
      - name: Upload only bounded private verification metadata, never a module or screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary-private-candidate-xiphos-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/private-candidate-xiphos-metadata.json
          retention-days: 14
          if-no-files-found: warn
      - name: Record strict scope of this disposable reader
        if: always()
        shell: bash
        run: |
          {
            echo 'Actual stock MHCC and temporary BRMHCCReview have identical 29,975 occupied native entries and byte-identical compressed payload.'
            echo 'Our published LSG Bible was SHA-attested and installed next to BRMHCCReview for real Xiphos commentary-pane GUI tests.'
            echo 'Five real original commentary prose selections and two genuine original OSIS link destinations are strictly required to pass.'
            echo 'No source prose, SWORD original/candidate ZIP, screenshots or UI HTML are uploaded.'
            echo 'This does NOT approve all headings, actual mouse click navigation, copyright/edition equivalence, editorial acceptance or publication.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Modern independent reader lane. Ubuntu 24.04's packaged Xiphos 4.2.1
  # predates the March 2026 upstream commentary-introduction fix (#1091).
  # Fedora 45 ships reviewed upstream Xiphos 4.5.0 without source builds.
  # This runs the SAME private stock/candidate/text checks, not a new probe.
  private-candidate-in-current-xiphos:
    runs-on: ubuntu-24.04
    container:
      image: fedora:45
    timeout-minutes: 30
    env:
      RESOURCE_ID: ${{ github.event.inputs.resource_id || 'mhcc-crosswire' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution Xiphos 4.5 and native SWORD test dependencies
        shell: bash
        run: |
          set -euo pipefail
          timeout 420s dnf -y --setopt=install_weak_deps=False install \
            xiphos sword-devel sword-utils gcc-c++ python3 python3-lxml \
            python3-jsonschema xorg-x11-server-Xvfb xdotool xclip \
            dbus-daemon shadow-utils util-linux
          for name in Xvfb xiphos diatheke xdotool xclip dbus-run-session g++ runuser; do
            command -v "$name"
          done
          actual="$(rpm -q --qf '%{VERSION}' xiphos)"
          test "$actual" = '4.5.0' || {
            echo "This separate lane requires the reviewed Fedora 45 Xiphos 4.5.0"; exit 1;
          }
          python3 -c 'from lxml import etree; import jsonschema'
          useradd --create-home --shell /bin/bash mhccci
          install -d -m 0700 -o mhccci -g mhccci /tmp/mhcc-current-xiphos
      - name: Compile same independent unfiltered original SWORD readers
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o /tmp/mhcc-current-xiphos/native-full -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_commentary_raw_key.cpp \
            -o /tmp/mhcc-current-xiphos/native-key -lsword
      - name: Check unchanged source and actual five-prose/two-href Xiphos 4.5 GUI
        shell: bash
        run: |
          set -euo pipefail
          runuser -u mhccci -- python3 \
            scripts/commentary_private_candidate_xiphos_gui.py \
            --resource-id "$RESOURCE_ID" \
            --native-full-corpus-binary /tmp/mhcc-current-xiphos/native-full \
            --native-single-key-binary /tmp/mhcc-current-xiphos/native-key \
            --seconds 12 \
            --report /tmp/mhcc-current-xiphos/receipt.json
      - name: Verify modern-reader positive evidence but not untested navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/mhcc-current-xiphos/receipt.json").read_text())
          proof = d["independent_private_candidate_gui_receipt"]
          assert d["total_native_keys"] == 29975
          assert d["all_original_SWORD_compressed_files_byte_preserved"] is True
          assert d["complete_stock_and_candidate_native_raw_corpus_sha256_equal"] is True
          assert proof["independent_gui_commentary_excerpt_match_count"] == 5
          assert proof["original_source_corpus_hash_reconfirmed"] is True
          assert proof["published"] is False and d["published"] is False
          assert proof["xiphos_reference_mouse_click_navigation_verified"] is False
          intro = proof["real_Xiphos_commentary_book_chapter_heading_context_menu"]
          print("Current Xiphos 4.5.0 genuine prose samples: 5; "
                "source hyperlink destinations: 2; normal chapter intro positive: "
                + str(intro["original_intro_in_normal_chapter_GUI_verified"])
                + "; no link click or release approval implied")
          PY
      - name: Retain metadata only for modern Xiphos comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary-private-xiphos-fedora45-metadata-${{ github.run_id }}
          path: /tmp/mhcc-current-xiphos/receipt.json
          retention-days: 14
          if-no-files-found: warn
