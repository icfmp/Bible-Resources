name: LSG stable Segond SWORD candidate (no publication)
on:
  pull_request:
    paths:
      - '.github/workflows/lsg-stable-segond.yml'
      - 'scripts/lsg_stable_source_trial.py'
      - 'scripts/reviewed_reference_merges.py'
      - 'scripts/lsg_stock_raw_markup.py'\n      - 'scripts/sword_raw_markup_logical_lines.cpp'
      - 'tests/test_lsg_stock_raw_markup.py'
      - 'tests/test_reviewed_reference_merges.py'
      - 'config/lsg-reviewed-verse-merges.json'
      - 'tests/test_lsg_stable_source_trial.py'
      - 'scripts/lsg_rebuild_trial.py'
      - 'scripts/patch_u2o_intro.py'
      - 'tests/test_lsg_rebuild_trial.py'
      - 'scripts/lsg_osis_parity.py'
      - 'scripts/lsg_model_validation.py'
      - 'tests/test_lsg_model_validation.py'
      - 'scripts/lsg_note_parity.py'
      - 'scripts/lsg_note_space_dryrun.py'
      - 'scripts/lsg_speech_space_dryrun.py'
      - 'tests/test_lsg_speech_space_dryrun.py'
      - 'tests/test_lsg_note_space_dryrun.py'
      - 'scripts/lsg_poetry_parity.py'
      - 'tests/test_lsg_poetry_parity.py'
      - 'scripts/lsg_poetry_segments.py'
      - 'tests/test_lsg_poetry_segments.py'
      - 'tests/test_lsg_note_parity.py'
      - 'scripts/lsg_sword_rebuild.py'
      - 'scripts/lsg_v11n_coverage.py'
      - 'scripts/lsg_source_v11n_delta.py'
      - 'scripts/lsg_ephemeral_osis_candidate.py'
      - 'scripts/lsg_dynamic_sword_trial.py'
      - 'scripts/sword_raw_markup_counts.cpp'
      - 'tests/test_lsg_source_v11n_delta.py'
      - 'tests/test_lsg_ephemeral_osis_candidate.py'
      - 'scripts/sword_v11n_ceilings.cpp'
      - 'tests/test_lsg_v11n_coverage.py'
      - 'tests/test_lsg_osis_parity.py'
      - 'tests/test_lsg_sword_rebuild.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted XML and schema parsers
        run: python -m pip install -r requirements.txt
      - name: Pin upstream USFM converter to immutable reviewed commit
        run: |
          git clone --quiet https://github.com/adyeths/u2o.git "${{ runner.temp }}/u2o"
          git -C "${{ runner.temp }}/u2o" checkout -q --detach dde28bc545e8d8697fa5496c243187847ec55d31
          test "$(git -C "${{ runner.temp }}/u2o" rev-parse HEAD)" = dde28bc545e8d8697fa5496c243187847ec55d31
      - name: Apply reviewed generic intro-table fix to pinned converter COPY
        run: |
          python scripts/patch_u2o_intro.py \
            --original "${{ runner.temp }}/u2o/u2o.py" \
            --output "${{ runner.temp }}/u2o-reviewed/u2o.py"
      - name: Fetch matching publisher USFM and USFX original sources to temporary storage
        run: |
          mkdir -p "${{ runner.temp }}/original"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from pilot_fetch import fetch
          root=Path("${{ runner.temp }}/original")
          for item,url in [
              ("usfm","https://ebible.org/Scriptures/fraLSG_usfm.zip"),
              ("usfx","https://ebible.org/Scriptures/fraLSG_usfx.zip"),
          ]:
              info=fetch(url,root/(item+".zip"),"lsg")
              print("original",item,info["bytes"],info["sha256"])
          PY
      - name: Verify exact reviewed eBible pilot source archive revisions
        run: |
          echo '64c4fe2a84d92f958deb0d1add4247d126a21c8a51e5b3058338f661a42d4900  ${{ runner.temp }}/original/usfm.zip' | sha256sum --check --status
          echo 'fe059525d3167c70c22777e6cb6d578eb1e63095904f61fed0a857c4f643ac0e  ${{ runner.temp }}/original/usfx.zip' | sha256sum --check --status
      - name: Fetch and locally verify pinned official CrossWire/W3C XSD pair
        run: python scripts/fetch_reviewed_schema.py --directory "${{ runner.temp }}/reviewed-osis"
      - name: Install official SWORD compiler and isolated reader for diagnostic only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsword-utils diatheke libsword-dev >/dev/null
          command -v osis2mod
          command -v diatheke
      - name: Run synthetic stable SWORD reference/reader regression tests
        run: |
          python -m unittest discover -s tests -p 'test_lsg_stable_source_trial.py' -v
          python -m unittest discover -s tests -p 'test_reviewed_reference_merges.py' -v
          python -m unittest discover -s tests -p 'test_lsg_stock_raw_markup.py' -v
      - name: Build raw SWORD C++ per-entry structure inspector against installed stable libsword
        run: |
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_raw_markup_logical_lines.cpp -o "${{ runner.temp }}/sword-raw-audit" -lsword
          test -x "${{ runner.temp }}/sword-raw-audit"
      - name: Compile real source-attested OSIS via stable SWORD and classify every chapter
        env:
          LSG_SAMPLE_DEBUG: '0'
          LSG_STOCK_RAW_INSPECTOR: ${{ runner.temp }}/sword-raw-audit
        run: |
          python scripts/lsg_stable_source_trial.py \
            --usfm-zip "${{ runner.temp }}/original/usfm.zip" \
            --usfx-zip "${{ runner.temp }}/original/usfx.zip" \
            --converter "${{ runner.temp }}/u2o-reviewed/u2o.py" \
            --schema "${{ runner.temp }}/reviewed-osis/osisCore.2.1.1-cw-latest.xsd" \
            --report reports/lsg-stable-segond.json
      - name: Upload ONLY text-free metadata, never source OSIS or SWORD binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsg-stock-sword-segond-report
          path: reports/lsg-stable-segond.json
          retention-days: 14
          if-no-files-found: warn
      - name: Explain limitation and approval boundary
        if: always()
        run: |
          echo '## Real LSG via stock SWORD Segond' >> "$GITHUB_STEP_SUMMARY"
          echo 'Uses released osis2mod -v Segond and diatheke, not SWORD HEAD or custom XML v11n.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original publisher source, temporary OSIS and binary are not published or uploaded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Project owner explicitly authorized one source-bound, verified Mark 10:52–53 index merge. Full markup and final release gates remain outstanding.' >> "$GITHUB_STEP_SUMMARY"
