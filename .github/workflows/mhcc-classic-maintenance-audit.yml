name: MHCC classic BRNP normalization trial
on:
  pull_request:
    paths:
      - '.github/workflows/mhcc-classic-maintenance-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed dependencies and native SWORD
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_brnp.py -v
          python scripts/fetch_reviewed_schema.py --directory "$RUNNER_TEMP/reviewed-osis"
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 update -qq
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y libsword-dev libsword-utils diatheke
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_index.cpp -o "$RUNNER_TEMP/mhcc-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_raw_corpus.cpp -o "$RUNNER_TEMP/mhcc-raw" -lsword
      - name: Reversible structural normalization, independent BRNP and full native comparison
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,io,json,os,re,subprocess,zipfile
          from collections import Counter,defaultdict
          from pathlib import Path
          from xml.parsers import expat
          from lxml import etree
          from check_brnp import check
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          from commentary_native_raw_inventory import private_crosscheck
          tmp=Path(os.environ["RUNNER_TEMP"])
          bundle=tmp/"mhcc-brnp-candidate"
          bundle.mkdir()
          sha=lambda data:hashlib.sha256(data).hexdigest()
          ns="{http://www.bibletechnologies.net/2003/OSIS/namespace}"
          parser=lambda:etree.XMLParser(resolve_entities=False,no_network=True,load_dtd=False)
          source=Path("sources/cleaned/commentaries/en/mhcc-crosswire/mhcc.osis.xml").read_bytes()
          assert sha(source)=="6aca55c36789f6f7d081b7cba2a167a8006cad9447ae8b50d619ad0de32dfb39"
          broken=b"hard livelihood out comfort us."
          restored=b'hard livelihood out of it. Lamech hoped for relief by the birth of this son, "This same shall comfort us.'
          assert source.count(broken)==1
          base=source.replace(broken,restored,1)
          assert sha(base)=="690184e2cdac0e6160bddb256149f2111d51b946caf29622e3b7f2ea358835e0"
          # Generic trial of empty redundant book milestones and missing chapter
          # closures in explicit, matching logical containers. Never remove content.
          def normalize(data):
              root=etree.fromstring(data,parser())
              items=list(root.iter())
              assert all(isinstance(n.tag,str) for n in items)
              p=expat.ParserCreate(namespace_separator="}")
              spans=[];stack=[];text_events=[]
              start_tag=re.compile(rb'<(?:[^>"\x27]|"[^"]*"|\x27[^\x27]*\x27)*>')
              def start(name,attrs):
                  pos=p.CurrentByteIndex
                  # Locate the complete start tag while respecting quoted attributes.
                  m=start_tag.match(data,pos)
                  assert m
                  end=m.end()
                  idx=len(spans)
                  spans.append([pos,end,None,None,m.group().endswith(b"/>")])
                  stack.append(idx)
              def end(name):
                  idx=stack.pop(); rec=spans[idx]
                  rec[2]=p.CurrentByteIndex
                  rec[3]=p.CurrentByteIndex if rec[4] else data.index(b">",p.CurrentByteIndex)+1
              p.StartElementHandler=start;p.EndElementHandler=end
              p.CharacterDataHandler=lambda text:text_events.append((p.CurrentByteIndex,bool(text.strip()),len(text)))
              p.Parse(data,True)
              assert len(items)==len(spans) and not stack
              mapping={node:span for node,span in zip(items,spans)}
              from bisect import bisect_left
              offsets=[sp[0] for sp in spans]
              event_offsets=[event[0] for event in text_events]
              assert offsets==sorted(offsets) and event_offsets==sorted(event_offsets)
              patches=[]; removed=[]; closures=[]; gaps=[]
              books=[n for n in items if n.tag==ns+"div" and n.get("type")=="book" and not(n.get("sID") or n.get("eID"))]
              ids=[n.get("osisID") for n in books]
              assert all(ids) and len(ids)==len(set(ids))
              for book in books:
                  book_id=book.get("osisID")
                  marks=[n for n in book.iterdescendants(ns+"div") if n.get("type")=="book" and (n.get("sID") or n.get("eID"))]
                  if not marks:continue
                  # Each start/end pair has the same identity and canonical flag.
                  # Require the duplicate role to be represented by the enclosing book.
                  starts=[];ends=[];active=[]
                  for n in marks:
                      a=dict(n.attrib);sid=n.get("sID");eid=n.get("eID")
                      assert bool(sid)!=bool(eid) and n.get("osisID")==book_id
                      assert set(a)<= {"type","osisID","sID","eID","canonical"}
                      assert n.get("canonical") in (None,"true") and len(n)==0 and not n.text
                      assert next(x for x in n.iterancestors(ns+"div") if x.get("type")=="book" and not(x.get("sID") or x.get("eID")))==book
                      role=(sid or eid,n.get("canonical"))
                      if sid:active.append(role);starts.append(role)
                      else:
                          assert active and active.pop()==role
                          ends.append(role)
                      st,en,_,_,empty=mapping[n]
                      assert empty
                      patches.append((st,en,b"",data[st:en]))
                      removed.append({"book":book_id,"role":"start" if sid else "end","attributes":a})
                  assert not active and Counter(starts)==Counter(ends)
                  # The paired duplicate flag variants must span the same content.
                  assert len(starts)==2 and {x[1] for x in starts}=={None,"true"}, (book_id,starts)
                  # No authored text/section starts between duplicate starts or ends.
                  a,b,c,d=marks
                  for left,right in ((a,b),(c,d)):
                      lo=mapping[left][1];hi=mapping[right][0]
                      between=items[bisect_left(offsets,lo):bisect_left(offsets,hi)]
                      visible=sum(length for pos,nonempty,length in text_events[bisect_left(event_offsets,lo):bisect_left(event_offsets,hi)] if nonempty)
                      gaps.append({"book":book_id,"nonwhitespace_characters":visible,"intervening_tags":dict(Counter(etree.QName(n).localname+":"+str(n.get("type","")) for n in between))})
              print("BOOK_PAIR_GAPS",json.dumps({"distinct_gap_shapes":list({json.dumps({k:v for k,v in g.items() if k!="book"},sort_keys=True) for g in gaps}),"nonempty_gaps":[g for g in gaps if g["nonwhitespace_characters"]][:10]},sort_keys=True),flush=True)
              assert all(not g["nonwhitespace_characters"] and all(tag.startswith("milestone:") or tag in {"div:bookGroup","div:book","div:chapter"} for tag in g["intervening_tags"]) for g in gaps), "Book milestone pair variants differ in content or semantic scope"
              chapters=[n for n in items if n.tag==ns+"div" and n.get("type")=="chapter" and n.get("osisID") and not(n.get("sID") or n.get("eID"))]
              for ch in chapters:
                  own=ch.get("osisID")
                  milestones=[n for n in ch.iterdescendants(ns+"chapter") if n.get("sID") or n.get("eID")]
                  starts=[n for n in milestones if n.get("sID")]
                  ends=[n for n in milestones if n.get("eID")]
                  if not starts and not ends:continue
                  assert len(starts)==1 and starts[0].get("osisID")==own
                  sid=starts[0].get("sID")
                  if ends:
                      assert len(ends)==1 and ends[0].get("eID")==sid
                      continue
                  assert re.fullmatch(r"[A-Za-z0-9_.:-]+",sid)
                  assert starts[0].getparent() is ch and starts[0] is ch[0]
                  st,en,close,_,empty=mapping[ch]
                  assert not empty and data[close:close+2]==b"</"
                  added=('<chapter eID="'+sid+'"/>').encode()
                  patches.append((close,close,added,b""))
                  closures.append({"chapter":own,"pair_id":sid})
              out=bytearray(); pos=0; ledger=[]
              for st,en,repl,original in sorted(patches):
                  assert pos<=st and data[st:en]==original
                  out.extend(data[pos:st]);offset=len(out);out.extend(repl);pos=en
                  ledger.append({"input_offset":st,"output_offset":offset,"removed":original.decode(),"inserted":repl.decode()})
              out.extend(data[pos:]);result=bytes(out)
              reverse=result
              for rec in reversed(ledger):
                  off=rec["output_offset"];ins=rec["inserted"].encode()
                  assert reverse[off:off+len(ins)]==ins
                  reverse=reverse[:off]+rec["removed"].encode()+reverse[off+len(ins):]
              assert reverse==data
              # Exact visible character stream, full nontransport hierarchy and
              # attributes, including every annotation and reference, retained.
              after=etree.fromstring(result,parser())
              assert "".join(root.itertext())=="".join(after.itertext())
              def signature(tree):
                  return [(n.tag,tuple(sorted(n.attrib.items())),tuple((a.tag,tuple(sorted(a.attrib.items()))) for a in n.iterancestors())) for n in tree.iter() if not (n.tag==ns+"div" and n.get("type")=="book" and (n.get("sID") or n.get("eID"))) and not(n.tag==ns+"chapter" and n.get("eID") in {c["pair_id"] for c in closures})]
              assert signature(root)==signature(after)
              return result,ledger,removed,closures
          normalized,ledger,removed,closures=normalize(base)
          again,again_ledger,*_=normalize(normalized)
          assert again==normalized and not again_ledger
          assert len(removed)==264 and {c["chapter"] for c in closures}=={"1Sam.25","Ps.95"}
          (bundle/"mhcc.osis.xml").write_bytes(normalized)
          old_path=tmp/"erratum-only.osis.xml";old_path.write_bytes(base)
          schema=tmp/"reviewed-osis/osisCore.2.1.1-cw-latest.xsd"
          before=check(old_path,"commentary",schema_path=schema)
          after=check(bundle/"mhcc.osis.xml","commentary",schema_path=schema)
          (bundle/"brnp-before.json").write_text(json.dumps(before,indent=2,sort_keys=True)+"\n")
          (bundle/"brnp-after.json").write_text(json.dumps(after,indent=2,sort_keys=True)+"\n")
          structure={"base_sha256":sha(base),"normalized_sha256":sha(normalized),"removed_book_milestones":len(removed),"closed_chapters":closures,"reversible":True,"idempotent":True,"exact_visible_character_stream_equal":True,"other_element_hierarchy_and_attributes_equal":True,"before_findings":before["finding_codes"],"after_findings":after["finding_codes"],"official_schema":after["official_osis"],"annotation_count_before":before["commentary_entry_count"],"annotation_count_after":after["commentary_entry_count"]}
          print("BRNP_STRUCTURE",json.dumps(structure,sort_keys=True),flush=True)
          (bundle/"structure-ledger.json").write_text(json.dumps({"structure":structure,"byte_edits":ledger},sort_keys=True,indent=2)+"\n")
          assert after["finding_count"]==0 and before["commentary_entry_count"]==after["commentary_entry_count"]
          def compile_source(label,raw):
              root=tmp/label;payload=root/"modules/comments/zcom/mhcc"
              payload.mkdir(parents=True);(root/"mods.d").mkdir()
              (root/"mods.d/mhcc.conf").write_bytes(Path("modules/mhcc-crosswire/payload/mods.d/mhcc.conf").read_bytes())
              xml=root/"source.osis.xml";xml.write_bytes(raw)
              run=subprocess.run(["osis2mod",str(payload),str(xml),"-z","z","-b","3","-v","KJV"],capture_output=True,timeout=180)
              assert run.returncode==0
              return root
          def scan(root):
              env=dict(os.environ,SWORD_PATH=str(root))
              raw=subprocess.run([str(tmp/"mhcc-raw"),"MHCC"],env=env,capture_output=True,check=True,timeout=90).stdout
              entries={}
              report,*_=parse_native_raw_corpus(io.BytesIO(raw),on_entry=lambda k,r,b:entries.__setitem__((k,r),b))
              index=subprocess.run([str(tmp/"mhcc-index"),"MHCC"],env=env,capture_output=True,check=True,timeout=90).stdout
              private_crosscheck(index,"MHCC",list(entries),report)
              topology=subprocess.run([str(tmp/"mhcc-index"),"MHCC","--adjacent-links"],env=env,capture_output=True,check=True,timeout=90).stdout
              return entries,report["all_native_raw_entries_ordered_sha256"],topology
          a_root=compile_source("erratum-only",base);b_root=compile_source("normalized",normalized)
          a,ah,at=scan(a_root);b,bh,bt=scan(b_root)
          assert ah=="ec00e36c0d0cdaefccddd1db164731c49087f43b68676a6a5cd0c6bd699ab263"
          def sem(raw):
              root=etree.fromstring(b"<root>"+raw+b"</root>",parser())
              # Only book milestones and the two repaired chapter eIDs are
              # authorized transport differences. Compiler can add div wrappers;
              # all non-div elements, text and reference labels stay exact.
              seq=tuple((n.tag,tuple(sorted(n.attrib.items())),n.text) for n in root.iterdescendants() if isinstance(n.tag,str) and n.tag!="div" and not(n.tag=="chapter" and n.get("eID") in {c["pair_id"] for c in closures}))
              return " ".join("".join(root.itertext()).split()),seq
          rawdiff=[];semanticdiff=[];badxml=[];cache={}
          for k in sorted(a.keys()&b.keys()):
              if a[k]==b[k]:continue
              rawdiff.append(k)
              if k[0]=="U":semanticdiff.append(k);continue
              pair=(sha(a[k]),sha(b[k]))
              if pair not in cache:
                  try:cache[pair]=sem(a[k])==sem(b[k])
                  except (ValueError,etree.XMLSyntaxError):cache[pair]=None
              if cache[pair] is None:badxml.append(k)
              elif not cache[pair]:semanticdiff.append(k)
          aliases=[]
          review=json.loads(Path("config/commentary-rebuilds/mhcc-crosswire.json").read_text())
          for link in review["added_links"]:
              def linked(root):
                  return subprocess.run([str(tmp/"mhcc-index"),"MHCC","--is-linked",link["master_key"],link["new_key"]],env=dict(os.environ,SWORD_PATH=str(root)),capture_output=True,check=True,timeout=10).stdout
              if linked(a_root)!=linked(b_root):aliases.append(link["new_key"])
          receipt={"baseline_native_sha256":ah,"normalized_native_sha256":bh,"counts":dict(Counter(k for k,r in b)),"missing":sorted(a.keys()-b.keys())[:30],"extra":sorted(b.keys()-a.keys())[:30],"raw_changed":len(rawdiff),"semantic_changed_count":len(semanticdiff),"semantic_changed_sample":semanticdiff[:40],"xml_parse_errors":len(badxml),"adjacent_link_topology_equal":at==bt,"changed_reviewed_alias_links":aliases,"opaque_top_equal":all(a[k]==b.get(k) for k in a if k[0]=="U"),"publication":False}
          print("BRNP_NATIVE",json.dumps(receipt,sort_keys=True),flush=True)
          (bundle/"native-receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          assert a.keys()==b.keys() and not semanticdiff and not badxml and at==bt and not aliases
          # Keep exact compiled candidate only after both independent gates pass.
          import shutil
          shutil.copytree(b_root/"modules",bundle/"payload/modules")
          shutil.copytree(b_root/"mods.d",bundle/"payload/mods.d")
          PY
      - name: Retain trial receipts and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhcc-brnp-structural-trial
          path: ${{ runner.temp }}/mhcc-brnp-candidate/
          retention-days: 90
          if-no-files-found: warn
