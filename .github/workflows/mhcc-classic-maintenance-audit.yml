name: MHCC 0.1.2 final independent reader verification
on:
  pull_request:
    paths:
      - '.github/workflows/mhcc-classic-maintenance-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain exact previously validated structural candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14920876777/zip" > "$RUNNER_TEMP/mhcc-structural.zip"
          echo "e27b710c907275e6dd842b685caa95a552e84a2f73efce5faef0391bccd2d360  $RUNNER_TEMP/mhcc-structural.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/mhcc-structural.zip" -d "$RUNNER_TEMP/verified"
          echo "6e692fe887b0952bda540599b99c2c39d4b71a9f3d8e32a443db405bf53da52e  $RUNNER_TEMP/verified/mhcc.osis.xml" | sha256sum -c
          git fetch --no-tags --depth=1 origin refs/pull/275/head
          test "$(git rev-parse FETCH_HEAD)" = 30d6cd7a26de8cf8982877eee06a19b8b163d937
          git worktree add --detach "$RUNNER_TEMP/historical-reader" FETCH_HEAD
          python -m pip install -r requirements.txt
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i -E 's#https?://[A-Za-z0-9.-]*ec2.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 update -qq
          timeout 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y libsword-dev libsword-utils diatheke xiphos xvfb dbus-x11 xdotool xclip openbox
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_raw_corpus.cpp -o "$RUNNER_TEMP/native" -lsword
      - name: Compare actual diatheke and Xiphos passage text, including repaired chapters
        env:
          PYTHONPATH: ${{ runner.temp }}/historical-reader/scripts
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,io,json,os,re,shutil,signal,subprocess,time
          from pathlib import Path
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          from commentary_xiphos_dual_reader import verify_and_install_reviewed_bible,attempt_real_xiphos_passage_copy
          import commentary_xiphos_dual_reader as reader
          from pilot_subprocess import query
          from reader_xiphos_headless_smoke import _dismiss_transient_xiphos_notice
          tmp=Path(os.environ["RUNNER_TEMP"])
          source=tmp/"verified"
          root=tmp/"qa/sword";root.parent.mkdir()
          shutil.copytree(source/"payload",root)
          raw=subprocess.run([str(tmp/"native"),"MHCC"],env=dict(os.environ,SWORD_PATH=str(root)),capture_output=True,check=True,timeout=90).stdout
          entries={}
          report,*_=parse_native_raw_corpus(io.BytesIO(raw),on_entry=lambda kind,key,body:entries.__setitem__((kind,key),body))
          assert report["all_native_raw_entries_ordered_sha256"]=="957ef1f956f804ae67d0563969a2e2a4a9e567fe0153550c45015cb14310a5d6"
          bible=verify_and_install_reviewed_bible(root)
          keys=["Gen.5.25","Gen.5.32","1Sam.25.1","1Sam.26.1","Ps.95.1","Ps.96.1","Eccl.4.8","Matt.13.36","Rev.22.21"]
          comparisons={}
          for key in keys:
              assert ("K",key) in entries,key
              book,ch,v=key.split(".");ref=f"{book} {ch}:{v}"
              code,commentary=query("MHCC",ref,fmt="plain",root=root)
              bc,bible_text=query("BRLSG1910",ref,fmt="plain",root=root)
              assert code==bc==0 and len(commentary)>64 and len(bible_text)>16,key
              # Check a distinctive real source body excerpt, not merely a successful command.
              words=reader._normalized_words(entries["K",key])
              rendered=reader._normalized_words(commentary)
              # The historical GUI helper will independently compare against native prose.
              assert len(rendered)>12
              if key.startswith("Gen.5."):
                  assert b"Lamech hoped for relief by the birth of this son" in commentary
              comparisons[ref]={"commentary":commentary,"bible":bible_text,"commentary_internal":entries["K",key]}
          original_match=reader._long_commentary_excerpt_is_on_gui_clipboard
          restored=b"Lamech hoped for relief by the birth of this son"
          def strict_match(original,bible,selected):
              if not original_match(original,bible,selected):return False
              if restored in original:
                  expected=reader._normalized_words(restored);words=reader._normalized_words(selected)
                  return any(words[i:i+len(expected)]==expected for i in range(len(words)-len(expected)+1))
              return True
          reader._long_commentary_excerpt_is_on_gui_clipboard=strict_match
          home=tmp/"qa-home";home.mkdir()
          for d in ("config","cache","data"):(home/d).mkdir()
          env=dict(os.environ,HOME=str(home),XDG_CONFIG_HOME=str(home/"config"),XDG_CACHE_HOME=str(home/"cache"),XDG_DATA_HOME=str(home/"data"),SWORD_PATH=str(root),DISPLAY=":91",GDK_BACKEND="x11",LC_ALL="C.UTF-8",NO_AT_BRIDGE="1",WEBKIT_DISABLE_COMPOSITING_MODE="1")
          procs=[]
          log=tmp/"xiphos-startup.log"
          def launch(args,output):
              p=subprocess.Popen(args,env=env,stdout=output,stderr=output,start_new_session=True)
              procs.append(p);return p
          try:
              with log.open("wb") as stream:
                  xv=launch(["Xvfb",":91","-screen","0","1280x800x24","-nolisten","tcp"],stream)
                  time.sleep(1.5)
                  wm=launch(["openbox"],stream)
                  time.sleep(1)
                  app=launch(["dbus-run-session","--","xiphos"],stream)
                  win=None
                  for _ in range(110):
                      if app.poll() is not None:raise RuntimeError("Xiphos exited")
                      win=reader._main_xiphos_window(env)
                      if win:break
                      # Resize any actual visible Xiphos window that is too
                      # small for the historical main-window threshold.
                      ids=subprocess.run(["xdotool","search","--onlyvisible","--class","[Xx]iphos"],env=env,capture_output=True).stdout.decode().split()
                      for wid in ids:
                          g=subprocess.run(["xdotool","getwindowgeometry","--shell",wid],env=env,capture_output=True).stdout.decode()
                          dims=dict(re.findall(r"^(WIDTH|HEIGHT)=(\d+)$",g,re.M))
                          if int(dims.get("WIDTH",0))>=420 and int(dims.get("HEIGHT",0))>=300:
                              subprocess.run(["xdotool","windowsize",wid,"1216","736"],env=env,capture_output=True)
                      time.sleep(.5)
                  assert win,"Xiphos main window did not become visible"
                  subprocess.run(["xdotool","windowsize",win,"1216","736"],env=env,check=True)
                  subprocess.run(["xdotool","windowmove",win,"16","16"],env=env,check=True)
                  time.sleep(2)
                  _dismiss_transient_xiphos_notice(env)
                  result=attempt_real_xiphos_passage_copy(env,comparisons)
                  receipt={"schema_version":1,"native_corpus_sha256":report["all_native_raw_entries_ordered_sha256"],"source_sha256":hashlib.sha256((source/"mhcc.osis.xml").read_bytes()).hexdigest(),"source_structure_run":45394900192,"diatheke_samples":keys,"xiphos":result,"xiphos_window_visible":True,"restored_phrase_required_in_gui":True,"published":False}
                  (source/"reader-receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
                  print("FINAL_READER",json.dumps(receipt,sort_keys=True),flush=True)
                  assert result["actual_passage_commands_accepted"] and result["independent_gui_commentary_excerpt_match_count"]==len(keys)
          finally:
              for p in reversed(procs):
                  if p.poll() is None:
                      os.killpg(p.pid,signal.SIGTERM)
                      try:p.wait(timeout=5)
                      except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL);p.wait()
              if not (source/"reader-receipt.json").exists():
                  print("XIPHOS_STARTUP_DIAGNOSTIC",log.read_text(errors="replace")[-3000:])
          PY
      - name: Retain final independent reader receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhcc-final-reader-proof
          path: ${{ runner.temp }}/verified/reader-receipt.json
          if-no-files-found: warn
          retention-days: 90
