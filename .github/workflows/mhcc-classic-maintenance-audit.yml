name: MHCC classic maintenance evidence (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/mhcc-classic-maintenance-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stock native readers
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 update -qq
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y libsword-dev libsword-utils diatheke xiphos xvfb dbus-x11 xdotool xclip
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_index.cpp -o "$RUNNER_TEMP/mhcc-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_raw_corpus.cpp -o "$RUNNER_TEMP/mhcc-raw" -lsword
      - name: Check immutable history, actual upstream drift and exact erratum scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,io,json,os,subprocess
          from collections import Counter
          from pathlib import Path
          from lxml import etree
          from pilot_fetch import fetch
          from pilot_preflight import inspect_archive
          from commentary_native_raw_inventory import _safe_stock_install,private_crosscheck,NativeCommentaryMarkupCensus
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          tmp=Path(os.environ["RUNNER_TEMP"])
          module=Path("modules/mhcc-crosswire")
          source_dir=Path("sources/cleaned/commentaries/en/mhcc-crosswire")
          intake=json.loads(Path("config/commentary-intake/mhcc-crosswire.json").read_text())
          plan=json.loads(Path("config/release-plans/mhcc-0.1.1.json").read_text())
          rebuild=json.loads(Path("config/commentary-rebuilds/mhcc-crosswire.json").read_text())
          cleanup=json.loads((source_dir/"CLEANUP_MANIFEST.json").read_text())
          sha=lambda data: hashlib.sha256(data).hexdigest()
          def download_release(tag,name,digest,expected_size,ident):
              subprocess.run(["gh","release","download",tag,"--pattern",name,"--dir",str(tmp)],check=True,timeout=120)
              archive=tmp/name
              assert sha(archive.read_bytes())==digest and archive.stat().st_size==expected_size
              manifest=inspect_archive(archive,source_kind="sword",expected_module_id=ident,expected_category="commentary")
              root=tmp/tag
              _safe_stock_install(archive,manifest["members"],root)
              return archive,root,manifest
          prev,stock,prev_meta=download_release("mhcc-0.1.0","BRMHCC-0.1.0.zip","0faf4376b6b97093ecb94f306886c24d3030ab1f5e194472ad908dd73921f9c0",1772960,"BRMHCC")
          current,published,cur_meta=download_release(plan["tag"],plan["zip_name"],plan["package_sha256"],plan["package_size_bytes"],"MHCC")
          def members(root):
              return {p.relative_to(root).as_posix():sha(p.read_bytes()) for p in root.rglob("*") if p.is_file()}
          assert members(published)==members(module/"payload")==rebuild["payload_sha256"]
          print("PUBLISHED_PAYLOAD",json.dumps({"archive_sha256":plan["package_sha256"],"members":members(published),"all_git_payload_members_match":True}),flush=True)
          def scan(root,ident):
              env=dict(os.environ,SWORD_PATH=str(root.resolve()))
              data=subprocess.run([str(tmp/"mhcc-raw"),ident],env=env,capture_output=True,check=True,timeout=90).stdout
              entries={}
              census=NativeCommentaryMarkupCensus()
              def observe(kind,ref,raw):
                  entries[(kind,ref)]=raw
                  census.observe(kind,ref,raw)
              report,*_=parse_native_raw_corpus(io.BytesIO(data),on_entry=observe)
              index=subprocess.run([str(tmp/"mhcc-index"),ident],env=env,capture_output=True,check=True,timeout=90).stdout
              parity=private_crosscheck(index,ident,list(entries),report)
              return entries,{"native_sha256":report["all_native_raw_entries_ordered_sha256"],"counts":dict(Counter(k for k,r in entries)),"index":parity,"markup":census.report(len(entries))}
          old,old_report=scan(stock,"BRMHCC")
          new,new_report=scan(published,"MHCC")
          assert old_report["native_sha256"]==intake["native_raw_corpus_sha256"]
          assert new_report["native_sha256"]==rebuild["candidate_native_corpus_sha256"]
          added=set(new)-set(old)
          removed=set(old)-set(new)
          changed={k for k in old.keys()&new.keys() if old[k]!=new[k]}
          expected_added={("K",row["new_key"]) for row in rebuild["added_links"]}
          expected_changed={("K",key) for row in rebuild["source_edits"] for key in row["affected_original_keys"]}
          history_matches = added==expected_added and not removed and changed==expected_changed
          print("HISTORICAL_DELTA",json.dumps({"added":sorted(added),"removed":sorted(removed),"changed_count":len(changed),"unexpected_added":sorted(added-expected_added),"expected_added_absent":sorted(expected_added-added),"unexpected_changed_count":len(changed-expected_changed),"unexpected_changed_sample":sorted(changed-expected_changed)[:12],"expected_changed_absent":sorted(expected_changed-changed),"old_native_sha256":old_report["native_sha256"],"new_native_sha256":new_report["native_sha256"],"history_matches":history_matches},sort_keys=True),flush=True)
          wrong_links=[row["new_key"] for row in rebuild["added_links"] if new.get(("K",row["new_key"]))!=new.get(("K",row["master_key"])) or ("K",row["new_key"]) not in new]
          wrong_edits=[key for row in rebuild["source_edits"] for key in row["affected_original_keys"] if ("K",key) not in old or ("K",key) not in new or sha(old["K",key])!=row["original_sha256"] or sha(new["K",key])!=row["revised_sha256"]]
          print("HISTORICAL_DELTA_WITNESSES",json.dumps({"wrong_links":wrong_links,"wrong_edits":wrong_edits}),flush=True)
          print("NATIVE_HISTORY",json.dumps({"original":old_report,"current":new_report,"added_keys":len(added),"changed_keys":len(changed),"removed_keys":len(removed),"exact_approved_delta":history_matches and not wrong_links and not wrong_edits},sort_keys=True),flush=True)
          # Raw byte drift may be a transport wrapper rather than changed prose.
          # Compare text/punctuation and ordered non-div tag attributes separately.
          def semantics(raw):
              root=etree.fromstring(b"<root>"+raw+b"</root>",etree.XMLParser(resolve_entities=False,no_network=True))
              name=lambda n:etree.QName(n).localname
              text=" ".join("".join(root.itertext()).split())
              markup=tuple((name(n),tuple(sorted(n.attrib.items()))) for n in root.iterdescendants() if isinstance(n.tag,str) and name(n)!="div")
              refs=tuple((n.get("osisRef")," ".join("".join(n.itertext()).split())) for n in root.iterdescendants() if isinstance(n.tag,str) and name(n)=="reference")
              return text,markup,refs
          text_changed=[];structure_changed=[];refs_changed=[];parse_failures=[]
          unique_pairs={}
          for key in changed:
              if key[0]=="U":
                  continue
              a,b=old[key],new[key]
              pair=(sha(a),sha(b))
              if pair not in unique_pairs:
                  try:
                      x,y=semantics(a),semantics(b)
                      unique_pairs[pair]=(x[0]!=y[0],x[1]!=y[1],x[2]!=y[2])
                  except (etree.XMLSyntaxError,ValueError):
                      unique_pairs[pair]=None
              result=unique_pairs[pair]
              if result is None:parse_failures.append(key)
              else:
                  if result[0]:text_changed.append(key)
                  if result[1]:structure_changed.append(key)
                  if result[2]:refs_changed.append(key)
          print("SEMANTIC_HISTORY",json.dumps({"text_changed_count":len(text_changed),"text_changed_sample":sorted(text_changed)[:60],"nondiv_markup_changed_count":len(structure_changed),"nondiv_markup_changed_sample":sorted(structure_changed)[:30],"reference_changed_count":len(refs_changed),"reference_changed_sample":sorted(refs_changed)[:30],"parse_failures":len(parse_failures),"unique_changed_body_pairs":len(unique_pairs),"opaque_top_bytes_equal":all(old[k]==new[k] for k in old if k[0]=="U")},sort_keys=True),flush=True)
          source=(source_dir/"mhcc.osis.xml").read_bytes()
          assert sha(source)==cleanup["reconstructed_source_sha256"]
          parser=etree.XMLParser(resolve_entities=False,no_network=True,huge_tree=False)
          document=etree.fromstring(source,parser)
          broken=b"hard livelihood out comfort us."
          restored=b'hard livelihood out of it. Lamech hoped for relief by the birth of this son, "This same shall comfort us.'
          hosts=[key for key,raw in new.items() if broken in raw]
          assert hosts and set(hosts)=={key for key,raw in old.items() if broken in raw}
          assert all(key[0]=="K" and key[1].startswith("Gen.5.") and new[key].count(broken)==1 and old[key].count(broken)==1 for key in hosts)
          print("GENESIS_PRIOR_SEMANTICS",json.dumps({"text_and_nondiv_attributes_equal":all(semantics(old[key])==semantics(new[key]) for key in hosts),"prior_body_sha256":sha(old[hosts[0]]),"current_body_sha256":sha(new[hosts[0]])}),flush=True)
          print("ERRATUM_LOCATORS",json.dumps({"source_matches":source.count(broken),"native_hosts":[key[1] for key in hosts],"source_hash":sha(source)},sort_keys=True),flush=True)
          assert source.count(broken)==1
          candidate=source.replace(broken,restored,1)
          assert candidate.replace(restored,broken,1)==source
          edited=etree.fromstring(candidate,parser)
          sig=lambda root:[(node.tag,sorted(node.attrib.items())) for node in root.iter() if isinstance(node.tag,str)]
          assert sig(document)==sig(edited)
          target=[(str(node.tag),[(str(p.tag),dict(p.attrib)) for p in list(node.iterancestors())[:3]]) for node in document.iter() if isinstance(node.tag,str) and ((node.text and broken.decode() in node.text) or (node.tail and broken.decode() in node.tail))]
          print("GENESIS_ERRATUM",json.dumps({"source_sha256":sha(source),"candidate_source_sha256":sha(candidate),"affected_keys":[key[1] for key in hosts],"before_native_entry_sha256":sha(new[hosts[0]]),"proposed_after_native_entry_sha256":sha(new[hosts[0]].replace(broken,restored,1)),"identical_old_native_body":all(new[key]==new[hosts[0]] for key in hosts),"source_occurrences":source.count(broken),"bytes_inserted":len(restored)-len(broken),"exact_reverse_roundtrip":True,"xml_structure_and_attributes_identical":True,"source_location":target,"candidate_compiled":False,"published":False},sort_keys=True),flush=True)
          # Compile the pinned clean master and exact reversible edited master
          # with identical compiler settings; compare every actual entry.
          def compile_source(label,data):
              root=tmp/label
              payload=root/"modules/comments/zcom/mhcc"
              payload.mkdir(parents=True)
              (root/"mods.d").mkdir()
              (root/"mods.d/mhcc.conf").write_bytes((published/"mods.d/mhcc.conf").read_bytes())
              xml=root/"source.osis.xml"
              xml.write_bytes(data)
              p=subprocess.run(["osis2mod",str(payload),str(xml),"-z","z","-b","3","-v","KJV"],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=240)
              if p.returncode:
                  raise RuntimeError("Standard compiler failed; private source not logged")
              return root
          baseline_root=compile_source("recompile-baseline",source)
          candidate_root=compile_source("recompile-erratum",candidate)
          baseline,baseline_report=scan(baseline_root,"MHCC")
          revised,revised_report=scan(candidate_root,"MHCC")
          baseline_missing=set(new)-set(baseline)
          baseline_extra=set(baseline)-set(new)
          def content_differences(a,b):
              differences=[]; failures=[]
              for key in sorted(a.keys()&b.keys()):
                  if a[key]==b[key]:continue
                  if key[0]=="U":
                      differences.append(key);continue
                  try:
                      if semantics(a[key])!=semantics(b[key]):differences.append(key)
                  except (etree.XMLSyntaxError,ValueError):failures.append(key)
              return differences,failures
          baseline_semantic,baseline_parse=content_differences(new,baseline)
          revised_semantic,revised_parse=content_differences(baseline,revised)
          actual_changed={key for key in baseline.keys()&revised.keys() if baseline[key]!=revised[key]}
          exact_candidate_edits=set(hosts)==actual_changed and all(revised[key]==baseline[key].replace(broken,restored,1) for key in hosts if key in baseline and key in revised)
          def topology(root):
              return subprocess.run([str(tmp/"mhcc-index"),"MHCC","--adjacent-links"],env=dict(os.environ,SWORD_PATH=str(root.resolve())),capture_output=True,check=True,timeout=90).stdout
          old_topology=topology(published); baseline_topology=topology(baseline_root); revised_topology=topology(candidate_root)
          aliases_preserved=True
          for row in rebuild["added_links"]:
              link=subprocess.run([str(tmp/"mhcc-index"),"MHCC","--is-linked",row["master_key"],row["new_key"]],env=dict(os.environ,SWORD_PATH=str(candidate_root.resolve())),capture_output=True,check=True,timeout=10).stdout
              previous_link=subprocess.run([str(tmp/"mhcc-index"),"MHCC","--is-linked",row["master_key"],row["new_key"]],env=dict(os.environ,SWORD_PATH=str(published.resolve())),capture_output=True,check=True,timeout=10).stdout
              if link!=previous_link: aliases_preserved=False
          compile_result={"published_to_baseline_missing":sorted(baseline_missing)[:30],"published_to_baseline_extra":sorted(baseline_extra)[:30],"published_to_baseline_semantic_differences_count":len(baseline_semantic),"published_to_baseline_semantic_differences_sample":baseline_semantic[:20],"published_to_baseline_parse_failures":len(baseline_parse),"baseline_to_candidate_key_parity":set(baseline)==set(revised),"baseline_to_candidate_raw_changed_keys":sorted(actual_changed)[:30],"baseline_to_candidate_raw_changed_count":len(actual_changed),"baseline_to_candidate_semantic_changed_count":len(revised_semantic),"baseline_to_candidate_parse_failures":len(revised_parse),"exact_reversible_native_erratum":exact_candidate_edits,"published_to_baseline_adjacent_link_topology_equal":old_topology==baseline_topology,"baseline_to_candidate_adjacent_link_topology_equal":baseline_topology==revised_topology,"historical_alias_link_state_equal":aliases_preserved,"baseline_native_corpus_sha256":baseline_report["native_sha256"],"candidate_native_corpus_sha256":revised_report["native_sha256"],"candidate_native_counts":revised_report["counts"],"native_candidate_compiled":True,"published":False}
          print("COMPILED_ERRATUM",json.dumps(compile_result,sort_keys=True),flush=True)
          assert not baseline_missing and not baseline_extra and not baseline_semantic and not baseline_parse
          assert set(baseline)==set(revised) and exact_candidate_edits and not revised_parse
          assert old_topology==baseline_topology==revised_topology and aliases_preserved
          # Exact private versioned ZIP; no public catalogue/release changes.
          assert revised_report["native_sha256"]=="ec00e36c0d0cdaefccddd1db164731c49087f43b68676a6a5cd0c6bd699ab263"
          assert sha(candidate)=="690184e2cdac0e6160bddb256149f2111d51b946caf29622e3b7f2ea358835e0"
          import zipfile,re,shutil
          from pilot_subprocess import query,present_key
          conf=candidate_root/"mods.d/mhcc.conf"
          config=conf.read_text()
          assert config.count("\nVersion=0.1.1\n")==1 and config.count("\nSwordVersionDate=2026-11-16\n")==1
          config=config.replace("\nVersion=0.1.1\n","\nVersion=0.1.2\n").replace("Bible Resources edited module MHCC version 0.1.1.","Bible Resources edited module MHCC version 0.1.2. Restored one attested textual lacuna in Genesis 5:25-32; all previously reviewed navigation and two historical corrections retained.")
          # Keep the previous date until actual publication date is known.
          config=re.sub(r"(?m)^InstallSize=\d+$","InstallSize="+str(sum(p.stat().st_size for p in (candidate_root/"modules").rglob("*") if p.is_file())),config)
          config=config.rstrip()+"\nHistory_0.1.2=Restored the attested omitted words in Genesis 5:25-32; all prior sections and aliases preserved.\n"
          conf.write_text(config)
          bundle=tmp/"mhcc-candidate-evidence"
          bundle.mkdir()
          source_target=bundle/"mhcc.osis.xml"
          source_target.write_bytes(candidate)
          package=bundle/"MHCC-0.1.2-private.zip"
          with zipfile.ZipFile(package,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in sorted(members(candidate_root)):
                  if rel=="source.osis.xml":continue
                  info=zipfile.ZipInfo(rel,(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,(candidate_root/rel).read_bytes())
          meta=inspect_archive(package,source_kind="sword",expected_module_id="MHCC",expected_category="commentary")
          assert len(meta["members"])==7 and meta["sword_conf"]["version"]=="0.1.2"
          qa_root=tmp/"reader-candidate"/"sword"
          qa_root.parent.mkdir()
          _safe_stock_install(package,meta["members"],qa_root)
          qa_entries,qa_scan=scan(qa_root,"MHCC")
          assert qa_entries==revised
          diatheke=[]
          for key in ["Gen.5.24","Gen.5.25","Gen.5.26","Gen.5.32","Gen.6.1","Eccl.4.8","Ezek.3.1","1Chr.7.1","Lev.19.37","Ps.108.13"]:
              if ("K",key) not in revised:
                  diatheke.append({"reference":key,"native_key_absent":True})
                  continue
              book,ch,v=key.split(".")
              ref=f"{book} {ch}:{v}"
              code,data=query("MHCC",ref,fmt="plain",root=qa_root)
              assert present_key(ref,data,code)
              is_edit=key in {k[1] for k in hosts}
              if is_edit:
                  assert b"Lamech hoped for relief by the birth of this son" in data
                  assert broken not in data
              diatheke.append({"reference":key,"nonempty_readback":True,"restored_phrase_verified":is_edit,"sha256":sha(data)})
          receipt={"schema_version":1,"candidate_source_sha256":sha(candidate),"candidate_native_corpus_sha256":qa_scan["native_sha256"],"candidate_package_sha256":sha(package.read_bytes()),"candidate_package_size_bytes":package.stat().st_size,"payload_member_sha256":members(qa_root),"actual_candidate_installed_readback_equal":True,"diatheke":diatheke,"source_correction":compile_result,"version":"0.1.2","publication_date_pending":True,"publication_authorized":False,"published":False}
          (bundle/"candidate-receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("PRIVATE_CANDIDATE",json.dumps(receipt,sort_keys=True),flush=True)
          # New upstream bytes are research only: never repin the source.
          upstream=tmp/"upstream-observed.zip"
          try:
              observation=fetch(intake["sword_zip_url"],upstream,intake["provider"])
              meta=inspect_archive(upstream,source_kind="sword",expected_module_id="MHCC",expected_category="commentary")
              root=tmp/"upstream-observed"
              _safe_stock_install(upstream,meta["members"],root)
              live,live_report=scan(root,"MHCC")
              data=lambda m:{Path(k).name:v for k,v in m.items() if k.startswith("modules/comments/")}
              live_data,archived_data=data(members(root)),data(members(stock))
              print("UPSTREAM_DRIFT",json.dumps({"observed":observation,"pinned_archive_sha256":intake["archive_sha256"],"observed_conf_sha256":meta["sword_conf"]["conf_sha256"],"pinned_conf_sha256":intake["stock_conf_sha256"],"observed_version":meta["sword_conf"]["version"],"observed_native":live_report,"same_native_corpus_as_original":live==old,"same_native_data_members_as_immutable_original":live_data==archived_data,"data_members_changed":sorted(k for k in set(live_data)|set(archived_data) if live_data.get(k)!=archived_data.get(k)),"added_native_keys":len(live.keys()-old.keys()),"removed_native_keys":len(old.keys()-live.keys()),"changed_existing_native_keys":sum(live[k]!=old[k] for k in live.keys()&old.keys()),"source_pin_unchanged":True},sort_keys=True),flush=True)
          except Exception as exc:
              print("UPSTREAM_DRIFT_BLOCKED",type(exc).__name__,str(exc)[:400],flush=True)
          PY
      - name: Verify relocated historical Modern owner decision witness in clean checkout
        if: always()
        run: |
          set -euo pipefail
          p="sources/cleaned/commentaries/en/hmcc-modern/editorial/evidence/OWNER_EDITORIAL_DECISIONS_2026-11-19.json"
          test -f "$p"
          git ls-files --error-unmatch "$p"
          test "$(git hash-object "$p")" = 17ae1990423f5bdee7096ea76e9b5fc6927af1b6
          sha256sum "$p"
          python -m unittest discover -s tests -p test_reviewed_modern_commentary_rebuild.py -v
      - name: Real Xiphos selected-passage proof using prior reviewed harness
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/pull/275/head
          test "$(git rev-parse FETCH_HEAD)" = 30d6cd7a26de8cf8982877eee06a19b8b163d937
          git worktree add --detach "$RUNNER_TEMP/historical-reader" FETCH_HEAD
          PYTHONPATH="$RUNNER_TEMP/historical-reader/scripts" python - <<'PY'
          import hashlib,io,json,os,subprocess
          from pathlib import Path
          from commentary_xiphos_dual_reader import _run_real_gui,verify_and_install_reviewed_bible
          from pilot_subprocess import query,present_key
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          tmp=Path(os.environ["RUNNER_TEMP"])
          root=tmp/"reader-candidate/sword"
          receipt=tmp/"mhcc-candidate-evidence/candidate-receipt.json"
          data=json.loads(receipt.read_text())
          raw=subprocess.run([str(tmp/"mhcc-raw"),"MHCC"],env=dict(os.environ,SWORD_PATH=str(root)),capture_output=True,check=True,timeout=90).stdout
          entries={}
          report,*_=parse_native_raw_corpus(io.BytesIO(raw),on_entry=lambda kind,key,body:entries.__setitem__((kind,key),body))
          assert report["all_native_raw_entries_ordered_sha256"]==data["candidate_native_corpus_sha256"]
          bible=verify_and_install_reviewed_bible(root)
          samples=["Gen.5.25","Gen.5.32","Gen.5.24","Eccl.4.8","Ezek.3.1","1Chr.7.1"]
          comparisons={}
          for key in samples:
              book,ch,v=key.split(".")
              ref=f"{book} {ch}:{v}"
              code,commentary=query("MHCC",ref,fmt="plain",root=root)
              bc,bible_text=query("BRLSG1910",ref,fmt="plain",root=root)
              assert present_key(ref,commentary,code) and present_key(ref,bible_text,bc)
              comparisons[ref]={"commentary":commentary,"bible":bible_text,"commentary_internal":entries["K",key]}
          # Require the restored sentence itself in the GUI selection, not only
          # any unrelated long excerpt from the same chapter.
          import commentary_xiphos_dual_reader as reader
          original_match=reader._long_commentary_excerpt_is_on_gui_clipboard
          restored=b"Lamech hoped for relief by the birth of this son"
          def strict_match(original,bible,selected):
              if not original_match(original,bible,selected):return False
              if restored in original:
                  expected=reader._normalized_words(restored)
                  words=reader._normalized_words(selected)
                  return any(words[i:i+len(expected)]==expected for i in range(len(words)-len(expected)+1))
              return True
          reader._long_commentary_excerpt_is_on_gui_clipboard=strict_match
          result=_run_real_gui(root,comparisons,seconds=12,commentary_module_id="MHCC")
