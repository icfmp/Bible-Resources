name: Tool registry consistency

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'CONTRIBUTING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_source_bound_inventory:
    name: Check full tracked script registry without modifying the repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse stale or missing tool registry (no writes)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tool_registry.py --check
      - name: Explain metadata-only drift without rewriting checked-in files
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.tool_registry import generate
          actual = json.loads(Path("docs/TOOL_REGISTRY.json").read_text())
          # JSON arrays from checked-in metadata must compare to JSON arrays,
          # not Python tuples: avoid false import inventory drift reports.
          expected = json.loads(json.dumps(generate()))
          old = {entry["path"]: entry for entry in actual["files"]}
          new = {entry["path"]: entry for entry in expected["files"]}
          for path in sorted(set(old) | set(new)):
              before, after = old.get(path, {}), new.get(path, {})
              changed = [field for field in sorted(set(before) | set(after))
                         if before.get(field) != after.get(field)]
              if changed:
                  print(path, "drift fields:", ", ".join(changed))
                  if "python_imports" in changed:
                      print("  expected python_imports JSON:",
                            json.dumps(after.get("python_imports", ()),separators=(",",":")))
                  if "static_references" in changed:
                      print("  missing static callers:",
                            sorted(set(after.get("static_references", ())) -
                                   set(before.get("static_references", ()))))
                      print("  obsolete static callers:",
                            sorted(set(before.get("static_references", ())) -
                                   set(after.get("static_references", ()))))
                  if "sha256_at_inventory" in changed:
                      print("  expected source SHA-256:", after.get("sha256_at_inventory"))
          PY
