name: Observe an exact official publisher OSIS source (metadata only)

on:
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Reviewed config/publisher-osis/<resource_id>.json"
        type: string
        required: true
        default: frajnd-2024
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/publisher-osis-observation.yml"
      - "scripts/publisher_osis_observation.py"
      - "tests/test_publisher_osis_observation.py"
      - "config/publisher-osis/**"

permissions:
  contents: read

jobs:
  observe-official-osis:
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.pull_request == null && github.event.comment.author_association == 'OWNER' && startsWith(github.event.issue.title, '[Import]') && startsWith(github.event.comment.body, '/bible-osis-observe ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    env:
      RESOURCE_ID: ${{ inputs.resource_id || 'frajnd-2024' }}
      OBSERVED_REPORT: /tmp/reviewed-osis-observation/observation.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate strict source observer without network
        run: python -m unittest discover -s tests -p 'test_publisher_osis_observation.py' -v
      - name: Parse owner-only issue observation command
        if: github.event_name == 'issue_comment'
        env:
          COMMAND: ${{ github.event.comment.body }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          m = re.fullmatch(r"/bible-osis-observe ([a-z0-9][a-z0-9-]{1,48})", os.environ["COMMAND"])
          if not m:
              raise SystemExit("Invalid approved source observation command")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("RESOURCE_ID=" + m.group(1) + "\n")
          print("Approved metadata-only OSIS observation for resource:", m.group(1))
          PY
      - name: Observe source bytes in disposable runner (NO ORIGINAL UPLOAD)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reviewed-osis-observation
          python scripts/publisher_osis_observation.py \
            --resource-id "$RESOURCE_ID" --report "$OBSERVED_REPORT"
      - name: Retain observation metadata only
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: publisher-osis-observed-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/reviewed-osis-observation/observation.json
          retention-days: 90
          if-no-files-found: error
      - name: Attach permanent observation to the requesting import issue
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ env.OBSERVED_REPORT }}
        with:
          script: |
            const fs = require('fs');
            const metadata = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
            const fields = [
              'publisher_osis_xml_sha256', 'publisher_osis_xml_bytes',
              'strict_osis_xml_parsed', 'source_note_caller_shape_counts',
              'source_note_type_allowlisted_counts'
            ];
            const selected = Object.fromEntries(fields.map(k => [k, metadata[k]]));
            const link = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = [
              "### Publisher official OSIS observation — UNREVIEWED",
              `Resource: \`${metadata.resource_id}\``,
              `Declared edition: ${metadata.declared_edition}`,
              `Reviewed source URL: ${metadata.official_source_url}`,
              `Exact workflow: ${link}`,
              `Commit: \`${context.sha}\``,
              "",
              "Metadata-only observation:",
              "\`\`\`json",
              JSON.stringify(selected, null, 2),
              "\`\`\`",
              "",
              "**Observation only**: original XML discarded; NOT a pinned approved revision, source/USFX equivalence, footnote fidelity, rebuild authorization, or release."
            ].join("\n");
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: summary
            });
