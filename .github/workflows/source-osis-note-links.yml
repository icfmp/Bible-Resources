name: Review original OSIS note links (source only, no SWORD compilation)

on:
  pull_request:
    paths:
      - ".github/workflows/source-osis-note-links.yml"
      - "scripts/source_osis_note_link_triage.py"
      - "tests/test_source_osis_note_link_triage.py"
      - "scripts/publisher_osis_usfx_parity.py"
      - "scripts/publisher_osis_observation.py"
      - "scripts/source_native_osis_target_addressability.py"
      - "config/publisher-osis/**"
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  source-links:
    if: >-
      ${{ github.event_name == 'pull_request' ||
          (github.event.issue.pull_request == null &&
           github.event.comment.author_association == 'OWNER' &&
           startsWith(github.event.issue.title, '[Import]') &&
           startsWith(github.event.comment.body, '/bible-source-links ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      RESOURCE_ID: frajnd-2024
      REPORT: /tmp/original-source-link-review/report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install only Python parser dependencies (NO apt/SWORD)
        run: python -m pip install -r requirements.txt
      - name: Run isolated synthetic source-link and source-index tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_source_osis_note_link_triage.py' -v
          python -m unittest discover -s tests -p 'test_source_native_osis_target_addressability.py' -v
          python -m unittest discover -s tests -p 'test_publisher_osis_usfx_parity.py' -v
      - name: Parse exact authorized import-issue request
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          OWNER_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          command = os.environ["OWNER_COMMAND"]
          match = re.fullmatch(r"/bible-source-links ([a-z][a-z0-9-]{1,63})", command)
          if not match:
              raise SystemExit("Invalid source-only link review request")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("RESOURCE_ID=" + match.group(1) + "\n")
          print("Source-only review requested for a reviewed import ID.")
          PY
      - name: Download exactly pinned official OSIS and inspect note targets in private memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-source-link-review
          python scripts/source_osis_note_link_triage.py \
            --resource-id "$RESOURCE_ID" --report "$REPORT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path(os.environ["REPORT"]).read_text())
          assert report["source_note_target_literals_or_bodies_exposed"] is False
          assert report["original_text_notes_and_links_unchanged"] is True
          assert report["publication_or_editorial_approval"] is False
          assert report["source_verse_index_only"] is True
          assert report["actual_compiled_navigation_verified"] is False
          print("Validated bounded source-only result; no SWORD or editorial claims.")
          PY
      - name: Upload metadata-only source-link review evidence
        uses: actions/upload-artifact@v4
        with:
          name: original-osis-note-link-review-${{ github.run_id }}
          path: /tmp/original-source-link-review/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Comment bounded source-only outcome on original import issue
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ env.REPORT }}
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT,'utf8'));
            if (report.source_note_target_literals_or_bodies_exposed !== false ||
                report.source_verse_index_only !== true ||
                report.publication_or_editorial_approval !== false) {
              throw new Error('Unsafe or overclaiming source-only receipt');
            }
            const lines = [
              "### Stage-5 original-OSIS link navigation triage — NOT EDITORIAL APPROVAL",
              "Action: https://github.com/"+context.repo.owner+"/"+context.repo.repo+"/actions/runs/"+context.runId,
              "Exact source SHA-256: `"+report.official_source_sha256+"`",
              "Tool commit: `"+context.sha+"`",
              "Authorial target attributes: "+report.metadata_counts.explicit_original_target_attributes,
              "Original target attributes requiring review: "+report.unresolved_original_target_attributes,
              "",
              "Bounded *host-reference only* review findings (no raw target values):",
              "```json",
              JSON.stringify(report.bounded_note_host_findings,null,2),
              "```",
              "These are limitations of original target addressability against the publisher's own verse index.",
              "There is no compiled SWORD, GUI click or human editorial navigation sign-off in this audit.",
              "Never invent absent original verses, rewrite `osisRef`, or mark stage 5 complete from this result."
            ];
            await github.rest.issues.createComment({
              ...context.repo, issue_number:context.issue.number,
              body:lines.join("\n")
            });
