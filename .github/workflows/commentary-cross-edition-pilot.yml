name: Commentary cross-edition read-only pilot

on:
  pull_request:
    paths:
      - 'config/commentary-intake/wesley-crosswire.json'
      - '.github/workflows/commentary-cross-edition-pilot.yml'
      - 'scripts/commentary_intake.py'
      - 'scripts/commentary_native_inventory.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wesley:
    name: Real independently published second commentary (no text upload)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited reader and source tooling
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 update
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y diatheke libsword-dev
      - name: Verify independent Wesley identity before touching the source ZIP
        run: |
          python scripts/commentary_intake.py --resource-id wesley-crosswire --stage 1 --report "${RUNNER_TEMP}/wesley-intake-stage1.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"wesley-intake-stage1.json"
          r=json.loads(p.read_text())
          assert r["status"]=="metadata_review_required"
          assert r["module_id"]=="Wesley"
          assert r["published"] is False
          assert r["copyright_and_redistribution_approved"] is False
          print("Independent Wesley manifest checked; no source downloaded")
          PY
      - name: Observe independent real SWORD ZIP without authorial or rights claims
        run: |
          python scripts/commentary_intake.py --resource-id wesley-crosswire --stage auto --report "${RUNNER_TEMP}/wesley-intake-observation.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"wesley-intake-observation.json").read_text())
          assert r["status"] in (
              "observed_not_approved",
              "observed_identity_discrepancy_needs_review",
              "pinned_sword_observed_source_comparison_pending")
          assert r["module_id"]=="Wesley" and r["published"] is False
          assert r["full_original_to_module_parity"] is False
          assert r["copyright_and_redistribution_approved"] is False
          assert r["editorial_approved"] is False
          assert r["sword_conf"]["driver"] in ("RawCom","RawCom4","zCom","zCom4")
          print("Wesley publisher identity:", r["sword_conf"]["version"],
                "lang:",r["sword_conf"]["language"],"status:",r["status"])
          print("Wesley stock observation complete: driver",r["sword_conf"]["driver"],
                "ZIP SHA-256",r["archive_sha256"],
                "ZIP bytes",r["archive_bytes"],
                "reader sample count",len(r["reader_samples"]),
                "publication",r["published"])
          PY
      - name: Pinned full native index inventory if source SHA has been reviewed
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("config/commentary-intake/wesley-crosswire.json").read_text())
          raise SystemExit(0 if data.get("archive_sha256") else 1)
          PY
          then
            g++ -std=c++17 -O2 -I/usr/include/sword \
              scripts/sword_native_commentary_index.cpp \
              -o "${RUNNER_TEMP}/commentary-native-index" -lsword
            python scripts/commentary_native_inventory.py \
              --resource-id wesley-crosswire \
              --native-inspector "${RUNNER_TEMP}/commentary-native-index" \
              --report "${RUNNER_TEMP}/wesley-native-index.json"
            python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"wesley-native-index.json").read_text())
          assert report["status"]=="occupied_slot_inventory_not_entry_parity"
          assert report["module_id"]=="Wesley" and report["published"] is False
          assert report["source_to_native_text_fidelity_verified"] is False
          print("Wesley real native inventory complete; occupied numbered",
                report["occupied_numbered_slots"],"introductions",
                report["occupied_intro_slots"],"opaque",
                report["occupied_anonymous_top_slots"],
                "NOT authorial source-to-compiled fidelity proof")
          PY
          else
            echo "Wesley archive SHA unpinned: strictly observation only; full native inventory blocked pending separate reviewed SHA pin."
          fi
      - name: Archive metadata only (never copyright-sensitive text or native payload)
        uses: actions/upload-artifact@v4
        with:
          name: wesley-independent-commentary-research-metadata
          path: |
            ${{ runner.temp }}/wesley-intake-stage1.json
            ${{ runner.temp }}/wesley-intake-observation.json
            ${{ runner.temp }}/wesley-native-index.json
          if-no-files-found: error
          retention-days: 7
