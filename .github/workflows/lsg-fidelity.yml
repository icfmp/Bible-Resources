name: LSG authored-source fidelity pilot
on:
  pull_request:
    paths:
      - 'scripts/lsg_source_compare.py'
      - '.github/workflows/lsg-fidelity.yml'
      - 'scripts/lsg_sword_compare.py'
      - 'tests/test_lsg_source_compare.py'
      - 'tests/test_lsg_sword_compare.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lsg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parsers
        run: python -m pip install -r requirements.txt
      - name: Download the signed-off publisher source files to temporary storage
        run: |
          mkdir -p "${{ runner.temp }}/lsg"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from pilot_fetch import fetch
          target=Path('${{ runner.temp }}/lsg')
          for key,url in [
              ('usfx','https://ebible.org/Scriptures/fraLSG_usfx.zip'),
              ('usfm','https://ebible.org/Scriptures/fraLSG_usfm.zip')]:
              result=fetch(url,target/(key+'.zip'),'lsg')
              print(key, result['bytes'], result['sha256'])
          PY
      - name: Compare the original LSG USFM/USFX structures
        run: |
          python scripts/lsg_source_compare.py \
            --usfx-zip "${{ runner.temp }}/lsg/usfx.zip" \
            --usfm-zip "${{ runner.temp }}/lsg/usfm.zip" \
            --report reports/lsg-authoring-structure.json
      - name: Inspect the actual SWORD output format on three public-domain sample verses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y diatheke >/dev/null
          python - <<'PY'
          import sys,tempfile,zipfile,shutil,os
          from pathlib import Path, PurePosixPath
          sys.path.insert(0,'scripts')
          from pilot_fetch import fetch
          from pilot_preflight import inspect_archive
          from pilot_subprocess import query
          home=Path('${{ runner.temp }}/lsg')
          fetch('https://ebible.org/sword/zip/fraLSG1910eb.zip',home/'sword.zip','lsg')
          info=inspect_archive(home/'sword.zip',source_kind='sword',
              expected_module_id='fraLSG1910eb',expected_category='bible')
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              with zipfile.ZipFile(home/'sword.zip') as archive:
                  for item in info['members']:
                      name=item['name']
                      if name.endswith('/'):continue
                      dst=root/PurePosixPath(name)
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      with archive.open(name) as src,dst.open('xb') as out:
                          shutil.copyfileobj(src,out,length=262144)
              for ref in ['Gen 1','Ps 23','Gen 1:1','Ps 23:2','John 5:4','Acts 8:37']:
                  for fmt in ['plain','internal']:
                      code,body=query('fraLSG1910eb',ref,fmt=fmt,root=root,exe='diatheke')
                      print('SWORD sample',ref,fmt,'status',code,'bytes',len(body),
                            'prefix',repr(body[:1800 if ref in ('Gen 1','Ps 23') else 430].decode('utf-8',errors='replace')))
          PY
      - name: Compare selected LSG SWORD verses with independently parsed USFX
        run: |
          python scripts/lsg_sword_compare.py \
            --sword-zip "${{ runner.temp }}/lsg/sword.zip" \
            --usfx-zip "${{ runner.temp }}/lsg/usfx.zip" \
            --report reports/lsg-usfx-sword-verse-parity.json
      - name: Upload only the text-free diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsg-authoring-fidelity-report
          path: |
            reports/lsg-authoring-structure.json
            reports/lsg-usfx-sword-verse-parity.json
          retention-days: 30
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: |
          echo '## Louis Segond 1910 source comparison' >> "$GITHUB_STEP_SUMMARY"
          echo 'Private publisher ZIPs were held only in runner temporary storage.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The uploaded JSON records book/verse structure and XSD compatibility, never Bible text.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No module was rewritten or published.' >> "$GITHUB_STEP_SUMMARY"
