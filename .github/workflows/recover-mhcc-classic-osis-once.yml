name: Restore classic MHCC 0.1.1 OSIS via full published native source parity
on:
  push:
    branches: [recovery/mhcc-classic-source-20261120]
    paths: [.github/workflows/recover-mhcc-classic-osis-once.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.repository == 'icfmp/Bible-Resources'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install existing source-native OSIS/SWORD testing tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt
          timeout 150s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
          timeout 360s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends libsword-dev libsword-utils
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_raw_corpus.cpp -o "$RUNNER_TEMP/native-raw" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_index.cpp -o "$RUNNER_TEMP/native-index" -lsword
      - name: Recover a source-preserving OSIS derivative from exact published classic MHCC
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import defaultdict
          from hashlib import sha256
          from io import BytesIO
          from pathlib import Path
          import json,os,subprocess,tempfile
          from commentary_osis_mixed_transport_probe import probe_complete_original_transport
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          root=Path.cwd()
          plan=json.loads((root/"config/commentary-rebuilds/mhcc-crosswire.json").read_text())
          expected="2d85930f0a69efaf30dbde195e5f9779eaaf849cf0221e85ed46d6ec8bcb025e"
          assert plan["candidate_native_corpus_sha256"]==expected
          published=root/"modules/mhcc-crosswire/payload"
          env=dict(os.environ,SWORD_PATH=str(published))
          raw_bin=Path(os.environ["RUNNER_TEMP"])/"native-raw"
          idx_bin=Path(os.environ["RUNNER_TEMP"])/"native-index"
          proc=subprocess.run([str(raw_bin),"MHCC"],env=env,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=260)
          if proc.returncode!=0 or len(proc.stdout)>350*1024*1024:
              raise RuntimeError("Published curated MHCC 0.1.1 native source unavailable")
          intros={}
          numbered=defaultdict(list)
          top=[]
          original={}
          def collect(kind,key,raw):
              if kind=="I":intros[key]=raw
              elif kind=="U":top.append(raw)
              else:
                  numbered[key.rsplit(".",1)[0]].append((key,raw))
                  original[key]=raw
          receipt,keys,intro_keys,top_keys=parse_native_raw_corpus(BytesIO(proc.stdout),on_entry=collect)
          if (receipt["all_native_raw_entries_ordered_sha256"]!=expected or
              (len(keys),len(intro_keys),len(top_keys))!=(28742,1255,2)):
              raise ValueError("Released MHCC native SHA, keys or TOP differ")
          # Published editorial controls identify the EXACT 24 source-native alias
          # destinations. They must share original body bytes with their approved
          # masters, and no authorial note or section text may be changed.
          alias={}
          for entry in plan["added_links"]:
              master,target=entry["master_key"],entry["new_key"]
              if master not in original or target not in original or target in alias:
                  raise ValueError("Approved index delta absent or repeated")
              if original[master]!=original[target]:
                  raise ValueError("Published alias not raw-identical to approved master")
              alias[target]={"link_to":master,"source_raw_sha256":sha256(original[master]).hexdigest()}
          if len(alias)!=24:raise ValueError("Unexpected MHCC editorial alias count")
          base=defaultdict(list)
          for chapter,units in numbered.items():
              base[chapter]=[(ref,raw) for ref,raw in units if ref not in alias]
          if sum(map(len,base.values()))!=28718:raise ValueError("Original section index count drift")
          with tempfile.TemporaryDirectory(prefix="mhcc-classic-rebuild-") as temp:
              scratch=Path(temp)
              report=probe_complete_original_transport(
                  intros,base,top,scratch=scratch,native_raw_binary=raw_bin,
                  provisional_index_aliases=alias,original_stock_sword_root=published,
                  original_stock_module_id="MHCC",native_index_binary=idx_bin
              )
              for field in ("readback_completed","full_original_K_I_U_native_entry_parity_proven",
                            "all_original_TOP_positions_exact_raw_bytes",
                            "original_indexed_I_K_text_markup_reference_checks_passed",
                            "all_proposed_new_aliases_same_compiled_raw_as_original_master"):
                  if report.get(field) is not True:
                      raise ValueError("Whole-corpus MHCC SWORD parity gate failed: "+field)
              for k in ("source_intro_I_coverage","source_numbered_K_coverage"):
                  v=report[k]
                  if len(set(v.values()))!=1 or next(iter(v.values()))!=(1255 if k=="source_intro_I_coverage" else 28718):
                      raise ValueError("Partial reader/text/markup/reference gate: "+k)
              source=scratch/"complete-original-private-candidate/source-original-private.osis.xml"
              if not source.is_file() or source.stat().st_size<1_000_000:
                  raise ValueError("No complete reconstructed classic commentary OSIS")
              data=source.read_bytes()
              target=root/"sources/cleaned/commentaries/en/mhcc-crosswire"
              if target.exists():raise ValueError("Refuse overwrite of classic original MHCC editorial source")
              target.mkdir(parents=True)
              (target/"mhcc.osis.xml").write_bytes(data)
              proof={
                 "schema_version":1,
                 "resource_id":"mhcc-crosswire","language":"en","type":"commentary",
                 "edition":"MHCC classic CrossWire-derived 0.1.1",
                 "source_kind":"native_source_attested_reconstructed_osis_not_original_authoring_osis",
                 "source_native_published_module":"modules/mhcc-crosswire/payload",
                 "source_native_edition_version":"0.1.1",
                 "source_native_corpus_sha256":expected,
                 "source_native_key_counts":{"K":28742,"I":1255,"TOP":2},
                 "source_native_audit":"modules/mhcc-crosswire/SOURCE_AUDIT.json",
                 "approved_corrections":"config/commentary-rebuilds/mhcc-crosswire.json",
                 "approved_alias_count":24,
                 "approved_prose_reference_errata_already_in_source":2,
                 "reconstructed_source_file":"sources/cleaned/commentaries/en/mhcc-crosswire/mhcc.osis.xml",
                 "reconstructed_source_sha256":sha256(data).hexdigest(),
                 "reconstructed_source_size":len(data),
                 "private_standard_compiler_roundtrip_passed":True,
                 "source_to_compiled_reader_whitespace_normalized_unicode_punctuation_order_preserved":True,
                 "source_to_compiled_nondiv_xml_attributes_references_preserved":True,
                 "source_to_compiled_original_section_reference_index_passed":True,
                 "source_to_compiled_intro_and_opaque_top_passed":True,
                 "original_crosswire_authoring_osis_recovered":False,
                 "compilation_xml_raw_byte_identity_claimed":False,
                 "historical_print_edition_parity_claimed":False,
                 "already_published_native_sword_changed":False,
                 "source_approval_basis":"Original classic MHCC 0.1.1 release's source-native editorial approvals; no new substantive edits",
              }
              (target/"CLEANUP_MANIFEST.json").write_text(json.dumps(proof,indent=2,sort_keys=True)+"\n")
              receipt_output={k:report[k] for k in (
               "readback_completed","source_intro_I_coverage","source_numbered_K_coverage",
               "all_original_TOP_positions_exact_raw_bytes",
               "original_indexed_I_K_text_markup_reference_checks_passed",
               "full_original_K_I_U_native_entry_parity_proven")}
              print("CLASSIC_MHCC_RESTORED",proof["reconstructed_source_sha256"],len(data),
                    json.dumps(receipt_output,sort_keys=True))
          PY
      - name: Commit only fully verified reconstructed classic OSIS
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/recover-mhcc-classic-osis-once.yml
          git add sources/cleaned/commentaries/en/mhcc-crosswire/
          git diff --cached --check -- ':!sources/cleaned/**/*.xml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve source-attested classic MHCC 0.1.1 reconstructed OSIS'
          git push origin HEAD:recovery/mhcc-classic-source-20261120
