name: Import exact private Darby ZIP in stable AndBible Android (research only)

on:
  pull_request:
    paths:
      - ".github/workflows/darby-andbible-android-private.yml"
      - "scripts/probe_andbible_android_private_import.py"
      - "tests/test_probe_andbible_android_private_import.py"
      - "scripts/probe_private_repaired_darby_sword.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-android-sword-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install source audit dependencies and local UI parsing regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_probe_andbible_android_private_import.py' -v
          python -m unittest discover -s tests -p 'test_repair_osis_source_bytes.py' -v
          python -m unittest discover -s tests -p 'test_audit_omitted_verse_notes.py' -v
      - name: Download and verify exact official stable AndBible 5.1.1117 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/darby-private-android/evidence"
          curl --fail --location --retry 2 --max-time 120 \
            -o "$RUNNER_TEMP/darby-private-android/andbible-production-1117.apk" \
            https://github.com/AndBible/and-bible/releases/download/production-1117/andbible-production-1117.apk
          echo "1c9ed93391642c0de4529065a65e10eb44242d60722231b917b14c5919cdf796  $RUNNER_TEMP/darby-private-android/andbible-production-1117.apk" | sha256sum --check --status
      - name: Install pinned native SWORD compiler prerequisites and JSword-independent corpus readers
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s sudo apt-get -o Acquire::Retries=1 update -qq
          timeout 180s sudo apt-get -o Acquire::Retries=1 install -y \
            libsword-dev libsword-utils diatheke subversion cmake ninja-build \
            zlib1g-dev libbz2-dev liblzma-dev libicu-dev libcurl4-openssl-dev
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_index.cpp \
            -o "$RUNNER_TEMP/darby-private-android/native-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_raw_corpus.cpp \
            -o "$RUNNER_TEMP/darby-private-android/native-raw" -lsword
      - name: Build exact upstream CrossWire SWORD r3918 compiler
        shell: bash
        run: |
          set -euo pipefail
          svn export --non-interactive --quiet -r 3918 \
            https://crosswire.org/svn/sword/trunk \
            "$RUNNER_TEMP/darby-private-android/sword-r3918"
          cmake -S "$RUNNER_TEMP/darby-private-android/sword-r3918" \
            -B "$RUNNER_TEMP/darby-private-android/sword-r3918-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DSWORD_BUILD_UTILS=YES \
            -DSWORD_BUILD_TESTS=NO -DSWORD_BUILD_EXAMPLES=NO
          cmake --build "$RUNNER_TEMP/darby-private-android/sword-r3918-build" \
            --target osis2mod --parallel 4
          compiler="$(find "$RUNNER_TEMP/darby-private-android/sword-r3918-build" \
            -type f -name osis2mod -perm /111 -print -quit)"
          test -n "$compiler"
          test -x "$compiler"
          echo "PINNED_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Reacquire exact signed official CrossWire OSIS validation schema
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch_reviewed_schema.py \
            --directory "$RUNNER_TEMP/darby-private-android/schema"
      - name: Permit ephemeral Android emulator hardware acceleration
        shell: bash
        run: |
          if test -c /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Rebuild, audit, and try Android GUI local-file import inside disposable emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          # AOSP avoids the Google Pixel Launcher ANR seen on hosted runners.
          # Official AndBible stable APK and private SWORD pins stay unchanged.
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          script: python scripts/probe_private_repaired_darby_sword.py --osis2mod "$PINNED_COMPILER" --native-index "$RUNNER_TEMP/darby-private-android/native-index" --native-raw "$RUNNER_TEMP/darby-private-android/native-raw" --diatheke "$(command -v diatheke)" --schema "$RUNNER_TEMP/darby-private-android/schema/osisCore.2.1.1-cw-latest.xsd" --link-plan config/publisher-osis/frajnd-2024-note-link-research.json --inline-plan config/publisher-osis/frajnd-2024-inline-markup-research.json --andbible-android-apk "$RUNNER_TEMP/darby-private-android/andbible-production-1117.apk" --andbible-android-evidence-dir "$RUNNER_TEMP/darby-private-android/evidence" --report "$RUNNER_TEMP/darby-private-android/report.json"
      - name: Upload screenshot and bounded metadata only; never candidate Bible payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darby-andbible-android-private-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/darby-private-android/evidence/
            ${{ runner.temp }}/darby-private-android/report.json
          retention-days: 7
          if-no-files-found: warn
