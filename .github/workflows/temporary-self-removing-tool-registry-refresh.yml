name: Temporary self-removing source-bound tool registry refresh
on:
  push:
    branches:
      - fix/generic-sword-osis-option-filter-validation
    paths:
      - '.github/workflows/temporary-self-removing-tool-registry-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove one-shot CI from Git index before generating permanent registry
        run: |
          set -euo pipefail
          git rm -f -- .github/workflows/temporary-self-removing-tool-registry-refresh.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git add -f -- reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(tools): refresh SWORD filter tool registry without temporary job'
          git push origin HEAD:refs/heads/fix/generic-sword-osis-option-filter-validation
