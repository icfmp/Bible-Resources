name: One-shot OSIS boundary inventory refresh
on:
  push:
    branches:
      - maintenance/osis-native-boundaries-20261122
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute checked registry and retire one-shot task
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintenance-osis-boundary-registry-once.yml
          python scripts/tool_registry.py --write
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          python scripts/tool_registry.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh OSIS boundary inventory"
          git push
