name: Probe publisher OSIS to native SWORD candidates (research only)

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/publisher-osis-sword-candidate.yml"
      - "scripts/publisher_osis_sword_candidate.py"
      - "tests/test_publisher_osis_sword_candidate.py"
      - "config/publisher-sword-research/**"

permissions:
  contents: read

jobs:
  original-sword-probe:
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.pull_request == null && github.event.comment.author_association == 'OWNER' && startsWith(github.event.issue.title, '[Import]') && startsWith(github.event.comment.body, '/bible-osis-candidate ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 32
    permissions:
      contents: read
      issues: write
    env:
      RESOURCE_ID: frajnd-2024
      REPORT: /tmp/bible-source-rebuild-probe/candidate-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tested Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline private SWORD candidate regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_publisher_osis_sword_candidate.py' -v
          python -m unittest discover -s tests -p 'test_publisher_osis_usfx_parity.py' -v
      - name: Parse authenticated owner request
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os, re
          match = re.fullmatch(
              r"/bible-osis-candidate ([a-z0-9][a-z0-9-]{1,48})",
              os.environ["COMMAND"])
          if not match:
              raise SystemExit("Invalid research command")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write("RESOURCE_ID="+match.group(1)+"\n")
          print("Authorized private compiler research:", match.group(1))
          PY
      - name: Install standard SWORD compiler and independent native inspectors
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsword-dev libsword-utils diatheke
          mkdir -p /tmp/native-probe-binaries
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_index.cpp -o /tmp/native-probe-binaries/native-index -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_raw_corpus.cpp -o /tmp/native-probe-binaries/native-raw -lsword
          command -v osis2mod
      - name: Compile two ephemeral official-OSIS candidates and compare real native entries
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bible-source-rebuild-probe
          python scripts/publisher_osis_sword_candidate.py \
            --resource-id "$RESOURCE_ID" \
            --osis2mod "$(command -v osis2mod)" \
            --native-index /tmp/native-probe-binaries/native-index \
            --native-raw /tmp/native-probe-binaries/native-raw \
            --report "$REPORT"
      - name: Upload metadata-only evidence (never original OSIS or compiled SWORD)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: publisher-sword-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/bible-source-rebuild-probe/candidate-report.json
          retention-days: 90
          if-no-files-found: error
      - name: Record bounded original-to-candidate findings on import issue
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ env.REPORT }}
        with:
          script: |
            const fs=require('fs');
            const data=JSON.parse(fs.readFileSync(process.env.REPORT,'utf8'));
            const lines=[
              "### Official publisher OSIS → standard native SWORD research — NOT RELEASED",
              `Resource: \`${data.resource_id}\``,
              `Original SHA-256: \`${data.original_publisher_osis_sha256}\``,
              `Exact tool commit: \`${context.sha}\``,
              `Action: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
            ];
            for(const candidate of data.candidate_research_results){
              lines.push(`#### ${candidate.candidate_versification}: ${candidate.candidate_status}`);
              if(candidate.reason_category) lines.push(`Failure type: ${candidate.reason_category}`);
              if(candidate.safe_failure_code) lines.push(`Safe failure code: ${candidate.safe_failure_code}`);
              if(candidate.failed_phase) lines.push(`Failed phase: ${candidate.failed_phase}`);
              if(candidate.source_to_compiled_counts){
                lines.push("Checked counts (no Bible content):", "```json",
                  JSON.stringify(candidate.source_to_compiled_counts,null,2), "```");
              }
              if(candidate.first_safe_reference_note_index_findings){
                lines.push("Bounded review references:", "```json",
                  JSON.stringify(candidate.first_safe_reference_note_index_findings.slice(0,20),null,2),
                  "```");
              }
            }
            lines.push("","**All research module binaries and publisher text discarded.**",
              "Not a rights/editorial sign-off, not complete structure/visual acceptance, not a release.");
            await github.rest.issues.createComment({
              ...context.repo, issue_number:context.issue.number,
              body:lines.join("\n")
            });
