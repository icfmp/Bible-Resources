name: Prepare metadata-only MHCC 1.0.0 promotion
on:
  pull_request:
    paths:
      - '.github/workflows/mhcc-promotion.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/mhcc-1.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate previous public release and prepare only metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          gh release download mhcc-0.1.2 -p MHCC-0.1.2.zip -D "$RUNNER_TEMP"
          echo "ae6c9006bfd889446122426ae2d29e1b80c8cb7ba1b1d4aeaf6eecd1157ac6b3  $RUNNER_TEMP/MHCC-0.1.2.zip" | sha256sum -c
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          from zipfile import ZipFile
          from reviewed_compiled_commentary_rebuild import checked_zcom_payload_files, reviewed_rebuilt_commentary_errors
          from validate import parse_conf
          from build import build
          root=Path(".");tmp=Path(os.environ["RUNNER_TEMP"]);m=root/"modules/mhcc-crosswire";ed=root/"sources/cleaned/commentaries/en/mhcc-crosswire";old=ed/"editorial/evidence/release-0.1.2"
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          load=lambda p:json.loads(p.read_text())
          def save(p,obj):p.write_text(json.dumps(obj,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          review=root/"config/commentary-rebuilds/mhcc-crosswire.json";plan=root/"config/release-plans/mhcc-0.1.2.json"
          conf=m/"payload/mods.d/mhcc.conf";meta=load(m/"metadata.json");prior=load(review);proof=load(m/"SOURCE_VALIDATION.json")
          members=checked_zcom_payload_files(m/"payload","MHCC","CHAPTER")
          with ZipFile(tmp/"MHCC-0.1.2.zip") as z:
              assert len(z.namelist())==len(members) and set(z.namelist())==set(members)
              assert all(z.read(k)==p.read_bytes() for k,p in members.items())
          _,parsed=parse_conf(conf);assert not reviewed_rebuilt_commentary_errors(m,root,meta,parsed)
          assert sha(ed/"mhcc.osis.xml")==proof["candidate_source_sha256"]
          for src,dest in [(review,"review-manifest.json"),(plan,"release-plan.json"),(m/"metadata.json","metadata.json"),(m/"SOURCE_VALIDATION.json","SOURCE_VALIDATION.json"),(m/"SOURCE_AUDIT.json","SOURCE_AUDIT.json"),(m/"EDITORIAL.md","EDITORIAL.md"),(conf,"module.conf"),(ed/"CLEANUP_MANIFEST.json","CLEANUP_MANIFEST.json")]:
              target=old/dest
              if target.exists():assert src.read_bytes()==target.read_bytes(),target
              else:shutil.copyfile(src,target)
          promotion={"previous_version":"0.1.2","previous_review_sha256":sha(old/"review-manifest.json"),"previous_metadata_sha256":sha(old/"metadata.json"),"previous_proof_sha256":sha(old/"SOURCE_VALIDATION.json"),"old_display_name":meta["title"]["en"],"new_display_name":"Matthew Henry's Concise Commentary"}
          meta["title"]["en"]=promotion["new_display_name"];meta["version"]="1.0.0"
          data=conf.read_bytes()
          for before,after in [(b"Version=0.1.2\n",b"Version=1.0.0\n"),(("Description="+promotion["old_display_name"]+"\n").encode(),("Description="+promotion["new_display_name"]+"\n").encode()),(b" version 0.1.2.",b" version 1.0.0.")]:
              assert data.count(before)==1
              data=data.replace(before,after,1)
          conf.write_bytes(data)
          current=dict(prior,version="1.0.0",authorization={"approved_by":"Bible Resources project owner","scope":"Owner requested metadata-only promotion to Matthew Henry's Concise Commentary (MHCC) 1.0.0, retaining all validated 0.1.2 content.","evidence_url":"https://github.com/icfmp/Bible-Resources/issues/557"},metadata_promotion=promotion,payload_sha256={k:sha(p) for k,p in members.items()})
          assert all(current["payload_sha256"][k]==prior["payload_sha256"][k] for k in members if k!="mods.d/mhcc.conf")
          save(review,current);save(m/"metadata.json",meta);save(m/"SOURCE_VALIDATION.json",dict(proof,curated_version="1.0.0",metadata_promotion=promotion))
          notes=ed/"editorial/releases/MHCC-1.0.0.md"
          notes.write_text("# Matthew Henry's Concise Commentary — MHCC 1.0.0\n\nMetadata-only promotion of the reviewed 0.1.2 edition. The canonical OSIS source, native text, all six compiled data files, links, references and introductions are unchanged. Only the displayed English name and module version are changed. Previous release evidence and original source remain intact. Public Domain; CrossWire provenance retained. Prior native reader and BRNP evidence still applies. The upstream CrossWire MHCC 2.0 shares the module ID; explicit provider replacement may be necessary.\n\nSee [0.1.2](https://github.com/icfmp/Bible-Resources/releases/tag/mhcc-0.1.2) and [#557](https://github.com/icfmp/Bible-Resources/issues/557).\n")
          with (m/"EDITORIAL.md").open("a") as f:f.write("\n## 1.0.0 metadata-only promotion\n\n"+notes.read_text().split("\n\n",1)[1])
          _,parsed=parse_conf(conf);errors=reviewed_rebuilt_commentary_errors(m,root,meta,parsed);assert not errors,errors
          # Actual negative regression: reject unrelated config changes, modified binary digest, historical proof and source hash.
          for k in ("Description","DistributionLicense"):
              original=conf.read_bytes()
              try:
                  conf.write_bytes(original.replace((k+"=").encode(),(k+"=unexpected ").encode(),1))
                  assert reviewed_rebuilt_commentary_errors(m,root,meta,parsed)
              finally:conf.write_bytes(original)
          for field in ("candidate_native_corpus_sha256","payload_sha256"):
              bad=json.loads(json.dumps(current))
              if field=="payload_sha256":bad[field][next(k for k in members if k.startswith("modules/"))]="0"*64
              else:bad[field]="0"*64
              try:
                  save(review,bad);assert reviewed_rebuilt_commentary_errors(m,root,meta,parsed)
              finally:save(review,current)
          snapshot=root/"catalog/v1/catalog.json";snapshot.unlink();dist=tmp/"dist";build(output=dist);shutil.copyfile(dist/"catalog/v1/catalog.json",snapshot)
          p=dist/"sword/packages/MHCC.zip"
          newplan=dict(load(plan),tag="mhcc-1.0.0",version="1.0.0",title="Matthew Henry's Concise Commentary — MHCC 1.0.0",zip_name="MHCC-1.0.0.zip",package_sha256=sha(p),package_size_bytes=p.stat().st_size,notes_path=str(notes))
          newplan["authorization"]=dict(newplan["authorization"],decision="Owner requested metadata-only name harmonization and promotion to 1.0.0; exact 0.1.2 content and source proof retained.",evidence_url="https://github.com/icfmp/Bible-Resources/issues/557")
          save(root/"config/release-plans/mhcc-1.0.0.json",newplan);plan.unlink()
          print("MHCC_PROMOTION",json.dumps(newplan,sort_keys=True),flush=True)
          PY
          git add -A -- modules/mhcc-crosswire sources/cleaned/commentaries/en/mhcc-crosswire/editorial config/release-plans config/commentary-rebuilds/mhcc-crosswire.json catalog/v1/catalog.json
          python scripts/tool_registry.py --write
          python scripts/release_preflight.py --module-id mhcc-crosswire --report "$RUNNER_TEMP/preflight.json"
          python -m unittest discover -s tests -v
      - name: Commit only validated changes on review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- modules/mhcc-crosswire sources/cleaned/commentaries/en/mhcc-crosswire/editorial config/release-plans config/commentary-rebuilds/mhcc-crosswire.json catalog/v1/catalog.json
          git add -u -- reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git diff --cached --stat
          git commit -m "Promote classic MHCC to 1.0.0 without changing content"
          git push origin HEAD:refs/heads/release/mhcc-1.0.0
