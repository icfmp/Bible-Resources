          extra_total=sum(dual["original_vs_native_unlinked_word_relation_classes"].get(
              name,0) for name in extra_classes)
          gap_classes=dual["source_extra_unlinked_word_gap_topology_classes"]
          gap_by_book=dual["original_book_source_extra_word_gap_topology_classes"]
          assert sum(gap_classes.values())==extra_total
          assert sum(sum(groups.values()) for groups in gap_by_book.values())==extra_total
          assert all(isinstance(name,str) and name.islower() and
                     name.replace("_","").isalnum() and type(count) is int and count>=0
                     for name,count in gap_classes.items())
          print("Original and native both-side citation label exclusion, unlinked words:",
                json.dumps(dual["original_vs_native_unlinked_word_relation_classes"],
                           sort_keys=True))
          print("Source-extra unlinked word location uniqueness, no original text:",
                json.dumps(gap_classes,sort_keys=True))
          print("Source-extra unlinked word location uniqueness by original book:",
                json.dumps(gap_by_book,sort_keys=True))
          p_classes=dual["source_extra_original_p_visible_word_digest_case_classes"]
          p_books=dual["original_book_source_extra_original_p_digest_case_classes"]
          p_receipts=dual["source_extra_original_p_digest_source_line_sha_only_rows"]
          assert sum(p_classes.values())==extra_total
          assert len(p_receipts)==extra_total
          assert sum(sum(classes.values()) for classes in p_books.values())==extra_total
          assert all(set(classes)<=set(p_classes) for classes in p_books.values())
          assert dual["exact_source_p_digest_match_not_proof_of_biblical_heading_or_authorship"]
          assert all(isinstance(row["original_source_line"],int)
                     and len(row["original_body_sha256"])==64
                     and isinstance(row["all_extra_gap_full_original_p_digest_candidate_classes"],list)
                     for row in p_receipts)
          print("Original complete ThML paragraph exact digest source-extra categories:",
                json.dumps(p_classes,sort_keys=True))
          print("Original whole paragraph gap digest candidates by source book:",
                json.dumps(p_books,sort_keys=True))
          high=report["source_high_extra_unlinked_spans_other_same_chapter_native_location"]
          selected=high["bounded_cases_selected_for_original_native_replay"]
          assert 0<=selected<=4
          assert high["all_genuine_unique_source_extra_span_cases_at_least_100_words"]>=selected
          assert high["no_source_or_native_text_exported"] is True
          if selected:
              assert high["source_extra_outlier_cases_examined"]==selected
              assert high["complete_original_native_raw_entries_replayed"]>0
              assert high["no_original_words_or_native_key_strings_exposed"] is True
              assert high["source_xml_or_original_crosswire_native_binary_modified"] is False
              assert high["same_chapter_location_not_authorial_section_or_full_edition_parity"]
              assert len(high["original_source_line_hash_and_native_other_slot_counts_only"])==selected
          print("Source-extra long original prose same-chapter native exact-span search:",
                json.dumps(high,sort_keys=True))
          if selected:
              structure=high["original_pinned_ccel_extra_gap_paragraph_structure"]
              assert structure["source_xml_sha256"]==report["source_original_sha256"]
              assert structure["original_outlier_source_units_reconciled"]==selected
              assert structure["original_reference_markers_and_section_divisions_not_modified"]
              assert structure["original_words_or_native_keys_exposed"] is False
              assert structure["only_original_ccel_source_scripCom_claimed_reference_recorded"]
              assert structure["ccel_claimed_reference_is_not_native_mapping_or_authorial_edition_proof"]

              assert structure["original_authorial_print_editional_structure_parity_established"] is False
              items=structure["source_line_hash_and_original_adjacent_paragraph_structure_only"]
              assert len(items)==selected
              assert all(len(x["original_extra_word_spans_authentically_within_adjacent_source_div"])>0
                         and x["original_adjacent_div_unlinked_word_count"]>0
                         for x in items)
              print("Pinned CCEL section paragraph structure at extra-word original positions:",
                    json.dumps(structure,sort_keys=True))
          evidence = {
              "status": "SOURCE_STOCK_ONE_VOLUME_LEXICAL_CENSUS_NOT_PARITY",
              "resource_id": "mhc-crosswire",
              "source_volume": report["source_volume"],
              "volume_count": report["source_collection_volume_count"],
              "source_xml_sha256": report["source_original_sha256"],
              "original_sword_zip_sha256": report["stock_sword_archive_sha256"],
              "original_sword_raw_corpus_sha256":
                  report["stock_full_raw_content_sha256"],
              "original_source_verse_range_units": units,
              "original_source_divisions_without_visible_text_count": no_visible,
              "original_source_divisions_without_visible_text_line_sha_structure":
                  report["source_original_verse_and_range_body_evidence"][
                      "bounded_original_sections_without_visible_text_line_sha_structure"],
              "original_source_divisions_without_visible_text_examples_truncated":
                  report["source_original_verse_and_range_body_evidence"][
                      "original_sections_without_visible_text_examples_truncated"],
              "source_section_text_diagnostic_classes": classes,
              "source_book_text_diagnostic_classes": by_book,
              "source_book_word_relationship_subtypes": by_book_relations,
              "source_longer_original_native_K_run_scope_diagnostics": native_scope,
              "source_longer_original_scripRef_label_word_scope": link_scope,
              "source_longer_both_source_and_native_reference_label_word_scope": dual,
              "source_high_extra_unlinked_spans_other_same_chapter_native_location": high,
              "source_book_counts_are_not_editorial_content_parity": True,
              "closed_lexical_difference_types": lexical,
              "closed_word_sequence_relationship_types": relationships,
              "closed_same_words_punctuation_difference_types": punctuation,
              "closed_compiled_extra_word_position_types": locations,
              "closed_categories_are_diagnostic_not_authorial_edition_parity": True,
              "source_chapter_marker_count":
                  chapter["explicit_chapter_source_marker_count"],
              "source_reviewable_chapter_siblings":
                  chapter["original_chapter_siblings_reviewed_count"],
              "source_unreviewed_chapter_siblings":
                  chapter["original_chapter_siblings_not_reviewed_count"],
              "source_unreviewed_chapter_sibling_tag_counts":
                  chapter["original_unreviewed_sibling_tag_counts"],
              "source_authorial_loss_triage_classes": selection["classes"],
              "original_vs_compiled_full_text_punctuation_markup_parity": False,
              "rights_approved": False,
              "editorial_approved": False,
              "published": False,
              "original_source_words_or_binaries_exported": False,
          }
          path = (Path(os.environ["RUNNER_TEMP"]) /
                  "mhc-original-volume-safe-receipt.json")
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n",
                          encoding="utf-8")
          print("An exact source edition/structure proof is NOT established.")
          PY
      - name: Compare original Psalm first paragraphs with pinned independent KJV USFM titles
        if: env.SOURCE_VOLUME == '3'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path
          import urllib.request
          url="https://ebible.org/Scriptures/eng-kjv2006_usfm.zip"
          pinned="b6faa67117ccaba49df9e7df224a553f11758ae7c5d58f0f7979e2b73ac4480b"
          request=urllib.request.Request(url,headers={
              "User-Agent":"BibleResources-SourceResearch/1.0"})
          with urllib.request.urlopen(request,timeout=60) as response:
              if response.url!="https://ebible.org/Scriptures/eng-kjv2006_usfm.zip":
                  raise SystemExit("Independent KJV USFM source redirect changed")
              data=response.read(16*1024*1024+1)
          if (not data or len(data)>16*1024*1024
                  or sha256(data).hexdigest()!=pinned):
              raise SystemExit("Original independent KJV USFM archive changed its pinned SHA-256")
          path=Path(os.environ["RUNNER_TEMP"])/"original-independent-kjv-usfm.zip"
          path.write_bytes(data)
          print("Independent original KJV USFM SHA-256 pin verified:",pinned)
          PY
          python scripts/commentary_usfm_title_witness.py \
            --source-safe-receipt "$RUNNER_TEMP/mhc-original-volume-safe-receipt.json" \
            --usfm-zip "$RUNNER_TEMP/original-independent-kjv-usfm.zip" \
            --usfm-archive-sha256 "b6faa67117ccaba49df9e7df224a553f11758ae7c5d58f0f7979e2b73ac4480b" \
            --usfm-book-id PSA \
            --source-book Ps \
            --report "$RUNNER_TEMP/mhc-independent-usfm-psalm-title-evidence.json"
      - name: Upload only independent, pinned KJV USFM Psalm-title comparison metadata
        if: env.SOURCE_VOLUME == '3'
        uses: actions/upload-artifact@v4
        with:
          name: mhc-psalm-title-kjv-usfm-metadata-evidence
          path: ${{ runner.temp }}/mhc-independent-usfm-psalm-title-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload only independent, source-bound metadata-only volume receipt
        uses: actions/upload-artifact@v4
        with:
          name: mhc-ccel-volume-${{ matrix.source_volume }}-text-evidence
          path: ${{ runner.temp }}/mhc-original-volume-safe-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Explain private content boundaries
        if: always()
        run: |
          {
            echo '## Original MHC source-to-stock text research'
            echo 'Exactly one of six independently SHA-pinned CCEL volumes per CI run.'
            echo 'Private original commentary words, source XML and full SWORD binary are not uploaded.'
            echo 'A word-count or token match is not edition, punctuation, markup, rights or GUI approval.'
            echo 'No source or module edits, public catalogue, merge or release.'
          } >> "$GITHUB_STEP_SUMMARY"
