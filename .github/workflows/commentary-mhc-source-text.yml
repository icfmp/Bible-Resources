          assert dual["original_source_or_native_binary_modified"] is False
          assert dual["no_unlinked_word_category_implies_authorial_edition_parity_or_missing_text"]
          assert sum(dual["original_vs_native_unlinked_word_relation_classes"].values()) == expected_longer
          assert len(dual["original_line_SHA_and_two_sided_link_word_metadata_only_rows"]) == expected_longer
          extra_classes={
              "stock_plain_words_contiguous_inside_longer_original_plain_text",
