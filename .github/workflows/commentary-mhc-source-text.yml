name: Audit six original MHC volumes against pinned CrossWire raw commentary privately
on:
  pull_request:
    paths:
      - '.github/workflows/commentary-mhc-source-text.yml'
      - 'scripts/commentary_private_text_compare.py'
      - 'tests/test_commentary_private_text_compare.py'
      - 'scripts/commentary_source_native_boundaries.py'
      - 'tests/test_commentary_source_native_boundaries.py'
      - 'scripts/commentary_nonlink_word_alignment.py'
      - 'tests/test_commentary_nonlink_word_alignment.py'
      - 'scripts/commentary_nonlink_words.py'
      - 'tests/test_commentary_nonlink_words.py'
      - 'scripts/commentary_usfm_title_witness.py'
      - 'tests/test_commentary_usfm_title_witness.py'
      - 'config/commentary-intake/mhc-crosswire.json'
  workflow_dispatch:
    inputs:
      source_volume:
        description: Exact independently pinned original CCEL volume (1–6)
        type: choice
        required: true
        default: '1'
        options: ['1', '2', '3', '4', '5', '6']
permissions:
  contents: read
concurrency:
  group: mhc-original-text-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  observe_upstream_authoring_osis_metadata:
    name: Observe CrossWire upstream MHC authoring OSIS without publishing it
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pin upstream public GitLab revision and observe source bytes only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt -q
          python -m unittest discover -s tests -p 'test_commentary_osis_paragraph_presence.py' -v
          export GIT_TERMINAL_PROMPT=0 GIT_LFS_SKIP_SMUDGE=1
          upstream=https://gitlab.com/crosswire-bible-society/mhc.git
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          latest="$(timeout 120s git ls-remote "$upstream" refs/heads/main | awk '{print $1}')"
          if ! [[ "$latest" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Upstream source ref was not verifiable; no source trusted' >&2
            exit 1
          fi
          # Initially confirm the independently observed 2022 publisher revision,
          # not an unreviewed later commit or arbitrary moving target.
          if [[ "$latest" != 537591a9* ]]; then
            echo 'Official CrossWire MHC upstream HEAD changed: require review/re-pin' >&2
            exit 1
          fi
          timeout 240s git -c core.hooksPath=/dev/null clone --depth 1 --branch main \
            --single-branch --no-tags "$upstream" "$scratch/source" 1>&2
          actual="$(git -C "$scratch/source" rev-parse HEAD)"
          if [ "$actual" != "$latest" ]; then
            echo 'Official CrossWire MHC source ref changed during clone' >&2
            exit 1
          fi
          UPSTREAM_SOURCE="$scratch/source" UPSTREAM_SHA="$actual" python - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path
          import re
          import xml.parsers.expat as expat
          import json
          import sys
          from urllib.parse import urlsplit
          from io import BytesIO
          from urllib.request import Request,urlopen
          from zipfile import ZipFile

          root=Path(os.environ["UPSTREAM_SOURCE"])
          manifest=json.loads(Path("config/commentary-intake/mhc-crosswire.json").read_text())
          source_pin=manifest.get("commentary_source",{}).get("original_authoring_osis",{})
          if (manifest["module_id"]!="MHC" or manifest["version"]!="2.2"
                  or source_pin.get("observed_upstream_commit_sha")!=os.environ["UPSTREAM_SHA"]):
              raise SystemExit("Original MHC manifest/upstream source commit pin mismatch")
          if sorted(p.name for p in root.iterdir() if p.name!=".git") != [
              "README.md","mhc.conf","mhc.osis.xml","mhcBuild.sh"
          ]:
              raise SystemExit("Unreviewed source repository member set")
          expected={"mhc.osis.xml":180*1024*1024, "mhc.conf":128*1024,
                    "mhcBuild.sh":128*1024, "README.md":128*1024}
          metadata={}
          for name,max_size in expected.items():
              path=root/name
              if not path.is_file() or path.is_symlink() or not 0<path.stat().st_size<=max_size:
                  raise SystemExit("Invalid original upstream source member")
              digest=sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda:handle.read(1024*1024),b""):
                      digest.update(block)
              metadata[name]={"sha256":digest.hexdigest(),"size":path.stat().st_size}

          required_pins={
              "mhc.osis.xml":("authoring_osis_sha256","authoring_osis_bytes"),
              "mhc.conf":("source_conf_sha256",None),
              "mhcBuild.sh":("upstream_build_script_sha256",None),
              "README.md":("readme_sha256",None),
          }
          for filename,(hash_field,size_field) in required_pins.items():
              observed=metadata[filename]
              if observed["sha256"]!=source_pin.get(hash_field):
                  raise SystemExit("Official source differs from independently reviewed SHA pin")
              if size_field and observed["size"]!=source_pin.get(size_field):
                  raise SystemExit("Official source differs from reviewed byte length")
          # Parse markup data ONLY; never execute the upstream build script.
          # Expat rejects DTD/entity extension; streamed events avoid exporting prose.
          p=expat.ParserCreate()
          seen={"osis":0,"osisText":0,"div":0,"reference":0}
          roots=[]
          depth=0
          def start(name,attrs):
              global depth
              depth+=1
              tag=name.split(":")[-1]
              if depth==1: roots.append(tag)
              if tag in seen: seen[tag]+=1
          def end(name):
              global depth
              depth-=1
          def reject(*args):
              raise ValueError("Unreviewed original upstream XML DTD/entity declaration")
          p.StartElementHandler=start
          p.EndElementHandler=end
          p.StartDoctypeDeclHandler=reject
          p.EntityDeclHandler=reject
          p.ExternalEntityRefHandler=lambda *args: 0
          with (root/"mhc.osis.xml").open("rb") as handle:
              while block:=handle.read(1024*1024):
                  p.Parse(block,False)
              p.Parse(b"",True)
          if roots!=["osis"] or seen["osisText"]<1 or seen["div"]<1:
              raise SystemExit("Expected original OSIS document structure not confirmed")
          # Diagnose whether the publisher's source has addressable chapter
          # structures before any proposed correction. Count *identifiers*,
          # never output any unreviewed authorial prose or titles.
          from collections import Counter
          from lxml import etree
          source_xml=etree.parse(str(root/"mhc.osis.xml"),etree.XMLParser(
              resolve_entities=False,no_network=True,load_dtd=False,
              recover=False,huge_tree=True))
          div_nodes=[node for node in source_xml.iter()
                     if isinstance(node.tag,str)
                     and node.tag.rsplit("}",1)[-1]=="div"]
          attrs=Counter(key.rsplit("}",1)[-1] for node in div_nodes
                        for key in node.attrib)
          types=Counter(node.get("type","UNSPECIFIED") for node in div_nodes)
          # Derive requested scopes from original CCEL `scripCom` claims,
          # never hard-code Bible-book/chapter aliases in the source inspector.
          sample_cases=manifest["commentary_source"][
              "original_authoring_source_paragraph_cases"]
          if not 1<=len(sample_cases)<=8:
              raise SystemExit("Unreviewed source-bound structural scopes")
          chapter_scopes=[]
          for case in sample_cases:
              original_ref=case.get("original_source_marker_osisRef","")
              if sha256(original_ref.encode("utf-8")).hexdigest()!=case[
                      "original_full_reference_sha256"]:
                  raise SystemExit("Source chapter locator differs from pinned marker SHA")
              match=re.fullmatch(
                  r"Bible:([1-4]?[A-Za-z][A-Za-z0-9]*)\.([1-9][0-9]*)\.[1-9][0-9]*"
                  r"(?:-[1-4]?[A-Za-z][A-Za-z0-9]*\.[1-9][0-9]*\.[1-9][0-9]*)?",
                  original_ref)
              if match is None:
                  raise SystemExit("Original CCEL section is not an approved verse locator")
              chapter_scopes.append((case["original_full_reference_sha256"],
                                    match.group(1),match.group(2)))
          print("Official source OSIS div structural attribute names/counts:",
                json.dumps(dict(sorted(attrs.items())),sort_keys=True))
          print("Official source OSIS div type labels/counts (structural only):",
                json.dumps(dict(sorted(types.items())),sort_keys=True))
          book_divisions={node.get("osisID"):node for node in div_nodes
                          if node.get("type")=="book"}
          if len(book_divisions)!=66:
              raise SystemExit("Official source book divisions ambiguous")
          for ref_sha,book,chapter in chapter_scopes:
              book_div=book_divisions.get(book)
              if book_div is None:
                  raise SystemExit("Pinned CCEL biblical book lacks an OSIS book division")
              chapter_ref=book+"."+chapter
              actual_markers=Counter()
              linked_targets=0
              descendants=0
              for node in book_div.iter():
                  if not isinstance(node.tag,str):
                      continue
                  descendants+=1
                  tag=node.tag.rsplit("}",1)[-1]
                  marker_values=[
                      node.get(key,"") for key in ("osisID","sID","eID")
                  ]
                  if any(chapter_ref==item or
                         item.startswith(chapter_ref+".")
                         for val in marker_values for item in val.split()):
                      actual_markers[tag]+=1
                  if tag=="reference" and any(
                         chapter_ref==item or item.startswith(chapter_ref+".")
                         for item in node.get("osisRef","").split()):
                      linked_targets+=1
              print("Authenticated source book/chapter structural metadata only:",
                    json.dumps({
                      "original_source_marker_ref_sha256":ref_sha,
                      "book_xml_descendant_element_count":descendants,
                      "local_chapter_addressable_element_tag_counts":
                          dict(sorted(actual_markers.items())),
                      "cross_reference_element_count_targeting_chapter_not_scope":
                          linked_targets,
                      "source_or_compiled_paragraph_owner_not_inferred":True,
                    },sort_keys=True))
          del div_nodes,source_xml
          conf=(root/"mhc.conf").read_text(encoding="utf-8")
          def confval(key):
              match=re.findall(r"(?m)^"+re.escape(key)+r"=([^\r\n]*)$",conf)
              if len(match)!=1: raise SystemExit("Original upstream .conf has ambiguous critical metadata")
              return match[0].strip()
          version=confval("Version")
          driver=confval("ModDrv")
          source_type=confval("SourceType")
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,2}",version):
              raise SystemExit("Original upstream source version has an unreviewed shape")
          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9]{1,19}",driver) or not re.fullmatch(
                  r"[A-Za-z][A-Za-z0-9]{1,19}",source_type):
              raise SystemExit("Unreviewed upstream build format metadata shape")
          print("Official .conf driver / source type (observed, NOT normalized):",
                driver,source_type)
          # Compare against ACTUAL pinned original published .conf, never
          # against a guessed driver spelling. Do not execute upstream scripts.
          req=Request(manifest["sword_zip_url"],
                      headers={"User-Agent":"BibleResources-OriginalMHCSourceParity/1.0"})
          with urlopen(req,timeout=90) as response:
              stock_zip=response.read(40*1024*1024+1)
          if (not stock_zip or len(stock_zip)>40*1024*1024
                  or sha256(stock_zip).hexdigest()!=manifest["archive_sha256"]):
              raise SystemExit("Original public SWORD ZIP changed from pin")
          with ZipFile(BytesIO(stock_zip)) as package:
              conf_members=[n for n in package.namelist()
                            if n.lower().endswith("/mhc.conf")]
              if len(conf_members)!=1 or package.getinfo(conf_members[0]).file_size>128*1024:
                  raise SystemExit("Pinned original SWORD configuration missing")
              stock_conf=package.read(conf_members[0]).decode("utf-8")
          def stockfield(key):
              m=re.findall(r"(?m)^"+re.escape(key)+r"=([^\r\n]*)$",stock_conf)
              if len(m)!=1: raise SystemExit("Original stock .conf critical field ambiguous")
              return m[0].strip()
          stock_fields={key:stockfield(key) for key in (
              "Version","ModDrv","SourceType","DistributionLicense"
          )}
          source_fields={
              "Version":version,
              "ModDrv":driver,
              "SourceType":source_type,
              "DistributionLicense":confval("DistributionLicense"),
          }
          print("Pinned official SWORD ZIP SHA256 verified:",sha256(stock_zip).hexdigest())
          print("Original zipped stock .conf SHA256:",
                sha256(stock_conf.encode("utf-8")).hexdigest())
          print("Upstream authoring .conf vs ORIGINAL downloaded .conf metadata:",
                json.dumps({key:{
                    "upstream":source_fields[key],
                    "pinned_stock":stock_fields[key],
                    "equal":source_fields[key]==stock_fields[key]
                } for key in ("Version","ModDrv","SourceType","DistributionLicense")},
                sort_keys=True))
          print("Published .conf matches independently authenticated source .conf",
                "on these four fields:",
                all(source_fields[key]==stock_fields[key] for key in source_fields))
          print("Full source OSIS/native K/I/TOP paragraph parity is NOT YET tested.")

          # Target cases are SOURCE-HASH-PINNED data, not content-specific
          # code exceptions or guessed verse mappings. The generic search
          # reports only bounded token lengths and presence/absence, never
          # original CrossWire/CCEL XML words or native verse strings.
          sys.path.insert(0,str(Path.cwd()/"scripts"))
          from commentary_osis_paragraph_presence import (
              original_ccel_paragraph_words,
              exact_original_paragraph_runs_in_osis,
          )
          source_cases=manifest["commentary_source"][
              "original_authoring_source_paragraph_cases"]
          volumes={v["number"]:v for v in manifest[
              "commentary_source"]["xml_witness_volumes"]}
          if (not isinstance(source_cases,list) or not 1<=len(source_cases)<=8
                  or len({c["source_volume"] for c in source_cases})!=len(source_cases)):
              raise SystemExit("Unreviewed original CCEL paragraph selection")
          original_cases=[]
          for candidate in source_cases:
              volume=volumes[candidate["source_volume"]]
              req=Request(volume["url"],
                          headers={"User-Agent":"BibleResources-MHC-OriginalParagraphStudy/1.0"})
              with urlopen(req,timeout=90) as response:
                  if urlsplit(response.url).hostname not in ("ccel.org","www.ccel.org"):
                      raise SystemExit("Unreviewed original CCEL source origin redirect")
                  original_xml=response.read(32*1024*1024+1)
              if (not original_xml or len(original_xml)>32*1024*1024
                      or sha256(original_xml).hexdigest()!=volume["sha256"]):
                  raise SystemExit("Original CCEL XML differs from pinned SHA")
              verified_words=original_ccel_paragraph_words(
                  original_xml,expected_xml_sha256=volume["sha256"],
                  case=candidate)
              original_cases.append((candidate,verified_words))
          report=exact_original_paragraph_runs_in_osis(
              (root/"mhc.osis.xml").read_bytes(),
              expected_osis_sha256=source_pin["authoring_osis_sha256"],
              original_cases=original_cases)
          print("Pinned CCEL exact original paragraph vs official original",
                "authoring OSIS (closed metadata; no prose, no key addresses):",
                json.dumps(report,sort_keys=True))
          print("An exact word run ANYWHERE in OSIS does not establish original",
                "verse ownership, historical edition identity or rights.")

          print("Official upstream source commit (not equivalent to compiled ZIP SHA):",
                os.environ["UPSTREAM_SHA"])
          print("Authoring-file original bytes and independent SHA256:",
                json.dumps(metadata,sort_keys=True))
          print("Original authoring OSIS XML root and closed tag counts:",
                roots[0],json.dumps(seen,sort_keys=True))
          print("Upstream .conf version vs pinned downloaded CrossWire 2.2:",
                version,version==manifest["version"])
          print("Original build script inspected by SHA only; never executed.")
          print("Original source OSIS to compiled raw parity: NOT YET TESTED.")
          print("Electronic rights / CCEL derived layers: NOT AUTHORIZED BY THIS CHECK.")
          print("Original GitLab source and original ZIP: unmodified and unpublished.")
          PY
  observe_kjv_independent_usfm_metadata:
    name: Observe independent KJV Psalm USFM witness, without importing source text
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Observe independent eBible KJV Psalm USFM title metadata (candidate witness only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from io import BytesIO
          import os
          import re
          import urllib.request
          from zipfile import ZipFile
          url = "https://ebible.org/Scriptures/eng-kjv2006_usfm.zip"
          req=urllib.request.Request(url,headers={"User-Agent":"BibleResources-SourceResearch/1.0"})
          with urllib.request.urlopen(req,timeout=60) as response:
              if not response.url.startswith("https://ebible.org/"):
                  raise SystemExit("Unreviewed eBible redirect; abort observation")
              data=response.read(16*1024*1024+1)
          if not data or len(data)>16*1024*1024:
              raise SystemExit("Unreviewed eBible KJV archive size")
          print("Independent eBible KJV USFM archive SHA-256 (observation only):",
                sha256(data).hexdigest())
          if sha256(data).hexdigest() != "b6faa67117ccaba49df9e7df224a553f11758ae7c5d58f0f7979e2b73ac4480b":
              raise SystemExit("Independently pinned eBible KJV USFM changed")
          found=[]
          seen_book_codes=set()
          with ZipFile(BytesIO(data)) as archive:
              files=[n for n in archive.namelist() if n.lower().endswith((".usfm",".sfm"))]
              if len(files)>100:
                  raise SystemExit("Unreviewed USFM archive file count")
              for name in files:
                  if archive.getinfo(name).file_size>4*1024*1024:
                      raise SystemExit("Unreviewed USFM file size")
                  raw=archive.read(name)
                  text=raw.decode("utf-8-sig")
                  found_codes=re.findall(r"(?m)^\\id\s+([A-Z0-9]{3})\b",text)
                  seen_book_codes.update(found_codes)
                  if "PSA" in found_codes:
                      found.append({
                          "psalm_file_sha256":sha256(raw).hexdigest(),
                          "psalm_file_bytes":len(raw),
                          "chapter_markers":len(re.findall(r"(?m)^\\c\s+\d+",text)),
                          "d_title_markers":len(re.findall(r"(?m)^\\d\s+",text)),
                      })
          print("Independent USFM observed book codes and Psalm candidate count:",
                sorted(seen_book_codes),len(found))
          if len(found)!=1:
              raise SystemExit("Independent KJV USFM must have exactly one Psalm book")
          print("Independent eBible KJV USFM candidate ZIP SHA-256:",sha256(data).hexdigest())
          print("Independent eBible KJV Psalm USFM title-only metadata:",found[0])
          print("Only observation: no CCEL or CrossWire word comparison yet; no source text published")
          PY
  review-one-actual-original-volume:
    name: Original CCEL volume ${{ matrix.source_volume }} — exact stock text diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source_volume: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{0}]', inputs.source_volume) || '[1,2,3,4,5,6]') }}
    env:
      SOURCE_VOLUME: ${{ matrix.source_volume }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-neutral one/collection selection and private text comparison
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_commentary_private_text_compare.py' -v
          python -m unittest discover -s tests -p 'test_commentary_source_native_boundaries.py' -v
          python -m unittest discover -s tests -p 'test_commentary_nonlink_word_alignment.py' -v
          python -m unittest discover -s tests -p 'test_commentary_nonlink_words.py' -v
          python -m unittest discover -s tests -p 'test_commentary_prose_cross_slot.py' -v
          python -m unittest discover -s tests -p 'test_commentary_usfm_title_witness.py' -v
      - name: Install real original native SWORD readers
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update -qq
          timeout 150s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y libsword-dev
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_index.cpp \
            -o "$RUNNER_TEMP/commentary-native-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_raw_corpus.cpp \
            -o "$RUNNER_TEMP/commentary-private-raw" -lsword
      - name: Compare entire SHA-pinned original volume with complete unchanged CrossWire stock
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_private_text_compare.py \
            --resource-id mhc-crosswire \
            --source-volume "$SOURCE_VOLUME" \
            --native-index-binary "$RUNNER_TEMP/commentary-native-index" \
            --native-raw-binary "$RUNNER_TEMP/commentary-private-raw" \
            --report "$RUNNER_TEMP/mhc-original-volume-text-evidence.json"
      - name: Report only bounded metadata and explicitly incomplete authorial parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
              "mhc-original-volume-text-evidence.json").read_text(encoding="utf-8"))
          assert report["resource_id"] == "mhc-crosswire"
          assert report["source_volume"] == int(os.environ["SOURCE_VOLUME"])
          assert report["source_is_multivolume_collection"] is True
          assert report["source_collection_volume_count"] == 6
          assert report["native_full_corpus_rechecked"] is True
          assert report["source_text_or_sword_bytes_in_receipt"] is False
          assert report["original_exact_edition_proven"] is False
          assert report["original_structure_notes_quotes_and_paragraphs_parity_proven"] is False
          assert report["copyright_and_redistribution_approved"] is False
          assert report["editorial_approved"] is False
          assert report["published"] is False
          print("MHC volume:", report["source_volume"])
          print("Original verse/range source units:",
                report["source_original_verse_and_range_body_evidence"][
                    "original_verse_or_range_body_count"])
          print("Original sections without visible source text:",
                report["source_original_verse_and_range_body_evidence"][
                    "original_sections_without_visible_text_count"])
          print("Text comparison diagnostic classes only:",
                json.dumps(report["text_diagnostic"][
                    "per_source_marker_text_diagnostic_counts"], sort_keys=True))
          print("Original chapter-sibling XML review status:",
                json.dumps({
                    "reviewed": report["source_original_chapter_neighbor_evidence"][
                        "original_chapter_siblings_reviewed_count"],
                    "unreviewed": report["source_original_chapter_neighbor_evidence"][
                        "original_chapter_siblings_not_reviewed_count"],
                    "unreviewed_tags": report["source_original_chapter_neighbor_evidence"][
                        "original_unreviewed_sibling_tag_counts"],
                }, sort_keys=True))
          selection = report["source_authorial_word_loss_attention_selection"]
          assert selection["no_authorial_or_compiled_text_modified"] is True
          assert selection["source_punctuation_and_markup_parity_not_proven"] is True
          print("Authorial word-order loss versus stock-only/other differences:",
                json.dumps(selection["classes"], sort_keys=True))
          units = report["source_original_verse_and_range_body_evidence"][
              "original_verse_or_range_body_count"]
          classes = report["text_diagnostic"][
              "per_source_marker_text_diagnostic_counts"]
          allowed = {
              "exact_unicode_text_match", "edge_whitespace_difference_only",
              "interior_whitespace_difference_only",
              "lexical_text_or_punctuation_difference",
              "missing_original_start_in_native_raw",
              "stock_raw_fragment_not_strict_xml",
          }
          assert set(classes) <= allowed
          assert all(type(v) is int and v >= 0 for v in classes.values())
          no_visible = report["source_original_verse_and_range_body_evidence"][
              "original_sections_without_visible_text_count"]
          assert sum(classes.values()) + no_visible == units and units > 0
          assert report["source_original_verse_and_range_body_evidence"][
              "original_reference_and_adjacent_divisions_not_modified"] is True
          chapter = report["source_original_chapter_neighbor_evidence"]
          assert (chapter["original_chapter_siblings_reviewed_count"] +
                  chapter["original_chapter_siblings_not_reviewed_count"] ==
                  chapter["explicit_chapter_source_marker_count"])
          details = report["text_diagnostic"]
          lexical = details["lexical_disagreement_classification"]
          relationships = details["different_word_sequence_relationship_subtypes"]
          punctuation = details["same_words_different_punctuation_subtypes"]
          locations = details["stock_containment_additional_word_position_counts"]
          for group in (lexical, relationships, punctuation, locations):
              assert isinstance(group, dict)
              assert all(type(key) is str and len(key) <= 100
                         and key.replace("_", "").isalnum()
                         and key == key.lower()
                         and type(count) is int and count >= 0
                         for key, count in group.items())
          assert sum(lexical.values()) == classes.get(
              "lexical_text_or_punctuation_difference", 0)
          assert sum(punctuation.values()) == lexical.get(
              "same_unicode_word_tokens_different_punctuation", 0)
          assert sum(locations.values()) == relationships.get(
              "source_words_contiguous_inside_longer_stock", 0)
          print("Closed lexical difference kinds:", json.dumps(lexical, sort_keys=True))
          print("Closed source/stock word-sequence relationships:",
                json.dumps(relationships, sort_keys=True))
          print("Closed punctuation-only subtypes:",
                json.dumps(punctuation, sort_keys=True))
          by_book = details["book_counts"]
          if not isinstance(by_book, dict) or len(by_book) > 66:
              raise SystemExit("Unbounded original per-book source review data")
          import re
          assert all(re.fullmatch(r"[1-4]?[A-Za-z][A-Za-z0-9]{1,15}", book)
                     for book in by_book)
          assert all(isinstance(kinds, dict)
                     and set(kinds) <= allowed
                     and all(type(value) is int and value >= 0
                             for value in kinds.values())
                     for kinds in by_book.values())
          total_book = {}
          for kinds in by_book.values():
              for status, n in kinds.items():
                  total_book[status] = total_book.get(status, 0) + n
          assert total_book == classes
          print("Source book identifiers and text-diagnostic counts only:",
                json.dumps(by_book, sort_keys=True))
          by_book_relations = details["source_book_word_relationship_subtypes"]
          if not isinstance(by_book_relations, dict) or len(by_book_relations)>66:
              raise SystemExit("Unbounded original source-book word relations")
          assert set(by_book_relations) == set(by_book)
          assert all(re.fullmatch(r"[1-4]?[A-Za-z][A-Za-z0-9]{1,15}", name)
                     and isinstance(kinds,dict)
                     and set(kinds) <= set(relationships)
                     and all(type(n) is int and n>=0 for n in kinds.values())
                     for name,kinds in by_book_relations.items())
          summed = {}
          for kinds in by_book_relations.values():
              for category,count in kinds.items():
                  summed[category] = summed.get(category,0) + count
          assert summed == relationships
          print("Source book word-order/selection relationship counts:",
                json.dumps(by_book_relations, sort_keys=True))
          native_scope=report["source_longer_original_native_run_structural_scope"]
          expected_longer=relationships.get("stock_words_in_order_with_extra_source_words",0)
          assert native_scope["source_longer_same_start_cases"] == expected_longer
          assert native_scope["all_original_source_longer_cases_have_exact_native_K_SHA_attestation"]
          assert native_scope["all_original_source_longer_cases_reviewed_without_sampling"]
          assert native_scope["original_source_or_stock_binary_modified"] is False
          assert native_scope["original_edition_or_section_layout_parity_proven"] is False
          assert sum(native_scope["native_run_vs_source_declared_scope_classes"].values()) == expected_longer
          assert len(native_scope["original_source_native_K_run_bounded_sha_only_rows"]) == expected_longer
          assert native_scope["original_book_case_counts"] == {
              book:groups["stock_words_in_order_with_extra_source_words"]
              for book,groups in by_book_relations.items()
              if groups.get("stock_words_in_order_with_extra_source_words",0)
          }
          print("Original longer-source native occupied K-run scope classes:",
                json.dumps(native_scope["native_run_vs_source_declared_scope_classes"],
                           sort_keys=True))
          print("Source-longer original book distribution:",
                json.dumps(native_scope["original_book_case_counts"], sort_keys=True))
          link_scope=report["source_longer_original_link_label_word_scope"]
          assert link_scope["source_longer_case_count"] == expected_longer
          assert link_scope["all_original_source_longer_cases_included"]
          assert link_scope["removed_only_source_reference_label_word_positions"]
          assert link_scope["original_source_or_SWORD_binary_modified"] is False
          assert link_scope["full_punctuation_markup_paragraph_editional_parity_proven"] is False
          assert link_scope["original_book_case_counts"] == native_scope["original_book_case_counts"]
          assert sum(link_scope["source_link_label_exclusion_classes"].values()) == expected_longer
          assert len(link_scope["original_line_sha_and_closed_link_word_metadata_only_rows"]) == expected_longer
          print("Source longer word differences after excluding only source scripRef labels:",
