name: One-shot OSIS evidence helper registry refresh
on:
  push:
    branches:
      - maintenance/package-bible-osis-evidence-20261122
permissions:
  contents: write
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate registry and remove one-shot job
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintenance-osis-registry-once.yml
          python scripts/tool_registry.py --write
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          python scripts/tool_registry.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update OSIS evidence library registry"
          git push
