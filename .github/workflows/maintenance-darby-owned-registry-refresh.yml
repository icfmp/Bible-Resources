name: One-shot Darby module tool inventory update
on:
  pull_request:
    paths:
      - '.github/workflows/maintenance-darby-owned-registry-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/darby-private-native-module-owner-20261121
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove disposable workflow, regenerate and verify exact inventory
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintenance-darby-owned-registry-refresh.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync registry after module-owning Darby private native audit'
          git push origin HEAD:maintenance/darby-private-native-module-owner-20261121
