name: Register attested LSG 0.1.0 in SWORD catalogue

# One-time bootstrap of the already published, source-audited binary.
# Keep this separate from still-open research PRs #18/#24. The published
# GitHub Release is an immutable source; never recompile Scripture here.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-lsg-in-catalogue.yml'
      - 'scripts/materialize_attested_lsg_release.py'
      - 'config/catalogue-import-lsg-0.1.0.json'
      - 'modules/lsg-1910/metadata.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install repo validator and independent stock SWORD reader
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y diatheke >/dev/null

      - name: Check importer ZIP corruption and fingerprint regressions
        run: python -m unittest discover -s tests -p 'test_materialize_attested_lsg_release.py' -v

      - name: Obtain the exact already-published package and source audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/approved-release"
          gh release download lsg-0.1.0 --repo "$GITHUB_REPOSITORY" \
            --pattern BRLSG1910-0.1.0.zip \
            --pattern lsg-stable-segond.json \
            --dir "$RUNNER_TEMP/approved-release"

      - name: Verify full evidence chain and install unchanged SWORD files
        run: |
          python scripts/materialize_attested_lsg_release.py \
            --release-zip "$RUNNER_TEMP/approved-release/BRLSG1910-0.1.0.zip" \
            --source-audit "$RUNNER_TEMP/approved-release/lsg-stable-segond.json" \
            --manifest config/catalogue-import-lsg-0.1.0.json
          python scripts/validate.py
          # The previously committed official snapshot still says zero modules.
          # Preserve it, generate the newly approved catalogue with the normal
          # builder, then commit the new snapshot. Verify by rebuilding with
          # the snapshot present: no security gate is left disabled.
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('catalog/v1/catalog.json')
          previous=json.loads(path.read_text(encoding='utf-8'))
          assert previous=={
              'modules':[],
              'repository':'Bible Resources',
              'repository_url':'https://icfmp.github.io/Bible-Resources/',
              'schema_version':1,
          },'Unexpected preexisting official catalogue state'
          print('Verified original zero-module catalogue before reviewed update')
          PY
          mv catalog/v1/catalog.json "$RUNNER_TEMP/lsg-catalogue-before.json"
          python scripts/build.py --output dist --base-url https://icfmp.github.io/Bible-Resources/
          cp dist/catalog/v1/catalog.json catalog/v1/catalog.json
          # Mandatory second build proves published manifest and source
          # snapshot are identical and the original mismatch guard still runs.
          python scripts/build.py --output dist --base-url https://icfmp.github.io/Bible-Resources/
          python scripts/smoke.py
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path("dist/catalog/v1/catalog.json").read_text())
          matches=[m for m in o["modules"] if m["sword_id"]=="BRLSG1910" and m["version"]=="0.1.0"]
          assert len(matches)==1, "Published catalogue must contain exactly the approved LSG"
          assert Path("dist/sword/packages/BRLSG1910.zip").is_file()
          assert Path("dist/sword/mods.d/brlsg1910.conf").is_file()
          print("One approved SWORD catalogue module and package verified")
          PY

      - name: Commit permanent source-audited module to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/lsg-1910 catalog/v1/catalog.json
          git diff --cached --quiet && { echo 'Refusing to republish unchanged module'; exit 1; }
          git commit -m 'Publish approved LSG 1910 0.1.0 SWORD payload and source audit in main'
          git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN do not start new workflow runs.
      # Deploy the independently validated catalogue in this very run.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
