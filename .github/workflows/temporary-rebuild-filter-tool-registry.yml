name: Temporary branch-only SWORD registry metadata refresh
on:
  push:
    branches:
      - fix/generic-sword-osis-option-filter-validation
    paths:
      - '.github/workflows/temporary-rebuild-filter-tool-registry.yml'
      - 'scripts/validate.py'
      - 'scripts/sword_option_filters.py'
      - 'tests/test_sword_option_filters.py'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate only the canonical retained tool registry
        run: |
          set -euo pipefail
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'chore(tools): register generic SWORD option-filter validation'
            git push origin HEAD:refs/heads/fix/generic-sword-osis-option-filter-validation
          fi
