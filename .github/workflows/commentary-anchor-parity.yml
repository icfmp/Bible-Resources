name: Compare commentary original reference anchors to stock SWORD (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/commentary-anchor-parity.yml'
      - 'scripts/commentary_anchor_parity.py'
      - 'scripts/commentary_osis_mixed_transport_probe.py'
      - 'scripts/commentary_xml_witness.py'
      - 'scripts/commentary_native_inventory.py'
      - 'scripts/sword_native_commentary_index.cpp'
      - 'tests/test_commentary_anchor_parity.py'
      - 'config/commentary-intake/**'
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Reviewed source-neutral commentary intake ID"
        type: string
        required: true
        default: mhcc-crosswire
      probe_osis_key:
        description: "Optional one fully-qualified OSIS verse to examine (diagnostic only)"
        type: string
        required: false
        default: John.3.16
      test_private_full_xiphos:
        description: "Optional corrected MHC full-candidate Xiphos GUI experiment; inconclusive is not approval"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: commentary-anchor-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select-source:
    runs-on: ubuntu-latest
    outputs:
      resources: ${{ steps.select.outputs.resources }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select exactly the modified commentary manifests
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RESOURCE_ID: ${{ inputs.resource_id || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          directory = Path("config/commentary-intake")
          registered = {}
          for path in sorted(directory.glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("category") == "commentary" and data.get("resource_id") == path.stem:
                  registered[path.as_posix()] = path.stem

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              requested = os.environ["INPUT_RESOURCE_ID"]
              if requested not in registered.values():
                  raise SystemExit(f"Unknown commentary manifest: {requested!r}")
              resources = [requested]
          else:
              # Default pull_request checkout is GitHub's synthetic merge commit:
              # first parent = base, HEAD = tested merged candidate.
              changed = set(subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^1", "HEAD"],
                  text=True).splitlines())
              resources = sorted(set(registered[path] for path in changed if path in registered))
              if not resources:
                  # Preserve the historical default when only reusable code or
                  # a corrections plan changes; no fabricated MHC acceptance.
                  resources = ["mhcc-crosswire"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("resources=" + json.dumps(resources) + "\n")
          print("Selected source identities:", ", ".join(resources))
          PY

  original_to_native_anchors:
    needs: select-source
    strategy:
      fail-fast: false
      matrix:
        resource_id: ${{ fromJSON(needs.select-source.outputs.resources) }}
    name: Original anchors (${{ matrix.resource_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESOURCE_ID: ${{ matrix.resource_id }}
      PROBE: ${{ github.event.inputs.probe_osis_key || 'John.3.16' }}
      RUN_PRIVATE_XIPHOS: ${{ github.event_name == 'workflow_dispatch' && inputs.test_private_full_xiphos || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source XML and stock SWORD reader dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y libsword-dev libsword-utils diatheke
          if [[ "$RESOURCE_ID" == "mhc-crosswire" && "$RUN_PRIVATE_XIPHOS" == "true" ]]; then
            timeout 180s sudo apt-get -o Acquire::Retries=0 \
              -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y \
              xiphos xvfb xdotool xclip dbus-x11
          fi
      - name: Build native metadata-only commentary key scanner
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_index.cpp \
            -o "${RUNNER_TEMP}/commentary-native-index" -lsword
      - name: Compile private original commentary raw reader for bounded source-body locations
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "${RUNNER_TEMP}/commentary-private-raw" -lsword
      - name: Compare complete original reference anchors to exact stock occupied keys
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_FULL=()
          if [[ "$RESOURCE_ID" == "mhc-crosswire" ]]; then
            PRIVATE_FULL=(--private-full-probe)
            if [[ "$RUN_PRIVATE_XIPHOS" == "true" ]]; then
              PRIVATE_FULL+=(--private-full-xiphos-probe)
            fi
          fi
          python scripts/commentary_anchor_parity.py \
            --resource-id "$RESOURCE_ID" \
            --native-inspector "${RUNNER_TEMP}/commentary-native-index" \
            --native-raw-binary "${RUNNER_TEMP}/commentary-private-raw" \
            --private-alias-probe "${PRIVATE_FULL[@]}" \
            --probe-osis-key "$PROBE" \
            --report "${RUNNER_TEMP}/commentary-anchor-receipt.json"
      - name: Report source-to-SWORD key diagnostics without source prose
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "commentary-anchor-receipt.json")
              .read_text(encoding="utf-8"))
          if report.get("status") == "ordered_original_xml_volume_anchor_diagnostics_not_parity":
              location = report["original_unoccupied_start_prose_location"]
              assert location["status"] in {
                  "bounded_original_source_prose_location_not_text_parity",
                  "no_canonically_valid_unoccupied_source_starts_to_scan",
                  "more_than_reviewed_probe_budget_not_scanned",
              }
              assert report["published"] is False
              if location["status"] == "bounded_original_source_prose_location_not_text_parity":
                  assert location["fully_crosschecked_original_native_corpus"] is True
                  print("Canonical unoccupied-start original prose location (not full parity):",
                        json.dumps(location, sort_keys=True))
              else:
                  print("Canonical unoccupied-start source prose location:",
                        location["status"])
              attempt_report = report["private_original_source_first_verse_index_alias_probes"]
              assert attempt_report["published"] is False
              print("Private original commentary chapter-only, index-only SWORD experiments (NO RELEASE):",
                    json.dumps(attempt_report, sort_keys=True))
              if os.environ["RESOURCE_ID"] == "mhc-crosswire":
                  full = report.get("private_complete_original_index_alias_rebuild")
                  if full is None:
                      raise AssertionError("Expected complete private MHC rebuild evidence")
                  print("Whole-module private source/native readback, no release:",
                        json.dumps({
                            "status": full["status"],
                            "readback_completed": full["readback_completed"],
                            "source_numbered_K_coverage": full.get("source_numbered_K_coverage"),
                            "source_intro_I_coverage": full.get("source_intro_I_coverage"),
                            "source_TOP_count": full.get("source_TOP_count"),
                            "compiled_TOP_count": full.get("compiled_TOP_count"),
                            "all_original_TOP_positions_exact_raw_bytes":
                                full.get("all_original_TOP_positions_exact_raw_bytes"),
                            "planned_extra_index_keys": full.get("planned_extra_index_keys"),
                            "full_original_K_I_U_native_entry_parity_proven":
                                full.get("full_original_K_I_U_native_entry_parity_proven"),
                            "private_original_vs_alias_cli_chapter_repetition_probe":
                                full.get("private_original_vs_alias_cli_chapter_repetition_probe"),
                            "private_real_xiphos_alias_navigation_probe":
                                full.get("private_real_xiphos_alias_navigation_probe"),
                        }, sort_keys=True))
                  assert full["full_original_K_I_U_native_entry_parity_proven"] is True
                  assert full["planned_extra_index_keys"] == 3
                  gui = full["private_real_xiphos_alias_navigation_probe"]
                  if os.environ["RUN_PRIVATE_XIPHOS"] == "true":
                      assert gui is not None
                      visibly_matched = (
                          gui["actual_passage_commands_accepted"]
                          and gui["independent_gui_commentary_excerpt_match_count"]
                              == gui["sample_count"]
                      )
                      print("Optional corrected-candidate GUI verdict:",
                            "EXCERPTS_OBSERVED_NOT_APPROVAL" if visibly_matched
                            else "INCONCLUSIVE_NOT_ACCEPTED")
                  else:
                      assert gui is None
                  assert full["published"] is False
              print("Original XML volumes:", report["original_xml_volume_count"])
              assert report["original_native_versification_registry_checked"] is True
              classes = report["original_reference_registry_classes_across_volumes"]
              assert sum(classes.values()) == report["source_annotation_markers_across_volumes"]
              print("Actual original SWORD KJV verse-registry check:",
                    json.dumps(classes, sort_keys=True))
              print("Out-of-registry original source reference examples (not text loss):",
                    json.dumps(report["bounded_original_out_of_registry_reference_examples"],
                               sort_keys=True))
              print("Source annotations:", report["source_annotation_markers_across_volumes"])
              print("Source classes:", json.dumps(
                  report["source_annotation_classes_across_volumes"], sort_keys=True))
              print("Matched original starts by type:", json.dumps(
                  report["matched_stock_start_by_class_across_volumes"], sort_keys=True))
              print("Unoccupied original starts and range endpoints by type:",
                    json.dumps(report["unoccupied_stock_start_by_class_across_volumes"],
                               sort_keys=True))
              print("Source book codes without occupied stock entries:",
                    json.dumps(report["source_books_without_any_occupied_stock_native_slots"]))
              print("Bounded original start exceptions (reference keys only):",
                    json.dumps(report["bounded_source_start_mismatch_examples"],
                               sort_keys=True))
              print("Bounded original range-end exceptions (reference keys only):",
                    json.dumps(report["bounded_source_range_end_mismatch_examples"],
                               sort_keys=True))
              for item in report["volume_observations"]:
                  data = item["anchor_diagnostic"]
                  print("Volume", item["volume"], "original markers", data["source_marker_count"],
                        "start misses", sum(data["unoccupied_source_start_by_class"].values()),
                        "original SHA-256", item["original_ccel_xml_sha256"])
          else:
              print("Single original XML marker count:", report["source_marker_count"])
              print("Unoccupied start counts:", json.dumps(
                  report["unoccupied_source_start_by_class"], sort_keys=True))
          assert report["authored_source_to_compiled_text_parity"] is False
          assert report["published"] is False
          PY
      - name: Keep only metadata-only hash and key diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary-anchor-mapping-receipt-${{ matrix.resource_id }}
          path: ${{ runner.temp }}/commentary-anchor-receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Prevent premature source-fidelity or publication assertions
        if: always()
        run: |
          {
            echo '## Commentary original-to-SWORD reference mapping'
            echo 'Complete source work-qualified section reference *starts* compared to stock occupied native keys.'
            echo 'Actual commentary text, notes, quote order, section end boundaries, edits, licensing and release are NOT approved.'
            echo 'A missing exact key may be an address/range convention, not automatically lost authorial text.'
            echo 'No source text, original XML or binary module is uploaded.'
          } >> "$GITHUB_STEP_SUMMARY"
