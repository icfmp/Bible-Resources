name: Attempt exact original zCom in official AndBible Android emulator (research only)

on:
  pull_request:
    paths:
      - '.github/workflows/commentary-zcom-andbible-android.yml'
      - 'scripts/commentary_stock_andbible_android.py'
      - 'tests/test_commentary_stock_andbible_android.py'
      - 'scripts/commentary_android_text_witness.py'
      - 'scripts/commentary_android_webview_debug.py'
      - 'tests/test_commentary_android_text_witness.py'
      - 'scripts/sword_commentary_raw_key.cpp'
      - 'scripts/sword_native_commentary_raw_corpus.cpp'
      - 'scripts/sword_native_raw_corpus_inventory.py'
      - 'config/commentary-intake/**'
  workflow_dispatch:
    inputs:
      resource_id:
        description: Reviewed original CrossWire zCom commentary
        required: true
        type: string
        default: mhcc-crosswire

permissions:
  contents: read
concurrency:
  group: commentary-stock-android-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  official-stable-andbible-zcom-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RESOURCE_ID: ${{ github.event.inputs.resource_id || 'mhcc-crosswire' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies and verify safe Android controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip install websocket-client==1.8.0
          python -m unittest discover -s tests -p 'test_commentary_stock_andbible_android.py' -v
          python -m unittest discover -s tests -p 'test_commentary_android_text_witness.py' -v
      - name: Obtain exact official stable AndBible APK; no other APK accepted
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/commentary-private-android"
          curl --fail --location --retry 2 --max-time 120 \
            -o "$RUNNER_TEMP/commentary-private-android/andbible-production-1117.apk" \
            https://github.com/AndBible/and-bible/releases/download/production-1117/andbible-production-1117.apk
          echo "1c9ed93391642c0de4529065a65e10eb44242d60722231b917b14c5919cdf796  $RUNNER_TEMP/commentary-private-android/andbible-production-1117.apk" \
            | sha256sum --check --status
      - name: Build source-only original native SWORD single-entry reader
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update -qq
          timeout 150s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y libsword-dev
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_commentary_raw_key.cpp \
            -o "$RUNNER_TEMP/commentary-private-android/stock-raw-key" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "$RUNNER_TEMP/commentary-private-android/stock-full-native" -lsword
          test -x "$RUNNER_TEMP/commentary-private-android/stock-raw-key"
          test -x "$RUNNER_TEMP/commentary-private-android/stock-full-native"
      - name: Permit ephemeral hardware acceleration if present
        shell: bash
        run: |
          if test -c /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Test actual exact CrossWire stock ZIP via pinned stable Android app and file picker
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          script: python scripts/commentary_stock_andbible_android.py --resource-id "$RESOURCE_ID" --apk "$RUNNER_TEMP/commentary-private-android/andbible-production-1117.apk" --native-raw-key-binary "$RUNNER_TEMP/commentary-private-android/stock-raw-key" --native-full-raw-binary "$RUNNER_TEMP/commentary-private-android/stock-full-native" --report "$RUNNER_TEMP/commentary-private-android/android-stock-import-proof.json"
      - name: Enforce exact pinned stock and honest Android observation limitations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"commentary-private-android/android-stock-import-proof.json"
          data=json.loads(p.read_text())
          manifest=json.loads((Path("config/commentary-intake")/(os.environ["RESOURCE_ID"]+".json")).read_text())
          assert data["status"]=="pinned_original_zCom_stable_Android_ui_import_observation"
          assert data["resource_id"]==manifest["resource_id"]
          assert data["sword_module_id"]==manifest["module_id"]
          assert data["crosswire_original_zip_sha256"]==manifest["archive_sha256"]
          assert data["crosswire_original_conf_sha256"]==manifest["stock_conf_sha256"]
          assert data["andbible_apk_sha256"]=="1c9ed93391642c0de4529065a65e10eb44242d60722231b917b14c5919cdf796"
          assert data["official_android_application_installed"] is True
          assert data["official_android_app_file_import_action_tapped"] is True
          assert data["reviewed_bible_module_id"]=="BRLSG1910"
          assert data["reviewed_bible_all_five_published_files_attested"] is True
          assert data["reviewed_bible_zip_selected_in_actual_file_picker"] is True
          assert data["android_proceed_dialog_tapped"] is True
          assert data["original_commentary_installzip_proceed_tapped"] is True
          assert type(data["first_download_enabled_okay_button_tapped"]) is bool
          assert data["official_exported_installzip_activity_started"] is True
          assert type(data["android_startup_snapshots_checked"]) is int
          assert 1<=data["android_startup_snapshots_checked"]<=6
          assert isinstance(data["android_bounded_startup_recovery_actions"],list)
          assert len(data["android_bounded_startup_recovery_actions"])<=6
          assert set(data["android_bounded_startup_recovery_actions"])<={
              "WAIT","CLOSE APP","DISMISS","DISMISS UNTIL NEXT UPDATE","ADVANCED"
          }
          assert data["android_file_picker_exact_original_zip_selected"] is True
          assert 1<=len(data["android_baseline_bible_picker_actions"])<=7
          assert all(isinstance(x["safe_action_names"],list) for x in data["android_baseline_bible_picker_actions"])
          assert data["android_sample_reference_deeplink_attempted"] is True
          toolbar=data["android_commentary_toolbar_selection"]
          assert set(toolbar)=={
              "actual_commentary_toolbar_resource_found",
              "exact_original_commentary_popup_item_found",
              "exact_original_commentary_menu_item_tapped",
              "reader_source_identity_witness_after_selection",
              "reader_screen_changed_after_selection",
              "possible_auto_switch_without_menu"
          }
          assert all(type(value) is bool for value in toolbar.values())
          assert (not toolbar["exact_original_commentary_menu_item_tapped"]
                  or (toolbar["actual_commentary_toolbar_resource_found"]
                      and toolbar["exact_original_commentary_popup_item_found"]))
          prose=data["android_exact_original_authorial_prose_webview_witness"]
          assert set(prose)=={
              "scope","original_native_occupied_sample_keys_inspected",
              "real_AndBible_WebViews_observed",
              "real_AndBible_WebView_text_sequences_examined",
              "original_prose_sample_entries_with_16_consecutive_words_visible",
              "actual_original_prose_excerpt_in_Android_WebView_verified",
              "status","original_prose_UI_text_XML_screenshots_or_ZIP_exported"
          }
          assert prose["scope"]=="exact_original_native_zCom_prose_vs_actual_AndBible_WebView_accessibility"
          assert type(data["original_sample_references_not_verifiably_native_occupied_count"]) is int
          assert 0<=data["original_sample_references_not_verifiably_native_occupied_count"]<len(manifest["sample_references"])
          assert 1<=prose["original_native_occupied_sample_keys_inspected"]<=len(manifest["sample_references"])
          assert (prose["original_native_occupied_sample_keys_inspected"]
                  + data["original_sample_references_not_verifiably_native_occupied_count"]
                  == len(manifest["sample_references"]))
          assert type(prose["real_AndBible_WebViews_observed"]) is int
          assert 0<=prose["real_AndBible_WebViews_observed"]<=12
          assert type(prose["real_AndBible_WebView_text_sequences_examined"]) is int
          assert 0<=prose["real_AndBible_WebView_text_sequences_examined"]<=3000
          assert type(prose["original_prose_sample_entries_with_16_consecutive_words_visible"]) is int
          assert 0<=prose["original_prose_sample_entries_with_16_consecutive_words_visible"]<=len(manifest["sample_references"])
          assert type(prose["actual_original_prose_excerpt_in_Android_WebView_verified"]) is bool
          assert prose["original_prose_UI_text_XML_screenshots_or_ZIP_exported"] is False
          assert prose["status"] in {
              "source_pinned_original_exposition_visible_in_real_Android_WebView",
              "inconclusive_no_source_prose_witness_in_accessibility",
              "inconclusive_exact_MHCC_reader_selection_unavailable"
          }
          assert prose["actual_original_prose_excerpt_in_Android_WebView_verified"] == (
              prose["status"]=="source_pinned_original_exposition_visible_in_real_Android_WebView"
          )
          if prose["actual_original_prose_excerpt_in_Android_WebView_verified"]:
              assert prose["original_prose_sample_entries_with_16_consecutive_words_visible"]>=1
              assert prose["real_AndBible_WebViews_observed"]>=1
              assert toolbar["exact_original_commentary_menu_item_tapped"] is True
              assert toolbar["reader_source_identity_witness_after_selection"] is True
          full=data["android_full_original_authorial_prose_webview_witness"]
          assert set(full)=={
              "scope","original_full_native_corpus_sha256_attested",
              "actual_original_native_occupied_keys_scanned",
              "original_native_entries_with_substantial_exposition",
              "real_AndBible_WebViews_observed",
              "real_AndBible_WebView_text_sequences_examined",
              "real_Android_read_only_debug_DOM_pages_examined",
              "source_occupied_entries_with_16_consecutive_words_visible",
              "source_occupied_entries_with_16_words_in_debug_DOM",
              "actual_original_authorial_prose_in_real_Android_WebView_verified",
              "actual_original_prose_in_read_only_Android_debug_DOM_verified",
              "status","source_words_android_UI_XML_screenshots_or_ZIP_exported"
          }
          assert full["scope"]=="all_occupied_original_native_zCom_keys_vs_real_Android_WebView_prose"
          debug=data["android_private_read_only_official_webview_debug_probe"]
          assert set(debug)=={
              "scope","actual_app_debug_socket_found",
              "actual_Android_debug_page_targets_discovered",
              "actual_Android_debug_DOM_pages_read","status",
              "Android_DOM_page_URL_words_XML_screenshot_or_cookies_exported"
          }
          assert debug["scope"]=="official_AndBible_pinned_release_read_only_loopback_WebView_CDP"
          assert type(debug["actual_app_debug_socket_found"]) is bool
          assert type(debug["actual_Android_debug_page_targets_discovered"]) is int
          assert type(debug["actual_Android_debug_DOM_pages_read"]) is int
          assert 0<=debug["actual_Android_debug_page_targets_discovered"]<=8
          assert 0<=debug["actual_Android_debug_DOM_pages_read"]<=debug["actual_Android_debug_page_targets_discovered"]
          assert debug["status"] in {
              "inconclusive_original_app_WebView_debug_unavailable",
              "inconclusive_Android_debug_socket_no_readable_DOM",
              "official_Android_reader_DOM_text_read_privately",
              "inconclusive_exact_MHCC_reader_selection_unavailable"
          }
          assert debug["Android_DOM_page_URL_words_XML_screenshot_or_cookies_exported"] is False
          assert full["real_Android_read_only_debug_DOM_pages_examined"]==debug["actual_Android_debug_DOM_pages_read"]
          assert type(full["original_full_native_corpus_sha256_attested"]) is bool
          assert type(full["actual_original_native_occupied_keys_scanned"]) is int
          assert type(full["original_native_entries_with_substantial_exposition"]) is int
          assert type(full["real_AndBible_WebViews_observed"]) is int
          assert type(full["real_AndBible_WebView_text_sequences_examined"]) is int
          assert type(full["real_Android_read_only_debug_DOM_pages_examined"]) is int
          assert 0<=full["real_Android_read_only_debug_DOM_pages_examined"]<=8
          assert type(full["source_occupied_entries_with_16_consecutive_words_visible"]) is int
          assert type(full["source_occupied_entries_with_16_words_in_debug_DOM"]) is int
          assert type(full["actual_original_authorial_prose_in_real_Android_WebView_verified"]) is bool
          assert type(full["actual_original_prose_in_read_only_Android_debug_DOM_verified"]) is bool
          assert full["source_words_android_UI_XML_screenshots_or_ZIP_exported"] is False
          assert full["status"] in {
              "source_pinned_full_corpus_original_prose_visible_in_real_Android_WebView",
              "source_pinned_original_prose_visible_in_real_Android_debug_DOM",
              "inconclusive_no_full_original_prose_witness_in_accessibility_or_debug_DOM",
              "inconclusive_exact_MHCC_reader_selection_unavailable"
          }
          assert full["actual_original_authorial_prose_in_real_Android_WebView_verified"]==(
              full["status"] in {
                  "source_pinned_full_corpus_original_prose_visible_in_real_Android_WebView",
                  "source_pinned_original_prose_visible_in_real_Android_debug_DOM"
              }
          )
          assert full["actual_original_prose_in_read_only_Android_debug_DOM_verified"]==(
              full["status"]=="source_pinned_original_prose_visible_in_real_Android_debug_DOM"
          )
          assert 0<=full["source_occupied_entries_with_16_words_in_debug_DOM"]<=full["source_occupied_entries_with_16_consecutive_words_visible"]
          if full["original_full_native_corpus_sha256_attested"]:
              assert full["actual_original_native_occupied_keys_scanned"]==29975
              assert 1<=full["original_native_entries_with_substantial_exposition"]<=29975
              assert 0<=full["source_occupied_entries_with_16_consecutive_words_visible"]<=full["original_native_entries_with_substantial_exposition"]
              assert 1<=full["real_AndBible_WebViews_observed"]<=12
              assert toolbar["exact_original_commentary_menu_item_tapped"] is True
          else:
              assert full["status"]=="inconclusive_exact_MHCC_reader_selection_unavailable"
          if full["actual_original_authorial_prose_in_real_Android_WebView_verified"]:
              assert full["source_occupied_entries_with_16_consecutive_words_visible"]>=1
              assert toolbar["reader_source_identity_witness_after_selection"] is True
          reader_context=data["android_reader_context_by_phase"]
          assert set(reader_context)=={
              "after_app_restart", "after_verified_notice_action",
              "after_commentary_toolbar_attempt"
          }
          assert data["official_stable_update_notice_action"] in {
              "not_exact_verified_official_stable_notice",
              "notice_changed_before_safe_click",
              "notice_safe_action_unavailable",
              "official_stable_update_notice_dismissed_until_update"
          }
          if data["official_stable_update_notice_action"]=="official_stable_update_notice_dismissed_until_update":
              before_notice=reader_context["after_app_restart"]
              assert set(before_notice["known_allowlisted_ui_actions_visible"])=={
                  "DISMISS","DISMISS UNTIL NEXT UPDATE"
              }
              assert before_notice["ui_hierarchy_framework_class_counts"]["Button"]==2
              assert before_notice["ui_hierarchy_enabled_clickable_node_count"]==2
              assert before_notice["main_bible_reader_activity_resumed"] is True
              assert before_notice["ui_hierarchy_webview_count"]==0
              assert before_notice["known_reader_root_resource_ids_visible"]==[]
          allowed_ids={"bibleButton","commentaryButton","workspaceButton","optionsMenu",
                       "strongsButton","searchButton","speakButton"}
          allowed_roots={"drawerLayout","mainLayout","toolbarLayout",
                         "toolbarButtonLayout","mainBibleView"}
          for context in list(reader_context.values())+[
              data["android_reviewed_bible_baseline_reader_before_proceed"],
              data["android_reviewed_bible_baseline_reader_after_proceed"],
          ]:
              assert set(context)=={
                  "known_reader_toolbar_resource_ids_visible",
                  "known_reader_root_resource_ids_visible",
                  "ui_hierarchy_node_count",
                  "ui_hierarchy_package_class_counts",
                  "ui_hierarchy_webview_count",
                  "ui_hierarchy_framework_class_counts",
                  "ui_hierarchy_enabled_clickable_node_count",
                  "known_allowlisted_ui_actions_visible",
                  "ui_hierarchy_text_or_unknown_ids_exported",
                  "main_bible_reader_activity_resumed",
                  "another_andbible_activity_resumed",
                  "ui_hierarchy_has_any_elements",
                  "actual_commentary_rendering_verified"
              }
              assert isinstance(context["known_reader_toolbar_resource_ids_visible"],list)
              assert set(context["known_reader_toolbar_resource_ids_visible"])<=allowed_ids
              assert isinstance(context["known_reader_root_resource_ids_visible"],list)
              assert set(context["known_reader_root_resource_ids_visible"])<=allowed_roots
              assert type(context["ui_hierarchy_node_count"]) is int
              assert 0<=context["ui_hierarchy_node_count"]<=20000
              assert type(context["ui_hierarchy_webview_count"]) is int
              assert 0<=context["ui_hierarchy_webview_count"]<=context["ui_hierarchy_node_count"]
              classes=context["ui_hierarchy_framework_class_counts"]
              assert set(classes)=={
                  "TextView","Button","ImageButton","EditText","CheckBox","Switch",
                  "FrameLayout","LinearLayout","ScrollView","WebView","ComposeView","other"
              }
              assert all(type(n) is int and 0<=n<=20000 for n in classes.values())
              assert sum(classes.values())==context["ui_hierarchy_node_count"]
              assert type(context["ui_hierarchy_enabled_clickable_node_count"]) is int
              assert 0<=context["ui_hierarchy_enabled_clickable_node_count"]<=context["ui_hierarchy_node_count"]
              allowed_actions={
                  "LOAD DOCUMENTS FROM FILES","LOAD DOCUMENT FROM FILES",
                  "ADVANCED","DOWNLOADS","DOWNLOAD","PROCEED","BROWSE FILES","BROWSE",
                  "IMPORT","INSTALL","OK","OPEN","CONTINUE","DONE","DISMISS",
                  "DISMISS UNTIL NEXT UPDATE","ALLOW","WHILE USING THE APP",
                  "USE THIS FOLDER","WAIT","CLOSE APP","EXACT_MODULE_ZIP",
                  "EXACT_REVIEWED_BIBLE_ZIP","FINISH_FIRST_DOWNLOAD",
                  "OPEN_COMMENTARY_MENU","EXACT_COMMENTARY_MENU_MODULE"
              }
              assert isinstance(context["known_allowlisted_ui_actions_visible"],list)
              assert set(context["known_allowlisted_ui_actions_visible"])<=allowed_actions
              packages=context["ui_hierarchy_package_class_counts"]
              assert set(packages)=={"andbible","system_ui","documents_ui","other"}
              assert all(type(n) is int and 0<=n<=20000 for n in packages.values())
              assert sum(packages.values())==context["ui_hierarchy_node_count"]
              assert context["ui_hierarchy_text_or_unknown_ids_exported"] is False
              for key in ("main_bible_reader_activity_resumed",
                          "another_andbible_activity_resumed",
                          "ui_hierarchy_has_any_elements",
                          "actual_commentary_rendering_verified"):
                  assert type(context[key]) is bool
              assert context["actual_commentary_rendering_verified"] is False
          # No reader-toolbar absence is a claim of missing or damaged MHCC text.
          assert type(data["android_documented_intent_request_accepted"]) is bool
          assert type(data["android_screen_changed_after_reference_attempt"]) is bool
          assert type(data["android_exact_file_row_still_visible_after_selection"]) is bool
          phases=data["android_focus_witness_by_phase"]
          assert set(phases)=={"after_file_selection","after_import_attempt","after_app_restart","after_reference_intent"}
          allowed={"focused_window","focused_app_window","resumed_activity","top_resumed_activity"}
          assert all(isinstance(names,list) and len(names)<=4 and set(names)<=allowed
                     for names in phases.values())
          assert data["android_application_foreground_after_deeplink"] is bool(phases["after_reference_intent"])
          identity=data["original_module_identity_witness_by_phase"]
          assert set(identity)=={"after_import","after_app_restart","after_reference_intent"}
          assert all(type(v) is bool for v in identity.values())
          assert data["original_module_metadata_detected_in_ui_after_import"] is any(identity.values())
          assert data["original_text_and_reference_target_display_verified"] is False
          assert data["module_persistence_in_application_database_verified"] is False
          assert data["Android_commentary_links_verified"] is False
          assert data["Screenshots_or_commented_text_or_module_uploaded"] is False
          assert data["legal_editorial_release_approved"] is False
          assert data["published"] is False
          assert len(data["real_screen_sha256_only"])>=3
          assert all(re.fullmatch(r"[a-f0-9]{64}",val) for val in data["real_screen_sha256_only"].values())
          print("Android: reviewed complete Bible loaded first and exact stock MHCC ZIP chosen; actual Android reader/content and navigation independently recorded, not assumed")
          print("Android official stable notice safe action: "+data["official_stable_update_notice_action"])
          print("Actual source-pinned MHCC 16-word Android WebView prose witness (metadata only): "+
                json.dumps(prose,sort_keys=True))
          print("Android official local read-only WebView debug probe (metadata only): "+
                json.dumps(debug,sort_keys=True))
          print("All original 29,975 native MHCC entries vs real Android WebView (metadata only): "+
                json.dumps(full,sort_keys=True))
          print("Android actual resumed reader accessibility structure (no content, IDs beyond allowlist, or screenshots): "+
                json.dumps(reader_context,sort_keys=True))
          PY
      - name: Preserve only bounded original identity and UI action metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary-stock-android-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/commentary-private-android/android-stock-import-proof.json
          retention-days: 14
          if-no-files-found: warn
      - name: Declare exact scope and outstanding independent checks
        if: always()
        shell: bash
        run: |
          {
            echo 'Real official Android stable APK and original SHA-pinned CrossWire SWORD ZIP used inside disposable emulator.'
            echo 'Independently SHA-attested five-file reviewed BRLSG1910 Bible is ZIP-packaged byte-for-byte, selected first via Android file picker to satisfy AndBible FirstDownload Bible requirement.'
            echo 'After Bible installation the original MHCC uses the exact exported official AndBible InstallZip Activity, a real Proceed dialog and OS file picker; no internal app database or UI widget is forged.'
            echo 'Exact commentaryButton resource-id and MHCC (en) menu selection are probed; MHC (en) is a distinct full-edition module.'
            echo 'Exact resumed Activity and allowlisted reader toolbar resource names are recorded to distinguish an actual Bible reader from first-run/import context.'
            echo 'Android document switching is distinct from compiled text/links rendering; full visual fidelity is not automatically certified.'
            echo 'Real file-picker selection and deep-link attempts alone do not prove successful persistent import.'
            echo 'No screenshots, original commentary words, source archive or Android emulator image are published.'
            echo 'Independent authorial content/links/GUI inspection, rights, editorial acceptance and release remain open.'
          } >> "$GITHUB_STEP_SUMMARY"
