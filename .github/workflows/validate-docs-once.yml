# Temporary branch-only workflow that removes itself after dispatching checks.
name: Dispatch final documentation validation once
on:
  push:
    branches:
      - docs/physical-taxonomy-layout-20261120
    paths:
      - '.github/workflows/validate-docs-once.yml'
permissions:
  contents: write
  actions: write
jobs:
  dispatch-current-head:
    if: ${{ github.repository == 'icfmp/Bible-Resources' && github.ref == 'refs/heads/docs/physical-taxonomy-layout-20261120' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Remove helper and dispatch read-only CI on exact new head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/validate-docs-once.yml
          git commit -m 'chore: remove one-time documentation validation dispatcher'
          git push origin HEAD:refs/heads/docs/physical-taxonomy-layout-20261120
          gh workflow run validate.yml --ref docs/physical-taxonomy-layout-20261120
          gh workflow run tool-registry-maintenance.yml --ref docs/physical-taxonomy-layout-20261120
