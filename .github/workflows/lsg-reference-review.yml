      - name: Compile original, grouped and individually linked candidates into isolated SWORD engines
        run: |
          python - <<'PY'
          from collections import Counter
          from hashlib import sha256
          from itertools import zip_longest
          from pathlib import Path
          import json, shutil, sys, tempfile
          from lxml import etree
          sys.path.insert(0,'scripts')
          from approved_osis_sword_candidate import (
              _create_candidate_layout, _compile_osis, _read_native_frames)
          original=Path('sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml')
          candidate=Path('/tmp/lsg-structural-candidate.osis.xml')
          individual=Path('/tmp/lsg-individual-reference-candidate.osis.xml')
          compiler=Path(shutil.which('osis2mod'))
          reader=Path('/tmp/lsg-native-witness/native-raw')
          counters=Counter()
          mismatches=[]
          diagnostic={}
          native_text_difference_examples=[]
          def node(raw):
              parser=etree.XMLParser(resolve_entities=False,load_dtd=False,
                       no_network=True,recover=False,huge_tree=False)
              return etree.fromstring(b'<native>'+raw+b'</native>',parser=parser)
          def without_new_targets(root):
              removed=Counter()
              for elem in root.iter():
                  if not isinstance(elem.tag,str) or etree.QName(elem).localname!='reference':
                      continue
                  role=(
                      'note_origin' if elem.get('type')=='annotateRef' and
                      elem.get('subType')=='x-origin' else
                      'introduction' if elem.get('subType')=='x-introduction' else None
                  )
                  if not role and elem.get('osisRef') and (
                          elem.get('type') is None and
                          elem.get('subType') is None and
                          elem.getparent() is not None and
                          isinstance(elem.getparent().tag,str) and
                          etree.QName(elem.getparent()).localname=='note' and
                          elem.getparent().get('type')=='crossReference'):
                      role='printed_destination'
                  if role and elem.get('osisRef'):
                      del elem.attrib['osisRef']
                      removed[role]+=1
              return removed
          with tempfile.TemporaryDirectory(prefix='lsg-sword-dual-source-') as directory:
              folder=Path(directory)
              instances=[]
              for label, file, module in [
                  ('original',original,'LSGRefOriginalResearch'),
                  ('candidate',candidate,'LSGRefCandidateResearch'),
                  ('individual',individual,'LSGRefIndividualResearch'),
              ]:
                  work=folder/label
                  work.mkdir()
                  payload,output=_create_candidate_layout(work,module,'Segond','fr')
                  diagnostic[label]=_compile_osis(
                      compiler,file,output,'Segond',work/'compiler.log')
                  instances.append((module,work/'payload'))
              a=_read_native_frames(reader,*instances[0])
              b=_read_native_frames(reader,*instances[1])
              c=_read_native_frames(reader,*instances[2])
              def destination_target_sequence(note):
                  return [target for e in note
                      if isinstance(e.tag,str) and
                      etree.QName(e).localname=='reference' and
                      e.get('type') is None
                      for target in (e.get('osisRef') or '').split()]
              def strip_cross_reference_destination_markup(root):
                  for note in root.iter():
                      if (not isinstance(note.tag,str) or
                          etree.QName(note).localname!='note' or
                          note.get('type')!='crossReference'):
                          continue
                      for e in list(note):
                          if (not isinstance(e.tag,str) or
                              etree.QName(e).localname!='reference' or
                              e.get('type') is not None):
                              continue
                          at=note.index(e)
                          combined=(e.text or '')+(e.tail or '')
                          if at:
                              previous=note[at-1]
                              previous.tail=(previous.tail or '')+combined
                          else:
                              note.text=(note.text or '')+combined
                          note.remove(e)
                  return etree.tostring(root)
              for left,right,third in zip_longest(a,b,c):
                  if left is None or right is None or third is None:
                      raise SystemExit('Native reader entry count differs')
                  kind, key, original_raw=left
                  candidate_kind,candidate_key,candidate_raw=right
                  individual_kind,individual_key,individual_raw=third
                  if (kind!=candidate_kind or key!=candidate_key or
                      individual_kind!=kind or individual_key!=key):
                      raise SystemExit('Native ordered index differs')
                  counters['native_frames_compared']+=1
                  if kind=='K':counters['populated_verse_frames_compared']+=1
                  if candidate_raw==individual_raw:
                      counters['native_group_and_individual_frames_byte_identical']+=1
                  else:
                      grouped=node(candidate_raw)
                      separated=node(individual_raw)
                      grouped_notes=[n for n in grouped.iter() if
                          isinstance(n.tag,str) and etree.QName(n).localname=='note'
                          and n.get('type')=='crossReference']
                      separated_notes=[n for n in separated.iter() if
                          isinstance(n.tag,str) and etree.QName(n).localname=='note'
                          and n.get('type')=='crossReference']
                      if len(grouped_notes)!=len(separated_notes):
                          raise SystemExit('Native cross-reference note cardinality changed')
                      for first_note,second_note in zip(grouped_notes,separated_notes):
                          if (dict(first_note.attrib)!=dict(second_note.attrib) or
                              destination_target_sequence(first_note)!=
                              destination_target_sequence(second_note)):
                              raise SystemExit('Native original targets/anchors changed')
                          counters['native_notes_with_source_equivalent_individual_links']+=1
                      original_flat=''.join(grouped.itertext())
                      segmented_flat=''.join(separated.itertext())
                      if original_flat==segmented_flat:
                          counters['native_individual_frames_identical_full_text']+=1
                      else:
                          counters['native_individual_frames_text_changed']+=1
                      original_note_flat=[''.join(n.itertext()) for n in grouped_notes]
                      segmented_note_flat=[''.join(n.itertext()) for n in separated_notes]
                      if original_note_flat==segmented_note_flat:
                          counters['native_individual_frames_identical_note_text']+=1
                      else:
                          counters['native_individual_frames_note_text_changed']+=1
                          for p,q in zip(original_note_flat,segmented_note_flat):
                              if p==q:
                                  continue
                              import re
                              if re.sub(r'\s+','',p)==re.sub(r'\s+','',q):
                                  counters['native_individual_note_text_whitespace_only_differences']+=1
                              else:
                                  counters['native_individual_note_text_material_differences']+=1
                              if len(native_text_difference_examples)<12:
                                  index=next((i for i in range(min(len(p),len(q)))
                                              if p[i]!=q[i]),min(len(p),len(q)))
                                  native_text_difference_examples.append({
                                      'key':key,'offset':index,
                                      'grouped_sample':repr(p[max(index-30,0):index+40]),
                                      'individual_sample':repr(q[max(index-30,0):index+40]),
                                  })
                      if (strip_cross_reference_destination_markup(grouped)!=
                          strip_cross_reference_destination_markup(separated)):
                          counters['native_individual_frames_with_unrelated_markup_change']+=1
                      else:
                          counters['native_individual_frames_only_reference_markup_changed']+=1
                  if original_raw==candidate_raw:
                      counters['raw_frames_byte_identical']+=1
                      continue
                  old=node(original_raw)
                  new=node(candidate_raw)
                  added=without_new_targets(new)
                  for name,n in added.items():
                      counters['compiled_new_'+name+'_attributes']+=n
                  if etree.tostring(old)!=etree.tostring(new):
                      counters['native_frames_changed_beyond_allowed_targets']+=1
                      if len(mismatches)<20:mismatches.append({'kind':kind,'reference':key})
                  else:
                      counters['native_frames_with_only_allowed_target_additions']+=1
          split_receipt=json.loads(Path('/tmp/lsg-individual-reference-receipt.json').read_text())
          print('Native text difference source-bound samples:',native_text_difference_examples)
          print('Native individual reference structural diagnostics:',{
              key:number for key,number in counters.items()
              if key.startswith('native_individual') or
              key.startswith('native_notes_with_source')})
          if (counters['native_individual_frames_text_changed'] or
              counters['native_individual_frames_note_text_changed'] or
              counters['native_individual_frames_with_unrelated_markup_change'] or
              not counters['native_individual_frames_only_reference_markup_changed']):
              raise SystemExit('Native individually linked candidate changed authorial structure')
          receipt=json.loads(Path('/tmp/lsg-structural-report.json').read_text())
          assert counters['compiled_new_note_origin_attributes'] == receipt['original_cross_reference_notes']
          assert counters['compiled_new_introduction_attributes'] == receipt['resolved_introduction_spans']
          assert counters['compiled_new_printed_destination_attributes'] == receipt['resolved_original_destination_labels']
          assert (counters['compiled_new_note_origin_attributes']+
                  counters['compiled_new_introduction_attributes']+
                  counters['compiled_new_printed_destination_attributes']==
                  receipt['candidate_additions'])
          report={
              'status':'three_independent_temporary_sword_engines_compared',
              'original_source_sha256':sha256(original.read_bytes()).hexdigest(),
              'candidate_source_sha256':sha256(candidate.read_bytes()).hexdigest(),
              'individual_source_sha256':sha256(individual.read_bytes()).hexdigest(),
              'compiler':diagnostic,
              'native_counts':dict(counters),
              'bounded_mismatches_no_text':mismatches,
              'originals_or_releases_replaced':False,
              'native_binaries_retained':False,
              'visual_reader_navigation_certified':False,
          }
          path=Path('/tmp/lsg-native-reference-parity.json')
          path.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('Native original/grouped/individual frame comparison:',dict(counters))
          print('Bounded frame keys with unrelated changes:',mismatches)
          if (counters['native_frames_changed_beyond_allowed_targets'] or
              not counters['native_frames_compared'] or
              not counters['populated_verse_frames_compared']):
              raise SystemExit('Native original/candidate structural parity failed')
          PY
