name: LSG source reference forensic review
on:
  pull_request:
    paths:
      - '.github/workflows/lsg-reference-review.yml'
      - 'scripts/normalize_bible_references.py'
      - 'tests/test_normalize_bible_references.py'
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Analyze original and cleaned reference structures without modifying sources
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from collections import Counter
          from pathlib import Path
          from hashlib import sha256
          from lxml import etree
          import re
          base=Path('sources/original/bibles/fr/lsg-1910')
          for filename in ['fraLSG_usfx.zip','fraLSG_usfm.zip']:
              path=base/filename
              print('ORIGINAL',filename,'size',path.stat().st_size,'sha256',sha256(path.read_bytes()).hexdigest())
              with ZipFile(path) as archive:
                  members=archive.namelist()
                  print('ZIP files',len(members),members[:12])
                  if 'usfx' in filename:
                      xml_candidates=[n for n in members if n.lower().endswith(('.xml','.usfx'))]
                      print('USFX XML candidates',[(n,archive.getinfo(n).file_size) for n in xml_candidates[:10]])
                      for n in ['fraLSG_usfx.xml']:
                          data=archive.read(n)
                          parser=etree.XMLParser(resolve_entities=False,load_dtd=False,no_network=True)
                          root=etree.fromstring(data,parser=parser)
                          tags=Counter(etree.QName(e).localname for e in root.iter() if isinstance(e.tag,str))
                          print('USFX root, tag counts',etree.QName(root).localname,tags.most_common(25))
                          print('USFX package source first',etree.QName(root).localname)
                          print('USFX xref parent chains',Counter(
                              tuple(etree.QName(z).localname for z in list(e.iterancestors())[:3])
                              for e in root.iter() if isinstance(e.tag,str) and
                              etree.QName(e).localname=='xt').most_common(8))
                          for tag in ('x','xo','xt','ref','note','book','para','p','t','ex','f','it','ca','w'):
                              xs=[e for e in root.iter() if isinstance(e.tag,str) and etree.QName(e).localname==tag]
                              print('USFX',tag,'count',len(xs),'attributes',Counter(tuple(sorted(e.attrib)) for e in xs).most_common(6))
                              for e in xs[:3]:
                                  print('USFX sample',tag,'attrs',dict(e.attrib),'parent',etree.QName(e.getparent()).localname if e.getparent() is not None else '', 'label',repr(''.join(e.itertext())[:65]))
                  else:
                      usfm=[n for n in members if n.lower().endswith(('.usfm','.sfm','.txt'))]
                      print('USFM candidates',len(usfm),usfm[:7])
                      for n in usfm[:3]:
                          text=archive.read(n).decode('utf-8-sig','replace')
                          xs=re.findall(r'\\\\x\\s+(.{0,180}?)\\\\x\\*',text,re.S)
                          print('USFM',n,'xref_count',len(xs),'sample',[v[:130] for v in xs[:2]])
          path=Path('sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml')
          print('CLEANED',path.stat().st_size,sha256(path.read_bytes()).hexdigest())
          tree=etree.parse(str(path),etree.XMLParser(resolve_entities=False,load_dtd=False,no_network=True))
          ns='{http://www.bibletechnologies.net/2003/OSIS/namespace}'
          notes=list(tree.iter(ns+'note'))
          print('NOTES',len(notes),'types',Counter(n.get('type') for n in notes))
          for note in [n for n in notes if n.get('type')=='crossReference'][:5]:
              print('CLEANED note',note.attrib,'children',
                    [(etree.QName(e).localname,dict(e.attrib),repr(''.join(e.itertext())[:65])) for e in note][:5],
                    'ancestors',[(etree.QName(a).localname,a.get('osisID'),a.get('sID')) for a in list(note.iterancestors())[:4]])
          refs=list(tree.iter(ns+'reference'))
          print('REFERENCE STRUCTURES',len(refs),Counter((e.get('type'),e.get('subType')) for e in refs))
          intro=[e for e in refs if e.get('subType')=='x-introduction']
          print('INTRO REFERENCES',len(intro),'sample',[(dict(e.attrib),repr(''.join(e.itertext())[:45])) for e in intro[:8]])
          with ZipFile(base/'fraLSG_usfx.zip') as z:
              original=etree.fromstring(z.read('fraLSG_usfx.xml'),
                  etree.XMLParser(resolve_entities=False,load_dtd=False,no_network=True))
          source_notes=[x for x in original.iter() if isinstance(x.tag,str)
              and etree.QName(x).localname=='x']
          cleaned_notes=[n for n in notes if n.get('type')=='crossReference']
          print('SOURCE/CLEANED note counts:',len(source_notes),len(cleaned_notes))
          def normal(s):return ' '.join((s or '').split())
          problems=[]
          origin_labels=[]
          for i,(x,n) in enumerate(zip(source_notes,cleaned_notes)):
              xo=next((e for e in x if etree.QName(e).localname=='xo'),None)
              xt=next((e for e in x if etree.QName(e).localname=='xt'),None)
              children=[e for e in n if e.tag==ns+'reference']
              if xo is None or xt is None or len(children)!=2:
                  problems.append((i,'shape')); continue
              label=normal(''.join(xo.itertext()))
              origin_labels.append(label)
              if (normal(''.join(children[0].itertext()))!=label or
                  normal(''.join(children[1].itertext()))!=normal(''.join(xt.itertext())) or
                  n.get('n') != x.get('caller')):
                  problems.append((i,'content_or_callout'))
          print('SOURCE/CLEANED xref witness mismatches:',len(problems),problems[:12])
          patt=r'^\d+\.\d+'
          invalid=[t for t in origin_labels if not re.fullmatch(patt,t)]
          print('ORIGIN grammar matched/unmatched:',len(origin_labels)-len(invalid),len(invalid),
                'unmatched samples',invalid[:28])
          intro_labels=[normal(''.join(x.itertext())) for x in intro]
          source_intros=[normal(''.join(x.itertext())) for x in original.iter()
               if isinstance(x.tag,str) and etree.QName(x).localname=='ior']
          print('INTRO preserved:',len(intro_labels),len(source_intros),
                intro_labels==source_intros)
          patterns={
              'range_two_full':r'^\d+:\d+\s*[-–]\s*\d+:\d+',
              'range_same_chapter':r'^\d+:\d+\s*[-–]\s*\d+',
              'single':r'^\d+:\d+',
          }
          shapes=Counter(next((k for k,v in patterns.items() if re.fullmatch(v,t)),
               'other') for t in intro_labels)
          print('INTRO grammar:',dict(shapes))
          print('INTRO unmatched:',[t for t in intro_labels
               if not any(re.fullmatch(v,t) for v in patterns.values())][:30])
          PY

      - name: Run source-attested normalizer negative and idempotence tests
        run: python -m unittest discover -s tests -p test_normalize_bible_references.py -v
      - name: Fetch independently pinned official OSIS schema
        run: python scripts/fetch_reviewed_schema.py --directory /tmp/lsg-reviewed-osis
      - name: Build separate complete cleaned-source candidate and preservation ledger
        run: |
          python scripts/normalize_bible_references.py \
            --cleaned sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml \
            --original-usfx sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip \
            --manifest sources/cleaned/bibles/fr/lsg-1910/CLEANUP_MANIFEST.json \
            --crosswalk config/standard_usfm_osis_66.json \
            --output /tmp/lsg-structural-candidate.osis.xml \
            --report /tmp/lsg-structural-report.json
      - name: Validate official schema plus BRNP diagnostic before/after
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, sys
          original='sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml'
          folder=Path('/tmp')
          candidate=folder/'lsg-structural-candidate.osis.xml'
          schema=folder/'lsg-reviewed-osis/osisCore.2.1.1-cw-latest.xsd'
          reports=[]
          for label, file in [('before',original),('candidate',str(candidate))]:
              report=folder/f'lsg-brnp-{label}.json'
              result=subprocess.run([sys.executable,'scripts/check_brnp.py',file,
                  '--kind','bible','--schema',str(schema),'--report',str(report)],
                  capture_output=True,text=True)
              if result.returncode not in (0,1):
                  raise SystemExit(f'BRNP failed for {label}: {result.stderr}')
              reports.append(json.loads(report.read_text(encoding='utf-8')))
          before, after=reports
          receipt=json.loads((folder/'lsg-structural-report.json').read_text())
          old=before['finding_codes'];new=after['finding_codes']
          print('Before categories',old)
          print('After categories',new)
          print('Normalization candidate proof',receipt)
          assert receipt['exact_original_xml_text_and_element_order_preserved']
          assert receipt['only_source_attested_reference_osisRef_attributes_added']
          assert receipt['candidate_additions'] == (
              old.get('NONCANONICAL_REFERENCE_ORIGIN',0)+
              old.get('UNRESOLVED_INTRODUCTION_SPAN',0))
          assert not new.get('NONCANONICAL_REFERENCE_ORIGIN',0)
          assert not new.get('UNRESOLVED_INTRODUCTION_SPAN',0)
          assert new.get('UNRESOLVED_REFERENCE_TARGET',0)==old.get('UNRESOLVED_REFERENCE_TARGET',0)
          for code,number in new.items():
              assert number <= old.get(code,0),f'New or increased BRNP diagnostic: {code}'
          assert after['official_osis']['status']=='validated'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## LSG source-attested reference candidate (unpublished)\n\n')
              f.write(f"Exact added osisRef targets: {receipt['candidate_additions']}\n\n")
              f.write(f"Unlinked authored destination labels retained: {receipt['unlinked_original_destination_labels_preserved']}\n\n")
              f.write(f"Before: {old}\n\nAfter: {new}\n\n")
              f.write('Original source, translation text, note callouts, existing markup, authorial reference labels and compiled releases are unchanged.\n')
          PY
      - name: Upload candidate and complete structural provenance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsg-structural-reference-candidate-unpublished
          path: |
            /tmp/lsg-structural-candidate.osis.xml
            /tmp/lsg-structural-report.json
            /tmp/lsg-brnp-before.json
            /tmp/lsg-brnp-candidate.json
          if-no-files-found: warn
          retention-days: 14
