name: LSG source-pinned structural reference candidate
on:
  pull_request:
    paths:
      - '.github/workflows/lsg-reference-review.yml'
      - 'scripts/normalize_bible_references.py'
      - 'tests/test_normalize_bible_references.py'
      - 'scripts/segment_osis_reference_destinations.py'
      - 'tests/test_segment_osis_reference_destinations.py'
      - 'sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml'
      - 'sources/cleaned/bibles/fr/lsg-1910/CLEANUP_MANIFEST.json'
      - 'sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip'
      - 'config/standard_usfm_osis_66.json'
      - 'config/lsg-1910-printed-book-aliases.json'
      - 'sources/cleaned/bibles/fr/lsg-1910/editorial/UNRESOLVED_REFERENCE_LEDGER_2026-11-23.json'
      - 'sources/cleaned/bibles/fr/lsg-1910/editorial/SECONDARY_DIGITAL_CITATION_COMPARISON_2026-11-23.json'
      - 'sources/cleaned/bibles/fr/lsg-1910/editorial/PRINTED_1910_REFERENCE_COLLATION_2026-11-23.json'
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source-attested normalizer negative and idempotence tests
        run: python -m unittest discover -s tests -p test_normalize_bible_references.py -v
      - name: Test individually linked OSIS segmentation and source preservation
        run: python -m unittest discover -s tests -p test_segment_osis_reference_destinations.py -v
      - name: Inventory original citation-label grammar without creating links
        run: |
          python - <<'PY'
          from collections import Counter
          from zipfile import ZipFile
          from lxml import etree
          import json, re
          original='sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip'
          with ZipFile(original) as z:
              root=etree.fromstring(z.read('fraLSG_usfx.xml'),
                  etree.XMLParser(resolve_entities=False,load_dtd=False,no_network=True))
          labels=[' '.join(''.join(n.itertext()).split())
                  for n in root.iter('xt')]
          label_re=re.compile(r'(?<!\w)([1-3]?\s*[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ.]{0,12})\s+([1-9]\d{0,2}):([1-9]\d{0,2})')
          from scripts.normalize_bible_references import DIRECT_DESTINATION
          aliases=Counter()
          counts=Counter()
          samples={}
          compound_samples={}
          for label in labels:
              matches=list(label_re.finditer(label))
              for m in matches:aliases[m.group(1).strip()]+=1
              counts['notes_total']+=1
              if not matches:
                  counts['no_explicit_book_chapter_verse']+=1
                  if len(samples.get('no_explicit_book_chapter_verse',[]))<20:
                      samples.setdefault('no_explicit_book_chapter_verse',[]).append(label[:170])
              counts['explicit_book_chapter_verse_tokens']+=len(matches)
              if len(matches)>1:counts['multiple_explicit_book_tokens']+=1
              if ';' in label:counts['contains_semicolon']+=1
              if '–' in label or '—' in label or '-' in label:counts['contains_range_dash']+=1
              if '(' in label or ')' in label:counts['contains_parenthesis']+=1
              if re.search(r'\b(?:voir|cf|comp|et|ou)\b',label,re.I):
                  counts['contains_prose_connector']+=1
              if label.endswith('.'):counts['ends_with_period']+=1
              if not DIRECT_DESTINATION.fullmatch(label):
                  group=('multi_explicit_books' if len(matches)>1
                         else 'implicit_or_semicolon' if ';' in label
                         else 'other_compound')
                  counts['compound_'+group]+=1
                  if len(compound_samples.get(group, []))<24:
                      compound_samples.setdefault(group, []).append(label[:240])
          report={
              'status':'inventory_only_no_targets_inferred',
              'counts':dict(counts),
              'distinct_candidate_book_aliases':len(aliases),
              'top_candidate_aliases':aliases.most_common(100),
              'bounded_unmatched_examples':samples.get('no_explicit_book_chapter_verse',[]),
              'compound_examples_by_grammar_class':compound_samples,
              'source_citation_labels_rewritten':0,
          }
          from pathlib import Path
          Path('/tmp/lsg-citation-grammar-inventory.json').write_text(
              json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('LSG printed-citation syntax inventory:',dict(counts))
          print('Candidate alias tokens (not approved):',aliases.most_common(100))
          print('Unmatched examples (never linked):',samples.get('no_explicit_book_chapter_verse',[]))
          print('Compound examples by grammar class:',compound_samples)
          PY
      - name: Fetch independently pinned official OSIS schema
        run: python scripts/fetch_reviewed_schema.py --directory /tmp/lsg-reviewed-osis
      - name: Build separate complete cleaned-source candidate and preservation ledger
        run: |
          python scripts/normalize_bible_references.py \
            --cleaned sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml \
            --original-usfx sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip \
            --manifest sources/cleaned/bibles/fr/lsg-1910/CLEANUP_MANIFEST.json \
            --crosswalk config/standard_usfm_osis_66.json \
            --destination-aliases config/lsg-1910-printed-book-aliases.json \
            --complete-citation-lists \
            --source-local-short-forms \
            --disambiguated-chapter-commas \
            --output /tmp/lsg-structural-candidate.osis.xml \
            --report /tmp/lsg-structural-report.json
      - name: Validate official schema plus BRNP diagnostic before/after
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, sys
          original='sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml'
          folder=Path('/tmp')
          candidate=folder/'lsg-structural-candidate.osis.xml'
          schema=folder/'lsg-reviewed-osis/osisCore.2.1.1-cw-latest.xsd'
          reports=[]
          for label, file in [('before',original),('candidate',str(candidate))]:
              report=folder/f'lsg-brnp-{label}.json'
              result=subprocess.run([sys.executable,'scripts/check_brnp.py',file,
                  '--kind','bible','--schema',str(schema),'--report',str(report)],
                  capture_output=True,text=True)
              if result.returncode not in (0,1):
                  raise SystemExit(f'BRNP failed for {label}: {result.stderr}')
              reports.append(json.loads(report.read_text(encoding='utf-8')))
          before, after=reports
          receipt=json.loads((folder/'lsg-structural-report.json').read_text())
          old=before['finding_codes'];new=after['finding_codes']
          print('Before categories',old)
          print('After categories',new)
          print('Normalization candidate proof',receipt)
          assert receipt['exact_original_xml_text_and_element_order_preserved']
          assert receipt['only_source_attested_reference_osisRef_attributes_added']
          assert receipt['candidate_additions'] == (
              old.get('NONCANONICAL_REFERENCE_ORIGIN',0)+
              old.get('UNRESOLVED_INTRODUCTION_SPAN',0)-
              receipt['unlinked_introduction_spans_preserved']+
              receipt['resolved_original_destination_labels'])
          assert (receipt['original_cross_reference_notes'] ==
                  receipt['resolved_original_destination_labels']+
                  receipt['unlinked_original_destination_labels_preserved'])
          assert receipt['printed_abbreviation_map_sha256']
          assert (receipt['original_introduction_spans'] ==
                  receipt['resolved_introduction_spans']+
                  receipt['unlinked_introduction_spans_preserved'])
          assert not new.get('NONCANONICAL_REFERENCE_ORIGIN',0)
          assert (new.get('UNRESOLVED_INTRODUCTION_SPAN',0) ==
                  receipt['unlinked_introduction_spans_preserved'])
          assert new.get('UNRESOLVED_REFERENCE_TARGET',0)==(
              old.get('UNRESOLVED_REFERENCE_TARGET',0)-
              receipt['resolved_original_destination_labels'])
          for code,number in new.items():
              assert number <= old.get(code,0),f'New or increased BRNP diagnostic: {code}'
          assert after['official_osis']['status']=='validated'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## LSG source-attested reference candidate (unpublished)\n\n')
              f.write(f"Exact added osisRef targets: {receipt['candidate_additions']}\n\n")
              f.write(f"Unlinked authored destination labels retained: {receipt['unlinked_original_destination_labels_preserved']}\n\n")
              f.write(f"Before: {old}\n\nAfter: {new}\n\n")
              f.write('Original source, translation text, note callouts, existing markup, authorial reference labels and compiled releases are unchanged.\n')
          PY
      - name: Classify each still-unresolved original citation label without creating links
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from zipfile import ZipFile
          from lxml import etree
          import json,re,sys
          sys.path.insert(0,'scripts')
          from normalize_bible_references import (
              _complete_printed_destinations,_explicit_source_local_reference,
              _printed_book_aliases,_crosswalk,_parse,_usfx_bytes,_label,OSIS)
          orig=Path('sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip')
          with ZipFile(orig) as z:
              doc=_parse(z.read('fraLSG_usfx.xml'))
          source=_parse(Path('/tmp/lsg-structural-candidate.osis.xml').read_bytes())
          verse_ids={x for verse in source.iter(OSIS+'verse')
                     for x in (verse.get('osisID') or '').split()}
          from hashlib import sha256
          aliases,_digest=_printed_book_aliases(
              Path('config/lsg-1910-printed-book-aliases.json'),
              _crosswalk(Path('config/standard_usfm_osis_66.json')),
              sha256(orig.read_bytes()).hexdigest(),doc)
          records=[]
          causes=Counter()
          classes=Counter()
          examples={}
          def group(label,reason):
              if reason!='compound_or_implicit_reference':
                  return reason
              if re.search(r'\betc\.?',label,re.I):
                  return 'open_ended_etc'
              if re.fullmatch(r'v\.\s*[0-9]+\.?',label):
                  return 'same_chapter_relative_verse'
              if re.fullmatch(r'(?:[1-3]\s+)?[A-Za-zÀ-ÿ]+\s+v\.\s*[0-9]+\.?',label):
                  return 'named_book_relative_verse'
              if re.fullmatch(r'(?:[1-3]\s+)?[A-Za-zÀ-ÿ]+\s+[0-9]+\.?',label):
                  return 'chapter_only_reference'
              if re.search(r'\bv\.',label,re.I):
                  return 'embedded_relative_verse'
              return 'other_unresolved_syntax'
          for book in doc.iter('book'):
              for note in book.iter('x'):
                  xt=next((e for e in note if e.tag=='xt'),None)
                  xo=next((e for e in note if e.tag=='xo'),None)
                  if xt is None or xo is None:
                      raise SystemExit('Unexpected source USFX note shape')
                  label=_label(xt)
                  value,reason,_=_complete_printed_destinations(
                      label,aliases,verse_ids,disambiguated_chapter_commas=True)
                  if value is None and reason=='compound_or_implicit_reference':
                      value,reason=_explicit_source_local_reference(
                          label,aliases,_label(xo),
                          _crosswalk(Path('config/standard_usfm_osis_66.json'))[book.get('id')],
                          verse_ids)
                  if value is not None:continue
                  category=group(label,reason)
                  causes[reason]+=1
                  classes[category]+=1
                  entry={'original_usfm_book':book.get('id'),
                         'source_note_origin':_label(xo),
                         'original_citation_label':label,
                         'parser_reason':reason,
                         'editorial_review_class':category,
                         'action':'preserve_unlinked_until_independent_evidence'}
                  records.append(entry)
                  if len(examples.get(category,[]))<4:
                      examples.setdefault(category,[]).append(label[:100])
          receipt=json.loads(Path('/tmp/lsg-structural-report.json').read_text())
          if len(records)!=receipt['unlinked_original_destination_labels_preserved']:
              raise SystemExit('Original citation triage and normalized report diverge')
          report={'original_zip_sha256':sha256(orig.read_bytes()).hexdigest(),
                  'status':'read_only_full_source_witness_triage',
                  'unlinked_original_notes':len(records),
                  'cause_counts':dict(causes),
                  'review_categories':dict(classes),
                  'entries':records,
                  'proposed_corrections_or_links':0}
          Path('/tmp/lsg-source-citation-triage.json').write_text(
              json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          ledger=json.loads(Path(
              'sources/cleaned/bibles/fr/lsg-1910/editorial/UNRESOLVED_REFERENCE_LEDGER_2026-11-23.json'
          ).read_text(encoding='utf-8'))
          current=[e for e in records
                   if e['parser_reason']=='unattested_reference_start']
          expected=ledger['records']
          if (ledger['source_original_usfx_zip_sha256']!=sha256(orig.read_bytes()).hexdigest()
              or len(current)!=ledger['references_original_count']
              or len(expected)!=len(current)
              or [(x['original_usfm_book'],x['source_note_origin'],
                   x['original_citation_label']) for x in current]!=
                 [(x['original_usfm_book'],x['source_note_origin'],
                   x['original_citation_label']) for x in expected]
              or any(x['editorial_change'] is not None or
                     x['decision']!='preserve_source_label_unlinked'
                     for x in expected)):
              raise SystemExit('Historical source-citation review ledger has drifted or silently approved corrections')
          parallel=[entry for entry in expected if
                    'parallel_versification_review' in entry]
          if (len(parallel)!=ledger['independent_parallel_versification_candidates']
              or ledger['independent_printed_note_corrections_certified']!=0
              or any(entry['parallel_versification_review']['status'] !=
                     'candidate_only_requires_actual_printed_note_collation'
                     for entry in parallel)):
              raise SystemExit('Parallel versification evidence must remain non-authoritative until actual print-note collation')
          print('Source text and nine historical numbering candidates kept independent:',len(parallel))
          print_witness=json.loads(Path(
              'sources/cleaned/bibles/fr/lsg-1910/editorial/PRINTED_1910_REFERENCE_COLLATION_2026-11-23.json'
          ).read_text(encoding='utf-8'))
          proven=print_witness['records']
          proof_map={r['record_id']:r for r in proven}
          original_by_id={r['record_id']:r for r in expected}
          source_scan=print_witness['facsimile']
          if (print_witness['schema_version']!=1
              or print_witness['source_original_usfx_zip_sha256']!=sha256(orig.read_bytes()).hexdigest()
              or print_witness['authored_reference_label_edits_approved']!=0
              or print_witness['automatic_target_link_edits_approved']!=0
              or print_witness['print_readings_requiring_no_change']!=len(proven)
              or len(proof_map)!=len(proven)
              or len(proven)>len(expected)
              or source_scan['edition'].find('1910')<0
              or source_scan['retrieved_djvu_bytes']<200000000
              or len(source_scan['retrieved_djvu_sha256'])!=64
              or not source_scan['source_file_url'].startswith('https://commons.wikimedia.org/wiki/')
              or not source_scan['extraction_run'].startswith('https://github.com/icfmp/Bible-Resources/actions/runs/')):
              raise SystemExit('Original 1910 printed-witness evidence has changed identity or implied unapproved edits')
          for record_id, witness in proof_map.items():
              source_record=original_by_id.get(record_id)
              if (source_record is None
                  or witness['original_usfm_book']!=source_record['original_usfm_book']
                  or witness['source_note_origin']!=source_record['source_note_origin']
                  or witness['original_usfx_reference_label']!=source_record['original_citation_label']
                  or witness['normalized_marginal_citation']!=witness['original_usfx_reference_label']
                  or witness['printed_marginal_note_matches_original_usfx'] is not True
                  or witness['print_reading_status']!='visually_verified_from_actual_original_1910_page'
                  or witness['original_1910_djvu_page']<1
                  or not witness['page_url'].endswith('/'+str(witness['original_1910_djvu_page']))
                  or not witness['visually_read_marginal_citation']
                  or witness['authorized_change'] is not None):
                  raise SystemExit('Printed 1910 witness must be attested per original note with an unchanged citation')
          for row in expected:
              historical=('visually_verified_from_actual_original_1910_page'
                          if row['record_id'] in proof_map
                          else 'pending_manual_facsimile_collation')
              if row['printed_witness_status']!=historical:
                  raise SystemExit('Unresolved source note print status changed without an exact visual evidence record')
          print('Independent actual 1910 printed-note page readings:',len(proven),
                'pending:',len(expected)-len(proven))
          comparison=json.loads(Path(
              'sources/cleaned/bibles/fr/lsg-1910/editorial/SECONDARY_DIGITAL_CITATION_COMPARISON_2026-11-23.json'
          ).read_text(encoding='utf-8'))
          compared=comparison['records']
          checks=[(row['record_id'],row['original_usfm_book'],
                   row['source_note_origin'],row['original_citation_label'])
                  for row in compared]
          stable=[(row['record_id'],row['original_usfm_book'],
                   row['source_note_origin'],row['original_citation_label'])
                  for row in expected]
          if (comparison['schema_version']!=1 or
              comparison['original_usfx_sha256']!=sha256(orig.read_bytes()).hexdigest()
              or comparison['original_cleaned_sha256']!=receipt['source_sha256']
              or not comparison['status'].endswith('not_print_certification')
              or comparison['printed_1910_facsimile_reference_collation_complete']
              or comparison['authorial_corrections_approved']!=0
              or comparison['auto_link_enrichment_authorized']
              or checks!=stable or len(checks)!=54):
              raise SystemExit('Digital witness comparison must remain exact-original, distinct from print certification and without silent edits')
          compared_counts=Counter()
          for row in compared:
              if row['record_id'] in proof_map:
                  witness=proof_map[row['record_id']]
                  if (witness['secondary_digital_reference_label']!=row['secondary_citation_label']
                      or witness['printed_marginal_note_matches_secondary_digital'] is not
                          (witness['normalized_marginal_citation']==row['secondary_citation_label'])):
                      raise SystemExit('Printed citation disagrees with the secondary comparison record')
              source_label=row['original_citation_label']
              other=row['secondary_citation_label']
              computed=('text_identical_in_separately_hosted_digital_witness'
                        if source_label==other else
                        'digital_witness_disagrees_with_original_usfx')
              if (row['comparison']!=computed or
                  row['historical_print_status']!=('visually_verified_from_actual_original_1910_page' if row['record_id'] in proof_map else 'not_collated_from_printed_1910_reference_note')
                  or row['authorized_change'] is not None or not other
                  or not row['secondary_uri'].startswith('https://biblia.com/bible/lsg/')):
                  raise SystemExit('Secondary digital witness status/content invalid or wrongly editorially approved')
              compared_counts[computed]+=1
          if (compared_counts['digital_witness_disagrees_with_original_usfx']!=32
              or compared_counts['text_identical_in_separately_hosted_digital_witness']!=22):
              raise SystemExit('Secondary witness evidence coverage or comparison classification drifted')
          print('Secondary digital apparatus comparison (NOT 1910 print certification):',dict(compared_counts))
          print('Persistent original-source unaddressable citation ledger verified:',len(current))
          print('Unlinked 1910 source-citation classes:',dict(classes))
          print('Review-only category examples:',examples)
          print('Unattested-reference original note evidence (no editorial corrections):')
          for entry in records:
              if entry['parser_reason']=='unattested_reference_start':
                  print('LSG_UNATTESTED_CITATION='+json.dumps(entry,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Build second isolated candidate with one clickable reference per passage
        run: |
          SOURCE_HASH=$(python -c 'import json;print(json.load(open("/tmp/lsg-structural-report.json"))["candidate_sha256"])')
          python scripts/segment_osis_reference_destinations.py \
            --input /tmp/lsg-structural-candidate.osis.xml \
            --original-usfx sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip \
            --crosswalk config/standard_usfm_osis_66.json \
            --alias-witness config/lsg-1910-printed-book-aliases.json \
            --expected-input-sha256 "$SOURCE_HASH" \
            --disambiguated-chapter-commas \
            --output /tmp/lsg-individual-reference-candidate.osis.xml \
            --report /tmp/lsg-individual-reference-receipt.json
      - name: Independently validate source text, XSD and both BRNP reference inventories
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,sys
          folder=Path('/tmp')
          report=json.loads((folder/'lsg-individual-reference-receipt.json').read_text())
          before=json.loads((folder/'lsg-structural-report.json').read_text())
          assert report['original_note_text_and_punctuation_identical']
          assert report['entire_bible_text_and_verse_order_identical']
          assert report['source_original_destinations_and_order_identical']
          assert (report['segmented_destination_labels'] ==
                  before['multi_target_reference_labels'])
          assert (report['individual_reference_elements_created'] ==
                  before['resolved_destination_target_tokens']-
                  before['resolved_original_destination_labels']+
                  before['multi_target_reference_labels'])
          assert (report['new_reference_elements'] ==
                  before['resolved_destination_target_tokens']-
                  before['resolved_original_destination_labels'])
          assert not report.get('unsegmented_escaped_or_complex_source_labels',0)
          result=subprocess.run([
              sys.executable,'scripts/check_brnp.py',
              str(folder/'lsg-individual-reference-candidate.osis.xml'),
              '--kind','bible','--schema',
              str(folder/'lsg-reviewed-osis/osisCore.2.1.1-cw-latest.xsd'),
              '--report',str(folder/'lsg-individual-brnp.json')
          ],capture_output=True,text=True)
          if result.returncode not in (0,1):
              raise SystemExit('OSIS BRNP checker failed: '+result.stderr)
          ref=json.loads((folder/'lsg-brnp-candidate.json').read_text())
          split=json.loads((folder/'lsg-individual-brnp.json').read_text())
          assert split['official_osis']['status']=='validated'
          assert ref['finding_codes']==split['finding_codes']
          print('OSIS-valid per-reference candidate',report)
          PY
      - name: Install native SWORD compiler and independent raw XML reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsword-dev libsword-utils
          mkdir -p /tmp/lsg-native-witness
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_raw_corpus.cpp \
            -o /tmp/lsg-native-witness/native-raw -lsword
          command -v osis2mod
      - name: Exercise actual libSWORD OSISHTMLHREF passage-link renderer
        run: |
          cat >/tmp/lsg-native-witness/osis-reference-html.cpp <<'CPP'
          #include <sword/osishtmlhref.h>
          #include <sword/swbuf.h>
          #include <sword/versekey.h>
          #include <iostream>
          #include <string>
          static int anchors(const std::string& text) {
              int count=0;
              const std::string needle="<a href=";
              for (size_t pos=0;(pos=text.find(needle,pos))!=std::string::npos;
                   pos+=needle.size()) ++count;
              return count;
          }
          int main() {
              sword::OSISHTMLHREF html;
              sword::VerseKey key("Gen.1.1");
              sword::SWBuf grouped(
                  "<reference osisRef=\"Gen.1.1 Exod.2.1\">Ge 1:1; Ex 2:1</reference>");
              sword::SWBuf individual(
                  "<reference osisRef=\"Gen.1.1\">Ge 1:1</reference>; "
                  "<reference osisRef=\"Exod.2.1\">Ex 2:1</reference>");
              if (html.processText(grouped,&key) ||
                  html.processText(individual,&key)) return 2;
              std::string one(grouped.c_str()),two(individual.c_str());
              std::cout << "SWORD grouped HTML anchors: " << anchors(one)
                        << " | individual HTML anchors: " << anchors(two) << "\n";
              if (anchors(one)!=1 || anchors(two)!=2) return 3;
              if (two.find("Gen.1.1")==std::string::npos ||
                  two.find("Exod.2.1")==std::string::npos) return 4;
              return 0;
          }
          CPP
          g++ -std=c++17 -O2 -I/usr/include/sword \
            /tmp/lsg-native-witness/osis-reference-html.cpp \
