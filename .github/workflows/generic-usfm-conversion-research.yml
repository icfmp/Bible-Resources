name: Inspect pinned USFM conversion against original witnesses
on:
  push:
    branches: [research/generic-usfm-conversion]
    paths: ['.github/workflows/generic-usfm-conversion-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Recover exact reviewed converter patch and pinned upstream converter
        run: |
          set -eu
          git fetch --no-tags origin c4a20de64c7ba402b3a2f32c88ba3e6133d7a958
          git show c4a20de64c7ba402b3a2f32c88ba3e6133d7a958:scripts/patch_u2o_intro.py > "$RUNNER_TEMP/patch_u2o.py"
          test "$(git hash-object "$RUNNER_TEMP/patch_u2o.py")" = 7a68798181413da76aa4493148e422f74bbb5004
          curl --fail --silent --show-error --location --max-time 60 https://raw.githubusercontent.com/adyeths/u2o/dde28bc545e8d8697fa5496c243187847ec55d31/u2o.py --output "$RUNNER_TEMP/u2o-original.py"
          python "$RUNNER_TEMP/patch_u2o.py" --original "$RUNNER_TEMP/u2o-original.py" --output "$RUNNER_TEMP/u2o-reviewed.py"
      - name: Execute private conversion and compare original numbered content
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path, PurePosixPath
          from hashlib import sha256
          import json, os, subprocess, sys, tempfile, zipfile
          from pilot_preflight import inspect_archive
          from source_osis_inventory import source_inventory
          from research.bible.original_authorial_content_parity import verify_numbered_content
          adapters=json.loads(Path("config/original-bible-content-adapters.json").read_text())["resources"]
          converter=Path(os.environ["RUNNER_TEMP"])/"u2o-reviewed.py"
          for resource,a in sorted(adapters.items()):
              m=json.loads((Path("modules")/resource/"metadata.json").read_text())
              folder=Path("sources/original/bibles")/m["language"]/resource
              p=json.loads((folder/"PROVENANCE.json").read_text())
              w=p["additional_original_witness"]
              fm=folder/p["original_file"]; fx=folder/w["filename"]
              assert p["format"]=="USFM" and w["format"]=="USFX"
              assert sha256(fm.read_bytes()).hexdigest()==p["original_sha256"]==a["usfm_sha256"]
              assert sha256(fx.read_bytes()).hexdigest()==w["sha256"]==a["usfx_sha256"]
              receipt=inspect_archive(fm,source_kind="authored")
              inspect_archive(fx,source_kind="authored")
              crosswalk=json.loads(Path(a["crosswalk"]).read_text())
              mapping={x["usfm"]:x["osis"] for x in crosswalk["books"]}
              with tempfile.TemporaryDirectory() as temp,zipfile.ZipFile(fm) as zfm,zipfile.ZipFile(fx) as zfx:
                  root=Path(temp)
                  files=[]
                  for item in receipt["members"]:
                      name=item["name"]
                      if PurePosixPath(name).suffix.lower() not in {".usfm",".sfm"}:continue
                      dest=root/PurePosixPath(name)
                      assert dest.resolve().is_relative_to(root.resolve())
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      with dest.open("xb") as out:out.write(zfm.read(name))
                      files.append(dest)
                  assert files and len(files)<=len(mapping)
                  candidate=root/"candidate.osis.xml"
                  command=[sys.executable,str(converter),"Bible."+resource,"-l",m["language"],"-x","-o",str(candidate),*map(str,sorted(files))]
                  with tempfile.TemporaryFile() as log:
                      proc=subprocess.run(command,cwd=root,stdout=log,stderr=subprocess.STDOUT,timeout=180,check=False)
                      size=log.tell()
                      assert size<=128*1024*1024
                      log.seek(0);digest=sha256(log.read()).hexdigest()
                  report={"resource":resource,"converter_sha256":sha256(converter.read_bytes()).hexdigest(),
                          "source_usfm_sha256":a["usfm_sha256"],"source_usfx_sha256":a["usfx_sha256"],
                          "returncode":proc.returncode,"diagnostic_bytes":size,"diagnostic_sha256":digest,
                          "published":False,"conversion_fidelity_certified":False}
                  if proc.returncode==0 and candidate.is_file():
                      xml=candidate.read_bytes()
                      report["candidate_sha256"]=sha256(xml).hexdigest()
                      try:
                          keys,_=source_inventory(xml)
                          report["candidate_numbered_keys"]=len(keys.splitlines())
                          proof=verify_numbered_content(zfx.read(a["usfx_member"]),xml,mapping,{},zfm)
                          report["numbered_content_diagnostic"]=proof
                          from research.bible.original_authorial_content_parity import parse_usfx,source_verses
                          from research.bible.source_osis_verse_notes import original_osis_verses_and_notes
                          from source_osis_inventory import _source_tree,OSIS
                          from collections import Counter
                          source_root=parse_usfx(zfx.read(a["usfx_member"]))
                          original,_,_,_=source_verses(source_root,mapping)
                          converted,_,_=original_osis_verses_and_notes(xml)
                          target=_source_tree(xml)
                          selah_hosts=Counter()
                          for book in target.iter(OSIS+"div"):
                              if book.get("type")!="book":continue
                              current=None
                              for node in book.iter():
                                  if node.tag==OSIS+"verse":
                                      if node.get("eID"):current=None
                                      elif node.get("sID"):current=node.get("sID")
                                  if node.tag==OSIS+"l" and node.get("type")=="selah":
                                      assert current is not None
                                      selah_hosts[current]+=1
                          mismatch={k for k in original if " ".join(original[k].split())!=" ".join(converted[k].split())}
                          report["selah_spacing_diagnostic"]={
                              "mismatch_count":len(mismatch),"selah_count":sum(selah_hosts.values()),
                              "selah_host_count":len(selah_hosts),"mismatches_exactly_selah_hosts":mismatch==set(selah_hosts),
                              "non_selah_mismatches":sorted(mismatch-set(selah_hosts))[:20],
                              "unchanged_selah_hosts":sorted(set(selah_hosts)-mismatch)[:20]}
                          # Compare the actual converter product through the
                          # independent structural checks already in Validate.
                          # Recover only function definitions, never run a
                          # second workflow or substitute the approved master.
                          workflow=Path(".github/workflows/validate.yml").read_text()
                          start=workflow.index("          def _name(node):")
                          end=workflow.index("          # Exercise the actual comparator",start)
                          import textwrap,re,hashlib
                          from collections import defaultdict
                          from lxml import etree
                          from pilot_preflight import PilotError
                          namespace=dict(globals())
                          namespace.update(NON_VERSE_TEXT_ELEMENTS={"x","f","fig","s","r","toc","h","id"},
                              NON_VERSE_PARAGRAPH_STYLES={"r","s","s1","s2","s3","s4","sr","h","toc1","toc2","toc3"},
                              SKIP_TARGET=frozenset(("title","header","note","revisionDesc","description")),
                              SKIP_SOURCE=frozenset(("x","f","fig","s","r","toc","h","id","fe","ef","ex")),
                              OSIS=OSIS,PilotError=PilotError,re=re,hashlib=hashlib,etree=etree,
                              Counter=Counter,defaultdict=defaultdict)
                          exec(compile(textwrap.dedent(workflow[start:end]),"<reviewed poetry comparator>","exec"),namespace)
                          refs=[]
                          for book in source_root.iter("book"):
                              chapter=None
                              for node in book.iter():
                                  if node.tag=="c":chapter=int(node.get("id"))
                                  if node.tag=="v":refs.append((book.get("id"),chapter,int(node.get("id"))))
                          report["poetry_diagnostic"]=namespace["audit_segments"](source_root,target,mapping,refs)
                          # Reuse the other independent layout comparators
                          # against the freshly generated, unreviewed OSIS.
                          start=workflow.index("          def table_signature(")
                          end=workflow.index("          sample_editorial_source=",start)
                          exec(compile(textwrap.dedent(workflow[start:end]),"<reviewed layout comparators>","exec"),namespace)
                          report["table_paragraph_diagnostic"]=namespace["compare_original_tables_and_paragraphs"](source_root,target,mapping)
                          report["editorial_diagnostic"]=namespace["editorial_diagnostic"](source_root,target,mapping)
                          # Derive missing whitespace boundaries from the
                          # independent original witness, never from a list
                          # of Psalms or the previously corrected master.
                          def gaps(text):
                              result=set();pos=0;pending=False
                              for char in text:
                                  if char.isspace():pending=True
                                  else:
                                      if pos and pending:result.add(pos)
                                      pos+=1;pending=False
                              return result
                          edits=[];unsupported=[]
                          for book in target.iter(OSIS+"div"):
                              if book.get("type")!="book":continue
                              def append(value):
                                  state["position"]+=sum(not c.isspace() for c in (value or "")) if state["current"] else 0
                              state={"current":None,"position":0}
                              def visit(node):
                                  if not isinstance(node.tag,str):return
                                  kind=etree.QName(node).localname
                                  if kind in {"note","title","header"}:return
                                  container=False
                                  if kind=="verse":
                                      if node.get("eID"):
                                          assert state["current"]==node.get("eID")
                                          state["current"]=None;return
                                      state["current"]=node.get("osisID");state["position"]=0
                                      container=not bool(node.get("sID"))
                                  ref=state["current"];start=state["position"]
                                  append(node.text)
                                  for child in node:
                                      visit(child);append(child.tail)
                                  end=state["position"]
                                  if kind=="l" and node.get("type")=="selah" and ref in mismatch:
                                      missing=gaps(original[ref])-gaps(converted[ref])
                                      extra=gaps(converted[ref])-gaps(original[ref])
                                      if extra or not missing or not missing<={start,end}:
                                          unsupported.append({"ref":ref,"missing":sorted(missing),"extra":sorted(extra),"marker_offsets":[start,end]})
                                      else:
                                          if start in missing:
                                              # Place separation outside the
                                              # marker, in its preceding XML text slot.
                                              prev=node.getprevious()
                                              if prev is not None:prev.tail=(prev.tail or "")+" "
                                              else:
                                                  parent=node.getparent()
                                                  parent.text=(parent.text or "")+" "
                                              edits.append((ref,start,"before"))
                                          if end in missing:
                                              node.tail=" "+(node.tail or "")
                                              edits.append((ref,end,"after"))
                                  if container:state["current"]=None
                              visit(book)
                          report["selah_whitespace_projection"]={"edits":len(edits),"unsupported":unsupported[:20]}
                          if not unsupported:
                              revised=etree.tostring(target,encoding="utf-8",xml_declaration=True)
                              result=verify_numbered_content(zfx.read(a["usfx_member"]),revised,mapping,{},zfm)
                              report["selah_whitespace_projection"]["numbered_parity"]=result["all_supported_content_checks_equal"]
                              report["selah_whitespace_projection"]["mismatch_counts"]=result["mismatch_counts"]
                              report["selah_whitespace_projection"]["poetry_unchanged"]=namespace["audit_segments"](source_root,_source_tree(revised),mapping,refs)==report["poetry_diagnostic"]
                              report["selah_whitespace_projection"]["candidate_sha256"]=sha256(revised).hexdigest()
                      except (ValueError,RuntimeError,AssertionError) as exc:
                          report["audit_blocked_by"]=type(exc).__name__
                      except Exception as exc:
                          report["audit_blocked_by"]=type(exc).__name__
                  print("GENERIC_USFM_CONVERSION_RESEARCH",json.dumps(report,sort_keys=True),flush=True)
                  assert proc.returncode==0 and candidate.is_file(),"Converter failed; see metadata-only report"
          PY
