name: Verify private final BRJND2024 0.1.1 ZIP in stable Android GUI (NO publication)

on:
  pull_request:
    paths:
      - ".github/workflows/darby-private-repaired-sword.yml"
      - "scripts/probe_private_repaired_darby_sword.py"
      - "scripts/reader_xiphos_headless_smoke.py"
      - "scripts/repair_osis_note_links.py"
      - "scripts/repair_osis_inline_markup.py"
      - "scripts/repair_osis_source_bytes.py"
      - "tests/test_repair_osis_source_bytes.py"
      - "scripts/repair_osis_division_markers.py"
      - "tests/test_repair_osis_division_markers.py"
      - "config/darby-0.1.1.conf"
      - "scripts/prepare_darby_011_private_release_candidate.py"
      - "tests/test_prepare_darby_011_private_release_candidate.py"
      - "scripts/repair_osis_paragraph_indentation.py"
      - "tests/test_repair_osis_paragraph_indentation.py"
      - "scripts/source_native_division_markers.py"
      - "tests/test_source_native_division_markers.py"
      - "scripts/audit_omitted_verse_notes.py"
      - "tests/test_audit_omitted_verse_notes.py"
      - "config/publisher-osis/frajnd-2024-note-link-research.json"
      - "config/publisher-osis/frajnd-2024-inline-markup-research.json"

permissions:
  contents: read

jobs:
  private-native-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bounded source audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Run established source-only technical repair tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_repair_osis_note_links.py' -v
          python -m unittest discover -s tests -p 'test_repair_osis_inline_markup.py' -v
          python -m unittest discover -s tests -p 'test_repair_osis_source_bytes.py' -v
          python -m unittest discover -s tests -p 'test_repair_osis_division_markers.py' -v
          python -m unittest discover -s tests -p 'test_prepare_darby_011_private_release_candidate.py' -v
          python -m unittest discover -s tests -p 'test_probe_andbible_android_private_import.py' -v
          python -m unittest discover -s tests -p 'test_repair_osis_paragraph_indentation.py' -v
          python -m unittest discover -s tests -p 'test_source_native_division_markers.py' -v
          python -m unittest discover -s tests -p 'test_audit_omitted_verse_notes.py' -v
          python -m unittest discover -s tests -p 'test_publisher_osis_sword_candidate.py' -v
      - name: Install standard SWORD readback and pinned r3918 compiler prerequisites
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s sudo apt-get -o Acquire::Retries=1 update -qq
          timeout 180s sudo apt-get -o Acquire::Retries=1 install -y \
            libsword-dev libsword-utils diatheke subversion cmake ninja-build \
            zlib1g-dev libbz2-dev liblzma-dev libicu-dev libcurl4-openssl-dev
          mkdir -p "$RUNNER_TEMP/darby-private-native"
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_index.cpp \
            -o "$RUNNER_TEMP/darby-private-native/native-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_raw_corpus.cpp \
            -o "$RUNNER_TEMP/darby-private-native/native-raw" -lsword
      - name: Build full exact upstream CrossWire SWORD r3918 osis2mod
        shell: bash
        run: |
          set -euo pipefail
          svn export --non-interactive --quiet -r 3918 \
            https://crosswire.org/svn/sword/trunk "$RUNNER_TEMP/darby-private-native/sword-r3918"
          cmake -S "$RUNNER_TEMP/darby-private-native/sword-r3918" \
            -B "$RUNNER_TEMP/darby-private-native/sword-r3918-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DSWORD_BUILD_UTILS=YES \
            -DSWORD_BUILD_TESTS=NO -DSWORD_BUILD_EXAMPLES=NO
          cmake --build "$RUNNER_TEMP/darby-private-native/sword-r3918-build" \
            --target osis2mod --parallel 4
          compiler="$(find "$RUNNER_TEMP/darby-private-native/sword-r3918-build" \
            -type f -name osis2mod -perm /111 -print -quit)"
          test -n "$compiler"
          test -x "$compiler"
          echo "PINNED_COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Verify exact official CrossWire OSIS schema
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch_reviewed_schema.py \
            --directory "$RUNNER_TEMP/darby-private-native/schema"
      - name: Recreate private source and run whole-corpus native SWORD fidelity gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_private_repaired_darby_sword.py \
            --osis2mod "$PINNED_COMPILER" \
            --native-index "$RUNNER_TEMP/darby-private-native/native-index" \
            --native-raw "$RUNNER_TEMP/darby-private-native/native-raw" \
            --diatheke "$(command -v diatheke)" \
            --schema "$RUNNER_TEMP/darby-private-native/schema/osisCore.2.1.1-cw-latest.xsd" \
            --link-plan config/publisher-osis/frajnd-2024-note-link-research.json \
            --inline-plan config/publisher-osis/frajnd-2024-inline-markup-research.json \
            --division-overlay \
            --report "$RUNNER_TEMP/darby-private-native/report.json" \
            --attested-preview-export "$RUNNER_TEMP/darby-private-native/private-source-audited.zip"
      - name: Verify exact final BRJND2024 0.1.1 module identity and native source index
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_darby_011_private_release_candidate.py \
            --audit "$RUNNER_TEMP/darby-private-native/report.json" \
            --private-research-zip "$RUNNER_TEMP/darby-private-native/private-source-audited.zip" \
            --old-release-provenance modules/darby-jnd-2024/RELEASE_PROVENANCE.json \
            --final-conf config/darby-0.1.1.conf \
            --native-index "$RUNNER_TEMP/darby-private-native/native-index" \
            --private-output-dir "$RUNNER_TEMP/darby-private-native/final-011-candidate"
          grep -Fx 'Version=0.1.0' modules/darby-jnd-2024/payload/mods.d/brjnd2024.conf
          echo "Existing 0.1.0 remains untouched; candidate ZIP is private."
      - name: Download and SHA-verify official AndBible stable Android APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 \
            -o "$RUNNER_TEMP/darby-private-native/andbible-production-1117.apk" \
            https://github.com/AndBible/and-bible/releases/download/production-1117/andbible-production-1117.apk
          echo "1c9ed93391642c0de4529065a65e10eb44242d60722231b917b14c5919cdf796  $RUNNER_TEMP/darby-private-native/andbible-production-1117.apk" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/darby-private-native/final-android-evidence"
      - name: Permit ephemeral Android emulator hardware acceleration
        shell: bash
        run: |
          if test -c /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Install audited FINAL BRJND2024 0.1.1 module in stable AndBible and capture real paragraph displays
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          script: python -c 'import os; from pathlib import Path; from probe_andbible_android_private_import import attempt_private_android_import; t=Path(os.environ["RUNNER_TEMP"])/"darby-private-native"; attempt_private_android_import(payload=t/"final-011-candidate/final-module/payload",apk=t/"andbible-production-1117.apk",evidence_dir=t/"final-android-evidence",scratch=t,module_id="BRJND2024")'
      - name: Upload only metadata and checksums, never module or Bible text
        uses: actions/upload-artifact@v4
        with:
          name: darby-0-1-1-private-final-id-android-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/darby-private-native/report.json
            ${{ runner.temp }}/darby-private-native/final-011-candidate/metadata-only-report.json
            ${{ runner.temp }}/darby-private-native/final-android-evidence/
          retention-days: 30
          if-no-files-found: error
