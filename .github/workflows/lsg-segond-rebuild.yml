name: LSG full USFM to OSIS rebuild trial (no publication)
on:
  pull_request:
    paths:
      - '.github/workflows/lsg-segond-rebuild.yml'
      - 'scripts/lsg_rebuild_trial.py'
      - 'scripts/patch_u2o_intro.py'
      - 'tests/test_lsg_rebuild_trial.py'
      - 'scripts/lsg_osis_parity.py'
      - 'scripts/lsg_model_validation.py'
      - 'tests/test_lsg_model_validation.py'
      - 'scripts/lsg_note_parity.py'
      - 'scripts/lsg_note_space_dryrun.py'
      - 'scripts/lsg_speech_space_dryrun.py'
      - 'tests/test_lsg_speech_space_dryrun.py'
      - 'tests/test_lsg_note_space_dryrun.py'
      - 'scripts/lsg_poetry_parity.py'
      - 'tests/test_lsg_poetry_parity.py'
      - 'scripts/lsg_poetry_segments.py'
      - 'tests/test_lsg_poetry_segments.py'
      - 'tests/test_lsg_note_parity.py'
      - 'scripts/lsg_sword_rebuild.py'
      - 'scripts/lsg_v11n_coverage.py'
      - 'scripts/lsg_source_v11n_delta.py'
      - 'scripts/lsg_ephemeral_osis_candidate.py'
      - 'scripts/lsg_dynamic_sword_trial.py'
      - 'scripts/sword_raw_markup_counts.cpp'
      - 'tests/test_lsg_source_v11n_delta.py'
      - 'tests/test_lsg_ephemeral_osis_candidate.py'
      - 'scripts/sword_v11n_ceilings.cpp'
      - 'tests/test_lsg_v11n_coverage.py'
      - 'tests/test_lsg_osis_parity.py'
      - 'tests/test_lsg_sword_rebuild.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted XML and schema parsers
        run: python -m pip install -r requirements.txt
      - name: Pin upstream USFM converter to immutable reviewed commit
        run: |
          git clone --quiet https://github.com/adyeths/u2o.git "${{ runner.temp }}/u2o"
          git -C "${{ runner.temp }}/u2o" checkout -q --detach dde28bc545e8d8697fa5496c243187847ec55d31
          test "$(git -C "${{ runner.temp }}/u2o" rev-parse HEAD)" = dde28bc545e8d8697fa5496c243187847ec55d31
      - name: Apply reviewed generic intro-table fix to pinned converter COPY
        run: |
          python scripts/patch_u2o_intro.py \
            --original "${{ runner.temp }}/u2o/u2o.py" \
            --output "${{ runner.temp }}/u2o-reviewed/u2o.py"
      - name: Fetch matching publisher USFM and USFX original sources to temporary storage
        run: |
          mkdir -p "${{ runner.temp }}/original"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from pilot_fetch import fetch
          root=Path("${{ runner.temp }}/original")
          for item,url in [
              ("usfm","https://ebible.org/Scriptures/fraLSG_usfm.zip"),
              ("usfx","https://ebible.org/Scriptures/fraLSG_usfx.zip"),
          ]:
              info=fetch(url,root/(item+".zip"),"lsg")
              print("original",item,info["bytes"],info["sha256"])
          PY
      - name: Fetch and locally verify pinned official CrossWire/W3C XSD pair
        run: python scripts/fetch_reviewed_schema.py --directory "${{ runner.temp }}/reviewed-osis"
      - name: Install official SWORD compiler and isolated reader for diagnostic only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsword-utils diatheke libsword-dev >/dev/null
          command -v osis2mod
          command -v diatheke
      - name: Build temporary C++ reader of SWORD's canonical registry ceilings
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I/usr/include/sword scripts/sword_v11n_ceilings.cpp \
            -lsword -o "${{ runner.temp }}/sword-v11n-ceilings"
          test -x "${{ runner.temp }}/sword-v11n-ceilings"
      - name: Build pinned experimental CrossWire XML-v11n SWORD HEAD in temporary prefix
        run: |
          set -euo pipefail
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev zlib1g-dev libbz2-dev liblzma-dev libicu-dev >/dev/null
          git clone --quiet https://git.crosswire.org/main/sword.git "${{ runner.temp }}/sword-head"
          git -C "${{ runner.temp }}/sword-head" checkout --detach -q a376e42938580f446f53a4cb20e7161355fa9110
          test "$(git -C "${{ runner.temp }}/sword-head" rev-parse HEAD)" = a376e42938580f446f53a4cb20e7161355fa9110
          cmake -S "${{ runner.temp }}/sword-head" -B "${{ runner.temp }}/sword-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/sword-head-install" \
            -DWITH_CURL=OFF > /dev/null
          cmake --build "${{ runner.temp }}/sword-build" --parallel 3 >/dev/null
          cmake --install "${{ runner.temp }}/sword-build" >/dev/null
          test -x "${{ runner.temp }}/sword-head-install/bin/osis2mod"
          test -x "${{ runner.temp }}/sword-head-install/bin/diatheke"
          prefix="${{ runner.temp }}/sword-head-install"
          g++ -std=c++17 -O2 -Wall -Wextra \
            -I"$prefix/include" -I"$prefix/include/sword" \
            scripts/sword_raw_markup_counts.cpp \
            -L"$prefix/lib" -lsword \
            -o "${{ runner.temp }}/sword-raw-markup-inspector"
          test -x "${{ runner.temp }}/sword-raw-markup-inspector"
      - name: Test complete source conversion; no full Scripture module committed, uploaded or published
        env:
          LSG_SAMPLE_DEBUG: '0'
          LSG_COMPARE_CALVIN_V11N: '0'
          LSG_V11N_CEILINGS_BIN: ${{ runner.temp }}/sword-v11n-ceilings
          LSG_SWORD_HEAD_PREFIX: ${{ runner.temp }}/sword-head-install
          LSG_SWORD_RAW_INSPECTOR: ${{ runner.temp }}/sword-raw-markup-inspector
        run: |
          python scripts/lsg_rebuild_trial.py \
            --usfm-zip "${{ runner.temp }}/original/usfm.zip" \
            --usfx-zip "${{ runner.temp }}/original/usfx.zip" \
            --converter "${{ runner.temp }}/u2o-reviewed/u2o.py" \
            --schema "${{ runner.temp }}/reviewed-osis/osisCore.2.1.1-cw-latest.xsd" \
            --report reports/lsg-conversion-candidate.json
      - name: Upload ONLY diagnostic JSON, never OSIS XML, USFM, USFX or binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsg-private-osishandoff-diagnostic
          path: reports/lsg-conversion-candidate.json
          retention-days: 14
          if-no-files-found: warn
      - name: Explain acceptance limits
        if: always()
        run: |
          echo '## Candidate LSG USFM → OSIS (inspection only)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Immutable third-party converter version, original sources and two pinned official XSDs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If schemas pass, a real-source module is compiled ONLY in runner temporary storage, never uploaded/published.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real full verse-text, notes, xrefs and SWORD round-trip remain separate gates.' >> "$GITHUB_STEP_SUMMARY"
