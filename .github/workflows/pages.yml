name: Publish approved GitHub Releases and Pages catalogue
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and SWORD reader
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y diatheke
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: python scripts/build.py --output dist --base-url https://icfmp.github.io/Bible-Resources/
      - run: python scripts/smoke.py
      - name: Require an authorized GitHub Release for every catalogue resource
        run: |
          set -euo pipefail
          python scripts/catalogue_release_coverage.py --built dist
      - name: Retrieve pinned official schema for required BRNP gate
        run: python scripts/fetch_reviewed_schema.py --directory "$RUNNER_TEMP/brnp-osis"
      - name: Create or verify ALL GitHub Releases before exposing Pages catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/publish_reviewed_release.py \
            --built dist --repository "$GITHUB_REPOSITORY" \
            --target-sha "${{ github.sha }}" \
            --brnp-schema "$RUNNER_TEMP/brnp-osis/osisCore.2.1.1-cw-latest.xsd"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: pages-artifact
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Require the exact attempt artifact to be visible before deploying
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          for attempt in $(seq 1 12); do
            if response=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100) &&
              jq -e --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" \
                '.total_count == 1 and (.artifacts | length == 1 and (.[0].id | tostring) == $id and .[0].name == $name and .[0].expired == false)' \
                >/dev/null <<< "$response"; then
              echo "Verified exact Pages attempt artifact $ARTIFACT_NAME ($ARTIFACT_ID)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Exact Pages attempt artifact did not become uniquely visible"
          exit 1
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify live public HTTPS catalogue and all actual ZIP checksums
        run: |
          set -euo pipefail
          python scripts/verify_public_catalogue.py \
            --snapshot catalog/v1/catalog.json \
            --base-url https://icfmp.github.io/Bible-Resources/ \
            --attempts 8 --pause-seconds 8 \
            --run-id "${{ github.run_id }}"
