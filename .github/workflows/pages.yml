name: Publish approved GitHub Releases and Pages catalogue
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and SWORD reader
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y diatheke
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: python scripts/build.py --output dist --base-url https://icfmp.github.io/Bible-Resources/
      - run: python scripts/smoke.py
      - name: Require an authorized GitHub Release for every catalogue resource
        run: |
          set -euo pipefail
          python scripts/catalogue_release_coverage.py --built dist
      - name: Create or verify ALL GitHub Releases before exposing Pages catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/publish_reviewed_release.py \
            --built dist --repository "$GITHUB_REPOSITORY" \
            --target-sha "${{ github.sha }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
      - name: Verify live public HTTPS catalogue and all actual ZIP checksums
        run: |
          set -euo pipefail
          python scripts/verify_public_catalogue.py \
            --snapshot catalog/v1/catalog.json \
            --base-url https://icfmp.github.io/Bible-Resources/ \
            --attempts 8 --pause-seconds 8 \
            --run-id "${{ github.run_id }}"
