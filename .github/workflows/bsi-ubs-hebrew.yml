      - name: Upload read-only original lexical source-word evidence for final review
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-original-final-26-source-witnesses-REVIEW-ONLY
          path: /tmp/bsi-ubs-last-26-original-wlc-evidence.json
          retention-days: 7
      - name: Rebuild private source-word-verified v1 candidate without touching original index
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/build_private_reviewed_candidate.py \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --first entity-index/links/dictionaries/ubs-hebrew/reviewed_word_anchor_preview.json \
            --additional entity-index/links/dictionaries/ubs-hebrew/reviewed_additional_word_anchor_preview.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-v1-private-reviewed-candidate.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          original=Path("/tmp/bsi-ubs-hebrew-index.json")
          path=Path("/tmp/bsi-ubs-v1-private-reviewed-candidate.json")
          base=json.loads(original.read_text(encoding="utf-8"))
          candidate=json.loads(path.read_text(encoding="utf-8"))
          assert len(candidate["by_macula_word"]) == len(base["by_macula_word"]) + 273
          assert candidate["coverage_scope"]["linked_occurrences"] == 240371
          assert candidate["coverage_scope"]["indexable_unresolved"] == 2376
          assert candidate["coverage_scope"]["indexable_denominator"] == 242747
          assert candidate["editorial_candidate"]["status"] == "private_v1_candidate_not_published_or_approved"
          assert candidate["editorial_candidate"]["inferred_contextual_sense_ids"] == 0
          assert candidate["editorial_candidate"]["original_index_sha256"] == hashlib.sha256(original.read_bytes()).hexdigest()
          manifest=Path("entity-index/links/dictionaries/ubs-hebrew/v1_private_candidate_manifest.json")
          if manifest.is_file():
              expected=json.loads(manifest.read_text(encoding="utf-8"))
              assert expected["source_editions"] == candidate["editorial_candidate"]["index_source_revisions"]
              assert expected["status"] == candidate["editorial_candidate"]["status"]
              assert expected["candidate_index_sha256"] == hashlib.sha256(path.read_bytes()).hexdigest()
              assert expected["new_entry_only_word_links"] == 273
              assert expected["candidate_source_linked_lexical_occurrences"] == 240371
              assert expected["candidate_ubs_indexed_headword_coverage_pct"] == 99.021
              assert expected["original_source_words_left_unlinked_by_review"] == 1
              assert expected["contextual_sense_ids_inferred"] == 0
              assert expected["release_approved"] is False
          print("UBS_PRIVATE_CANDIDATE_REVIEW_NOT_PUBLICATION")
          PY
      - name: Rebuild 275-word final reviewed private candidate, preserve 24 source abstentions
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/build_final_reviewed_candidate.py \
            --index /tmp/bsi-ubs-v1-private-reviewed-candidate.json \
            --source_manifest entity-index/links/dictionaries/ubs-hebrew/v1_private_candidate_manifest.json \
            --decisions entity-index/links/dictionaries/ubs-hebrew/v1_final_word_specific_approvals.json \
            --source_evidence /tmp/bsi-ubs-last-26-original-wlc-evidence.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-v1-final-275-word-candidate.json
      - name: Measure one-pass Hebrew v1.1 semantic evidence on pinned original UBS and complete WLC
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_v11_semantic_feasibility.py \
            --index /tmp/bsi-ubs-v1-final-275-word-candidate.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --french ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-fr.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-v11-source-only-semantic-feasibility-PRIVATE.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/bsi-ubs-hebrew-v11-source-only-semantic-feasibility-PRIVATE.json').read_text())
          assert d['corpus']['all_original_wlc_words']==475911
          assert d['corpus']['original_lexical_class_words']==248680
          assert d['source_sense_inventory']['original_ubs_sense_ids']==16619
          assert d['original_ubs_headwords']==7943
          assert d['entry_only_review_word_count']==233190
          assert d['candidate_word_count']==53981
          assert d['candidate_headword_families']==1768
          assert sum(d['source_only_semantic_candidate_dispositions'].values())==d['entry_only_review_word_count']
          assert len(d['original_word_id_to_private_verse_witness_candidate'])==d['candidate_word_count']
          assert d['independently_contextually_validated']==0
          assert d['original_source_or_v1_release_modified'] is False
          assert d['published'] is False and d['publication_approved'] is False
          print('UBS_HEBREW_V11_SEMANTIC_FEASIBILITY_FULL_ORIGINAL_CORPUS_CHECKED_PRIVATE')
          PY
      - name: Build 72 private UBS Hebrew context pilot witnesses stratified by headword frequency
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/build_v11_context_pilot.py \
            --audit /tmp/bsi-ubs-hebrew-v11-source-only-semantic-feasibility-PRIVATE.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --french ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-fr.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-v11-72-word-contextual-pilot-PRIVATE.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/bsi-ubs-hebrew-v11-72-word-contextual-pilot-PRIVATE.json').read_text())
          assert d['sample_words']==72 and d['sample_family_count']==36
          assert len(d['source_contextual_evidence'])==72
          assert {x['tier'] for x in d['source_contextual_evidence']}=={'frequent','middle','rare'}
          assert all(x['original_wlc_word']['word_id']==x['word_id'] for x in d['source_contextual_evidence'])
          assert all(not x['editorial_approval'] and not x['independently_context_verified']
                     for x in d['source_contextual_evidence'])
          assert d['candidate_lexids_approved']==0 and d['publication_approved'] is False
          print('HEBREW_V11_72_STRATIFIED_ORIGINAL_CONTEXTS_PREPARED_NO_AUTOMATIC_EDITORIAL_ASSIGNMENT')
          PY
      - name: Upload private 72-sample Hebrew UBS semantic context pilot (NOT PUBLISHED)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-hebrew-v11-72-context-samples-PRIVATE-NOT-PUBLISHED
          path: /tmp/bsi-ubs-hebrew-v11-72-word-contextual-pilot-PRIVATE.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Hebrew v1.1 semantic feasibility audit (PRIVATE, NO choices)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-hebrew-v11-source-semantic-feasibility-PRIVATE-NOT-PUBLISHED
          path: /tmp/bsi-ubs-hebrew-v11-source-only-semantic-feasibility-PRIVATE.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload private final UBS v1 original-word-specific candidate (NOT released)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-final-275-word-source-verified-NOT-PUBLISHED
          path: /tmp/bsi-ubs-v1-final-275-word-candidate.json
          retention-days: 14
      - name: Verify reproducible, attributed UBS v1.0 technical RC package (NOT a release)
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/package_reviewed_v1_candidate.py \
            --index /tmp/bsi-ubs-v1-final-275-word-candidate.json \
            --release_manifest entity-index/links/dictionaries/ubs-hebrew/v1_final_candidate_manifest.json \
            --output /tmp/BSI-UBSHebrew-0.9.4-v1.0-rc2.zip
          cd /tmp
          sha256sum -c BSI-UBSHebrew-0.9.4-v1.0-rc2.zip.sha256
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          archive=Path("/tmp/BSI-UBSHebrew-0.9.4-v1.0-rc2.zip")
          with zipfile.ZipFile(archive) as z:
              root="BSI-UBSHebrew-0.9.4-v1.0-rc2/"
              readme=z.read(root+"README.md").decode("utf-8")
              att=z.read(root+"ATTRIBUTION.md").decode("utf-8")
              license=z.read(root+"LICENSE.txt").decode("utf-8")
              manifest=json.loads(z.read(root+"manifest.json"))
              payload=z.read(root+"index.json")
              assert "Not published" in readme
              assert "UBS" in att and "MACULA" in att
              assert "CC BY-SA 4.0" in license
              assert manifest["publication_authorized"] is False
              assert manifest["files"]["index.json"]["sha256"] == hashlib.sha256(payload).hexdigest()
              assert manifest["reviewed_word_specific_entry_only_links"] == 275
              assert manifest["last_word_specific_additional_approvals"] == 2
              assert manifest["retained_unlinked_original_final_word_reviews"] == 24
              assert manifest["inferred_contextual_ubs_sense_ids"] == 0
          print("UBS_V1_RC_BYTE_AND_RIGHTS_GATES_PASSED_NOT_PUBLISHED")
          PY
      - name: Stage exact owner-authorized, source-verified public ZIP for PR validation
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/promote_verified_ubs_release.py \
            --technical-rc /tmp/BSI-UBSHebrew-0.9.4-v1.0-rc2.zip \
