      - name: Upload generated QA index (not upstream dictionary definitions)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-hebrew-index-candidate
          path: |
            /tmp/bsi-ubs-hebrew-index.json
            /tmp/bsi-ubs-hebrew-lexical-gaps.json
            /tmp/bsi-ubs-hebrew-reconciliation.json
            /tmp/bsi-ubs-hebrew-top-lemmas.json
            /tmp/bsi-ubs-hebrew-sdbh-id-integrity.json
            /tmp/bsi-ubs-hebrew-family-register.json
          retention-days: 14

  publish-v1-lexical-data:
    name: Release independently audited UBS Hebrew lexical v1.0.0 after owner approval
    needs: verify-lexical-index
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: bsi-ubs-hebrew-v1-immutable-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Recover the separately checked immutable technical source ZIP from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: bsi-ubs-hebrew-v1-rc2-technical-NOT-PUBLISHED
          path: review-stage
      - name: Recover the separately reviewed publishable ZIP from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: bsi-ubs-hebrew-v1-publication-PREFLIGHT-NOT-PUBLISHED
          path: release-stage
      - name: Re-derive and verify the owner-authorized public ZIP bytes, no rebuild guesses
        run: |
          set -euo pipefail
          python3 -I entity-index/links/dictionaries/ubs-hebrew/promote_verified_ubs_release.py \
            --technical-rc review-stage/BSI-UBSHebrew-0.9.4-v1.0-rc2.zip \
            --approval entity-index/links/dictionaries/ubs-hebrew/v1_publication_authorization.json \
            --output release-stage/BSI-UBSHebrew-0.9.4-v1.0.0.zip \
            --verify-only
          (cd review-stage && sha256sum --check BSI-UBSHebrew-0.9.4-v1.0-rc2.zip.sha256)
          (cd release-stage && sha256sum --check BSI-UBSHebrew-0.9.4-v1.0.0.zip.sha256)
      - name: Create immutable data release or independently verify existing published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=bsi-ubs-hebrew-v1.0.0
          zip=BSI-UBSHebrew-0.9.4-v1.0.0.zip
          sha="${zip}.sha256"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p previous-release
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$zip" --pattern "$sha" --dir previous-release
            cmp "release-stage/$zip" "previous-release/$zip"
            cmp "release-stage/$sha" "previous-release/$sha"
            echo "Existing public UBS 0.9.4 v1.0.0 ZIP matches every previously reviewed byte."
          else
            gh release create "$tag" \
              "release-stage/$zip" "release-stage/$sha" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'BSI UBS Hebrew lexical crosswalk v1.0.0' \
              --notes 'First source-pinned lexical headword crosswalk for original MACULA WLC tokens to UBS Dictionary of Biblical Hebrew 0.9.4 (EN/FR). Independently attested and reproducible 275 source-word-specific additional entry-only links; 240,373 of 242,747 original lexical occurrences within this edition-specific indexed-headword scope have candidates (99.022%). This is NOT contextual semantic accuracy. No guessed contextual UBS sense IDs, original Bible text, MACULA source TSV or UBS dictionary articles are redistributed. Original source licenses and CC BY-SA 4.0 adaptation attribution are inside the archive. Standalone data resource: not a SWORD module and not integrated into the Bible application.'
            mkdir -p previous-release
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$zip" --pattern "$sha" --dir previous-release
            cmp "release-stage/$zip" "previous-release/$zip"
            cmp "release-stage/$sha" "previous-release/$sha"
            echo "Immutable public release uploaded and read-back verified."
          fi
