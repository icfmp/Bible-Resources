name: BSI UBS Hebrew dictionary crosswalk

on:
  pull_request:
    paths:
      - "entity-index/links/dictionaries/ubs-hebrew/**"
      - ".github/workflows/bsi-ubs-hebrew.yml"
  push:
    branches: [main]
    paths:
      - "entity-index/links/dictionaries/ubs-hebrew/**"
      - ".github/workflows/bsi-ubs-hebrew.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lexical-index:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Offline regression tests
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_index.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_lexical_gaps.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_strong_reconciliation.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_word_anchored.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_dictionary_scope.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_family_register.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_editorial_scope_dispositions.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_lexical_nonidentity.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_multi_headword_abstentions.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_reviewed_headwords.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_source_morpheme_abstentions.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_v1_disposition_coverage.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_single_candidate_abstentions.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_reviewed_word_anchor_preview.py
          python3 -I entity-index/links/dictionaries/ubs-hebrew/test_positive_family_unwitnessed.py
      - name: Check out exact UBS Hebrew EN/FR 0.9.4 source
        uses: actions/checkout@v4
        with:
          repository: ubsicap/ubs-open-license
          ref: a15a96cfaa4ca18a6c0339016645ba1e534db3c8
          path: ubs
          sparse-checkout: dictionaries/hebrew/JSON
          persist-credentials: false
      - name: Check out exact Macula Hebrew WLC original words
        uses: actions/checkout@v4
        with:
          repository: Clear-Bible/macula-hebrew
          ref: 47db250bd55d0d8577f2a94fba114ef16c35b23c
          path: macula-hebrew
          sparse-checkout: WLC/tsv
          lfs: true
          persist-credentials: false
      - name: Verify immutable commits and exact UBS Git blobs
        run: |
          test "$(git -C ubs rev-parse HEAD)" = "a15a96cfaa4ca18a6c0339016645ba1e534db3c8"
          test "$(git -C macula-hebrew rev-parse HEAD)" = "47db250bd55d0d8577f2a94fba114ef16c35b23c"
          test "$(git -C ubs hash-object dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON)" = "aabf1eeccc7fcf573b2346e8d2e3533a614ac055"
          test "$(git -C ubs hash-object dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-fr.JSON)" = "47dcfa6b17c455287e812305c8bf0bb15d213521"
          test "$(wc -c < macula-hebrew/WLC/tsv/macula-hebrew.tsv)" -gt 80000000
      - name: Analyze exact bilingual sense IDs and WLC source links
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/analyze_alignment.py \
            ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-fr.JSON \
            macula-hebrew/WLC/tsv/macula-hebrew.tsv
      - name: Build full bilingual lexical crosswalk
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/build_index.py \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --french ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-fr.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-index.json
      - name: Audit every unresolved dictionary link against pinned originals
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_unmatched.py \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-unmatched-audit.json
      - name: Diagnose unresolved Strong suffix families by original lemma and morphology
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_variants.py \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-variants.json \
            --expected-rows 475911
      - name: Rank every unresolved lexical occurrence by original language and lemma
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_lexical_gaps.py \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-lexical-gaps.json \

      - name: Investigate ten high-frequency unresolved Hebrew lexemes
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_top_lemmas.py \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-top-lemmas.json
      - name: Audit source-grounded Strong numeric-family reconciliation candidates
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_strong_reconciliation.py \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-reconciliation.json
      - name: Compare reproducible candidate-review report when committed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("/tmp/bsi-ubs-hebrew-reconciliation.json").read_text(encoding="utf-8"))
          assert actual["counts"]["unresolved_lexical_rows"] == 19975
          assert actual["counts"]["dual_evidence_candidate_occurrences"] == 7588
          assert actual["distinct_candidate_lexemes"] == 508
          assert all(x["verification_state"] == "candidate_only_not_accepted_link" for x in actual["candidates"])
          dest=Path("entity-index/links/dictionaries/ubs-hebrew/reconciliation_candidates.json")
          if dest.exists():
              assert json.loads(dest.read_text(encoding="utf-8")) == actual, "Candidate report differs from current pinned original sources"
              print("RECONCILIATION_CANDIDATE_REPORT_VERIFIED")
          else:
              print("RECONCILIATION_CANDIDATE_REPORT_PENDING_INITIAL_PIN")
          PY
      - name: Audit SDBH exact sense identity against independent lexical evidence
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_direct_sense_fidelity.py \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-sdbh-id-integrity.json
      - name: Examine remaining Hebrew orthographic differences without inferring links
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_orthography_gaps.py \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-orthography-gaps.json
      - name: Audit full UBS dictionary headword scope for remaining lexical words
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_dictionary_scope.py \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-scope.json
      - name: Build complete source-traceable v1 unresolved lexical family register
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/build_family_register.py \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-hebrew-family-register.json
      - name: Verify editorial nonidentity judgments against pinned UBS and MACULA originals
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/verify_lexical_nonidentity.py \
            --register /tmp/bsi-ubs-hebrew-family-register.json \
            --decisions entity-index/links/dictionaries/ubs-hebrew/v1_lexical_nonidentity_dispositions.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv
      - name: Verify all frozen multiple-headword abstentions from pinned UBS and MACULA sources
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/verify_multi_headword_abstentions.py \
            --register /tmp/bsi-ubs-hebrew-family-register.json \
            --decisions entity-index/links/dictionaries/ubs-hebrew/v1_multi_headword_abstentions.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv
      - name: Source-verify source-reviewed UBS entry-only identities
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/verify_reviewed_headwords.py \
            --register /tmp/bsi-ubs-hebrew-family-register.json \
            --decisions entity-index/links/dictionaries/ubs-hebrew/v1_reviewed_headword_dispositions.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv
      - name: Source-verify grammatical morphemes kept unlinked from inherited UBS headwords
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/verify_source_morpheme_abstentions.py \
            --register /tmp/bsi-ubs-hebrew-family-register.json \
            --decisions entity-index/links/dictionaries/ubs-hebrew/v1_source_morpheme_abstentions.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv
      - name: Verify source-keyed sole-candidate lexical abstentions without word links
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/verify_single_candidate_abstentions.py \
            --register /tmp/bsi-ubs-hebrew-family-register.json \
            --decisions entity-index/links/dictionaries/ubs-hebrew/v1_single_candidate_abstentions.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv
      - name: Stage only exact reviewed WLC word witnesses as entry-only candidate overlay
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/stage_reviewed_word_anchors.py \
            --register /tmp/bsi-ubs-hebrew-family-register.json \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --decisions entity-index/links/dictionaries/ubs-hebrew/v1_reviewed_headword_dispositions.json \
            --english ubs/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.4-en.JSON \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-reviewed-word-preview.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rel = Path("entity-index/links/dictionaries/ubs-hebrew/reviewed_word_anchor_preview.json")
          observed = json.loads(Path("/tmp/bsi-ubs-reviewed-word-preview.json").read_text(encoding="utf-8"))
          expected = json.loads(rel.read_text(encoding="utf-8"))
          assert observed == expected, "Reviewed anchor preview differs from pinned WLC"
          assert observed["summary"] == {
              "reviewed_families": 81,
              "reviewed_family_occurrences_not_automatically_linked": 274,
              "staged_original_word_ids": 139,
              "new_contextual_senses": 0,
          }
          print("UBS_EXPLICIT_WORD_WITNESS_PREVIEW_SOURCE_VERIFIED")
          PY
      - name: Enumerate every pending original WLC word inside source-reviewed headword families
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_positive_family_unwitnessed.py \
            --decisions entity-index/links/dictionaries/ubs-hebrew/v1_reviewed_headword_dispositions.json \
            --preview entity-index/links/dictionaries/ubs-hebrew/reviewed_word_anchor_preview.json \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --macula macula-hebrew/WLC/tsv/macula-hebrew.tsv \
            --output /tmp/bsi-ubs-positive-family-pending-original-words.json
          if [ -f entity-index/links/dictionaries/ubs-hebrew/positive_family_pending_original_words.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          generated=json.loads(Path("/tmp/bsi-ubs-positive-family-pending-original-words.json").read_text(encoding="utf-8"))
          committed=json.loads(Path("entity-index/links/dictionaries/ubs-hebrew/positive_family_pending_original_words.json").read_text(encoding="utf-8"))
          assert generated == committed, "Original MACULA word-level positive-family audit has drifted"
          print("UBS_135_PENDING_WORDS_EXACT_SOURCE_PIN_VERIFIED")
          PY
          fi
      - name: Verify all lexical families classified without editorial assumptions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          register=json.loads(Path("/tmp/bsi-ubs-hebrew-family-register.json").read_text(encoding="utf-8"))
          summary=register["summary"]
          assert summary["lexical_source_occurrences"] == 248680
          assert summary["linked_occurrences"] == 240098
          assert summary["unresolved_occurrences"] == 8582
          assert summary["outside_scope_occurrences"] == 5933
          assert summary["inside_scope_unresolved_occurrences"] == 2649
          assert summary["unresolved_families"] == 202 == len(register["families"])
          assert summary["families_by_reason"] == {
              "different_strong_exact_attested_lemma": 46,
              "different_strong_same_consonants": 27,
              "same_strong_family_unresolved": 122,
              "source_strong_unreadable": 2,
              "unattested_indexed_headword": 5,
          }
          assert sum(g["occurrences"] for g in register["families"]) == 8582
          assert summary["families_with_editorial_decision"] == 0
          assert all(g["review_decision"] == "not_editorially_validated" for g in register["families"])
          dest=Path("entity-index/links/dictionaries/ubs-hebrew/family_register.json")
          if dest.is_file():
              assert json.loads(dest.read_text(encoding="utf-8")) == register, "Family register does not match pinned sources"
          print("UBS_FAMILY_REGISTER_REPRODUCIBLE", summary)
          PY
      - name: Audit the entire independent UBS v1 editorial disposition partition
        run: |
          python3 -I entity-index/links/dictionaries/ubs-hebrew/audit_v1_disposition_coverage.py \
            --register /tmp/bsi-ubs-hebrew-family-register.json \
            --scope entity-index/links/dictionaries/ubs-hebrew/v1_scope_dispositions.json \
            --nonidentity entity-index/links/dictionaries/ubs-hebrew/v1_lexical_nonidentity_dispositions.json \
            --ambiguous entity-index/links/dictionaries/ubs-hebrew/v1_multi_headword_abstentions.json \
            --morphemes entity-index/links/dictionaries/ubs-hebrew/v1_source_morpheme_abstentions.json \
            --single entity-index/links/dictionaries/ubs-hebrew/v1_single_candidate_abstentions.json \
            --positive entity-index/links/dictionaries/ubs-hebrew/v1_reviewed_headword_dispositions.json \
            --index /tmp/bsi-ubs-hebrew-index.json \
            --output /tmp/bsi-ubs-v1-disposition-coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("/tmp/bsi-ubs-v1-disposition-coverage.json").read_text(encoding="utf-8"))
          snapshot=json.loads(Path("entity-index/links/dictionaries/ubs-hebrew/v1_disposition_coverage.json").read_text(encoding="utf-8"))
          assert actual == snapshot, "UBS v1 ledger partition differs from pinned original source inventory"
          counts=actual["counts"]
          assert (counts["in_scope_occurrences_with_any_disposition"]
                  + counts["not_yet_dispositioned_original_occurrences"]
                  == counts["in_scope_unresolved_occurrences_at_baseline"])
          assert (counts["in_scope_unresolved_occurrences_at_baseline"]
                  + counts["edition_scope_excluded_occurrences"]
                  == counts["original_unresolved_occurrences"])
          assert actual["policy"]["publication_approved"] is False
          print("UBS_V1_DISPOSITION_PARTITION_REPRODUCIBLE", counts)
          PY
      - name: Compare pinned generated index or prepare initial reproducible snapshot
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          generated=Path("/tmp/bsi-ubs-hebrew-index.json")
          target=Path("entity-index/links/dictionaries/ubs-hebrew/index.json")
          actual=json.loads(generated.read_text(encoding="utf-8"))
          assert actual["format"]=="bsi-ubs-hebrew-lexical-crosswalk"
          assert actual["languages"]==["en","fr"]
          assert actual["coverage"]["macula_words"] > 300000
          assert actual["coverage"]["with_ubs_entry_candidates"]==257038
          assert actual["statistics"]["shared_entries"]==7943
          assert actual["statistics"]["shared_senses"]==16619
          assert actual["statistics"]["indexed_strong_numbers"]==8979
          assert actual["coverage"]["macula_words"]==475911
          assert actual["coverage"]["with_exact_ubs_sense_candidates"]==30492
          assert actual["coverage"]["ambiguous_ubs_entry_candidates"]==5024
          assert actual["coverage"]["no_entry_match"]==218868
          assert actual["coverage_with_word_ids"]["additional_entry_only_links"] == 11393
          assert actual["coverage_with_word_ids"]["macula_word_ubs_alternate_lemma_and_source_sdbh_owner_entry_only"] == 1
          assert actual["coverage_with_word_ids"]["macula_word_ubs_published_alternate_lemma_same_strong_family"] == 610
          assert actual["coverage_with_word_ids"]["macula_word_consonants_and_source_sdbh_ubs_owner_entry_only"] == 2
          assert actual["coverage_with_word_ids"]["macula_word_exact_lemma_and_source_sdbh_ubs_owner_entry_only"] == 16
          assert actual["coverage_with_word_ids"]["word_aware_entry_links"] == 268431
          scope=actual["coverage_scope"]
          assert scope["original_lexical_source_occurrences"] == 248680
          assert scope["linked_occurrences"] == 240098
          assert scope["outside_indexed_headword_scope"] == 5933
          assert scope["indexable_denominator"] == 242747
          assert scope["indexable_unresolved"] == 2649
          assert scope["coverage_pct"] == 98.909
          assert scope["full_source_coverage_pct"] == 96.549
          assert scope["review"] == {
              "different_strong_same_exact_headword_review": 205,
              "different_strong_same_consonants_review": 2015,
              "matching_strong_family_unresolved_review": 427,
              "source_code_unreadable_review": 2,
          }
          assert len(actual["by_macula_word"]) == actual["coverage_with_word_ids"]["additional_entry_only_links"]
          assert actual["coverage_with_word_ids"]["generic_entry_links"] == 257038
          assert sum(actual["coverage"][key] for key in (
              "direct_sense","entry_only","ambiguous_entry_only",
              "no_entry_match","no_verified_lexical_link"))==475911
          assert actual["by_sdbh"]["006653001001000"]==["006653000000000"]
          import runpy
          lookup=runpy.run_path("entity-index/links/dictionaries/ubs-hebrew/build_index.py")["lookup"]
          direct=lookup(actual,"006653001001000","7225","H")
          assert "006653000000000" not in direct["entry_ids"] and direct["sense_ids"]==[]
          fallback=lookup(actual,"001156001002000","1254","H")
          assert fallback["sense_ids"]==[] and fallback["status"]=="entry_only"

          if target.is_file():
              assert json.loads(target.read_text(encoding="utf-8")) == actual, "Committed index differs from regenerated data"
              print("BSI_UBS_HEBREW_COMMITTED_INDEX_VERIFIED")
          else:
              print("BSI_UBS_HEBREW_INITIAL_INDEX_PENDING_COMMIT")
          PY
      - name: Upload generated QA index (not upstream dictionary definitions)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-hebrew-index-candidate
          path: |
            /tmp/bsi-ubs-hebrew-index.json
            /tmp/bsi-ubs-hebrew-lexical-gaps.json
            /tmp/bsi-ubs-hebrew-reconciliation.json
            /tmp/bsi-ubs-hebrew-top-lemmas.json
            /tmp/bsi-ubs-hebrew-sdbh-id-integrity.json
            /tmp/bsi-ubs-hebrew-family-register.json
          retention-days: 14
