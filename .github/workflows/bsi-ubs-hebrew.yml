          path: |
            /tmp/BSI-UBSHebrew-0.9.4-v1.0-rc2.zip
            /tmp/BSI-UBSHebrew-0.9.4-v1.0-rc2.zip.sha256
          retention-days: 14
      - name: Upload private UBS 0.9.4 v1 word-level index candidate (NOT released)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-v1-private-reviewed-word-candidate
          path: /tmp/bsi-ubs-v1-private-reviewed-candidate.json
