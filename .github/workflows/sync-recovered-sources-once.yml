name: Sync exact recovered editorial sources with current main
on:
  push:
    branches: [recovery/approved-clean-osis-20261120]
    paths: [.github/workflows/sync-recovered-sources-once.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    if: github.repository == 'icfmp/Bible-Resources'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Integrate latest published source/release main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/sync-recovered-sources-once.yml
          git diff --cached --check
          git commit -m 'Complete source recovery main synchronization without changing original sources'
          git push origin HEAD:recovery/approved-clean-osis-20261120
