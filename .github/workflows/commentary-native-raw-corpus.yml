name: Audit full raw commentary corpus (metadata-only)
on:
  pull_request:
    paths:
      - '.github/workflows/commentary-native-raw-corpus.yml'
      - 'scripts/commentary_native_raw_inventory.py'
      - 'scripts/sword_native_commentary_raw_corpus.cpp'
      - 'scripts/sword_native_commentary_index.cpp'
      - 'tests/test_commentary_native_raw_inventory.py'
      - 'config/commentary-intake/**'
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Reviewed source-neutral pinned commentary intake ID"
        required: true
        type: string
        default: mhcc-crosswire

permissions:
  contents: read

concurrency:
  group: commentary-raw-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full_stock_commentary_raw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESOURCE_ID: ${{ github.event.inputs.resource_id || 'mhcc-crosswire' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stock SWORD C++ development library
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y libsword-dev
      - name: Build private raw-content reader and independent metadata-only key inspector
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_index.cpp \
            -o "${RUNNER_TEMP}/commentary-native-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "${RUNNER_TEMP}/commentary-private-raw" -lsword
      - name: Independently enumerate and SHA every exact stock commentary entry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_native_raw_inventory.py \
            --resource-id "$RESOURCE_ID" \
            --native-index-binary "${RUNNER_TEMP}/commentary-native-index" \
            --native-raw-binary "${RUNNER_TEMP}/commentary-private-raw" \
            --report "${RUNNER_TEMP}/commentary-raw-receipt.json"
      - name: Enforce complete source-native XML observation and content privacy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"])/"commentary-raw-receipt.json").read_text()
          )
          source = json.loads(
              (Path("config/commentary-intake")/(os.environ["RESOURCE_ID"]+".json")).read_text()
          )
          assert report["stock_sword_original_sha256"] == source["archive_sha256"]
          if source.get("native_raw_corpus_sha256"):
              assert report["native_raw_corpus_ordered_sha256"] == source["native_raw_corpus_sha256"]
          census = report["original_stock_markup_census"]
          assert census["all_original_native_entries_accounted_for"] is True
          assert census["raw_entries_observed"] == report["raw_entry_count"]
          assert census["opaque_top_entries_not_assumed_to_be_xml"] == report["raw_opaque_top_slots"]
          assert (census["strict_xml_parseable_numbered_or_intro_entries"]
                  + census["empty_numbered_or_intro_entries"]
                  + census["unparseable_numbered_or_intro_entries"]
                  + census["oversized_or_binary_numbered_or_intro_entries"]
                  == report["raw_numbered_slots"] + report["raw_introduction_slots"])
          assert (census["reference_elements_with_osisref_attribute"]
                  + census["reference_elements_without_osisref_attribute"]
                  == census["original_element_counts_by_fixed_category"]["reference"])
          forms = census["original_osisref_form_count_by_fixed_category"]
          assert set(forms) == {
              "single_osis_verse", "verse_range_like", "book_or_chapter_like",
              "compound_target", "other_unclassified",
          }
          assert all(type(value) is int and value >= 0 for value in forms.values())
          assert sum(forms.values()) == census["reference_elements_with_osisref_attribute"]
          assert (census["original_reference_labels_with_visible_text"]
                  + census["original_reference_labels_without_visible_text"]
                  == census["original_element_counts_by_fixed_category"]["reference"])
          assert (census["original_title_elements_with_visible_text"]
                  + census["original_title_elements_without_visible_text"]
                  == census["original_element_counts_by_fixed_category"]["title"])
          assert (0 <= census["original_reference_elements_with_literal_Bible_work_prefix"]
                  <= census["reference_elements_with_osisref_attribute"])
          assert census["no_osisref_value_normalization_or_verse_existence_claim"] is True
          assert census["no_original_words_keys_or_reference_values_reported"] is True
          assert census["no_original_source_bytes_rewritten"] is True
          assert census["source_to_other_digital_edition_parity_proven"] is False
          assert census["real_reader_layout_or_click_navigation_proven"] is False
          assert report["original_bytes_changed"] is False and report["published"] is False
          print("Original-stock markup: {} strictly parsed; {} unresolved XML; "
                "{} title elements, {} references; no source edits or release".format(
                    census["strict_xml_parseable_numbered_or_intro_entries"],
                    census["unparseable_numbered_or_intro_entries"],
                    census["original_element_counts_by_fixed_category"]["title"],
                    census["original_element_counts_by_fixed_category"]["reference"],
                ))
          print("Original OSIS reference form tally (metadata only): "
                + json.dumps(forms, sort_keys=True))
          print("Original reference labels with/without visible text: "
                + str(census["original_reference_labels_with_visible_text"])
                + "/" + str(census["original_reference_labels_without_visible_text"]))
          print("Original titles with/without visible text: "
                + str(census["original_title_elements_with_visible_text"])
                + "/" + str(census["original_title_elements_without_visible_text"]))
          PY
      - name: Retain only text-free metadata, hashes, totals and pending approvals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary-full-raw-metadata-receipt
          path: ${{ runner.temp }}/commentary-raw-receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Document strict stage 4b boundary
        if: always()
        run: |
          {
            echo '## Complete native SWORD commentary content inventory'
            echo 'Raw words and XML were read privately via a subprocess PIPE and never shown in logs or artifacts.'
            echo 'All native keys must be independently enumerated with the stock SWORD engine and agree EXACTLY.'
            echo 'A complete native raw corpus hash is NOT independent source-to-compiled fidelity, nor markup/notes/signoff.'
            echo 'Source equivalence, rights, GUI reader tests and publication remain BLOCKED.'
          } >> "$GITHUB_STEP_SUMMARY"
