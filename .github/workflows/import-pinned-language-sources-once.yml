name: Import exact rights-reviewed Bible originals into language-typed source tree
on:
  push:
    branches:
      - maintenance/real-language-sources-20261120
    paths:
      - .github/workflows/import-pinned-language-sources-once.yml
permissions:
  contents: write
jobs:
  import-exact-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    if: github.repository == 'icfmp/Bible-Resources'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download two exact independently reviewed public-domain originals
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          mkdir -p sources/original/bibles/fr/lsg-1910 sources/original/bibles/fr/darby-jnd-2024
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 180 \
            https://ebible.org/Scriptures/fraLSG_usfm.zip \
            -o sources/original/bibles/fr/lsg-1910/fraLSG_usfm.zip
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 180 \
            https://cdn.editeurbpc.com/bible/osis/JND/bible_jnd_2_0.xml \
            -o sources/original/bibles/fr/darby-jnd-2024/bible_jnd_2_0.xml
      - name: Verify immutable original identities and safe supported formats
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET

          lsg = Path("sources/original/bibles/fr/lsg-1910/fraLSG_usfm.zip")
          darby = Path("sources/original/bibles/fr/darby-jnd-2024/bible_jnd_2_0.xml")
          m = json.loads(Path("config/catalogue-import-lsg-0.1.0.json").read_text())
          d = json.loads(Path("config/publisher-osis/frajnd-2024.json").read_text())
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          if not (0 < lsg.stat().st_size <= 10_000_000 and
                  digest(lsg) == m["source_usfm_zip_sha256"]):
              raise SystemExit("LSG source archive changed: refuse commit")
          if not (darby.stat().st_size == d["size_bytes"] and
                  digest(darby) == d["sha256"]):
              raise SystemExit("Darby edition changed: refuse commit")
          with ZipFile(lsg) as z:
              names = z.namelist()
              if (z.testzip() is not None or len(names) < 66 or
                  sum(i.file_size for i in z.infolist()) > 80_000_000 or
                  not any(n.lower().endswith((".sfm", ".usfm")) for n in names)):
                  raise SystemExit("LSG USFM archive integrity/format mismatch")
              for i in z.infolist():
                  pp=Path(i.filename)
                  if i.filename.startswith("/") or ".." in pp.parts or "\\" in i.filename:
                      raise SystemExit("Unsafe LSG archive filename")
          doc = ET.parse(darby)
          if not doc.getroot().tag.endswith("osis"):
              raise SystemExit("Darby source not OSIS")
          for p in (lsg, darby):
              print(p, "bytes", p.stat().st_size, "SHA-256", digest(p))
          PY
      - name: Commit only exact original files, not temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/import-pinned-language-sources-once.yml
          git add sources/original/bibles/fr/lsg-1910/fraLSG_usfm.zip \
                  sources/original/bibles/fr/darby-jnd-2024/bible_jnd_2_0.xml
          # An immutable publisher original may contain intentional trailing
          # spaces; never rewrite its bytes just to satisfy git diff --check.
          git diff --cached --check -- ':!sources/original/**'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Store byte-pinned French Bible original USFM and OSIS sources"
          git push origin HEAD:maintenance/real-language-sources-20261120
