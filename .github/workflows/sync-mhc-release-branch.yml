name: Synchronize MHC release branch with current main
on:
  push:
    branches: [release/mhc-0.1.0-publication]
    paths:
      - .github/workflows/sync-mhc-release-branch.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'icfmp/Bible-Resources'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Integrate latest main without overwriting unrelated repository changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          git rm .github/workflows/sync-mhc-release-branch.yml
          python scripts/tool_registry.py --check
          git diff --cached --check
          git commit -m "Remove one-time main synchronization workflow"
          git push origin HEAD:release/mhc-0.1.0-publication
