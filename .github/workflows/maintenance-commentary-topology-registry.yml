name: One-shot commentary topology tools registry refresh
on:
  pull_request:
    paths:
      - '.github/workflows/maintenance-commentary-topology-registry.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/commentary-census-and-topology-20261122
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove temporary workflow, refresh exact tracked consumers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintenance-commentary-topology-registry.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update registry for packaged commentary topology libraries'
          git push origin HEAD:maintenance/commentary-census-and-topology-20261122
