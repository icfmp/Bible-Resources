name: One-shot completed release-bootstrap inventory refresh
on:
  pull_request:
    paths:
      - '.github/workflows/maintenance-oneoff-release-retirement-registry.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/retire-completed-release-bootstraps-20261121
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate inventory excluding removed temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintenance-oneoff-release-retirement-registry.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git add -f reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync tooling inventory after completed release bootstrap retirement'
          git push origin HEAD:maintenance/retire-completed-release-bootstraps-20261121
