name: LSG 1910 full printed marginal apparatus batch study (unpublished evidence)
on:
  pull_request:
    paths:
      - .github/workflows/lsg-1910-batch-audit.yml
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install DjVu and source inspection dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y djvulibre-bin
          python -m pip install -q lxml rapidfuzz Pillow
      - uses: actions/cache@v4
        with:
          path: /tmp/lsg-print-1910.djvu
          key: original-facsimile-1910-sha256-67854882ec0e88defa5fea2d76a53ef479d2173467cdfa9b57f94a91c470643b
      - name: Download and check exact original 1910 printed edition
        run: |
          if [ ! -f /tmp/lsg-print-1910.djvu ]; then
            curl --retry 3 -fsSL 'https://upload.wikimedia.org/wikipedia/commons/1/17/La_Sainte_Bible%2C_trad._Segond%2C_ed._1910.djvu' -o /tmp/lsg-print-1910.djvu
          fi
          echo '67854882ec0e88defa5fea2d76a53ef479d2173467cdfa9b57f94a91c470643b  /tmp/lsg-print-1910.djvu' | sha256sum --check
      - name: Reconstruct source verse snippets and locate all 54 cases in the 1061-page embedded transcription
        run: |
          mkdir -p /tmp/lsg1910batch
          python - <<'PY'
          import re, json, unicodedata, subprocess, hashlib
          from pathlib import Path
          from zipfile import ZipFile
          from rapidfuzz import fuzz
          from lxml import etree
          from collections import defaultdict
          records=json.loads(Path('sources/cleaned/bibles/fr/lsg-1910/editorial/SECONDARY_DIGITAL_CITATION_COMPARISON_2026-11-23.json').read_text())['records']
          original=Path('sources/original/bibles/fr/lsg-1910/fraLSG_usfx.zip')
          with ZipFile(original) as z: doc=etree.fromstring(z.read('fraLSG_usfx.xml'))
          raw=subprocess.run(['djvutxt','/tmp/lsg-print-1910.djvu'],check=True,capture_output=True).stdout.decode('utf-8','replace')
          pages=raw.split('\f')
          if len(pages)!=1061: raise SystemExit('Unexpected printed page inventory')
          def norm(s):
              s=unicodedata.normalize('NFKD',s.casefold())
              s=''.join(c for c in s if not unicodedata.combining(c))
              return ' '.join(re.findall('[a-z0-9]+',s))
          normalized=[norm(p) for p in pages]
          expected={(r['original_usfm_book'],r['source_note_origin']) for r in records}
          samples={}
          for book in doc.iter('book'):
              bid=book.get('id')
              ch=None
              for node in book.iter():
                  if node.tag=='c':
                      ch=node.get('id')
                  elif node.tag=='v' and ch:
                      ref=(bid,ch+'.'+str(node.get('id')))
                      if ref not in expected: continue
                      # The USFX uses empty verse-number elements, with authorial text after each milestone.
                      text=(node.tail or '')
                      sibling=node.getnext()
                      while sibling is not None and sibling.tag not in ('c','v'):
                          if sibling.tag not in ('x','f'):
                              text+=' '+''.join(sibling.itertext())
                          text+=' '+(sibling.tail or '')
                          sibling=sibling.getnext()
                      samples[ref]=norm(text)[:220]
          print('EXTRACTED_VERSE_SNIPPETS',len(samples),'of',len(expected))
          for sample in [('GEN','9.4'),('GEN','28.12'),('LEV','10.18'),('REV','20.12')]:
              print('SAMPLE_VERSE',sample,repr(samples.get(sample,''))[:240])
          results=[]
          for r in records:
              key=(r['original_usfm_book'],r['source_note_origin'])
              snippet=samples.get(key,'')
              if len(snippet)<30: 
                  print('SOURCE_VERSE_TOO_SHORT',r['record_id'],repr(snippet))
                  results.append({'record_id':r['record_id'],'source_usfm_book':key[0],'source_note_origin':key[1],'source_excerpt':snippet,'match_status':'insufficient_original_verse_snippet','candidate_pages':[]})
                  continue
              # Matching only identifies a candidate page. OCR is inherently noisy: a high
              # similarity here is NOT historical proof of the literal printed marginal notes.
              query=snippet[:130]
              scores=sorted(((round(fuzz.partial_ratio(query,p),2),i+1) for i,p in enumerate(normalized)),reverse=True)[:5]
              best_score,best_page=scores[0]
              row={'record_id':r['record_id'],'source_usfm_book':key[0],'source_note_origin':key[1],
                   'source_excerpt':snippet[:160],
                   'match_status':'candidate_not_manually_verified',
                   'candidate_pages':[{'page':page,'score':score,'header':pages[page-1].splitlines()[0][:100]} for score,page in scores]}
              results.append(row)
              print('BATCH_VERSE_PAGE_CANDIDATE='+json.dumps(row,ensure_ascii=False,separators=(',',':')))
          assert len(results)==54 and len({r['record_id'] for r in results})==54
          Path('/tmp/lsg1910batch/all-candidate-page-locators.json').write_text(json.dumps({
            'source':'original_1910_print_existing_ocr_layer_only_not_print_reference_certification',
            'scan_sha256':'67854882ec0e88defa5fea2d76a53ef479d2173467cdfa9b57f94a91c470643b',
            'original_usfx_sha256':hashlib.sha256(original.read_bytes()).hexdigest(),
            'records':results
          },indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('PAGE_LOCATOR_COMPLETE',len(results),'unique_pages',len(set(r['candidate_pages'][0]['page'] for r in results if r['candidate_pages'])))
          for lo,hi in [(558,568),(579,587),(620,634),(997,1008),(1035,1042)]:
              for p in range(lo,hi+1):
                  print('TARGET_CHAPTER_HEADER',p,repr(pages[p-1].splitlines()[:2])[:140])
          detail=subprocess.run(['djvutxt','-detail=word','-page=29','/tmp/lsg-print-1910.djvu'],capture_output=True,check=True).stdout.decode('utf-8','replace')
          print('EXAMPLE_GEOMETRIC_TEXT_29',repr(detail[:3800]))
          PY
      - name: Extract all 54 actual printed page evidence regions in one pass
        run: |
          python - <<'PY'
          import re,json,base64,subprocess
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          from rapidfuzz import fuzz
          from unicodedata import normalize,combining
          root=Path('/tmp/lsg1910batch')
          doc=json.loads((root/'all-candidate-page-locators.json').read_text())
          overrides={
            'LSG-CR-016':559,  # Song 2:15, SNG chapter 2
            'LSG-CR-018':580,  # Isaiah 23:1, print page Isaiah 22-24
            'LSG-CR-021':627,  # Jeremiah 7:16, avoid identical phrase at Jeremiah 11
            'LSG-CR-046':1001, # Hebrews 2:13, only short snippet
            'LSG-CR-054':1039, # Revelation 20:12, reject a misleading repeated passage at chapter 7
          }
          def norm(s):
              s=normalize('NFKD',s.casefold())
              s=''.join(c for c in s if not combining(c))
              return ' '.join(re.findall('[a-z0-9]+',s))
          entries=[]
          for case in doc['records']:
              id=case['record_id']
              predicted=case['candidate_pages'][0]['page'] if case['candidate_pages'] else None
              page=overrides.get(id,predicted)
              if page is None or not 1<=page<=1061:raise SystemExit('No print locator for '+id)
              assert len([v for v in doc['records'] if v['record_id']==id])==1
              # The page locator is an OCR finding; never label it as visual reference proof.
              target=root/f'{id}-original-page{page}.tif'
              subprocess.run(['ddjvu','-page='+str(page),'-format=tiff','/tmp/lsg-print-1910.djvu',str(target)],check=True)
              im=Image.open(target).convert('RGB')
              width,height=im.size
              detail=subprocess.run(['djvutxt','-detail=word','-page='+str(page),'/tmp/lsg-print-1910.djvu'],
                                    check=True,capture_output=True).stdout.decode('utf-8','replace')
              line_re=r'^\s*\(line (\d+) (\d+) (\d+) (\d+) ([^\n]*)\)'
              lines=[]
              for m in re.finditer(line_re,detail,re.M):
                  words=re.findall(r'\(word \d+ \d+ \d+ \d+ "((?:[^"\\]|\\.)*)"\)',m.group(5))
                  content=norm(' '.join(words))
                  if content:lines.append((int(m.group(1)),int(m.group(2)),int(m.group(3)),int(m.group(4)),content))
              snippet=case['source_excerpt'][:105]
              candidates=[]
              if len(snippet)>=30:
                  for k in range(len(lines)):
                      window=' '.join(t[4] for t in lines[k:k+6])
                      if len(window)<max(45,len(snippet)*.7):continue
                      score=fuzz.partial_ratio(snippet,window)
                      candidates.append((score,k))
              score,k=max(candidates,default=(0,0))
              if score>=69 and lines:
                  selected=lines[k:k+6]
                  source_y_top=height-max(t[3] for t in selected)
                  source_y_bottom=height-min(t[1] for t in selected)
                  # Keep both original Scripture text and marginal column, with 100px context.
                  top=max(0,source_y_top-110)
                  bottom=min(height,source_y_bottom+120)
                  if bottom-top<280:
                      top=max(0,top-55);bottom=min(height,bottom+55)
                  location='verse_text_geo_candidate_not_historically_certified'
              else:
                  top=0;bottom=height
                  location='full_page_when_exact_verse_geometry_unreliable'
              snippet_crop=im.crop((0,top,width,bottom))
              out=root/f'{id}-printed-page{page}-source-context.jpg'
              snippet_crop.save(out,format='JPEG',quality=87,optimize=True)
              data=out.read_bytes()
              record={
                'record_id':id,'source_book':case['source_usfm_book'],
                'source_note_origin':case['source_note_origin'],
                'original_scan_page':page,'page_url':f'https://fr.wikisource.org/wiki/Page:La_Sainte_Bible,_trad._Segond,_ed._1910.djvu/{page}',
                'source_excerpt':case['source_excerpt'],
                'locator_type':('explicit_historical_chapter_page_hint' if id in overrides else 'automated_source_verse_text_match'),
                'image_crop_coordinates_original_pixels':[0,top,width,bottom],
                'approximate_source_verse_image_match_score':round(score,2),
                'image_anchor_status':location,'historical_print_reference_certified':False,
                'crop_filename':out.name,
              }
              entries.append(record)
              print('LSG_1910_CASE_SUMMARY='+json.dumps(record,ensure_ascii=False,separators=(',',':')))
              print(f'LSG_1910_CASE_IMAGE_{id}_BEGIN')
              print(base64.b64encode(data).decode('ascii'))
              print(f'LSG_1910_CASE_IMAGE_{id}_END')
              target.unlink()
          if len(entries)!=54 or len({r['record_id'] for r in entries})!=54:
              raise SystemExit('Missing exact-source printed case evidence')
          (root/'all-54-original-print-page-excerpts-ledger.json').write_text(
              json.dumps({'status':'images_extracted_from_original_1910_print_not_manual_reference_certification',
                  'original_djvu_sha256':doc['scan_sha256'],'records':entries},indent=2,ensure_ascii=False)+'\n',
              encoding='utf-8')
          print('PRINTED_PAGE_EXTRACTION_COMPLETE',len(entries),'distinct_printed_pages',len(set(x['original_scan_page'] for x in entries)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lsg-1910-source-verse-to-original-print-OCR-page-candidates-unapproved
          path: |
            /tmp/lsg1910batch/*.json
            /tmp/lsg1910batch/*.jpg
          retention-days: 7
