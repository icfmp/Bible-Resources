name: Darby configuration-only release reader replay (private candidate)
on:
  pull_request:
    paths:
      - '.github/workflows/darby-configuration-reader-replay.yml'
      - 'modules/darby-jnd-2024/payload/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xiphos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact production-format candidate
        run: |
          python -m pip install -r requirements.txt
          python scripts/build.py --output "$RUNNER_TEMP/reader-dist"
      - name: Install real Xiphos and replay historical isolated reader setup
        run: |
          set -euo pipefail
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i -E 's#https?://[A-Za-z0-9.-]*ec2.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 update -qq
          timeout 180s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y xiphos xvfb dbus-x11 xdotool xclip imagemagick diatheke
          git fetch --no-tags --depth=1 origin refs/pull/245/head
          test "$(git rev-parse FETCH_HEAD)" = '8c6f2b821048114550c046b44bf9cb3e0e9677cd'
          mkdir -p "$RUNNER_TEMP/reader-replay" "$RUNNER_TEMP/xiphos-evidence"
          git show FETCH_HEAD:scripts/reader_xiphos_headless_smoke.py > "$RUNNER_TEMP/reader-replay/reader_xiphos_headless_smoke.py"
      - name: Real Xiphos source-prose clipboard witnesses and note-preview comparison
        env:
          GH_TOKEN: ${{ github.token }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, subprocess, sys, time, unicodedata
          from pathlib import Path
          from research.bible.source_osis_verse_notes import original_osis_verses_and_notes
          base=Path(os.environ["RUNNER_TEMP"])
          sys.path.insert(0,str(base/"reader-replay"))
          import reader_xiphos_headless_smoke as replay
          folder=Path("modules/darby-jnd-2024")
          proof=json.loads((folder/"RELEASE_PROVENANCE.json").read_text())
          prior=proof["prior_release_binding"]
          source=Path("sources/cleaned/bibles/fr/darby-jnd-2024/bible_jnd_2_0.osis.xml").read_bytes()
          assert hashlib.sha256(source).hexdigest()==proof["corrected_candidate_osis_sha256"]
          verses,notes,_=original_osis_verses_and_notes(source)
          candidate=base/"reader-dist/sword/packages/BRJND2024.zip"
          assert hashlib.sha256(candidate.read_bytes()).hexdigest()==proof["release_zip_sha256"]
          subprocess.run(["gh","release","download",prior["tag"],"--pattern",prior["asset_name"],"--dir",str(base)],check=True,timeout=120)
          previous=base/prior["asset_name"]
          assert hashlib.sha256(previous.read_bytes()).hexdigest()==prior["release_sha256"]
          def run(args,env,check=True):
              p=subprocess.run(args,env=env,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=15)
              if check and p.returncode: raise RuntimeError("Xiphos QA command failed: "+args[0])
              return p.stdout
          def norm(s):
              return re.findall(r"[^\W_]+",unicodedata.normalize("NFC",s.casefold()))
          def contiguous(hay,needle,n):
              return len(needle)>=n and any(tuple(needle[i:i+n]) in {tuple(hay[j:j+n]) for j in range(len(hay)-n+1)} for i in range(len(needle)-n+1))
          def clipboard(env,x,y):
              run(["xdotool","mousemove",str(x),str(y),"click","1"],env)
              subprocess.run(["xclip","-selection","clipboard","-i"],input=b"UNRELATED_PRIVATE_READER_QA_SENTINEL",env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=True,timeout=8)
              run(["xdotool","key","--clearmodifiers","ctrl+a"],env)
              run(["xdotool","key","--clearmodifiers","ctrl+c"],env)
              time.sleep(.6)
              return run(["xclip","-selection","clipboard","-o"],env,check=False).decode("utf-8","replace")
          def markup(s):
              return bool(re.search(r"</?(?:reference|note|seg|milestone)\b|osisRef\s*=",s,re.I))
          samples=(("genesis-note","Gen.2.4"),("genesis-paragraph","Gen.6.9"),
                   ("poetry","Ps.3.1"),("measurement-note","Ezek.4.11"),
                   ("absent-verse-note","Acts.8.36"),("corrected-link","Rom.16.25"),
                   ("new-testament","Rev.20.4"))
          records={}
          def sample_reader(env,out,*unused,**kwargs):
              out.mkdir()
              ids=run(["xdotool","search","--onlyvisible","--class","[Xx]iphos"],env).decode().splitlines()
              window=next((wid for wid in reversed(ids) if b"WIDTH=" in run(["xdotool","getwindowgeometry","--shell",wid],env,check=False) and int(re.search(rb"WIDTH=(\d+)",run(["xdotool","getwindowgeometry","--shell",wid],env)).group(1))>=650),None)
              assert window,"No actual Xiphos reading window"
              for cmd in (["xdotool","windowfocus","--sync",window],["xdotool","windowsize",window,"1216","736"],["xdotool","windowmove",window,"16","16"]):
                  run(cmd,env)
              time.sleep(1)
              result=[]
              for slug,key in samples:
                  book,ch,v=key.split(".")
                  ref=book+" "+ch+":"+v
                  for cmd in replay._navigation_commands(ref,"reference-entry"): run(cmd,env)
                  time.sleep(2)
                  expected=norm(verses[key])
                  body=None
                  for x,y in ((535,290),(680,460),(390,550)):
                      value=clipboard(env,x,y)
                      if contiguous(norm(value),expected,min(8,len(expected))) and len(expected)>=3:
                          body=value
                          break
                  row={"reference":key,"actual_clipboard_source_prose_witness":body is not None,
                       "visible_literal_osis_marker":markup(body) if body else None}
                  if body is not None:
                      row["clipboard_sha256"]=hashlib.sha256(body.encode()).hexdigest()
                  snap=out/(slug+".png")
                  run(["import","-display",env["DISPLAY"],"-window","root",str(snap)],env)
                  row["screenshot_sha256"]=hashlib.sha256(snap.read_bytes()).hexdigest()
                  result.append(row)
                  print("XIPHOS_SAMPLE",json.dumps(row,sort_keys=True),flush=True)
              # Use the already reviewed Gen 2:4 note-preview geometry.
              for cmd in replay._navigation_commands("Gen 2:4","reference-entry"): run(cmd,env)
              time.sleep(2)
              run(["xdotool","mousemove","--sync","568","295"],env)
              time.sleep(1)
              run(["xdotool","click","2"],env)
              run(["xdotool","mousemove","--sync","120","550"],env)
              time.sleep(1)
              snap=out/"note-preview.png"
              run(["import","-display",env["DISPLAY"],"-window","root",str(snap)],env)
              found=False
              for x,y in ((174,545),(120,550),(180,590)):
                  value=clipboard(env,x,y)
                  for note in notes["Gen.2.4"]:
                      expected=norm(note["body"])
                      if len(expected)>=3 and contiguous(norm(value),expected,min(5,len(expected))):
                          result.append({"reference":"Gen.2.4","note_preview_text_witness":True,"visible_literal_osis_marker":markup(value)})
                          found=True
                          break
                  if found:break
              if not found:result.append({"reference":"Gen.2.4","note_preview_text_witness":False})
              print("XIPHOS_NOTE_PREVIEW",json.dumps(result[-1],sort_keys=True),flush=True)
              records[out.parent.name]=result
              return result
          replay._sample_reader_passages=sample_reader
          # The historical smoke opens an isolated real Xiphos window.
          # The parallel-toggle capture is unrelated to this configuration QA.
          replay._capture_parallel_toggle_sample=lambda *args,**kwargs: None
          for label,archive,digest in (("prior",previous,prior["release_sha256"]),("candidate",candidate,proof["release_zip_sha256"])):
              dest=base/"xiphos-evidence"/label
              dest.mkdir()
              info=replay.smoke(archive,"BRJND2024",digest,"Luther",12,
                  screenshot=dest/"startup.png",study_dir=dest/"passages",navigation_mode="reference-entry")
              (dest/"receipt.json").write_text(json.dumps(info,sort_keys=True,indent=2)+"\n")
          before,after=records["prior"],records["candidate"]
          summary={"prior":before,"candidate":after,"candidate_sha256":proof["release_zip_sha256"],
              "all_source_prose_witnesses":all(row["actual_clipboard_source_prose_witness"] for row in after[:-1]),
              "candidate_reading_markup_free":all(row["visible_literal_osis_marker"] is False for row in after[:-1]),
              "note_preview_verified":after[-1]["note_preview_text_witness"],
              "new_visible_markup":any(a.get("visible_literal_osis_marker") is True and b.get("visible_literal_osis_marker") is not True for a,b in zip(after,before)),
              "published":False}
          (base/"xiphos-evidence"/"summary.json").write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          print("XIPHOS_SUMMARY",json.dumps(summary,sort_keys=True),flush=True)
          assert summary["all_source_prose_witnesses"] and summary["candidate_reading_markup_free"] and not summary["new_visible_markup"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darby-configuration-xiphos-evidence
          path: ${{ runner.temp }}/xiphos-evidence/
          retention-days: 14
          if-no-files-found: warn
  andbible-jsword:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build canonical package and acquire exact stable JSword engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python scripts/build.py --output "$RUNNER_TEMP/reader-dist"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/AndBible/jsword.git "$RUNNER_TEMP/jsword"
          git -C "$RUNNER_TEMP/jsword" fetch --quiet --depth=1 origin 6ebd10a005fa7761e611c048ececea1430e22546
          git -C "$RUNNER_TEMP/jsword" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/jsword" rev-parse HEAD)" = 6ebd10a005fa7761e611c048ececea1430e22546
          git fetch --no-tags --depth=1 origin refs/pull/245/head
          test "$(git rev-parse FETCH_HEAD)" = 8c6f2b821048114550c046b44bf9cb3e0e9677cd
          mkdir -p "$RUNNER_TEMP/reader-replay/tests/java/org/icfmp/research" "$RUNNER_TEMP/reader-replay/scripts"
          git show FETCH_HEAD:scripts/probe_andbible_jsword.py > "$RUNNER_TEMP/reader-replay/scripts/probe_andbible_jsword.py"
          git show FETCH_HEAD:tests/java/org/icfmp/research/DarbyAndBibleJSwordProbeTest.java > "$RUNNER_TEMP/reader-replay/tests/java/org/icfmp/research/DarbyAndBibleJSwordProbeTest.java"
      - name: Replay five accepted independent JSword tests on exact final-ID package
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sys,zipfile
          from pathlib import Path
          from source_osis_inventory import source_inventory
          base=Path(os.environ["RUNNER_TEMP"])
          repo=base/"reader-replay"
          # Only adapt the historic research ID to the actual final module ID.
          # All original authored keys, note/navigation assertions and five
          # test methods stay unchanged.
          for p in (repo/"scripts/probe_andbible_jsword.py",repo/"tests/java/org/icfmp/research/DarbyAndBibleJSwordProbeTest.java"):
              raw=p.read_text()
              assert "JND2024RepairResearch" in raw and "jnd2024repairresearch.conf" in raw
              p.write_text(raw.replace("JND2024RepairResearch","BRJND2024").replace("jnd2024repairresearch.conf","brjnd2024.conf"))
          sys.path.insert(0,str(repo/"scripts"))
          from probe_andbible_jsword import run_pinned_jsword
          proof=json.loads(Path("modules/darby-jnd-2024/RELEASE_PROVENANCE.json").read_text())
          archive=base/"reader-dist/sword/packages/BRJND2024.zip"
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==proof["release_zip_sha256"]
          payload=base/"private-darby-repaired-sword-final-id"
          payload.mkdir()
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist())==set(proof["complete_release_member_sha256"]) and len(z.namelist())==7 and z.testzip() is None
              for member,digest in proof["complete_release_member_sha256"].items():
                  content=z.read(member)
                  assert hashlib.sha256(content).hexdigest()==digest
                  p=payload/member
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(content)
          source=Path("sources/cleaned/bibles/fr/darby-jnd-2024/bible_jnd_2_0.osis.xml").read_bytes()
          assert hashlib.sha256(source).hexdigest()==proof["corrected_candidate_osis_sha256"]
          keys,_=source_inventory(source)
          scratch=base/"jsword-scratch"
          scratch.mkdir()
          result=run_pinned_jsword(base/"jsword",payload,scratch,keys.splitlines())
          result["actual_package_sha256"]=proof["release_zip_sha256"]
          result["historical_test_revision"]="8c6f2b821048114550c046b44bf9cb3e0e9677cd"
          print("ANDBIBLE_JSWORD",json.dumps(result,sort_keys=True))
          PY
