name: Compare pinned publisher OSIS with original eBible USFX (metadata only)

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/publisher-osis-source-parity.yml"
      - "scripts/publisher_osis_usfx_parity.py"
      - "tests/test_publisher_osis_usfx_parity.py"
      - "scripts/publisher_osis_observation.py"
      - "config/publisher-osis/**"

permissions:
  contents: read

jobs:
  source-edition-parity:
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.pull_request == null && github.event.comment.author_association == 'OWNER' && startsWith(github.event.issue.title, '[Import]') && startsWith(github.event.comment.body, '/bible-osis-compare ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      RESOURCE_ID: frajnd-2024
      REPORT: /tmp/publisher-osis-source-parity/source-comparison.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reviewed Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated source-parity corruption and privacy tests (offline)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_publisher_osis_observation.py' -v
          python -m unittest discover -s tests -p 'test_publisher_osis_usfx_parity.py' -v
      - name: Parse authenticated issue-only original source comparison request
        if: github.event_name == 'issue_comment'
        env:
          COMMAND: ${{ github.event.comment.body }}
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          request = re.fullmatch(
              r"/bible-osis-compare ([a-z0-9][a-z0-9-]{1,48})",
              os.environ["COMMAND"])
          if not request:
              raise SystemExit("Invalid exact source comparison command")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as output:
              output.write("RESOURCE_ID="+request.group(1)+"\n")
          print("Owner original-source comparison requested for",request.group(1))
          PY
      - name: Independently verify both immutable source pins and compare in private runner
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/publisher-osis-source-parity
          python scripts/publisher_osis_usfx_parity.py \
            --resource-id "$RESOURCE_ID" --report "$REPORT"
      - name: Upload **only** bounded metadata comparison evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: original-source-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/publisher-osis-source-parity/source-comparison.json
          retention-days: 90
          if-no-files-found: error
      - name: Record exact source comparison and unresolved canonical references in issue
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ env.REPORT }}
        with:
          script: |
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(process.env.REPORT,"utf8"));
            const c = data.original_source_comparison_counts;
            const keys = [
              "usfx_numbered_verse_count",
              "publisher_numbered_verse_count",
              "usfx_only_reference_count",
              "publisher_only_reference_count",
              "shared_verse_nonspace_characters_equal",
              "shared_verse_nonspace_characters_differ",
              "source_note_pairs_checked",
              "note_body_words_punctuation_equal_after_space_folding",
              "note_body_folded_different",
              "source_note_caller_labels_equal",
              "source_note_caller_labels_differ",
              "note_anchor_punctuation_ordinal_equal",
              "note_anchor_punctuation_ordinal_different",
              "publisher_has_links_not_encoded_in_usfx",
              "publisher_total_explicit_links",
            ];
            const safeNoteShapes = [
              "exact_after_unicode_and_whitespace_folding",
              "one_side_empty",
              "prefix_only_candidate_unverified",
              "suffix_only_candidate_unverified",
              "internal_containment_candidate_unverified",
              "case_only_candidate_unverified",
              "different_or_unclassified",
            ];
            // Strict safe category names and counts only; zero note text.
            const selected = Object.fromEntries([
              ...keys.map(k=>[k,c[k]||0]),
              ...safeNoteShapes.map(shape=>[`note_body_shape_${shape}`,
                c[`note_body_shape_${shape}`]||0]),
            ]);
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "### Official publisher OSIS ↔ pinned eBible USFX — original source comparison (UNAPPROVED)",
              `Resource: \`${data.resource_id}\``,
              `Exact SHA-verified publisher BPC OSIS: \`${data.official_publisher_osis_sha256}\``,
              `Exact SHA-verified eBible USFX ZIP: \`${data.original_ebible_source_zip_sha256}\``,
              `Workflow: ${url}`,
              `Tool commit: \`${context.sha}\``,
              `Research-only status: **${data.status}**`,
              "",
              "Full-corpus aggregate categories (no Scripture):",
              "\`\`\`json", JSON.stringify(selected,null,2), "\`\`\`",
              "",
              "First bounded canonical-reference and note-index review targets:",
              "\`\`\`json",
              JSON.stringify(data.bounded_reference_and_note_ordinal_findings_only.slice(0,24),null,2),
              "\`\`\`",
              "",
              "**This is not authorial-source edition equivalence, a rebuild, license approval, or publication.**",
              "Do not fill missing verses or normalize changed notes to make the comparison pass."
            ].join("\n");
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });
