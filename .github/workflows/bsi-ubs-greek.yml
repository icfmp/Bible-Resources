name: BSI UBS Greek dictionary crosswalk

on:
  pull_request:
    paths:
      - "bible-semantic-index/links/dictionaries/ubs-greek/**"
      - ".github/workflows/bsi-ubs-greek.yml"
  push:
    branches: [main]
    paths:
      - "bible-semantic-index/links/dictionaries/ubs-greek/**"
      - ".github/workflows/bsi-ubs-greek.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lexical-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Offline regression tests
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_index.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_source_gaps.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_private_word_candidate.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_pronoun_candidate.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_remaining_headwords.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_families_batch2.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_eimi_disposition.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_no_ln_headwords.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_families_batch3.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_families_batch4.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_no_ln_batch5.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_224_ambiguities.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_taxonomy_headwords.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_missing_strong_word_headwords.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_missing_exact_headwords.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_alpha_case_only.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_composite_strong_original_words.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_composite_strong_headwords.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_word_coverage_invariants.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_hopote_headword.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_456_lexical_variants.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_ubs_explicit_alternate_lemmas.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_reviewed_explicit_ubs_alternates.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_last_47_lexical_forms.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_contextual_sense_candidates.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_provisional_context_sense_overlay.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_unresolved_semantic_priorities.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_lower_confidence_single_sense.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_context_review_batches.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_sense_form_witnesses.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_form_supported_provisional_senses.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_sense_reference_shapes.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_ubs_source_verse_witnesses.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_source_verse_provisional_senses.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_ubs_token_position_alignment.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_source_position_provisional_senses.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_consolidated_v1_review_index.py
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/test_public_identifier_release.py
      - name: Pin UBS source JSON (English and French edition 1.0)
        uses: actions/checkout@v4
        with:
          repository: ubsicap/ubs-open-license
          ref: a15a96cfaa4ca18a6c0339016645ba1e534db3c8
          path: ubs-source
          sparse-checkout: dictionaries/greek/JSON
          persist-credentials: false
      - name: Pin Macula SBLGNT Greek original-word inventory
        uses: actions/checkout@v4
        with:
          repository: Clear-Bible/macula-greek
          ref: 8423afe47b9e8f24b7772e808af45c7159a6fe7e
          path: macula-greek
          sparse-checkout: SBLGNT/tsv
          lfs: true
          persist-credentials: false
      - name: Verify exact pinned source files and regenerate index
        run: |
          test "$(git -C ubs-source rev-parse HEAD)" = "a15a96cfaa4ca18a6c0339016645ba1e534db3c8"
          test "$(git -C macula-greek rev-parse HEAD)" = "8423afe47b9e8f24b7772e808af45c7159a6fe7e"
          test "$(git -C ubs-source hash-object dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON)" = "b6f2535c3ed8988480f479fdaf4f69867a776119"
          test "$(git -C ubs-source hash-object dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON)" = "42b1abeaa7f7f7abaf72f6edd7e45badea42b90f"
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/build_index.py \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --macula macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --output /tmp/bsi-ubs-greek-index.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("/tmp/bsi-ubs-greek-index.json").read_text(encoding="utf-8"))
          pinned=json.loads(Path("bible-semantic-index/links/dictionaries/ubs-greek/index.json").read_text(encoding="utf-8"))
          assert actual==pinned, "Generated UBS index differs from committed index"
          assert actual["statistics"]["shared_entries"]==5507
          assert actual["statistics"]["shared_senses"]==9160
          assert actual["coverage"]["macula_words"]==137741
          assert actual["coverage"]["with_ubs_entry_candidates"]==128090
          assert actual["coverage"]["with_corresponding_sense_candidates"]==118272
          print("BSI_UBS_GREEK_INDEX_VERIFIED",actual["statistics"],actual["coverage"])
          PY
      - name: Census all 9,651 original unlinked Greek words and NFC/UBS-LN witnesses
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/audit_source_gaps.py \
            --index bible-semantic-index/links/dictionaries/ubs-greek/index.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --macula macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --output /tmp/bsi-ubs-greek-original-gap-review.json
      - name: Audit 1218 non-εἰμί Greek original words without UBS LN corroboration
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/audit_remaining_no_ln.py \
            --report /tmp/bsi-ubs-greek-original-gap-review.json \
            --index bible-semantic-index/links/dictionaries/ubs-greek/index.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --macula macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --output /tmp/bsi-ubs-greek-no-ln-1218-source-review.json
      - name: Upload Greek no-LN source lexical evidence (PRIVATE, NOT approved)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-greek-1218-no-ln-original-word-evidence-NOT-PUBLISHED
          path: /tmp/bsi-ubs-greek-no-ln-1218-source-review.json
          if-no-files-found: error
          retention-days: 14
      - name: Classify original Greek εἰμί source word families without inventing UBS senses
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/audit_eimi_disposition.py \
            --report /tmp/bsi-ubs-greek-original-gap-review.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --output /tmp/bsi-ubs-greek-eimi-original-disposition.json
      - name: Upload Greek εἰμί source evidence (PRIVATE, NO inferred LEXID)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-greek-eimi-source-disposition-NOT-PUBLISHED
          path: /tmp/bsi-ubs-greek-eimi-original-disposition.json
          if-no-files-found: error
          retention-days: 14
      - name: Independently verify all 5,938 original Greek lexical source-word entry candidates
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/build_private_word_candidate.py \
            --index bible-semantic-index/links/dictionaries/ubs-greek/index.json \
            --report /tmp/bsi-ubs-greek-original-gap-review.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --macula macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --output /tmp/bsi-ubs-greek-private-word-candidate.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path("bible-semantic-index/links/dictionaries/ubs-greek/index.json").read_text())
          candidate=json.loads(Path("/tmp/bsi-ubs-greek-private-word-candidate.json").read_text())
          assert all(candidate[k]==v for k,v in baseline.items())
          assert len(candidate["by_macula_word"])==5938
          assert candidate["word_aware_coverage"]["word_aware_entry_candidate_words"]==134028
          assert candidate["word_aware_coverage"]["remaining_no_ubs_headword_candidate_original_words"]==3713
          assert candidate["word_aware_coverage"]["new_inferred_contextual_lexical_sense_ids"]==0
          assert candidate["editorial_candidate"]["publication_approved"] is False
          assert candidate["editorial_candidate"]["editorial_acceptance"]=="pending_separate_review"
          assert all("sense_id" not in r for r in candidate["by_macula_word"].values())
          print("UBS_GREEK_WORD_SPECIFIC_PREVIEW_VERIFIED_NOT_PUBLISHED")
          PY
      - name: Review exact Greek first/second-person and demonstrative pronoun headwords
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/build_reviewed_pronoun_candidate.py \
            --baseline bible-semantic-index/links/dictionaries/ubs-greek/index.json \
            --source_report /tmp/bsi-ubs-greek-original-gap-review.json \
            --candidate /tmp/bsi-ubs-greek-private-word-candidate.json \
            --review bible-semantic-index/links/dictionaries/ubs-greek/v1_reviewed_pronoun_headwords.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --macula macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --output /tmp/bsi-ubs-greek-reviewed-pronoun-private-candidate.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/bsi-ubs-greek-reviewed-pronoun-private-candidate.json")
          index=json.loads(p.read_text(encoding="utf-8"))
          old=json.loads(Path("bible-semantic-index/links/dictionaries/ubs-greek/index.json").read_text(encoding="utf-8"))
          assert all(index[k]==v for k,v in old.items())
          assert index["editorial_candidate"]["publication_approved"] is False
          assert index["word_aware_coverage"]["new_inferred_contextual_lexical_sense_ids"] == 0
          assert index["editorial_candidate"]["source_pronoun_headword_approvals"] == 5033
          assert index["editorial_candidate"]["source_specific_approved_headwords"] == {
              "οὗτος": 906, "σύ": 1971, "ἐγώ": 2156}
          assert index["editorial_candidate"]["other_original_words_still_unapproved"] == 905
          assert index["word_aware_coverage"]["original_sblgnt_word_records"] == 137741
          assert index["word_aware_coverage"]["word_aware_entry_candidate_words"] == 134028
          import hashlib
          assert hashlib.sha256(p.read_bytes()).hexdigest() == (
              "867d69186e718939ee55ef91403755240972a1e4c31ddc091e4974d1a524fda0")
          assert len(index["by_macula_word"]) == 5938
          from collections import Counter
          kinds=Counter(w["match_type"] for w in index["by_macula_word"].values())
          assert kinds == {
              "source_reviewed_original_greek_pronoun_headword_only": 5033,
              "nfc_canonically_identical_lemma_and_original_ln_unapproved_word_candidate": 905,
          }
          assert all("sense_id" not in item for item in index["by_macula_word"].values())
          print("UBS_GREEK_PRONOUN_SOURCE_REVIEW_PRIVATELY_VERIFIED")
          PY
      - name: Enumerate all 905 unapproved Greek word witnesses by original lexical family
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/audit_remaining_headwords.py \
            --candidate /tmp/bsi-ubs-greek-reviewed-pronoun-private-candidate.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --output /tmp/bsi-ubs-greek-905-unapproved-family-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/bsi-ubs-greek-905-unapproved-family-evidence.json").read_text())
          assert report["unapproved_words"]==905
          assert sum(f["original_word_count"] for f in report["families"])==905
          assert all(f["contextual_sense_ids_selected"] == [] for f in report["families"])
          assert report["publication_approved"] is False
          print("GREEK_REMAINING_905_WITNESSES_ALL_EXPLICITLY_UNAPPROVED")
          PY
      - name: Source-review ten more exact Greek lexical headword families (private only)
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/build_reviewed_families_batch2.py \
            --candidate /tmp/bsi-ubs-greek-reviewed-pronoun-private-candidate.json \
            --evidence /tmp/bsi-ubs-greek-905-unapproved-family-evidence.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --ledger bible-semantic-index/links/dictionaries/ubs-greek/v1_reviewed_families_batch2.json \
            --output /tmp/bsi-ubs-greek-reviewed-family-batch2-private.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/bsi-ubs-greek-reviewed-family-batch2-private.json")
          reviewed=json.loads(p.read_text(encoding="utf-8"))
          base=json.loads(Path("bible-semantic-index/links/dictionaries/ubs-greek/index.json").read_text(encoding="utf-8"))
          assert all(reviewed[k]==v for k,v in base.items())
          assert reviewed["editorial_candidate"]["reviewed_original_headword_words_total"]==5610
          assert reviewed["editorial_candidate"]["other_original_words_still_unapproved"]==328
          assert reviewed["editorial_candidate"]["publication_approved"] is False
          assert reviewed["editorial_candidate"]["new_inferred_contextual_lexical_sense_ids"]==0
          from collections import Counter
          kinds=Counter(v["match_type"] for v in reviewed["by_macula_word"].values())
          assert kinds=={
              "source_reviewed_original_greek_pronoun_headword_only": 5033,
              "source_reviewed_original_greek_headword_batch2_only": 577,
              "nfc_canonically_identical_lemma_and_original_ln_unapproved_word_candidate": 328,
          }
          assert all("sense_id" not in row for row in reviewed["by_macula_word"].values())
          print("UBS_GREEK_FAMILY_BATCH2_PRIVATE_VERIFIED_NOT_PUBLISHED")
          PY
      - name: Source-review exact Greek εἰμί original word IDs as entry-only without UBS LN senses
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/build_reviewed_no_ln_headwords.py \
            --candidate /tmp/bsi-ubs-greek-reviewed-family-batch2-private.json \
            --index bible-semantic-index/links/dictionaries/ubs-greek/index.json \
            --report /tmp/bsi-ubs-greek-original-gap-review.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --ledger bible-semantic-index/links/dictionaries/ubs-greek/v1_reviewed_no_ln_headwords.json \
            --macula macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --output /tmp/bsi-ubs-greek-eimi-entry-only-private.json
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          c=json.loads(Path("/tmp/bsi-ubs-greek-eimi-entry-only-private.json").read_text())
          base=json.loads(Path("bible-semantic-index/links/dictionaries/ubs-greek/index.json").read_text())
          assert all(c[k]==v for k,v in base.items())
          assert len(c["by_macula_word"]) == 7969
          assert c["editorial_candidate"]["reviewed_original_headword_words_total"] == 7641
          assert c["editorial_candidate"]["new_inferred_contextual_lexical_sense_ids"] == 0
          assert c["editorial_candidate"]["publication_approved"] is False
          assert c["word_aware_coverage"]["word_aware_entry_candidate_words"] == 136059
          assert c["word_aware_coverage"]["remaining_no_ubs_headword_candidate_original_words"] == 1682
          assert Counter(x["match_type"] for x in c["by_macula_word"].values()) == {
            "source_reviewed_original_greek_pronoun_headword_only": 5033,
            "source_reviewed_original_greek_headword_batch2_only": 577,
            "nfc_canonically_identical_lemma_and_original_ln_unapproved_word_candidate": 328,
            "source_reviewed_original_greek_entry_only_without_ubs_ln": 2031,
          }
          assert all("sense_id" not in row for row in c["by_macula_word"].values())
          print("GREEK_EIMI_ORIGINAL_SOURCE_ENTRY_ONLY_REVIEWED_NO_CONTEXTUAL_SENSES")
          PY
      - name: Upload Greek εἰμί reviewed original word-ID headwords (PRIVATE, NOT published)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-greek-eimi-2031-entry-only-reviewed-NOT-PUBLISHED
          path: /tmp/bsi-ubs-greek-eimi-entry-only-private.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload second Greek editorial family batch (PRIVATE, NOT published)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-greek-577-word-families-reviewed-NOT-PUBLISHED
          path: /tmp/bsi-ubs-greek-reviewed-family-batch2-private.json
          if-no-files-found: error
          retention-days: 14
      - name: Classify remaining 328 strict original Greek lexical witnesses
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/audit_remaining_328.py \
            --evidence /tmp/bsi-ubs-greek-905-unapproved-family-evidence.json \
            --batch2 bible-semantic-index/links/dictionaries/ubs-greek/v1_reviewed_families_batch2.json \
            --output /tmp/bsi-ubs-greek-328-original-family-evidence.json
      - name: Review 155 original Greek word-ID headwords in 19 exact source-attested families
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/build_reviewed_families_batch3.py \
            --candidate /tmp/bsi-ubs-greek-eimi-entry-only-private.json \
            --evidence /tmp/bsi-ubs-greek-905-unapproved-family-evidence.json \
            --batch2 bible-semantic-index/links/dictionaries/ubs-greek/v1_reviewed_families_batch2.json \
            --residual /tmp/bsi-ubs-greek-328-original-family-evidence.json \
            --ledger bible-semantic-index/links/dictionaries/ubs-greek/v1_reviewed_families_batch3.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --output /tmp/bsi-ubs-greek-reviewed-batch3-private.json
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          c=json.loads(Path("/tmp/bsi-ubs-greek-reviewed-batch3-private.json").read_text())
          baseline=json.loads(Path("bible-semantic-index/links/dictionaries/ubs-greek/index.json").read_text())
          assert all(c[k]==v for k,v in baseline.items())
          assert len(c["by_macula_word"]) == 7969
          assert c["editorial_candidate"]["reviewed_original_headword_words_total"] == 7796
          assert c["editorial_candidate"]["other_original_words_still_unapproved"] == 173
          assert c["editorial_candidate"]["publication_approved"] is False
          assert c["editorial_candidate"]["new_inferred_contextual_lexical_sense_ids"] == 0
          assert Counter(x["match_type"] for x in c["by_macula_word"].values()) == {
            "source_reviewed_original_greek_pronoun_headword_only": 5033,
            "source_reviewed_original_greek_headword_batch2_only": 577,
            "source_reviewed_original_greek_entry_only_without_ubs_ln": 2031,
            "source_reviewed_original_greek_headword_batch3_only": 155,
            "nfc_canonically_identical_lemma_and_original_ln_unapproved_word_candidate": 173,
          }
          print("GREEK_BATCH3_VERIFIED_155_EXACT_ORIGINAL_WORD_HEADWORDS_PRIVATE_ONLY")
          PY
      - name: Audit 173 still-unapproved Greek source tokens after third editorial batch
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/audit_remaining_173.py \
            --residual /tmp/bsi-ubs-greek-328-original-family-evidence.json \
            --batch3 bible-semantic-index/links/dictionaries/ubs-greek/v1_reviewed_families_batch3.json \
            --output /tmp/bsi-ubs-greek-173-original-word-evidence.json
      - name: Review 138 source-attested Greek word IDs in 101 exact lexical families
        run: |
          python3 -I bible-semantic-index/links/dictionaries/ubs-greek/build_reviewed_families_batch4.py \
            --candidate /tmp/bsi-ubs-greek-reviewed-batch3-private.json \
            --residual328 /tmp/bsi-ubs-greek-328-original-family-evidence.json \
            --third_ledger bible-semantic-index/links/dictionaries/ubs-greek/v1_reviewed_families_batch3.json \
            --residual173 /tmp/bsi-ubs-greek-173-original-word-evidence.json \
            --ledger bible-semantic-index/links/dictionaries/ubs-greek/v1_reviewed_families_batch4.json \
