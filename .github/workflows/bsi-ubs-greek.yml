name: BSI UBS Greek dictionary crosswalk

on:
  pull_request:
    paths:
      - "entity-index/links/dictionaries/ubs-greek/**"
      - ".github/workflows/bsi-ubs-greek.yml"
  push:
    branches: [main]
    paths:
      - "entity-index/links/dictionaries/ubs-greek/**"
      - ".github/workflows/bsi-ubs-greek.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lexical-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Offline regression tests
        run: |
          python3 -I entity-index/links/dictionaries/ubs-greek/test_index.py
          python3 -I entity-index/links/dictionaries/ubs-greek/test_source_gaps.py
          python3 -I entity-index/links/dictionaries/ubs-greek/test_private_word_candidate.py
          python3 -I entity-index/links/dictionaries/ubs-greek/test_reviewed_pronoun_candidate.py
      - name: Pin UBS source JSON (English and French edition 1.0)
        uses: actions/checkout@v4
        with:
          repository: ubsicap/ubs-open-license
          ref: a15a96cfaa4ca18a6c0339016645ba1e534db3c8
          path: ubs-source
          sparse-checkout: dictionaries/greek/JSON
          persist-credentials: false
      - name: Pin Macula SBLGNT Greek original-word inventory
        uses: actions/checkout@v4
        with:
          repository: Clear-Bible/macula-greek
          ref: 8423afe47b9e8f24b7772e808af45c7159a6fe7e
          path: macula-greek
          sparse-checkout: SBLGNT/tsv
          lfs: true
          persist-credentials: false
      - name: Verify exact pinned source files and regenerate index
        run: |
          test "$(git -C ubs-source rev-parse HEAD)" = "a15a96cfaa4ca18a6c0339016645ba1e534db3c8"
          test "$(git -C macula-greek rev-parse HEAD)" = "8423afe47b9e8f24b7772e808af45c7159a6fe7e"
          test "$(git -C ubs-source hash-object dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON)" = "b6f2535c3ed8988480f479fdaf4f69867a776119"
          test "$(git -C ubs-source hash-object dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON)" = "42b1abeaa7f7f7abaf72f6edd7e45badea42b90f"
          python3 -I entity-index/links/dictionaries/ubs-greek/build_index.py \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --macula macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --output /tmp/bsi-ubs-greek-index.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("/tmp/bsi-ubs-greek-index.json").read_text(encoding="utf-8"))
          pinned=json.loads(Path("entity-index/links/dictionaries/ubs-greek/index.json").read_text(encoding="utf-8"))
          assert actual==pinned, "Generated UBS index differs from committed index"
          assert actual["statistics"]["shared_entries"]==5507
          assert actual["statistics"]["shared_senses"]==9160
          assert actual["coverage"]["macula_words"]==137741
          assert actual["coverage"]["with_ubs_entry_candidates"]==128090
          assert actual["coverage"]["with_corresponding_sense_candidates"]==118272
          print("BSI_UBS_GREEK_INDEX_VERIFIED",actual["statistics"],actual["coverage"])
          PY
      - name: Census all 9,651 original unlinked Greek words and NFC/UBS-LN witnesses
        run: |
          python3 -I entity-index/links/dictionaries/ubs-greek/audit_source_gaps.py \
            --index entity-index/links/dictionaries/ubs-greek/index.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --macula macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --output /tmp/bsi-ubs-greek-original-gap-review.json
      - name: Independently verify all 5,938 original Greek lexical source-word entry candidates
        run: |
          python3 -I entity-index/links/dictionaries/ubs-greek/build_private_word_candidate.py \
            --index entity-index/links/dictionaries/ubs-greek/index.json \
            --report /tmp/bsi-ubs-greek-original-gap-review.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --macula macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --output /tmp/bsi-ubs-greek-private-word-candidate.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path("entity-index/links/dictionaries/ubs-greek/index.json").read_text())
          candidate=json.loads(Path("/tmp/bsi-ubs-greek-private-word-candidate.json").read_text())
          assert all(candidate[k]==v for k,v in baseline.items())
          assert len(candidate["by_macula_word"])==5938
          assert candidate["word_aware_coverage"]["word_aware_entry_candidate_words"]==134028
          assert candidate["word_aware_coverage"]["remaining_no_ubs_headword_candidate_original_words"]==3713
          assert candidate["word_aware_coverage"]["new_inferred_contextual_lexical_sense_ids"]==0
          assert candidate["editorial_candidate"]["publication_approved"] is False
          assert candidate["editorial_candidate"]["editorial_acceptance"]=="pending_separate_review"
          assert all("sense_id" not in r for r in candidate["by_macula_word"].values())
          print("UBS_GREEK_WORD_SPECIFIC_PREVIEW_VERIFIED_NOT_PUBLISHED")
          PY
      - name: Review exact Greek first/second-person and demonstrative pronoun headwords
        run: |
          python3 -I entity-index/links/dictionaries/ubs-greek/build_reviewed_pronoun_candidate.py \
            --baseline entity-index/links/dictionaries/ubs-greek/index.json \
            --source_report /tmp/bsi-ubs-greek-original-gap-review.json \
            --candidate /tmp/bsi-ubs-greek-private-word-candidate.json \
            --review entity-index/links/dictionaries/ubs-greek/v1_reviewed_pronoun_headwords.json \
            --english ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-en.JSON \
            --french ubs-source/dictionaries/greek/JSON/UBSGreekNTDic-v1.0-fr.JSON \
            --macula macula-greek/SBLGNT/tsv/macula-greek-SBLGNT.tsv \
            --output /tmp/bsi-ubs-greek-reviewed-pronoun-private-candidate.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/bsi-ubs-greek-reviewed-pronoun-private-candidate.json")
          index=json.loads(p.read_text(encoding="utf-8"))
          old=json.loads(Path("entity-index/links/dictionaries/ubs-greek/index.json").read_text(encoding="utf-8"))
          assert all(index[k]==v for k,v in old.items())
          assert index["editorial_candidate"]["publication_approved"] is False
          assert index["word_aware_coverage"]["new_inferred_contextual_lexical_sense_ids"] == 0
          assert index["editorial_candidate"]["source_pronoun_headword_approvals"] == 5033
          assert index["editorial_candidate"]["source_specific_approved_headwords"] == {
              "οὗτος": 906, "σύ": 1971, "ἐγώ": 2156}
          assert index["editorial_candidate"]["other_original_words_still_unapproved"] == 905
          assert index["word_aware_coverage"]["original_sblgnt_word_records"] == 137741
          assert index["word_aware_coverage"]["word_aware_entry_candidate_words"] == 134028
          import hashlib
          assert hashlib.sha256(p.read_bytes()).hexdigest() == (
              "867d69186e718939ee55ef91403755240972a1e4c31ddc091e4974d1a524fda0")
          assert len(index["by_macula_word"]) == 5938
          from collections import Counter
          kinds=Counter(w["match_type"] for w in index["by_macula_word"].values())
          assert kinds == {
              "source_reviewed_original_greek_pronoun_headword_only": 5033,
              "nfc_canonically_identical_lemma_and_original_ln_unapproved_word_candidate": 905,
          }
          assert all("sense_id" not in item for item in index["by_macula_word"].values())
          print("UBS_GREEK_PRONOUN_SOURCE_REVIEW_PRIVATELY_VERIFIED")
          PY
      - name: Upload private source-reviewed Greek pronouns (NO public release)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-greek-pronouns-individually-source-reviewed-NOT-PUBLISHED
          path: /tmp/bsi-ubs-greek-reviewed-pronoun-private-candidate.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Greek word-aware PRIVATE lexical candidate (unapproved, not released)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-greek-5938-verified-word-preview-NOT-PUBLISHED
          path: /tmp/bsi-ubs-greek-private-word-candidate.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload original-source Greek lexical evidence (private review, NOT published)
        uses: actions/upload-artifact@v4
        with:
          name: bsi-ubs-greek-unapproved-5938-source-word-preview
          path: /tmp/bsi-ubs-greek-original-gap-review.json
          retention-days: 14
