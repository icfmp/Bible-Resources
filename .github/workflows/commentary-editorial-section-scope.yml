name: Audit original commentary editorial section scopes

on:
  pull_request:
    paths:
      - '.github/workflows/commentary-editorial-section-scope.yml'
      - 'scripts/commentary_section_scope_audit.py'
      - 'tests/test_commentary_section_scope_audit.py'
      - 'scripts/sword_native_commentary_index.cpp'
      - 'scripts/sword_native_commentary_raw_corpus.cpp'
      - 'config/commentary-intake/**'
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Pinned original commentary manifest ID"
        required: true
        default: mhcc-crosswire
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      RESOURCE_ID: ${{ github.event.inputs.resource_id || 'mhcc-crosswire' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test read-only generic section-scope classifier
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_commentary_section_scope_audit.py' -v
      - name: Install stable upstream native SWORD library
        run: |
          set -euo pipefail
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y libsword-dev
      - name: Compile independent stock index and private raw-entry readers
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_index.cpp \
            -o "${RUNNER_TEMP}/stock-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "${RUNNER_TEMP}/stock-raw" -lsword
      - name: Audit all original stock section headings against native occupied slots
        run: |
          set -euo pipefail
          python scripts/commentary_section_scope_audit.py \
            --resource-id "$RESOURCE_ID" \
            --native-index-binary "${RUNNER_TEMP}/stock-index" \
            --native-raw-binary "${RUNNER_TEMP}/stock-raw" \
            --report "${RUNNER_TEMP}/editorial-scope.json"
      - name: Summarize scope and known regression probes without original text
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"editorial-scope.json").read_text())
          assert r["status"]=="COMPLETE_NATIVE_SCAN_EDITORIAL_TRIAGE_NOT_APPROVAL"
          assert r["native_full_key_crosscheck"] is True
          assert r["original_text_logged_or_published"] is False
          assert r["original_sword_changed"] is False
          print("Native slots:",r["native_numbered_rows"],"intros:",r["native_intro_rows"])
          print("Section scope triage categories:",json.dumps(r["counts"],sort_keys=True))
          unknown=r["unrecognized_native_slot_review"]
          assert unknown["total"]==r["counts"]["no_recognized_heading"]
          assert unknown["all_output_is_original_text_free_metadata"] is True
          print("Unrecognized slot classes:",json.dumps(unknown["reason_counts"],sort_keys=True))
          print("Unrecognized distinct raw payloads:",unknown["distinct_native_raw_payload_hashes"])
          print("Unrecognized slots sharing payload with recognized heading:",
                unknown["shares_content_with_recognized_heading"])
          for row in unknown["case_rows"]:
              print("Unrecognized slot",row["native_key"],row["category"],
                    "same-payload-count",row["same_raw_payload_slot_count"],
                    "first-in-chapter",row["first_verse_in_chapter"],
                    "recognized-payload",row["same_payload_with_recognized_heading"])
          for key in ("Song.1.7","Jer.4.1","Jer.4.3"):
              probe=r["probes"].get(key)
              print("Probe",key,json.dumps(
                  {k:v for k,v in (probe or {}).items() if k!="raw_payload_sha256"},
                  sort_keys=True))
          for row in r["anomalies"]:
              print("Candidate range",row["start"],"through",row["declared_end"],
                    row["category"],"missing",",".join(row["missing_slots"]))
          witness=r["independent_thml_witness"]
          print("Independent ThML status:",witness["status"])
          print("Independent ThML section agreement:",
                json.dumps(witness.get("source_range_agreement_counts",{}),sort_keys=True))
          print("Independent ThML scripRef citation-only agreement:",
                json.dumps(witness.get("independent_scripref_range_agreement_counts",{}),sort_keys=True))
          print("Independent source evidence matrix:",
                json.dumps(witness.get("independent_reference_evidence_matrix",{}),sort_keys=True))
          for row in witness.get("no_exact_independent_reference_evidence_sections",[]):
              print("Needs editorial witness review",row["start"],row["declared_end"],row["heading_kind"])
          for case in witness.get("anomaly_source_range_corroboration",[]):
              print("Candidate witness",case["start"],case["declared_end"],case["relation"])
          for start,refs in witness.get("unparsed_source_reference_candidates_near_anomalies",{}).items():
              print("Unparsed source anchor",start,json.dumps(refs,sort_keys=True))
          for start,attrs in witness.get("source_attributes_near_anomalies",{}).items():
              print("Source attribute anchor",start,json.dumps(attrs,sort_keys=True))
          PY
      - name: Preserve metadata-only complete candidate report for independent review
        uses: actions/upload-artifact@v4
        with:
          name: original-commentary-section-scope
          path: ${{ runner.temp }}/editorial-scope.json
          retention-days: 14
