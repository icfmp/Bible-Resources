name: Audit original commentary editorial section scopes

on:
  # Historic MHCC-only research: after publication of corrected 0.1.1,
  # do not repeat a 0.1.0→0.1.1 candidate test on unrelated PRs.
  # Preserve the exact original workflow for explicit source-pinned replay.
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Pinned original commentary manifest ID"
        required: true
        default: mhcc-crosswire
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      RESOURCE_ID: ${{ github.event.inputs.resource_id || 'mhcc-crosswire' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test read-only generic section-scope classifier
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_commentary_section_scope_audit.py' -v
          python -m unittest discover -s tests -p 'test_commentary_editorial_topology.py' -v
          python -m unittest discover -s tests -p 'test_commentary_layout_census.py' -v
          python -m unittest discover -s tests -p 'test_commentary_paragraph_witness_probe.py' -v
          python -m unittest discover -s tests -p 'test_commentary_reference_registry_triage.py' -v
          python -m unittest discover -s tests -p 'test_commentary_literal_erratum_preflight.py' -v
          python -m unittest discover -s tests -p 'test_commentary_source_erratum_compiled_probe.py' -v
          python -m unittest discover -s tests -p 'test_commentary_public_metadata_preflight.py' -v
          python -m unittest discover -s tests -p 'test_commentary_navigation_link_plan.py' -v
          python -m unittest discover -s tests -p 'test_commentary_chapter_ref_labels.py' -v
          python -m unittest discover -s tests -p 'test_commentary_osis_rebuild_preflight.py' -v
          python -m unittest discover -s tests -p 'test_commentary_intro_chapter_text_review.py' -v
          python -m unittest discover -s tests -p 'test_commentary_osis_transport_probe.py' -v
          python -m unittest discover -s tests -p 'test_commentary_osis_intro_transport_probe.py' -v
          python -m unittest discover -s tests -p 'test_commentary_osis_mixed_transport_probe.py' -v
      - name: Install stable upstream native SWORD library
        run: |
          set -euo pipefail
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y libsword-dev libsword-utils
      - name: Install one independent Xiphos reader for the bounded private alias preview
        run: |
          set -euo pipefail
          timeout 180s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y \
            xiphos xvfb xdotool xclip dbus-x11 diatheke
      - name: Compile independent stock index and private raw-entry readers
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_index.cpp \
            -o "${RUNNER_TEMP}/stock-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "${RUNNER_TEMP}/stock-raw" -lsword
      - name: Prove standards-based continuous and disjoint commentary links on synthetic OSIS
        run: |
          set -euo pipefail
          command -v osis2mod
          ROOT="${RUNNER_TEMP}/synthetic-commentary"
          mkdir -p "$ROOT/mods.d" "$ROOT/modules/comments/zcom/LinkProof"
          timeout 45s osis2mod "$ROOT/modules/comments/zcom/LinkProof" \
            tests/fixtures/synthetic-linked-commentary.osis.xml \
            -z z -b 3 -v KJV > "$ROOT/osis2mod.log" 2>&1
          if grep -Eq 'FATAL\\(|ERROR\\(' "$ROOT/osis2mod.log"; then
            echo "Synthetic OSIS importer reported an error"
            exit 1
          fi
          cat > "$ROOT/mods.d/LinkProof.conf" <<'CONF'
          [LinkProof]
          DataPath=./modules/comments/zcom/LinkProof
          ModDrv=zCom
          CompressType=ZIP
          BlockType=CHAPTER
          SourceType=OSIS
          Versification=KJV
          Lang=en
          Description=Synthetic audit fixture only
          CONF
          SWORD_PATH="$ROOT" timeout 60s "${RUNNER_TEMP}/stock-raw" LinkProof > "$ROOT/native.raw"
          PYTHONPATH=scripts python - "$ROOT/native.raw" <<'PY'
          import sys
          from pathlib import Path
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          raw = {}
          def entry(kind, key, payload):
              if kind == "K":
                  raw[key] = payload
          with Path(sys.argv[1]).open("rb") as f:
              _, keys, _, _ = parse_native_raw_corpus(f, on_entry=entry)
          expected = {f"Gen.1.{v}" for v in (1, 2, 3, 4, 5, 7, 8)}
          assert expected <= set(keys), "Missing a real linked synthetic commentary verse"
          assert "Gen.1.6" not in keys, "Disjoint range incorrectly linked its gap"
          assert raw["Gen.1.1"] == raw["Gen.1.2"], "Connected range lost its linked body"
          assert len({raw[f"Gen.1.{v}"] for v in (4, 5, 7, 8)}) == 1, (
              "Disjoint annotation does not read back a single original commentary"
          )
          assert raw["Gen.1.3"] != raw["Gen.1.4"], "Independent commentary was overwritten"
          print("Synthetic SWORD linked-commentary readback PASSED:",
                len(expected), "occupied target verses; independent gap preserved")
          PY
      - name: Probe original SWORD book and chapter introduction index mapping using invented OSIS
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/synthetic-introductions"
          mkdir -p "$ROOT/mods.d" "$ROOT/modules/comments/zcom/IntroProof"
          timeout 45s osis2mod "$ROOT/modules/comments/zcom/IntroProof" \
            tests/fixtures/synthetic-commentary-introductions.osis.xml \
            -z z -b 3 -v KJV > "$ROOT/osis2mod.log" 2>&1
          cat > "$ROOT/mods.d/IntroProof.conf" <<'CONF'
          [IntroProof]
          DataPath=./modules/comments/zcom/IntroProof
          ModDrv=zCom
          CompressType=ZIP
          BlockType=CHAPTER
          SourceType=OSIS
          Versification=KJV
          Lang=en
          Description=Invented original-source introduction index diagnostic only
          CONF
          SWORD_PATH="$ROOT" timeout 60s "${RUNNER_TEMP}/stock-raw" IntroProof > "$ROOT/native.raw"
          PYTHONPATH=scripts python - "$ROOT/native.raw" <<'PY'
          from collections import Counter
          import sys
          from pathlib import Path
          from lxml import etree
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          intro={}
          top={}
          K={}
          def collect(kind, ref, raw):
              if kind=="I":
                  intro[ref]=raw
              elif kind=="U":
                  top[ref]=raw
              else:
                  K[ref]=raw
          with Path(sys.argv[1]).open("rb") as stream:
              report, numbered, intros, opaque=parse_native_raw_corpus(stream,on_entry=collect)
          print("Invented book+chapter intro OSIS native keys",
                "K",len(numbered),"I",len(intros),"U",len(opaque),
                "I-refs",",".join(intros),"U-refs",",".join(opaque))
          for ref,raw in intro.items():
              root=etree.fromstring(b"<r>"+raw+b"</r>")
              print("Invented SWORD intro slot",ref,
                    "raw-bytes",len(raw),
                    "nonblank-text",bool("".join(root.itertext()).strip()),
                    "child-tags",','.join(x.tag.rsplit('}',1)[-1] for x in root))
          for ref,raw in top.items():
              root=etree.fromstring(b"<r>"+raw+b"</r>")
              print("Invented SWORD opaque top slot",ref,
                    "raw-bytes",len(raw),
                    "nonblank-text",bool("".join(root.itertext()).strip()),
                    "child-tags",','.join(x.tag.rsplit('}',1)[-1] for x in root))
          assert {"Gen.1.1","Gen.1.2","Gen.2.1"} <= set(K)
          assert "Gen.1.3" not in K
          print("Invented introduction mapping exploration complete; no original module modified.")
          PY
      - name: Prove isolated native zCom alias links preserve all existing raw entries
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/synthetic-commentary"
          CLONE="${RUNNER_TEMP}/synthetic-commentary-alias"
          cp -a "$ROOT" "$CLONE"
          DATA="$CLONE/modules/comments/zcom/LinkProof"
          # zCom uses .czz for compressed authorial bytes; .czv is its verse index.
          compgen -G "$DATA/*.czz" > /dev/null
          (cd "$DATA" && sha256sum ./*.czz) > "$CLONE/compressed-payloads.before.sha256"
          g++ -std=c++17 -O2 -I/usr/include/sword \
            tests/fixtures/synthetic_zcom_link_entry.cpp \
            -o "${RUNNER_TEMP}/synthetic-native-link-entry" -lsword
          MODE=$(SWORD_PATH="$CLONE" timeout 45s "${RUNNER_TEMP}/synthetic-native-link-entry")
          echo "Synthetic zCom native linking capability: $MODE"
          (cd "$DATA" && sha256sum -c "$CLONE/compressed-payloads.before.sha256")
          SWORD_PATH="$CLONE" timeout 60s "${RUNNER_TEMP}/stock-raw" LinkProof > "$CLONE/native.after.raw"
          PYTHONPATH=scripts python - "$ROOT/native.raw" "$CLONE/native.after.raw" "$MODE" <<'PY'
          import sys
          from pathlib import Path
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          def read(path):
              exact={}
              def entry(kind,key,raw):
                  exact[(kind,key)]=raw
              with Path(path).open("rb") as f:
                  _,keys,intros,top=parse_native_raw_corpus(f,on_entry=entry)
              return exact,keys,intros,top
          before, old_keys, old_intro, old_top=read(sys.argv[1])
          after, new_keys, new_intro, new_top=read(sys.argv[2])
          assert old_intro==new_intro and old_top==new_top
          assert all(after[key]==body for key,body in before.items()), (
              "A previously occupied original synthetic module entry was altered"
          )
          assert "Gen.1.6" not in new_keys
          mode=sys.argv[3]
          if mode=="SYNTHETIC_NATIVE_ZCOM_READ_ONLY":
              assert after==before, "The read-only zCom load unexpectedly changed an index entry"
              print("Synthetic zCom native link support: READ_ONLY; "
                    "all",len(before),"original entries and compressed bodies unchanged")
          elif mode=="SYNTHETIC_NATIVE_ZCOM_LINK_APPLIED":
              assert set(after)==set(before)|{("K","Gen.1.10")}
              assert after[("K","Gen.1.10")]==before[("K","Gen.1.9")]
              print("Synthetic zCom linkEntry: applied one new alias, "
                    "all",len(before),"original entries and compressed bodies unchanged")
          else:
              raise AssertionError("Unknown native module link capability result")
          PY
      - name: Audit all original stock section headings against native occupied slots
        env:
          BIBLE_RESOURCES_PRIVATE_CANDIDATE_DAY: '2026-11-16'
        run: |
          set -euo pipefail
          python scripts/commentary_section_scope_audit.py \
            --resource-id "$RESOURCE_ID" \
            --native-index-binary "${RUNNER_TEMP}/stock-index" \
            --native-raw-binary "${RUNNER_TEMP}/stock-raw" \
            --report "${RUNNER_TEMP}/editorial-scope.json" \
            --private-owner-authorized-export-dir "${RUNNER_TEMP}/mhcc-011-approved-private-stage" \
            --temporary-numbered-sample-chapters Gen.36 Matt.13 Song.1 \
            --temporary-original-intro-sample-chapters Lev.19 Ps.108 \
            --temporary-original-mixed-chapters 2John.1 2Chr.1 Matt.13 \
            --temporary-original-full-transport \
            --temporary-source-paragraph-witness K:John.3.1 K:Exod.12.1 K:Matt.4.1 K:Gen.3.1 K:2John.1.1 I:Lev.19 \
            --temporary-provisional-range-index-preview \
            --temporary-preview-real-xiphos \
            --synthetic-intro-native-stream "${RUNNER_TEMP}/synthetic-introductions/native.raw"
      - name: Summarize scope and known regression probes without original text
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"editorial-scope.json").read_text())
          assert r["status"]=="COMPLETE_NATIVE_SCAN_EDITORIAL_TRIAGE_NOT_APPROVAL"
          assert r["native_full_key_crosscheck"] is True
          assert r["original_text_logged_or_published"] is False
          assert r["original_sword_changed"] is False
          print("Native slots:",r["native_numbered_rows"],"intros:",r["native_intro_rows"])
          transport=r["original_osis_rebuild_structure_preflight"]
          assert transport["status"]=="COMPLETE_NATIVE_OSIS_WRAPPER_PREFLIGHT_NOT_A_REBUILD"
          assert transport["raw_entries_observed"]==(
              r["native_numbered_rows"]+r["native_intro_rows"]+r["native_top_rows"])
          assert transport["compiled_osis_to_stock_byte_parity_proven"] is False
          assert transport["original_content_or_module_changed"] is False
          assert transport["publication_authorized"] is False
          print("Real original XML-to-OSIS-wrapper feasibility observed entries:",
                transport["raw_entries_observed"],
                "original-kind-counts",json.dumps(transport["raw_record_kinds"],sort_keys=True),
                "distinct bodies",transport["unique_nonopaque_payload_sha256_count"])
          print("OSIS wrapper original element/text structure observations:",
                json.dumps(transport["original_markup_shape_counts"],sort_keys=True))
          print("OSIS wrapper blockers / unhandled source structure:",
                json.dumps(transport["blocking_or_unresolved_structure_counts"],sort_keys=True))
          print("OSIS source local element names:",
                json.dumps(transport["original_element_counts_by_name"],sort_keys=True))
          print("Opaque TOP requiring explicit preservation:",
                transport["opaque_top_distinct_digest_count"])
          print("Opaque TOP exact native raw byte length census:",
                json.dumps(transport["opaque_top_original_raw_length_counts"],sort_keys=True))
          pilot=r["private_numbered_only_osis2mod_sample_roundtrip"]
          assert pilot is not None
          assert pilot["no_publication"] is True
          assert pilot["original_introductions_preserved_in_candidate"] is False
          assert pilot["original_top_preserved_in_candidate"] is False
          print("Private original numbered-only osis2mod source transport:",
                pilot["status"],
                "source K",pilot["input_numbered_native_keys"],
                "source identical-body groups",pilot["contiguous_identical_raw_body_groups"])
          if not pilot.get("compiled_native_readback_completed"):
              raise AssertionError("Isolated original native numbered OSIS compiler/readback unavailable")
          print("Private original numbered-only compiled sample readback:",
                "original K matched",pilot["original_numbered_keys_in_compiled_sample"],
                "source K missing",pilot["original_numbered_keys_missing_from_compiled_sample"],
                "extra K",pilot["additional_numbered_keys_in_compiled_sample"],
                "original raw bytes identical",pilot["original_raw_xml_exact_byte_matches"],
                "visible Unicode identical",pilot["original_raw_xml_visible_unicode_text_matches"],
                "unparseable compiled fragments",
                pilot["compiled_entries_unparseable_as_original_fragments"])
          print("Original versus recompilation same-order word classes:",
                json.dumps(pilot["original_vs_compiled_word_sequence_classes"],
                           sort_keys=True))
          print("Original visible text equality ignoring only whitespace:",
                pilot["original_vs_compiled_whitespace_normalized_visible_text_exact_matches"])
          print("Original native XML element-name counts exactly retained:",
                pilot["original_vs_compiled_element_name_count_exact_matches"])
          print("Original native sample total XML element names:",
                json.dumps(pilot["original_native_element_name_total_counts_in_sample"],
                           sort_keys=True))
          print("Recompiled native sample total XML element names:",
                json.dumps(pilot["compiled_native_element_name_total_counts_in_sample"],
                           sort_keys=True))
          print("Entry-level original-vs-recompiled XML element name count divergences:",
                json.dumps(pilot["source_to_compiled_element_name_count_changed_entry_counts"],
                           sort_keys=True))
          print("Original non-div element order and exact attribute values retained:",
                pilot["original_non_div_element_order_and_attribute_value_exact_matches"])
          print("All original div attributes retained despite compiler-generated wrappers:",
                pilot["original_div_element_attribute_multiset_preserved_entry_count"])
          print("All original reference element actual attribute values retained:",
                pilot["original_reference_attribute_value_exact_order_matches"])
          print("Only additional div tags; all other original element counts retained:",
                pilot["only_additional_div_tags_other_markup_names_unchanged"])
          for row in pilot["per_original_key_text_free_delta_classes"]:
              if row["word_sequence_relation"]!="EXACT_ORIGINAL_WORD_SEQUENCE":
                  print("Pilot changed words or word order",row["original_native_key"],
                        row["word_sequence_relation"],
                        "original words",row["source_word_count"],
                        "compiled words",row["compiled_word_count"],
                        "original tags",json.dumps(row["source_markup_elements"],sort_keys=True),
                        "compiled tags",json.dumps(row["compiled_markup_elements"],sort_keys=True))
          assert pilot["original_module_content_or_metadata_modified"] is False
          assert pilot["publication_authorized"] is False
          print("Introduction original native key classes:",
                json.dumps(transport["intro_original_native_key_class_counts"],sort_keys=True))
          print("Original book/chapter introduction top-level XML element names:",
                json.dumps(transport["intro_original_top_level_element_counts"],sort_keys=True))
          for sample in r["private_original_mixed_intro_and_numbered_osis2mod_roundtrips"]:
              print("Private original mixed I+K transport",sample["chapter"],
                    "status",sample["status"],"completed",sample.get("readback_completed",False),
                    "original I",json.dumps(sample.get("source_original_intro_I_coverage",{}),sort_keys=True),
                    "original K",json.dumps(sample.get("source_original_K_coverage",{}),sort_keys=True),
                    "missing original I",json.dumps(sample.get("original_I_keys_missing_from_compiled",[])),
                    "missing original K",json.dumps(sample.get("original_K_keys_missing_from_compiled",[])),
                    "unexpected K",json.dumps(sample.get("unexpected_compiled_K_keys",[])))
              assert sample["published"] is False
              if not sample.get("readback_completed",False):
                  raise AssertionError("Private original mixed source OSIS transport failed")
              if sample.get("selected_original_I_K_text_markup_reference_checks_passed") is not True:
                  raise AssertionError("Private original mixed source transport lost or changed I/K content, keys, attributes or reference targets")
              if sample["original_I_keys_missing_from_compiled"] or sample["original_K_keys_missing_from_compiled"] or sample["unexpected_compiled_I_keys"] or sample["unexpected_compiled_K_keys"]:
                  raise AssertionError("Private original mixed module has nonidentical indexed I/K locations")
          full=r["private_complete_original_I_K_U_osis2mod_roundtrip"]
          assert full is not None and full["published"] is False
          print("Private complete-original I/K/U compiler result:",full["status"],
                "completed",full.get("readback_completed",False),
                "original books",full["source_book_intro_count"],
                "chapters",full["source_chapter_intro_count"],
                "numbered native source keys",full["source_numbered_key_count"])
          if not full.get("readback_completed",False):
              raise AssertionError("Whole-original isolated OSIS compile/native readback failed")
          assert full["source_book_intro_count"]==66
          assert full["source_chapter_intro_count"]==1189
          assert full["source_numbered_key_count"]==28718
          print("Whole original intro comparisons:",json.dumps(full["source_intro_I_coverage"],sort_keys=True))
          print("Whole original numbered comparisons:",json.dumps(full["source_numbered_K_coverage"],sort_keys=True))
          print("Missing/extra original I/K:",
                full["missing_I_count"],full["missing_K_count"],
                full["extra_I_count"],full["extra_K_count"])
          print("Original versus recompiled TOP raw positions:",
                full["source_TOP_count"],full["compiled_TOP_count"],
                "exact original indexed TOP bytes",
                full["all_original_TOP_positions_exact_raw_bytes"])
          print("Full-original indexed source I/K semantic checks:",
                full["original_indexed_I_K_text_markup_reference_checks_passed"])
          print("All original I/K/U positions and checked semantics reconciled:",
                full["full_original_K_I_U_native_entry_parity_proven"])
          assert full["corrections_or_publication_authorized"] is False
          assert full["historical_print_edition_parity_proven"] is False
          assert full["reader_layout_parity_proven"] is False
          if not full["original_indexed_I_K_text_markup_reference_checks_passed"]:
              raise AssertionError("Full original I/K technical roundtrip differs; see metadata-only artifact")
          reviewed=r["source_corroborated_reviewed_section_alias_plan_not_release_approved"]
          assert reviewed is not None
          assert reviewed["status"]=="SOURCE_SCOPE_CORROBORATED_CANDIDATE_NOT_RELEASE_AUTHORIZED"
          assert reviewed["added_alias_count"]==24
          assert reviewed["independent_source_evidence_classes"]=={
              "EXACT_ORIGINAL_HEADING_AND_INDEPENDENT_LEADING_COMMENTARY_CITATION":16,
              "EXACT_DISCONTIGUOUS_ORIGINAL_HEADING_AND_INDEPENDENT_DIGITAL_PRESENTATIONS":1,
          }
          assert reviewed["release_authorized"] is False
          assert reviewed["original_keys_overwritten"] is False
          assert reviewed["original_ccel_annotation_values_copied"] is False
          assert reviewed["unmarked_first_verse_chapter_aliases_added"] is False
          print("Reviewed metadata-only original index-correction scope:",
                reviewed["status"],"classes",
                json.dumps(reviewed["independent_source_evidence_classes"],sort_keys=True),
                "source-preserving SWORD aliases",reviewed["added_alias_count"],
                "publication authorized",reviewed["release_authorized"])
          preview=r["private_provisional_range_index_preview_not_approved"]
          assert preview is not None and preview["published"] is False
          assert preview["corrections_or_publication_authorized"] is False
          assert preview["source_scope_editorially_approved"] is False
          assert preview["index_only_control_source_content_edited"] is False
          assert preview["private_source_corrected_candidate_compiled"] is True
          print("Provisional missing-section index preview (NOT editorially approved):",
                preview["status"],"compiled",preview.get("readback_completed",False),
                "original entries",preview["source_numbered_key_count"],
                "proposed new aliases",preview["planned_extra_index_keys"],
                "missing/extra originals I/K",
                preview["missing_I_count"],preview["missing_K_count"],preview["extra_I_count"],
                "extra index targets",preview["extra_K_count"],
                "alias raw payloads identical to original compiled master",
                preview["all_proposed_new_aliases_same_compiled_raw_as_original_master"],
                "original TOP unchanged",preview["all_original_TOP_positions_exact_raw_bytes"])
          assert preview["preflight_candidate_section_count"]==17
          staging=preview["private_versioned_package_install_not_released"]
          assert staging["status"]=="PRIVATE_VERSIONED_SWORD_ZCOM_ZIP_ISOLATED_INSTALL_PARITY_NOT_PUBLICATION"
          assert staging["curated_module_id"]=="MHCC"
          assert staging["proposed_version"]=="0.1.1"
          assert staging["original_native_I_count"]==1255
          assert staging["original_and_alias_native_K_count"]==28742
          assert staging["original_opaque_TOP_count"]==2
          assert staging["installed_package_I_K_U_raw_bytes_equal_to_private_compiled_source"] is True
          assert staging["native_compiled_files_copied_without_recompression_or_byte_edits"] is True
          metadata=staging["private_conf_metadata_exact_delta_receipt"]
          assert metadata["private_metadata_exact_reviewed_delta_only"] is True
          assert metadata["only_changed_original_fields"]==["BlockType","InstallSize","Version"]
          assert metadata["only_added_metadata_field"]=="History_0.1.1"
          assert metadata["original_distribution_license_textsource_about_and_date_unchanged"] is True
          assert metadata["installed_native_bytes_used_for_install_size"] is True
          assert metadata["original_about_print_claim_is_inherited_not_independently_certified"] is True
          assert metadata["public_release_or_new_revision_date_authorized"] is False
          assert staging["package_saved_as_public_artifact"] is False
          assert staging["published"] is False
          assert staging["release_authorized"] is False
          staged_gui=staging["private_versioned_curated_module_real_xiphos_selected_verse_probe"]
          assert staged_gui is not None
          assert staged_gui["sample_count"]==3
          assert staged_gui["independent_gui_commentary_excerpt_match_count"]==3
          assert staged_gui["real_xiphos_executable_started_and_visible"] is True
          assert staged_gui["actual_passage_commands_accepted"] is True
          assert staged_gui["source_prose_or_screenshot_uploaded"] is False
          assert staged_gui["published"] is False
          print("Real versioned MHCC 0.1.1 installed ZIP Xiphos navigation:",
                "sample",staged_gui["sample_count"],
                "real GUI matches",staged_gui["independent_gui_commentary_excerpt_match_count"],
                "commands accepted",staged_gui["actual_passage_commands_accepted"],
