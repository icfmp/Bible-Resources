name: Historical LSG 1.0.2 chapter-opening section heading replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headings:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical exact-source replay, not a gate pinned to an obsolete current version.
          ref: 5ea881265ba9cd525cd03fccc7925c1d5e5530c6
          fetch-depth: 0
      - name: Restore immutable approved 1.0.1 source before deriving the new heading edition
        run: |
          git show 33690e60647a9fd389cd347b8f44140770796bc0:sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml > /tmp/lsg-1.0.1-original.osis.xml
          echo '1eb474496bef0388da403528ea080da489d8b4d980d4b11397ffd8cfe2398a4d  /tmp/lsg-1.0.1-original.osis.xml' | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict OSIS validator and stock native SWORD
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsword-dev libsword-utils
      - name: Test reversible generic source title overlay
        run: |
          python -m unittest discover -s tests -p test_mark_osis_preverse_section_titles.py -v
          python scripts/mark_osis_preverse_section_titles.py \
            --input /tmp/lsg-1.0.1-original.osis.xml \
            --expected-input-sha256 1eb474496bef0388da403528ea080da489d8b4d980d4b11397ffd8cfe2398a4d \
            --expected-count 803 \
            --output /tmp/lsg-preverse-section-candidate.osis.xml \
            --report /tmp/lsg-preverse-section-receipt.json
      - name: Validate official OSIS schema unchanged Bible verse identities and full headings
        run: |
          python scripts/fetch_reviewed_schema.py --directory /tmp/lsg-heading-schema
          set +e
          python scripts/check_brnp.py /tmp/lsg-preverse-section-candidate.osis.xml \
            --kind bible --schema /tmp/lsg-heading-schema/osisCore.2.1.1-cw-latest.xsd \
            --report /tmp/lsg-heading-official-xsd.json
          check_exit=$?
          set -e
          test "$check_exit" -le 1
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from lxml import etree
          from collections import Counter
          import json,sys
          original=Path('/tmp/lsg-1.0.1-original.osis.xml')
          candidate=Path('/tmp/lsg-preverse-section-candidate.osis.xml')
          current=Path('sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml')
          current_sha=sha256(current.read_bytes()).hexdigest()
          if current_sha not in (
              '1eb474496bef0388da403528ea080da489d8b4d980d4b11397ffd8cfe2398a4d',
              '2b8342a67d8e97b433670450fe9dd9e58917a7fcfc0cb4d321882ca8219dc3bd'):
              raise SystemExit('Unexpected current master source during staging or after merge')
          if current_sha == '2b8342a67d8e97b433670450fe9dd9e58917a7fcfc0cb4d321882ca8219dc3bd':
              if current.read_bytes() != candidate.read_bytes():
                  raise SystemExit('Staged master differs from exact independently regenerated output')
          parser=etree.XMLParser(resolve_entities=False,load_dtd=False,
                                 no_network=True,recover=False,huge_tree=False)
          before=etree.parse(str(original),parser=parser)
          after=etree.parse(str(candidate),parser=parser)
          official=json.load(open('/tmp/lsg-heading-official-xsd.json'))
          if official['official_osis']['status']!='validated':
              raise SystemExit('Independent pinned official OSIS XSD validation failed')
          ns='{http://www.bibletechnologies.net/2003/OSIS/namespace}'
          old_tags=list(before.iter())
          new_tags=list(after.iter())
          if len(old_tags)!=len(new_tags):
              raise SystemExit('OSIS element count changed')
          changed=Counter()
          for x,y in zip(old_tags,new_tags):
              if x.tag!=y.tag or x.text!=y.text or x.tail!=y.tail:
                  raise SystemExit('OSIS content/punctuation/structure altered beyond the first title type')
              if x.attrib!=y.attrib:
                  if (x.tag!=ns+'title' or 'type' in x.attrib or
                      dict(y.attrib)!={**dict(x.attrib),'type':'x-section'}):
                      raise SystemExit('Unapproved OSIS attribute alteration')
                  changed['heading_types_added']+=1
          old_verse_keys={v.get('osisID') for v in before.iter(ns+'verse') if v.get('sID')}
          new_verse_keys={v.get('osisID') for v in after.iter(ns+'verse') if v.get('sID')}
          receipt=json.load(open('/tmp/lsg-preverse-section-receipt.json'))
          if (len(old_verse_keys)!=31170 or old_verse_keys!=new_verse_keys or
              changed['heading_types_added']!=803 or
              receipt['typed_chapter_first_titles']!=803):
              raise SystemExit('Inconsistent full source heading or Scripture key counts')
          print('Official OSIS schema valid, 803 pre-existing title types defined, original verse IDs/content/notes and other markup unchanged')
          PY
      - name: Compile exact source-faithful candidate through stable osis2mod
        run: |
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_raw_corpus.cpp \
            -o /tmp/lsg-heading-native-raw -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_render.cpp \
            -o /tmp/lsg-heading-native-display -lsword
          python - <<'PY'
          from pathlib import Path
          import shutil,sys
          sys.path.insert(0,'scripts')
          from approved_osis_sword_candidate import _create_candidate_layout,_compile_osis
          working=Path('/tmp/lsg-chapter-heading-sword')
          working.mkdir()
          payload,out=_create_candidate_layout(working,'BRLSG1910','Segond','fr')
          conf=payload/'mods.d/brlsg1910.conf'
          conf.write_text(conf.read_text().replace(
            'GlobalOptionFilter=OSISXRefs',
            'GlobalOptionFilter=OSISScripref\nGlobalOptionFilter=OSISHeadings'))
          _compile_osis(Path(shutil.which('osis2mod')),
              Path('/tmp/lsg-preverse-section-candidate.osis.xml'),
              out,'Segond',Path('/tmp/lsg-headings-osis2mod.log'))
          print('SWORD candidate compiled: new zText independent of the approved published module')
          PY
      - name: Independently verify all numbered Scripture prose notes and chapter-initial titles
        run: |
          python - <<'PY'
          from collections import Counter
          from hashlib import sha256
          from html import unescape
          from pathlib import Path
          from lxml import etree
          import json,re,sys
          sys.path.insert(0,'scripts')
          from mark_osis_preverse_section_titles import DIRECT_UNTYPED,CHAPTER_ID,TITLE_CLOSE
          from approved_osis_sword_candidate import _read_native_frames,_native_notes
          from research.bible.native_raw_main_text import native_raw_main_text
          from research.bible.source_osis_verse_notes import original_osis_verses_and_notes,_nonspace
          original=Path('/tmp/lsg-1.0.1-original.osis.xml').read_bytes()
          candidate=Path('/tmp/lsg-preverse-section-candidate.osis.xml').read_bytes()
          expected={}
          for match in DIRECT_UNTYPED.finditer(original):
              chapter=CHAPTER_ID.search(match.group('prefix')).group(1).decode('ascii')
              end=original.index(TITLE_CLOSE,match.end('opening'))
              expected[chapter+'.1']=original[match.end('opening'):end].decode('utf-8')
          if len(expected)!=803:
              raise SystemExit('Unexpected edition heading source count')
          authored,notes,source_receipt=original_osis_verses_and_notes(candidate)
          if len(authored)!=31170 or source_receipt['publisher_numbered_note_count']!=9751:
              raise SystemExit('Actual authorial Scripture/note inventory changed')
          osis_ns='{http://www.bibletechnologies.net/2003/OSIS/namespace}'
          named=Counter()
          native=set()
          missing=[]
          verses_wrong=[]
          notes_wrong=[]
          binary=Path('/tmp/lsg-heading-native-raw')
          payload=Path('/tmp/lsg-chapter-heading-sword/payload')
          for kind,key,raw in _read_native_frames(binary,'BRLSG1910',payload):
              if kind!='K':
                  continue
              native.add(key)
              named['verses_checked']+=1
              text,_=native_raw_main_text(raw)
              expected_text=authored[key]
              expected_notes=list(notes[key])
              if key=='Mark.10.52':
                  expected_text+=authored['Mark.10.53']
                  expected_notes+=list(notes['Mark.10.53'])
              if _nonspace(text)!=_nonspace(expected_text):
                  verses_wrong.append(key)
              ns=_native_notes(raw)
              if len(ns)!=len(expected_notes) or any(
                  x['caller']!=y['caller'] or x['type']!=y['type'] or
                  _nonspace(x['body'])!=_nonspace(y['body'])
                  for x,y in zip(ns,expected_notes)):
                  notes_wrong.append(key)
              named['notes_checked']+=len(ns)
              if key in expected:
                  root=etree.fromstring(b'<root>'+raw+b'</root>')
                  titles=[''.join(elem.itertext()) for elem in root.iter()
                          if isinstance(elem.tag,str) and
                          etree.QName(elem).localname=='title']
                  if expected[key] not in titles:
                      missing.append(key)
                  else:
                      named['chapter_first_titles_in_numbered_verse']+=1
          if (native!=set(authored)-{'Mark.10.53'} or
              named['verses_checked']!=31169 or
              named['notes_checked']!=9751 or
              named['chapter_first_titles_in_numbered_verse']!=803 or
              verses_wrong or notes_wrong or missing):
              raise SystemExit('SWORD source/main-note-heading parity failure: '+
                repr({'verses':verses_wrong[:10],'notes':notes_wrong[:10],
                      'missing_headings':missing[:15],'counts':dict(named)}))
          receipt={
              'status':'full_source_native_chapter_heading_candidate_verified',
              'source_sha256':sha256(original).hexdigest(),
              'candidate_sha256':sha256(candidate).hexdigest(),
              'source_keys':31170,'native_keys':31169,
              'stock_segon_single_exception':'Mark.10.53',
              'chapter_first_headings_now_in_first_verse':803,
              'scripture_text_mismatches':0,'note_mismatches':0,
              'source_original_verse_ids_and_text_unchanged':True,
              'public_release_created':False,
          }
          Path('/tmp/lsg-heading-native-receipt.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('All 803 original chapter-opening headings present in native first verse, all 31,169 Scripture verse bodies and 9,751 notes preserved')
          PY
          SWORD_PATH=/tmp/lsg-chapter-heading-sword/payload \
            /tmp/lsg-heading-native-display BRLSG1910 31169
      - name: Verify checked-in 1.0.2 module matches independently compiled native payload (read-only)
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          source=Path('sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml')
          candidate=Path('/tmp/lsg-preverse-section-candidate.osis.xml')
          expected_sha='2b8342a67d8e97b433670450fe9dd9e58917a7fcfc0cb4d321882ca8219dc3bd'
          if sha256(source.read_bytes()).hexdigest()!=expected_sha or source.read_bytes()!=candidate.read_bytes():
              raise SystemExit('The committed cleaned master is not the exactly verified 1.0.2 source')
          rel=Path('modules/texts/ztext/brlsg1910')
          staged=Path('modules/lsg-1910/payload')/rel
          compiled=Path('/tmp/lsg-chapter-heading-sword/payload')/rel
          required={'ot.bzs','ot.bzv','ot.bzz','nt.bzs','nt.bzv','nt.bzz'}
          if ({p.name for p in staged.iterdir() if p.is_file()}!=required or
              {p.name for p in compiled.iterdir() if p.is_file()}!=required):
              raise SystemExit('Unexpected SWORD native payload member set')
          for name in sorted(required):
              if staged.joinpath(name).read_bytes()!=compiled.joinpath(name).read_bytes():
                  raise SystemExit('The committed native payload differs from independent SWORD compilation: '+name)
          conf=Path('modules/lsg-1910/payload/mods.d/brlsg1910.conf').read_text()
          if ('Version=1.0.2' not in conf or
              'GlobalOptionFilter=OSISHeadings' not in conf or
              'GlobalOptionFilter=OSISScripref' not in conf or
              'GlobalOptionFilter=OSISXRefs' in conf):
              raise SystemExit('1.0.2 native reader configuration mismatch')
          import_plan=json.loads(Path('config/catalogue-import-lsg-1.0.2.json').read_text())
          release_plan=json.loads(Path('config/release-plans/lsg-1.0.2.json').read_text())
          if (import_plan['release_tag']!='lsg-1.0.2' or
              release_plan['tag']!='lsg-1.0.2' or
              import_plan['release_zip_sha256']!=release_plan['package_sha256']):
              raise SystemExit('Release package identity mismatch')
          for name in sorted(required):
              key=(rel/name).as_posix()
              if import_plan['files'].get(key)!=sha256(staged.joinpath(name).read_bytes()).hexdigest():
                  raise SystemExit('Release manifest member digest mismatch: '+key)
          print('Committed 1.0.2 OSIS and all six SWORD native files match exact independently rebuilt candidate')
          PY
          python scripts/validate.py
          python scripts/release_preflight.py --module-id lsg-1910 --report /tmp/lsg-1.0.2-preflight.json
      - name: Upload temporary source and native validation receipts only
        uses: actions/upload-artifact@v4
        with:
          name: lsg-chapter-opening-heading-preverse-research-only
          path: |
            /tmp/lsg-preverse-section-receipt.json
            /tmp/lsg-heading-native-receipt.json
          retention-days: 14
          if-no-files-found: error
