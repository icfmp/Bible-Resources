name: One-shot registry refresh for link-disposition extraction
on:
  pull_request:
    paths:
      - 'scripts/commentary_modern_reference_gate.py'
      - 'scripts/research/commentary/commentary_link_disposition_review.py'
      - 'tests/test_tool_registry.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/extract-modern-link-dispositions-20261121
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate registry and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git rm .github/workflows/maintenance-refresh-link-disposition-registry.yml
          git add reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh deterministic tool registry after proposal-gate extraction'
          git push origin HEAD:maintenance/extract-modern-link-dispositions-20261121
