name: Rebuild MHC from pinned original OSIS (private technical phase 1)

on:
  pull_request:
    paths:
      - "scripts/rebuild_osis_commentary.py"
      - "tests/test_rebuild_osis_commentary.py"
      - "scripts/clean_source_osis.py"
      - "scripts/repair_commentary_osis_milestones.py"
      - "tests/test_repair_commentary_osis_milestones.py"
      - "config/commentary-osis-repair-plans/mhc-endpoints-private-preview.json"
      - "tests/test_clean_source_osis.py"
      - ".github/workflows/commentary-mhc-technical-rebuild.yml"
      - "config/commentary-intake/mhc-crosswire.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for source identity and safe OSIS reading
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt -q
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_rebuild_osis_commentary.py' -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_clean_source_osis.py' -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_repair_commentary_osis_milestones.py' -v
      - name: Install stock libSWORD compiler and native reader headers
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update -qq
          timeout 240s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 \
            install -y --no-install-recommends libsword-dev libsword-utils diatheke
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "$RUNNER_TEMP/commentary-native-raw" -lsword
      - name: Download and verify exact official original authoring OSIS (never execute upstream scripts)
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_LFS_SKIP_SMUDGE=1
          timeout 240s git -c core.hooksPath=/dev/null clone \
            --depth 1 --branch main --single-branch --no-tags \
            https://gitlab.com/crosswire-bible-society/mhc.git \
            "$RUNNER_TEMP/original-mhc" >/dev/null 2>&1
          python - <<'PY'
          from hashlib import sha256
          import json, os, subprocess
          from pathlib import Path
          original=Path(os.environ["RUNNER_TEMP"])/"original-mhc"
          manifest=json.loads(Path("config/commentary-intake/mhc-crosswire.json").read_text())
          pin=manifest["commentary_source"]["original_authoring_osis"]
          assert manifest["language"]=="en" and manifest["module_id"]=="MHC"
          commit=subprocess.check_output(["git","-C",str(original),"rev-parse","HEAD"],text=True).strip()
          if commit!=pin["observed_upstream_commit_sha"]:
              raise SystemExit("Original authoring source Git commit changed; abort")
          source=original/pin["authoring_osis_file"]
          if (source.is_symlink() or source.stat().st_size!=pin["authoring_osis_bytes"]
                  or sha256(source.read_bytes()).hexdigest()!=pin["authoring_osis_sha256"]):
              raise SystemExit("MHC original OSIS size/SHA mismatch; abort")
          print("Verified pinned official OSIS commit, exact bytes and checksum")
          PY
      - name: Audit and clean original OSIS cosmetic artifacts in isolated storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export ORIGINAL="$RUNNER_TEMP/original-mhc/mhc.osis.xml"
          export CLEANED="$RUNNER_TEMP/mhc-cleaned.osis.xml"
          export RECEIPT="$RUNNER_TEMP/mhc-cleanup-receipt.json"
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          manifest=json.loads(Path("config/commentary-intake/mhc-crosswire.json").read_text())
          source_sha=manifest["commentary_source"]["original_authoring_osis"]["authoring_osis_sha256"]
          args=[sys.executable,"scripts/clean_source_osis.py",
                "--source",os.environ["ORIGINAL"],"--sha256",source_sha,
                "--private-output",os.environ["CLEANED"]]
          with Path(os.environ["RECEIPT"]).open("xb") as result:
              subprocess.run(args,stdout=result,check=True,timeout=140)
          receipt=json.loads(Path(os.environ["RECEIPT"]).read_text())
          if (receipt["status"]!="PRIVATE_OSIS_COSMETIC_CANDIDATE_NOT_EDITORIALLY_APPROVED"
                  or receipt["source_sha256"]!=source_sha
                  or not receipt["all_nonempty_osis_elements_and_attributes_preserved"]
                  or not receipt["only_verified_inert_display_elements_removed"]
                  or not receipt["all_source_nonspace_text_preserved"]
                  or not receipt["original_byte_regions_preserved_except_empty_hi"]
                  or not receipt["all_note_and_reference_text_preserved"]
                  or not receipt["asterisks_and_potential_note_markers_unmodified"]
                  or receipt["published"]):
              raise SystemExit("Unreviewed OSIS cleanup scope or failure")
          print("Exact SHA-pinned original OSIS processed as a private cleaned candidate")
          print("Cleaned source SHA-256:",receipt["cleaned_sha256"])
          print("Cosmetic operations (text-free):",receipt["cleanup_changes"])
          print("Text-preservation SHA-256 before/after:",
                receipt["original_nonspace_text_sha256"],
                receipt["cleaned_nonspace_text_sha256"])
          print("Original typographical/spacing candidate census (counts only):",
                receipt["original_suspicious_token_census"])
          print("Original text ownership by XML tag (characters only):",
                receipt["text_character_counts_by_xml_owner"])
          profile=receipt["original_markup_profile"]
          print("Emphasis style labels/counts:",profile["hi_emphasis_type_counts"])
          print("Emphasis text-length bands:",profile["hi_visible_length_band_counts"])
          print("Truly empty emphasis elements:",profile["truly_empty_hi_leaf_shape_counts"])
          print("Emphasis immediate XML owners:",profile["hi_direct_parent_counts"])
          print("NBSP source XML owners:",profile["nonbreaking_spaces_by_xml_owner"])
          print("Only inert empty hi styling may be removed; all other elements, attributes and note/link bodies retained")
          PY
      - name: Run existing commentary OSIS structural audit, report only metadata
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout 180s python scripts/audit_osis.py \
            "$RUNNER_TEMP/mhc-cleaned.osis.xml" --kind commentary \
            --report "$RUNNER_TEMP/mhc-structural-private.json" >/dev/null
          python - <<'PY'
          from collections import Counter
          import json, os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"mhc-structural-private.json"
          report=json.loads(path.read_text())
          if report.get("status")!="audited_not_normalized" or not report.get("no_content_changes"):
              raise SystemExit("Structural source audit failed")
          summary=report["summary"]
          print("Private MHC OSIS audit structural finding counts:",summary["finding_counts"])
          print("Private MHC OSIS audit source paragraphs:",summary["paragraphs"])
          print("Actual source annotated commentary sections:",
                summary["commentary_annotated_section_count"])
          print("Full annotation range/section grammar census:",
                summary["commentary_annotation_scope_shapes"])
          print("Structural range/order/book diagnostics:",
                summary["commentary_annotation_structural_counts"])
          print("Bounded annotated source section cases (no prose):",
                summary["commentary_nonstandard_scope_examples"][:30])
          # Exact source text, titles, note bodies and references stay private.
          findings=report["findings"]
          print("First structural finding positions (code and XML line only):",
                [{"code":row["code"],"line":row["original_xml_line"]}
                 for row in findings[:20]])
          from collections import Counter
          from hashlib import sha256
          import re
          references=[row for row in findings if row["code"]=="unreviewed_cross_reference"]
          def classify_target(value):
              if not value:
                  return "empty"
              if ";" in value or "," in value:
                  return "punctuation_separated"
              if any(x in value for x in ("–","—","‑")):
                  return "unicode_dash"
              if "@" in value or "!" in value:
                  return "extended_subreference"
              if ":" in value and not value.startswith("Bible:"):
                  return "other_work_prefix"
              if re.search(r"\\.\\d+[A-Za-z]+(?:$|\\s)",value):
                  return "letter_suffixed_endpoint"
              if re.search(r"-\\d+(?:$|\\s)",value):
                  return "abbreviated_range"
              if re.search(r"\\s",value.strip()):
                  return "compound_or_whitespace"
              return "other_unreviewed_osis_syntax"
          categories=Counter(classify_target(row.get("details",{}).get("osis_ref",""))
                             for row in references)
          print("Unreviewed source link-target grammar categories:",
                dict(sorted(categories.items())))
          def safe_shape(value):
              return re.sub(r"9+","9",re.sub(r"A+","A",
                  "".join("A" if x.isalpha() else "9" if x.isdigit()
                          else x for x in value)))[:100]
          print("Unreviewed source link-target locators (line/category/shape/SHA):",
                [{"line":row["original_xml_line"],
                  "category":classify_target(row.get("details",{}).get("osis_ref","")),
                  "shape":safe_shape(row.get("details",{}).get("osis_ref","")),
                  "sha256":sha256(row.get("details",{}).get("osis_ref","").encode("utf-8")).hexdigest()}
                 for row in references])
          # Only short, machine-readable Bible reference IDs are eligible for
          # diagnostic disclosure. Never expose arbitrary commentary prose.
          from lxml import etree
          xml=etree.parse(str(Path(os.environ["RUNNER_TEMP"])/"mhc-cleaned.osis.xml"),
                          parser=etree.XMLParser(resolve_entities=False,
                                                 load_dtd=False,no_network=True,
                                                 recover=False,huge_tree=True))
          suspicious_lines={row["original_xml_line"] for row in references}
          expected_sha={
              row["original_xml_line"]:
              sha256(row.get("details",{}).get("osis_ref","").encode()).hexdigest()
              for row in references
          }
          detailed=[]
          for element in xml.iter():
              if not isinstance(element.tag,str) or not element.tag.endswith("}reference"):
                  continue
              if element.sourceline not in suspicious_lines:
                  continue
              value=element.get("osisRef","")
              if sha256(value.encode()).hexdigest()!=expected_sha[element.sourceline]:
                  # One XML line can contain several different reference tags.
                  # The audit finding applies to the *specific* hashed target.
                  continue
              scope=next((x.get("annotateRef") for x in element.iterancestors()
                          if x.get("annotateType")=="commentary"),None)
              book=next((x.get("osisID") for x in element.iterancestors()
                         if x.get("type")=="book" and x.get("osisID")),None)
              label="".join(element.itertext()).strip()
              # No free-form source language is emitted, just grammar class.
              numeric_label=bool(re.fullmatch(r"\d{1,3}(?:[.:]\d{1,3})?"
                                               r"(?:[-–]\d{1,3})?",label))
              literal_target=value if (
                  len(value)<=120 and
                  re.fullmatch(r"[A-Za-z0-9_.: \-]{1,120}",value)
              ) else None
              detailed.append({
                  "line":element.sourceline,
                  "type":element.get("type"),
                  "source_host":scope,
                  "source_book":book,
                  "reference_is_just_numeric_label":numeric_label,
                  "machine_reference":literal_target,
              })
          if len(detailed)!=len(references):
              raise SystemExit("Source target line/key correspondence incomplete")
          print("Unreviewed machine references and source scopes (no commentary prose):",
                detailed)
          # Source here is a Bible-structured OSIS commentary (verse/chapter
          # elements), NOT annotateRef sections. Inspect the actual index data.
          import collections
          attributes=collections.Counter()
          element_shapes=collections.Counter()
          examples={"verse":[],"chapter":[],"milestone":[],"div":[]}
          for el in xml.iter():
              if not isinstance(el.tag,str):
                  continue
              local=el.tag.rsplit("}",1)[-1]
              if local not in examples:
                  continue
              current={k:v for k,v in el.attrib.items()
                       if k in {"osisID","sID","eID","n","type","subType"}}
              for name,value in current.items():
                  attributes[(local,name)]+=1
                  if name in {"osisID","sID","eID","n"}:
                      element_shapes[(local,name,
                                      "comma" if "," in value else
                                      "whitespace" if len(value.split())>1 else
                                      "range" if "-" in value else "atomic")]+=1
              if len(examples[local])<8:
                  examples[local].append({"line":el.sourceline, "attrs":current})
          print("Original MHC actual source reference-attribute census:",
                dict(sorted((str(k),v) for k,v in attributes.items())))
          print("Original MHC verse/chapter reference syntax counts:",
                dict(sorted((str(k),v) for k,v in element_shapes.items())))
          print("Actual OSIS source marker samples (machine attributes only):",
                examples)
          # Three independently attested source-range endpoint repair candidates.
          # Show only machine IDs, exact source line and markers; no MHC prose.
          attention={"Acts.26.33","Isa.7.26","Prov.31.32"}
          matching=[]
          close_ids=collections.Counter(
              n.get("eID") for n in xml.iter()
              if isinstance(n.tag,str) and n.tag.endswith("}verse") and n.get("eID"))
          for n in xml.iter():
              if (not isinstance(n.tag,str)
                      or not n.tag.endswith("}verse")
                      or not n.get("osisID")):
                  continue
              ids=n.get("osisID").split()
              if attention.isdisjoint(ids):
                  continue
              matching.append({
                  "line":n.sourceline,
                  "original_sid":n.get("sID"),
                  "original_display_n":n.get("n"),
                  "original_first_osisID":ids[0],
                  "original_last_osisID":ids[-1],
                  "original_assigned_osisID_count":len(ids),
                  "matching_eID_count":close_ids[n.get("sID")],
              })
          if len(matching)!=3:
              raise SystemExit("Pinned OSIS three known out-of-range groups not located")
          print("Three source range endpoint candidates (machine attributes only):",
                matching)
          print("No editorial changes or historical text correction performed")
          PY
      - name: Compile fresh private zCom4, then independently read EVERY occupied key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export SWORD_PATH="$RUNNER_TEMP/mhc-stage1-private"
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          manifest=json.loads(Path("config/commentary-intake/mhc-crosswire.json").read_text())
          source=manifest["commentary_source"]["original_authoring_osis"]
          root=Path(os.environ["RUNNER_TEMP"])
          cleanup=json.loads((root/"mhc-cleanup-receipt.json").read_text())
          cmd=[sys.executable, "scripts/rebuild_osis_commentary.py",
               "--source",str(root/"mhc-cleaned.osis.xml"),
               "--sha256",cleanup["cleaned_sha256"],
               "--private-work",os.environ["SWORD_PATH"],
               "--module","MHCStage1",
               "--language",manifest["language"],
               "--versification",manifest["commentary_source"]["observed_compiled_versification"],
               "--native-reader",str(root/"commentary-native-raw"),
               "--min-numbered","20000"]
          with (root/"rebuild-mhc-stage1-report.json").open("xb") as report:
              result=subprocess.run(cmd, stdout=report, stderr=subprocess.DEVNULL,
                                    check=False, timeout=650)
          if result.returncode:
              raise SystemExit("Technical rebuild FAILED; no module uploaded or published")
          data=json.loads((root/"rebuild-mhc-stage1-report.json").read_text())
          if (data["status"]!="COMPILED_AND_FULL_NATIVE_INDEX_READBACK_ONLY"
                  or data["editorial_text_changes_performed"] is not False
                  or data["publication_or_release_performed"] is not False):
              raise SystemExit("Unreviewed technical reconstruction receipt")
          print("Private MHC stage 1 compiled with zCom4 and fully enumerated")
          print("Native numbered entries:",data["native_occupied_numbered_keys"])
          print("Native introduction entries:",data["native_occupied_introduction_keys"])
          print("Native TOP entries:",data["native_occupied_opaque_top_keys"])
          if (data["native_occupied_numbered_keys"]!=31098
                  or data["native_occupied_introduction_keys"]!=1255
                  or data["native_occupied_opaque_top_keys"]!=2):
              raise SystemExit("Cleaned rebuild changed original native key coverage")
          print("Index key counts exactly match pinned original MHC")
          print("No historical source collations or editorial corrections performed")
          print("Full source-to-output textual parity is NOT yet certified")
          PY
          if ! timeout 45s diatheke -b MHCStage1 -k "Gen 1:1" >/dev/null 2>&1; then
            echo "Native CLI invocation failed; no technical acceptance"
            exit 1
          fi
          echo "Private CLI invocation completed"
      - name: Compare full clean candidate against pristine independent SWORD rebuild
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from lxml import etree
          root=Path(os.environ["RUNNER_TEMP"])
          manifest=json.loads(Path("config/commentary-intake/mhc-crosswire.json").read_text())
          pinned=manifest["commentary_source"]["original_authoring_osis"]
          native=root/"commentary-native-raw"
          pristine_work=root/"mhc-pristine-private"
          original_source=root/"original-mhc"/pinned["authoring_osis_file"]
          cmd=[sys.executable,"scripts/rebuild_osis_commentary.py",
               "--source",str(original_source),
               "--sha256",pinned["authoring_osis_sha256"],
               "--private-work",str(pristine_work),
               "--module","MHCPristine",
               "--language",manifest["language"],
               "--versification",manifest["commentary_source"]["observed_compiled_versification"],
               "--native-reader",str(native),"--min-numbered","20000"]
          pristine_report=root/"mhc-pristine-report.json"
          with pristine_report.open("xb") as handle:
              subprocess.run(cmd,stdout=handle,stderr=subprocess.DEVNULL,
                             check=True,timeout=650)
          pristine=json.loads(pristine_report.read_text())
          clean=json.loads((root/"rebuild-mhc-stage1-report.json").read_text())
          counts=("native_occupied_numbered_keys",
                  "native_occupied_introduction_keys",
                  "native_occupied_opaque_top_keys")
          if any(pristine[k]!=clean[k] for k in counts):
              raise SystemExit("MHC clean rebuild differs in native index populations")
          same_raw=(pristine["native_full_raw_corpus_sha256"]
                    == clean["native_full_raw_corpus_sha256"])
          print("Pristine vs cleaned full native raw corpus byte-identical:",same_raw)
          if same_raw:
              print("All native bodies and occupied keys exactly match original recompilation")
              print("This is technical comparison, NOT independent historical edition collation")
              raise SystemExit(0)

          sys.path.insert(0,str(Path.cwd()/"scripts"))
          from clean_source_osis import _inert_hi, _remove_empty_hi
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus

          def read_native(work,module):
              env=dict(os.environ,SWORD_PATH=str(work.resolve(strict=True)))
              proc=subprocess.Popen([str(native),module],
                                    env=env,stdout=subprocess.PIPE,
                                    stderr=subprocess.DEVNULL)
              raw_by_key={}
              def receive(kind,ref,raw):
                  raw_by_key[(kind,ref)]=raw
              try:
                  report,*_=parse_native_raw_corpus(proc.stdout,on_entry=receive)
                  if proc.wait(timeout=30)!=0:
                      raise ValueError("Native source reader failed")
              finally:
                  if proc.stdout: proc.stdout.close()
                  if proc.poll() is None: proc.kill()
                  proc.wait()
              return raw_by_key,report

          baseline,source_report=read_native(pristine_work,"MHCPristine")
          cleaned,candidate_report=read_native(root/"mhc-stage1-private","MHCStage1")
          if baseline.keys()!=cleaned.keys():
              raise SystemExit("Pristine/cleaned native occupied key sets differ")
          def authored_content_without_display_styles(raw):
              parser=etree.XMLParser(resolve_entities=False,load_dtd=False,
                                     no_network=True,recover=False,huge_tree=False)
              fragment=etree.fromstring(b"<fragment>"+raw+b"</fragment>",parser)
              fulltext="".join(fragment.itertext())
              protected=tuple(
                  etree.tostring(node,method="c14n",with_comments=True)
                  for node in fragment.iter()
                  if isinstance(node.tag,str) and
                     node.tag.rsplit("}",1)[-1] in {"note","reference"}
              )
              # A balanced, exact-text event stream. Only <hi> presentation
              # containers are transparent, never note/reference boundaries.
              # Adjacent text is coalesced across transparent hi boundaries.
              events=[]
              pending=[]
              def flush():
                  if pending:
                      events.append(("text","".join(pending)))
                      pending.clear()
              def walk(node):
                  if not isinstance(node.tag,str):
                      flush()
                      events.append(("other",etree.tostring(node,with_tail=False)))
                      return
                  local=node.tag.rsplit("}",1)[-1]
                  display_only=local=="hi"
                  if not display_only:
                      flush()
                      events.append(("open",node.tag,tuple(sorted(node.attrib.items()))))
                  if node.text:
                      pending.append(node.text)
                  for child in node:
                      walk(child)
                      if child.tail:
                          pending.append(child.tail)
                  if not display_only:
                      flush()
                      events.append(("close",node.tag))
              walk(fragment)
              flush()
              return fulltext,protected,tuple(events)

          from collections import Counter
          raw_changes=0
          altered_visible=[]
          visible_whitespace_only=[]
          visible_nonwhitespace_changed=[]
          exact_visible_length_deltas=Counter()
          deleted_whitespace_contexts=Counter()
          unsafe_visible_differences=[]
          altered_notes_or_links=[]
          altered_nonstyle_structure=[]
          unreadable=[]
          for key in baseline:
              left,right=baseline[key],cleaned[key]
              if left==right:
                  continue
              raw_changes+=1
              if key[0]=="U":
                  altered_nonstyle_structure.append(key)
                  continue
              try:
                  before=authored_content_without_display_styles(left)
                  after=authored_content_without_display_styles(right)
                  if before[0]!=after[0]:
                      altered_visible.append(key)
                      old_text,new_text=before[0],after[0]
                      exact_visible_length_deltas[len(new_text)-len(old_text)]+=1
                      old_nonspace="".join(c for c in old_text if not c.isspace())
                      new_nonspace="".join(c for c in new_text if not c.isspace())
                      if old_nonspace==new_nonspace:
                          visible_whitespace_only.append(key)
                      else:
                          visible_nonwhitespace_changed.append(key)
                      # An extra importer-generated space is cosmetic ONLY
                      # if removing it cannot join two alphanumeric words.
                      position=0
                      while (position<len(new_text)
                             and old_text[position]==new_text[position]):
                          position+=1
                      if (len(old_text)!=len(new_text)+1
                              or old_text[:position]+old_text[position+1:]!=new_text
                              or not old_text[position].isspace()):
                          deleted_whitespace_contexts["unexplained_text_delta"]+=1
                          unsafe_visible_differences.append(key)
                      else:
                          left=old_text[position-1] if position else ""
                          right=old_text[position+1] if position+1<len(old_text) else ""
                          if left.isalnum() and right.isalnum():
                              deleted_whitespace_contexts["word_join_risk"]+=1
                              unsafe_visible_differences.append(key)
                          elif left.isspace() or right.isspace():
                              deleted_whitespace_contexts["excess_whitespace_run"]+=1
                          elif not left or not right:
                              deleted_whitespace_contexts["entry_boundary"]+=1
                          else:
                              deleted_whitespace_contexts["one_space_next_to_punctuation_or_symbol"]+=1
                              unsafe_visible_differences.append(key)
                  if before[1]!=after[1]:
                      altered_notes_or_links.append(key)
                  baseline_tags=[ev for ev in before[2] if ev[0]!="text"]
                  candidate_tags=[ev for ev in after[2] if ev[0]!="text"]
                  if baseline_tags!=candidate_tags:
                      altered_nonstyle_structure.append(key)
              except (ValueError,etree.XMLSyntaxError):
                  unreadable.append(key)
          print("Native entries differing in raw bytes:",raw_changes)
          print("Native entries with changed exact visible Unicode:",len(altered_visible))
          print("Of those, whitespace-only Unicode differences:",
                len(visible_whitespace_only))
          print("Of those, nonwhitespace Unicode differences:",
                len(visible_nonwhitespace_changed))
          print("Native visible-text length delta histogram (candidate minus original):",
                dict(sorted(exact_visible_length_deltas.items())))
          print("Single-space deletion context counts (no words emitted):",
                dict(sorted(deleted_whitespace_contexts.items())))
          print("Native entries with unsafe or unexplained text changes:",
                len(unsafe_visible_differences))
