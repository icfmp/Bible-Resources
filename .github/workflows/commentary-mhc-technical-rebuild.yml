                  new_target=attrs_b.pop("osisRef",None)
                  if attrs_a!=attrs_b or (old_target,new_target) not in approved:
                      raise SystemExit("Compiled link edit changed an unreviewed XML attribute")
                  differences[(old_target,new_target)]+=1
