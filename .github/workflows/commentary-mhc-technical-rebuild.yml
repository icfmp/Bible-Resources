      - name: Install real Xiphos GUI dependencies in disposable runner
        if: github.event_name == 'workflow_dispatch' || (github.event.action == 'edited' && contains(github.event.pull_request.body, '[run-mhc-final-gui]'))
        id: install_corrected_xiphos
        shell: bash
        continue-on-error: true
        timeout-minutes: 13
        run: |
          set -euo pipefail
          # The default EC2 Ubuntu mirror has previously timed out after
          # fetching only part of the WebKit/GTK dependency closure. Use the
          # canonical Ubuntu archive instead of silently increasing timeouts
          # against the same stalled regional mirror.
          # GitHub Ubuntu images may use an EC2 mirror via a traditional
          # sources.list, Deb822 sources OR an apt-mirrors indirection. An
          # edit to ubuntu.sources alone did not cover all images; the
          # preceding real GUI run timed out fetching WebKit from EC2.
          # Restrict replacement to the specific known slow Ubuntu mirror;
          # do not overwrite security/third-party package sources.
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources \
              /etc/apt/apt-mirrors.txt /etc/apt/mirrors.txt; do
            if sudo test -f "$sources" && sudo grep -q 'us-east-2.ec2.archive.ubuntu.com' "$sources"; then
              sudo sed -i \
                -e 's|http://us-east-2.ec2.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://us-east-2.ec2.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$sources"
            fi
          done
          # An apt mirror alias can additionally live under apt/mirrors/.
          if sudo test -d /etc/apt/mirrors; then
            for sources in /etc/apt/mirrors/*; do
              if sudo test -f "$sources" && sudo grep -q 'us-east-2.ec2.archive.ubuntu.com' "$sources"; then
                sudo sed -i \
                  's|us-east-2.ec2.archive.ubuntu.com|archive.ubuntu.com|g' "$sources"
              fi
            done
          fi
          # Record only resulting trusted Ubuntu archive hosts.
          sudo grep -hE '^(URIs:|deb |http)' \
            /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources \
            /etc/apt/apt-mirrors.txt /etc/apt/mirrors.txt 2>/dev/null \
            | sed -E 's|https?://([^/ ]+).*|\\1|' | sort -u || true
          export DEBIAN_FRONTEND=noninteractive
          timeout 120s sudo apt-get -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          timeout 660s sudo -E apt-get -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=15 install -y --no-install-recommends \
              xiphos xvfb xdotool xclip dbus-x11
          for binary in xiphos Xvfb xdotool xclip dbus-run-session; do
            command -v "$binary" >/dev/null || {
              echo "Missing real-Xiphos GUI dependency: $binary" >&2
              exit 1
            }
          done
