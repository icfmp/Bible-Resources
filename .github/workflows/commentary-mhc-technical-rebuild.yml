                              if left.get(name) is None or right.get(name) is None:
                                  change_forms["attr_added_or_removed"]+=1
                              else:
                                  change_forms["attr_value_changed"]+=1
                              if attr in {"sID","eID"}:
                                  old_id=left.get(name)
                                  new_id=right.get(name)
                                  milestone_pairs[(old_id,new_id)]+=1
                                  if len(sampled_generated_milestones)<8:
