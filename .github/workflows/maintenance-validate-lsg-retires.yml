name: One-shot full validation of LSG-owned tools and retired Darby 0.1.1 bootstrap
on:
  pull_request:
    paths:
      - '.github/workflows/maintenance-validate-lsg-retires.yml'
permissions:
  contents: write
jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/module-own-darby-011-replay-20261121
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact final working tree without temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintenance-validate-lsg-retires.yml
          python scripts/tool_registry.py --check
      - name: Install dependencies and real SWORD reader
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          timeout 90s sudo apt-get -o Acquire::Retries=0 update -qq
          timeout 90s sudo apt-get -o Acquire::Retries=0 install -y diatheke
      - name: Run entire unit suite
        run: python -m unittest discover -s tests -v
      - name: Validate, deterministically build, check real native SWORD and release coverage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate.py
          python scripts/build.py --output dist --base-url https://icfmp.github.io/Bible-Resources/
          python scripts/smoke.py
          python scripts/catalogue_release_coverage.py --built dist
      - name: Permanently remove one-shot validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize fully verified LSG and Darby tooling lifecycle cleanup'
          git push origin HEAD:maintenance/module-own-darby-011-replay-20261121
