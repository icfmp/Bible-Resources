name: Restore exact source-attested Darby 2024 cleaned OSIS edition
on:
  push:
    branches: [recovery/darby-2024-clean-osis]
    paths: [.github/workflows/recover-darby-osis-once.yml]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    if: github.repository == 'icfmp/Bible-Resources'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install pinned existing source validators
        run: python -m pip install -q -r requirements.txt
      - name: Rebuild original 0.1.1 publisher corrections without modifying source
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from repair_osis_note_links import propose as propose_links
          from repair_osis_inline_markup import propose as propose_inline
          from repair_osis_source_bytes import patch_exact_original
          from repair_osis_unlinked_reference_labels import render_absent_references_plain
          from repair_osis_division_markers import patch_divisions
          from repair_osis_paragraph_indentation import trim_publisher_paragraph_indentation
          from source_osis_inventory import source_inventory
          from publisher_osis_usfx_parity import original_osis_verses_and_notes
          def digest(d):return hashlib.sha256(d).hexdigest()
          original_path=Path("sources/original/bibles/fr/darby-jnd-2024/bible_jnd_2_0.xml")
          original=original_path.read_bytes()
          original_sha="2204629e3efb3024dceb392780ef5e61f4296ea832c90e3dd2a5c3224179c1d3"
          desired_final="35eb23c62eefdcda9a94d6a493df0bf32d5af1bc6ccc2132e495091d7771406d"
          if digest(original)!=original_sha:raise SystemExit("Original edition drift")
          plan_a=json.loads(Path("config/publisher-osis/frajnd-2024-note-link-research.json").read_text())
          plan_b=json.loads(Path("config/publisher-osis/frajnd-2024-inline-markup-research.json").read_text())
          link,link_receipt=propose_links(original,plan_a)
          if digest(link)!="23b6225cf4f827f6f84e321ed60fedb55ec42c3bc2b5cf58747942bd32f6ad8d" or link_receipt["change_count"]!=11:
              raise SystemExit("Historical note link-only source mismatch")
          inline,inline_receipt=propose_inline(link,plan_b)
          if digest(inline)!="89b67a1007547b113c0049a2df8912b66716a406d19237f036d5dad71f7771c8" or inline_receipt["edit_count"]!=2:
              raise SystemExit("Historical inline normalization mismatch")
          lexical,lexical_receipt=patch_exact_original(original,plan_a,plan_b)
          if not lexical_receipt["all_unedited_original_bytes_identical"]:
              raise SystemExit("Reconstruction altered source outside approved byte spans")
          unlinked,unlinked_receipt=render_absent_references_plain(original,lexical,plan_a)
          if unlinked_receipt["explicit_plain_label_count"]!=3:
              raise SystemExit("Invalid absent-verse reference treatment")
          divided,division_receipt=patch_divisions(unlinked,expected_sha256=digest(unlinked))
          if not division_receipt["all_leading_editorial_signs_transferred"]:
              raise SystemExit("Unresolved original division sign")
          output,indent_receipt=trim_publisher_paragraph_indentation(divided,expected_sha256=digest(divided))
          if digest(output)!=desired_final:
              raise SystemExit("Final OSIS does NOT match approved 0.1.1 candidate SHA")
          if not indent_receipt["all_source_note_values_and_positions_preserved"]:
              raise SystemExit("Notes or note anchors changed")
          orig_keys,orig_info=source_inventory(original)
          final_keys,final_info=source_inventory(output)
          if orig_keys!=final_keys or len(orig_keys)!=31166:
              raise SystemExit("Canonical Bible verse keys altered")
          source_v,source_n,_=original_osis_verses_and_notes(original)
          final_v,final_n,_=original_osis_verses_and_notes(output)
          if source_v.keys()!=final_v.keys() or sum(map(len,final_n.values()))!=6340:
              raise SystemExit("Full numbered verse or annotation coverage mismatch")
          release_provenance=json.loads(Path("modules/darby-jnd-2024/RELEASE_PROVENANCE.json").read_text())
          if release_provenance["corrected_candidate_osis_sha256"]!=digest(output):
              raise SystemExit("Published release metadata has different corrected source hash")
          dest=Path("sources/cleaned/bibles/fr/darby-jnd-2024")
          if dest.exists():raise SystemExit("Cannot overwrite existing canonical source")
          dest.mkdir(parents=True)
          (dest/"bible_jnd_2_0.osis.xml").write_bytes(output)
          stages=[
            ["original",original_sha],
            ["source_note_repair",digest(link)],
            ["inline_semantic_repair",digest(inline)],
            ["lexical_patches",digest(lexical)],
            ["omitted_verse_label_wrappers",digest(unlinked)],
            ["editorial_division_metadata",digest(divided)],
            ["paragraph_xml_indentation",digest(output)],
          ]
          manifest={"schema_version":1,"resource_id":"darby-jnd-2024",
            "status":"exact_approved_0_1_1_compiler_input_restored",
            "source_format":"OSIS","language":"fr","type":"bible",
            "original_path":str(original_path),"original_sha256":original_sha,
            "cleaned_source_sha256":digest(output),"cleaned_bytes":len(output),
            "published_source_proof":"modules/darby-jnd-2024/RELEASE_PROVENANCE.json",
            "source_owner_approval":"config/darby-0.1.1-release-authorization.json",
            "reviewed_stage_hashes":stages,"annotated_original_verse_keys":len(orig_keys),
            "original_translation_note_count":6340,
            "original_bible_text_prose_unchanged_outside_explicitly_reviewed_division_metadata":True,
            "reviewed_link_operations":11,"reviewed_inline_operations":2,
            "reviewed_omitted_verse_plain_labels":3,
            "original_source_untouched":True}
          (dest/"CLEANUP_MANIFEST.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("Exact 0.1.1 source recovered",len(output),digest(output), "keys",len(orig_keys))
          PY
      - name: Commit recovered exact source and remove one-time workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/recover-darby-osis-once.yml
          git add sources/cleaned/bibles/fr/darby-jnd-2024/
          git diff --cached --check -- ':!sources/cleaned/**/*.xml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore source-locked Darby 2024 0.1.1 editorial OSIS"
          git push origin HEAD:recovery/darby-2024-clean-osis
