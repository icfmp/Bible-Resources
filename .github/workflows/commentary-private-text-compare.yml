name: Compare exact original commentary text to stock SWORD privately
on:
  pull_request:
    paths:
      - '.github/workflows/commentary-private-text-compare.yml'
      - 'scripts/commentary_private_text_compare.py'
      - 'scripts/commentary_chapter_neighbors.py'
      - 'scripts/commentary_chapter_cross_slot.py'
      - 'scripts/commentary_chapter_paragraph_overlap.py'
      - 'scripts/commentary_chapter_p_boundaries.py'
      - 'scripts/commentary_chapter_ref_labels.py'
      - 'tests/test_commentary_chapter_ref_labels.py'
      - 'tests/test_commentary_chapter_p_boundaries.py'
      - 'tests/test_commentary_chapter_paragraph_overlap.py'
      - 'tests/test_commentary_chapter_cross_slot.py'
      - 'tests/test_commentary_chapter_neighbors.py'
      - 'tests/test_commentary_private_text_compare.py'
      - 'scripts/commentary_text_delta.py'
      - 'tests/test_commentary_text_delta.py'
      - 'scripts/commentary_unresolved_lexical_triage.py'
      - 'scripts/commentary_nonlink_words.py'
      - 'tests/test_commentary_nonlink_words.py'
      - 'scripts/commentary_reference_cross_slot.py'
      - 'tests/test_commentary_reference_cross_slot.py'
      - 'tests/test_commentary_unresolved_lexical_triage.py'
      - 'scripts/commentary_stock_prefix_topology.py'
      - 'tests/test_commentary_stock_prefix_topology.py'
      - 'tests/test_commentary_prefixed_suffix.py'
      - 'tests/test_commentary_stock_source_context.py'
      - 'scripts/commentary_native_raw_inventory.py'
      - 'scripts/sword_native_commentary_raw_corpus.cpp'
      - 'scripts/commentary_xml_witness.py'
      - 'config/commentary-intake/**'
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Independently pinned commentary source and SWORD originals"
        required: true
        type: string
        default: mhcc-crosswire

permissions:
  contents: read

concurrency:
  group: commentary-lexical-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private_source_to_stock_text:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      RESOURCE_ID: ${{ github.event.inputs.resource_id || 'mhcc-crosswire' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed XML and stable SWORD dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
          timeout 90s sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y libsword-dev
      - name: Compile independent stock key inspector and PRIVATE raw SWORD reader
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_index.cpp \
            -o "${RUNNER_TEMP}/commentary-native-index" -lsword
          g++ -std=c++17 -O2 -I/usr/include/sword \
            scripts/sword_native_commentary_raw_corpus.cpp \
            -o "${RUNNER_TEMP}/commentary-private-raw" -lsword
      - name: Compare every original verse/range body with stock entry without content output
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commentary_private_text_compare.py \
            --resource-id "$RESOURCE_ID" \
            --native-index-binary "${RUNNER_TEMP}/commentary-native-index" \
            --native-raw-binary "${RUNNER_TEMP}/commentary-private-raw" \
            --report "${RUNNER_TEMP}/commentary-source-stock-lexical.json"
      - name: Summarize reviewed text-free source/body audit counters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "commentary-source-stock-lexical.json").read_text())
          if report.get("status") != "full_source_verse_and_range_body_to_stock_raw_text_diagnostics_not_release_approval":
              raise SystemExit("Source-to-stock text receipt is incomplete")
          metrics = report.get("text_diagnostic", {})
          selected = (
              "stock_original_body_suffix_exact_unicode_and_difference_classes",
              "stock_original_body_suffix_total_changed_punctuation_gaps",
              "unexplained_original_to_stock_word_boundary_count",
              "unexplained_original_to_stock_common_suffix_fraction_buckets",
              "unexplained_original_to_stock_changed_segment_positions",
              "unexplained_source_changed_middle_word_token_count_buckets",
              "unexplained_stock_changed_middle_word_token_count_buckets",
              "source_neighbor_compared_to_stock_prefix_entry_count",
              "source_neighbor_exact_context_match_stock_entry_count",
              "source_neighbor_same_word_tokens_not_exact_context_match_stock_entry_count",
              "source_neighbor_candidate_type_counts",
              "stock_prefix_matched_authentic_source_neighbor_context_classes",
              "stock_metadata_top_level_tag_counts_crosschecked_against_existing_prefix_inventory",
          )
          safe = {}
          for key in selected:
              value = metrics[key]
              if isinstance(value, dict):
                  if not all(re.fullmatch(r"[a-z][a-z0-9_:]{0,127}", label)
                             and type(count) is int and count >= 0
                             for label, count in value.items()):
                      raise SystemExit("Unapproved diagnostic value in bounded public summary")
              elif type(value) is not int or value < 0:
                  raise SystemExit("Unapproved numeric diagnostic in bounded public summary")
              safe[key] = value
          print("Non-text original-to-stock suffix diagnostics: " + json.dumps(safe, sort_keys=True))
          chapter = report["source_chapter_neighbor_to_stock_intro_diagnostics"]
          proof = report["source_original_chapter_neighbor_evidence"]
          if (proof["explicit_chapter_source_marker_count"] !=
                  chapter["original_chapter_source_siblings_compared"]):
              raise SystemExit("Chapter-adjacent source audit was not complete")
          for obj in (
                  proof["original_chapter_adjacent_sibling_tag_counts"],
                  chapter["source_chapter_sibling_tags"],
                  chapter["source_chapter_sibling_to_occupied_native_intro_classes"]):
              if not all(re.fullmatch(r"[a-z][a-z0-9_]{0,127}", label)
                         and type(count) is int and count >= 0
                         for label, count in obj.items()):
                  raise SystemExit("Unreviewed chapter witness summary field")
          print("Source-adjacent chapter witness (NOT chapter parity): " +
                json.dumps({
                    "source_markers": proof["explicit_chapter_source_marker_count"],
                    "original_sibling_tags": chapter["source_chapter_sibling_tags"],
                    "stock_intro_alignment_classes":
                        chapter["source_chapter_sibling_to_occupied_native_intro_classes"],
                }, sort_keys=True))
          location = report["source_chapter_neighbor_to_same_chapter_numbered_location"]
          if location["original_chapter_source_markers_evaluated"] != proof["explicit_chapter_source_marker_count"]:
              raise SystemExit("Same-chapter native numbered scan omitted original source markers")
          outcome = location["source_sibling_location_in_original_stock_same_chapter_numbered_slots"]
          if (not all(re.fullmatch(r"[a-z][a-z0-9_]{0,127}", name)
                      and type(value) is int and value >= 0
                      for name, value in outcome.items())
                  or sum(outcome.values()) != proof["explicit_chapter_source_marker_count"]):
              raise SystemExit("Same-chapter witness categories did not reconcile")
          print("Source chapter siblings in SAME-chapter numbered stock entries (NOT authorial parity): " +
                json.dumps({
                    "markers": location["original_chapter_source_markers_evaluated"],
                    "stock_numbered_slots_scanned": location["same_chapter_numbered_stock_slots_scanned"],
                    "strict_xml_parse_failures": location["strict_xml_unparseable_stock_numbered_slots"],
                    "location_classes": outcome,
                }, sort_keys=True))
          alternative = report["source_chapter_neighbor_to_same_book_alternative_slots"]
          classifications = alternative["source_sibling_locations_in_alternative_same_book_slots"]
          original_gap = (outcome.get("original_sibling_not_found_in_same_chapter_numbered_slots", 0)
                          + outcome.get("no_strictly_parsed_same_chapter_numbered_slot", 0))
          allowed = {
              "previously_found_exact_in_same_chapter_numbered_slot",
              "previously_found_words_in_same_chapter_numbered_slot",
              "same_chapter_intro_exact_unicode_containment",
              "same_chapter_intro_contiguous_unicode_word_tokens_only",
              "other_chapter_numbered_exact_unicode_containment",
              "other_chapter_numbered_contiguous_unicode_word_tokens_only",
              "other_chapter_intro_exact_unicode_containment",
              "other_chapter_intro_contiguous_unicode_word_tokens_only",
              "book_intro_exact_unicode_containment",
              "book_intro_contiguous_unicode_word_tokens_only",
              "not_found_in_other_same_book_stock_slots",
          }
          if (alternative["original_source_chapter_siblings_evaluated"] !=
                  proof["explicit_chapter_source_marker_count"] or
                  alternative["previously_not_found_in_same_chapter_numbered_slots"] != original_gap or
                  not all(k in allowed and type(v) is int and v >= 0
                          for k, v in classifications.items()) or
                  sum(classifications.values()) != proof["explicit_chapter_source_marker_count"] or
                  len(alternative["bounded_originally_unlocated_line_hash_only_cases"]) >
                      alternative["per_marker_detail_cap"]):
              raise SystemExit("MHCC alternate stock location probe did not reconcile")
          print("Original chapter-neighbor alternative stock location counts (not text parity): " +
                json.dumps({"source_chapter_markers": proof["explicit_chapter_source_marker_count"],
                            "same_chapter_unlocated": original_gap,
                            "stock_slots_scanned_by_kind":
                                alternative["native_same_book_other_slot_reads_by_kind"],
                            "classification": classifications,
                            }, sort_keys=True))
          # Approved, bounded machine identifiers only. Never log original headings,
          # original osisRef strings, stock XML, editorial text, or snippets.
          cases = alternative["bounded_originally_unlocated_line_hash_only_cases"]
          if len(cases) != min(original_gap, alternative["per_marker_detail_cap"]):
              raise SystemExit("Source-line/hash-only case inventory was incomplete")
          safe_cases = []
          for case in cases:
              keys = {
                  "source_line", "original_reference_sha256", "original_neighbor_text_sha256",
                  "original_neighbor_tag", "original_unicode_characters",
                  "original_unicode_word_token_count", "alternative_stock_location_class",
                  "matching_native_key_sha256",
              }
              if set(case) != keys:
                  raise SystemExit("Unreviewed diagnostic field may disclose source")
              if (type(case["source_line"]) is not int or case["source_line"] < 1 or
                      type(case["original_unicode_characters"]) is not int or
                      case["original_unicode_characters"] <= 0 or
                      type(case["original_unicode_word_token_count"]) is not int or
                      case["original_unicode_word_token_count"] <= 0 or
                      case["original_neighbor_tag"] not in {"h2", "p"} or
                      case["alternative_stock_location_class"] not in allowed):
                  raise SystemExit("Invalid original source audit metadata")
              if not all(re.fullmatch(r"[0-9a-f]{64}", case[k])
                         for k in ("original_reference_sha256", "original_neighbor_text_sha256")):
                  raise SystemExit("Invalid original source audit hash")
              match_hash = case["matching_native_key_sha256"]
              if match_hash is not None and (
                      not isinstance(match_hash, str) or
                      not re.fullmatch(r"[0-9a-f]{64}", match_hash)):
                  raise SystemExit("Invalid stock key identifier hash")
              safe_cases.append(case)
          print("Original chapter-neighbor bounded line/hash-only remaining cases: " +
                json.dumps(safe_cases, sort_keys=True))
          cross = report["source_unpaired_reference_cross_native_slots"]
          lexical = metrics["unresolved_source_stock_lexical_selection_triage"]
          allowed_source = {
              "same_entry_reference_target_multiplicity_shortfall",
              "target_witnessed_in_other_numbered_key_same_chapter",
              "target_witnessed_in_same_chapter_intro_key",
              "target_witnessed_elsewhere_in_same_book",
              "target_not_witnessed_in_other_same_book_stock_reference_markup",
              "original_source_target_is_empty",
              "original_target_not_literal_Bible_work_qualified_unreviewed",
          }
          allowed_compiled = {
              "same_entry_original_target_multiplicity_shortfall",
              "target_witnessed_in_other_original_source_unit_same_chapter",
              "target_witnessed_in_other_original_source_chapter_same_book",
              "stock_target_not_in_any_original_verse_range_link_same_book",
          }
          allowed_target_statuses = {
              "raw_target_exact_match",
              "literal_Bible_work_prefix_only_match",
              "unpaired_original_target",
          }
          allowed_link_label_classes = {
              "empty_original_label_unreviewed",
              "literal_label_inside_stock_reference_element",
              "literal_label_in_stock_text_outside_confirmed_reference_element",
              "word_tokens_in_stock_reference_element_different_punctuation",
              "word_tokens_in_stock_text_different_punctuation_or_markup",
              "original_label_text_not_located_in_selected_stock_entry",
          }
          target_label_matrix = cross["original_target_match_status_x_selected_stock_label_location"]
          scope_label_matrix = cross["unpaired_original_target_scope_x_selected_stock_label_location"]
          source_classes = cross["source_unpaired_target_occurrence_location_classes"]
          stock_classes = cross["stock_unpaired_target_occurrence_source_classes"]
          missing_cases = cross["bounded_all_no_stock_reference_case_line_fullhash_topology"]
          high_cases = cross["bounded_highest_unpaired_source_target_line_fullhash_topology"]
          allowed_receipt_fields = {
              "original_source_line","original_full_reference_sha256",
              "original_body_sha256","compiled_stock_raw_sha256",
              "unpaired_original_reference_targets","unpaired_stock_reference_targets",
              "unpaired_original_target_scope_counts",
              "unpaired_compiled_target_source_scope_counts",
              "same_book_numbered_native_keys_with_identical_selected_raw",
              "same_book_intro_native_keys_with_identical_selected_raw",
              "native_payload_repetition_is_not_source_range_or_commentary_parity",
          }
          def checked_counts(values, names):
              return isinstance(values,dict) and all(
                  key in names and type(n) is int and n >= 0
                  for key,n in values.items()
              )
          if (not isinstance(target_label_matrix,dict) or
                  not isinstance(scope_label_matrix,dict) or
                  not all(status in allowed_target_statuses and
                          checked_counts(labels, allowed_link_label_classes)
                          for status,labels in target_label_matrix.items()) or
                  not all(scope in allowed_source and
                          checked_counts(labels, allowed_link_label_classes)
                          for scope,labels in scope_label_matrix.items())):
              raise SystemExit("Unreviewed per-link original scripture target/label class")
          target_label_counts = {
              status:sum(labels.values()) for status,labels in target_label_matrix.items()
          }
          scope_label_counts = {
              scope:sum(labels.values()) for scope,labels in scope_label_matrix.items()
          }
          independent_label_count = {}
          for labels in target_label_matrix.values():
              for label,n in labels.items():
                  independent_label_count[label] = independent_label_count.get(label,0)+n
          if (target_label_counts.get("raw_target_exact_match",0) !=
                  cross["source_and_stock_raw_exact_target_matches"] or
                  target_label_counts.get("literal_Bible_work_prefix_only_match",0) !=
                  cross["source_and_stock_literal_Bible_work_prefix_only_matches"] or
                  target_label_counts.get("unpaired_original_target",0) !=
                  sum(source_classes.values()) or
                  sum(target_label_counts.values()) != cross["original_scripRef_target_occurrences"] or
                  scope_label_counts != source_classes or
                  independent_label_count !=
                  lexical["original_scripRef_display_label_location_in_stock_text_classes"]):
              raise SystemExit("Individual original link target/label census diverged")
          if (cross["source_markers_with_lexically_unresolved_reference_issues"] !=
                    metrics["unexplained_original_to_stock_word_boundary_count"] or
                  cross["original_scripRef_target_occurrences"] !=
                    lexical["original_scripRef_total_across_unresolved_entries"] or
                  cross["stock_reference_target_occurrences"] !=
                    lexical["stock_reference_total_across_unresolved_entries"] or
                  cross["source_and_stock_raw_exact_target_matches"] !=
                    lexical["raw_exact_osisRef_target_multiset_match_count"] or
                  cross["source_and_stock_literal_Bible_work_prefix_only_matches"] !=
                    lexical["literal_Bible_work_qualifier_only_osisRef_target_multiset_match_count"] or
                  not checked_counts(source_classes, allowed_source) or
                  not checked_counts(stock_classes, allowed_compiled) or
                  sum(source_classes.values()) !=
                    cross["original_scripRef_target_occurrences"] -
                    cross["source_and_stock_raw_exact_target_matches"] -
                    cross["source_and_stock_literal_Bible_work_prefix_only_matches"] or
                  sum(stock_classes.values()) !=
                    cross["stock_reference_target_occurrences"] -
                    cross["source_and_stock_raw_exact_target_matches"] -
                    cross["source_and_stock_literal_Bible_work_prefix_only_matches"] or
                  sum(cross["original_source_markers_with_or_without_stock_reference_markup"].values()) !=
                    cross["source_markers_with_lexically_unresolved_reference_issues"] or
                  len(missing_cases) != lexical["stock_reference_presence"].get("stock_no_reference",0) or
                  len(missing_cases) > 20 or len(high_cases) > 20 or
                  cross["reviewed_metadata_line_hash_only_case_cap"] != 20):
              raise SystemExit("Original cross-slot scripture-reference evidence did not reconcile")
          for case in missing_cases + high_cases:
              if (set(case) != allowed_receipt_fields or
                      type(case["original_source_line"]) is not int or
                      case["original_source_line"] < 1 or
                      not all(isinstance(case[name],str) and re.fullmatch(r"[a-f0-9]{64}",case[name])
                              for name in ("original_full_reference_sha256","original_body_sha256",
                                           "compiled_stock_raw_sha256")) or
                      not all(type(case[name]) is int and case[name] >= 0
                              for name in ("unpaired_original_reference_targets",
                                           "unpaired_stock_reference_targets",
                                           "same_book_numbered_native_keys_with_identical_selected_raw",
                                           "same_book_intro_native_keys_with_identical_selected_raw")) or
                      case["native_payload_repetition_is_not_source_range_or_commentary_parity"] is not True or
                      not checked_counts(case["unpaired_original_target_scope_counts"],allowed_source) or
                      not checked_counts(case["unpaired_compiled_target_source_scope_counts"],allowed_compiled) or
                      sum(case["unpaired_original_target_scope_counts"].values()) !=
                          case["unpaired_original_reference_targets"] or
                      sum(case["unpaired_compiled_target_source_scope_counts"].values()) !=
                          case["unpaired_stock_reference_targets"]):
                  raise SystemExit("Original reference cross-slot report has unsafe or incomplete case")
          print("Original chapter/book alternative reference location counts (NOT source parity): " +
                json.dumps({
                    "original_unpaired":source_classes,
                    "stock_unpaired":stock_classes,
                    "source_target_match_x_label_location":target_label_matrix,
                    "unpaired_source_target_scope_x_label_location":scope_label_matrix,
                    "unresolved_original_markers":
                        cross["source_markers_with_lexically_unresolved_reference_issues"],
                    "stock_native_keys_scanned":
                        cross["complete_native_K_and_I_keys_inspected_for_target_witnesses"],
                    "stock_reference_bearing_native_keys":
                        cross["native_keys_with_at_least_one_reference_element"],
                    "reference_xml_errors":cross["reference_markup_strict_xml_parse_failures"],
                    "no_reference_original_markers":len(missing_cases),
                    "highest_unpaired_linehash_cases":len(high_cases),
                },sort_keys=True))
          print("Bounded original no-stock-reference payload propagation line/hash cases: " +
                json.dumps(missing_cases,sort_keys=True))
          unresolved = metrics["unexplained_original_to_stock_word_boundary_count"]
          allowed_plain_relations = {
              "no_plain_words_outside_citations_either_side",
              "stock_plain_words_only_after_removing_source_scripture_labels",
              "source_plain_words_only_after_removing_stock_scripture_labels",
              "same_ordered_case_sensitive_unicode_plain_words",
              "same_ordered_plain_words_only_casefold_differs",
              "same_ordered_plain_words_only_nfkc_differs",
              "original_plain_words_contiguous_inside_longer_stock_plain_text",
              "stock_plain_words_contiguous_inside_longer_original_plain_text",
              "original_plain_words_in_order_with_extra_unmarked_stock_words",
              "stock_plain_words_in_order_with_extra_original_words",
              "same_plain_word_multiset_but_different_order",
              "plain_word_order_or_selection_requires_editorial_review",
          }
          plain_counts = lexical["original_prose_outside_link_word_relation_counts"]
          plain_x_shape = lexical["original_prose_outside_link_relations_by_original_lexical_difference"]
          plain_cases = lexical["bounded_plain_word_nontrivial_differences_line_and_hash_cases"]
          plain_by_stock_ref = lexical["original_prose_outside_link_relations_by_compiled_reference_markup"]
          if (not isinstance(plain_by_stock_ref,dict) or
                  not all(scope in {"stock_has_reference","stock_no_reference"} and
                          isinstance(relations,dict) and
                          all(key in allowed_plain_relations and type(number) is int and number >= 0
                              for key,number in relations.items())
                          for scope,relations in plain_by_stock_ref.items()) or
                  sum(sum(rel.values()) for rel in plain_by_stock_ref.values()) != unresolved or
                  any(sum(relations.values()) != lexical["stock_reference_presence"].get(scope,0)
                      for scope,relations in plain_by_stock_ref.items())):
              raise SystemExit("Source outside-link/stock-reference cross-tab diverged")
          allowed_plain_case_fields = {
              "original_source_line","original_full_reference_sha256",
              "original_body_sha256","stock_raw_sha256",
              "original_plain_word_tokens","stock_plain_word_tokens",
              "shared_plain_word_multiset_occurrences","outside_link_word_relation",
          }
          if (not isinstance(plain_counts,dict) or
                  not all(k in allowed_plain_relations and type(v) is int and v >= 0
                          for k,v in plain_counts.items()) or
                  sum(plain_counts.values()) != unresolved or
                  not isinstance(plain_x_shape,dict) or
                  not all(shape in lexical["differing_middle_shape_classes"] and
                          isinstance(relations,dict) and
                          all(k in allowed_plain_relations and type(n) is int and n >= 0
                              for k,n in relations.items()) and
                          sum(relations.values()) ==
                            lexical["differing_middle_shape_classes"][shape]
                          for shape,relations in plain_x_shape.items()) or
                  sum(sum(v.values()) for v in plain_x_shape.values()) != unresolved or
                  sum(lexical["original_plain_word_token_count_bins"].values()) != unresolved or
                  sum(lexical["stock_plain_word_token_count_bins"].values()) != unresolved or
                  len(plain_cases) > 20):
              raise SystemExit("Original nonlink commentary prose word census incomplete")
          for case in plain_cases:
              if (set(case) != allowed_plain_case_fields or
                      case["outside_link_word_relation"] not in allowed_plain_relations or
                      not all(type(case[k]) is int and case[k] >= 0
                              for k in ("original_source_line","original_plain_word_tokens",
                                        "stock_plain_word_tokens",
                                        "shared_plain_word_multiset_occurrences")) or
                      case["original_source_line"] < 1 or
                      case["shared_plain_word_multiset_occurrences"] >
                          min(case["original_plain_word_tokens"],case["stock_plain_word_tokens"]) or
                      not all(isinstance(case[k],str) and re.fullmatch(r"[a-f0-9]{64}",case[k])
                              for k in ("original_full_reference_sha256","original_body_sha256",
                                        "stock_raw_sha256"))):
                  raise SystemExit("Unreviewed source nonlink words leaked into report")
          print("Original 156-case words OUTSIDE source/stock scripture link labels (not exegesis parity): " +
                json.dumps({"relations":plain_counts,
                            "by_original_lexical_shape":plain_x_shape,
                            "by_stock_reference_markup":plain_by_stock_ref,
                            "nontrivial_linehash_cases":len(plain_cases)},sort_keys=True))
          print("Original outside-link prose discrepancies, source line/full hash only: " +
                json.dumps(plain_cases,sort_keys=True))
          if (lexical["source_vs_stock_unresolved_word_selection_cases"] != unresolved or
                  sum(lexical["differing_middle_shape_classes"].values()) != unresolved or
                  sum(lexical["one_word_case_character_classes"].values()) != unresolved or
                  sum(lexical["middle_exact_alignment_classes"].values()) != unresolved or
