name: MHC first-verse witness and canonical migration boundary audit
on:
  pull_request:
    paths:
      - '.github/workflows/mhc-complete-maintenance-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install comparison prerequisites
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          git fetch --no-tags --depth=1 origin 066c92af91b50b9df5c54fe0b66e3ea816eba0de
          test "$(git rev-parse FETCH_HEAD)" = 066c92af91b50b9df5c54fe0b66e3ea816eba0de
          git worktree add --detach "$RUNNER_TEMP/historical" FETCH_HEAD
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 update -qq
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y libsword-dev libsword-utils diatheke
          g++ -std=c++17 -O2 -I/usr/include/sword scripts/sword_native_commentary_raw_corpus.cpp -o "$RUNNER_TEMP/raw" -lsword
      - name: Compare all CCEL anchor words against neighboring source and published native bodies
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,subprocess,sys,urllib.request
          from collections import Counter
          from difflib import SequenceMatcher
          from pathlib import Path
          from lxml import etree
          from sword_native_raw_corpus_inventory import parse_native_raw_corpus
          tmp=Path(os.environ["RUNNER_TEMP"]);out=tmp/"mhc-anchor-final";out.mkdir()
          sys.path.insert(0,str(tmp/"historical/scripts"))
          from audit_osis import source_commentary_introductions,source_commentary_overlap_witness
          src=Path("sources/cleaned/commentaries/en/mhc-crosswire/mhc.osis.xml")
          original=Path("sources/original/commentaries/en/mhc-crosswire/mhc.osis.xml")
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert sha(src.read_bytes())=="c64891f4fb2c3bd3a7e5e6cca992d80675849e7b3615f80ee95121461ef385f4"
          assert sha(original.read_bytes())=="3cf367f00c498a3124b339c00896aaef4ef1196a2d5c310ecb20ea42abd130f6"
          keys=["Josh.18.1","1Sam.25.1","2Sam.22.1"]
          chapters={k.rsplit(".",1)[0] for k in keys}
          orig_groups=[];source_commentary_overlap_witness(original,groups_out=orig_groups)
          groups=[];source_commentary_overlap_witness(src,groups_out=groups)
          intro=source_commentary_introductions(src)
          manifest=json.loads(Path("config/commentary-intake/mhc-crosswire.json").read_text())["commentary_source"]["xml_witness_volumes"][1]
          with urllib.request.urlopen(urllib.request.Request(manifest["url"],headers={"User-Agent":"Bible Resources source audit"}),timeout=35) as response:
              raw=response.read(12_000_001)
          assert sha(raw)==manifest["sha256"]
          parser=lambda:etree.XMLParser(resolve_entities=False,load_dtd=False,no_network=True,huge_tree=True)
          ccel=etree.fromstring(raw,parser());doc=etree.parse(str(src),parser())
          ns="{http://www.bibletechnologies.net/2003/OSIS/namespace}"
          source_markers={n.get("sID"):n for n in doc.iter(ns+"verse") if n.get("sID")}
          def words(text):return re.findall(r"\w+",text.casefold())
          def folded(text):return " ".join(text.split())
          def visible(raw):return "".join(etree.fromstring(b"<fragment>"+raw+b"</fragment>",parser()).itertext())
          bodies={};native_keys=set()
          p=subprocess.Popen([str(tmp/"raw"),"MHC"],env=dict(os.environ,SWORD_PATH=str(Path("modules/mhc-crosswire/payload").resolve())),stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
          def receive(k,r,b):
              native_keys.add((k,r))
              if (k=="K" and r.rsplit(".",1)[0] in chapters) or (k=="I" and r in chapters):bodies[k,r]=b
          try:
              receipt,*_=parse_native_raw_corpus(p.stdout,on_entry=receive)
              assert p.wait(timeout=60)==0
          finally:
              p.stdout.close()
              if p.poll() is None:p.kill();p.wait()
          assert receipt["all_native_raw_entries_ordered_sha256"]=="ea20737b3612cb183921c48beca96a728317dcbb5b4e5ff142308b6d974169b4"
          result=[]
          for key in keys:
              chapter=key.rsplit(".",1)[0]
              marker=[n for n in ccel.iter() if isinstance(n.tag,str) and etree.QName(n).localname=="scripCom" and n.get("osisRef")=="Bible:"+key]
              assert len(marker)==1
              node=marker[0];body=node.getnext();assert etree.QName(body).localname=="div"
              witness="".join(body.itertext());w=words(witness)
              gs=[g for g in groups if g["keys"][0].rsplit(".",1)[0]==chapter]
              assert gs and ("K",key) not in native_keys
              first=gs[0];assert first["keys"][0].endswith(".2")
              joined=" ".join([intro[chapter]["text"]]+[g["text"] for g in gs])
              book=next(n for n in doc.iter(ns+"div") if n.get("type")=="book" and n.get("osisID")==chapter.split(".")[0])
              bookwords=" "+" ".join(words("".join(book.itertext())))+" "
              def coverage(v):
                  v=words(v)
                  sm=SequenceMatcher(None,w,v,autojunk=False)
                  matches=[m for m in sm.get_matching_blocks() if m.size]
                  covered=sum(m.size for m in matches)
                  missing=[{"start_word":op[1]+1,"count":op[2]-op[1]} for op in sm.get_opcodes() if op[0] in ("delete","replace") and op[2]>op[1]]
                  windows=[w[i:i+12] for i in range(max(0,len(w)-11))]
                  full=" "+" ".join(v)+" "
                  hits=sum(" "+" ".join(x)+" " in full for x in windows)
                  return {"source_tokens":len(w),"target_tokens":len(v),"ordered_words_matched":covered,"longest_exact_word_run":max((m.size for m in matches),default=0),"missing_or_replaced_word_runs":missing[:25],"sliding_12word_windows_matched":hits,"sliding_12word_windows_total":len(windows),"book_12word_windows_matched":sum(" "+" ".join(x)+" " in bookwords for x in windows)}
              next_body=visible(bodies["K",first["keys"][0]])
              orig=next(g for g in orig_groups if g["sID"]==first["sID"])
              marker=source_markers[first["sID"]]
              # Only original scope metadata and content-comparison counts.
              # The labels are source-authored passage labels, not guessed keys.
              result.append({"key":key,"master":first["keys"][0],"original_scope_label":marker.get("n"),"original_scope_ids":list(first["keys"]),"ccel_marker_line":node.sourceline,"ccel_witness_sha256":sha(witness.encode()),"ccel_vs_first_source":coverage(first["text"]),"ccel_vs_entire_chapter":coverage(joined),"ccel_vs_first_native":coverage(next_body),"source_first_text_unchanged_from_original":orig["text"]==first["text"],"native_contains_complete_first_source":"".join(first["text"].split()) in "".join(next_body.split()),"native_intro_matches_source":folded(intro[chapter]["text"]) in folded(visible(bodies["I",chapter])),"source_first_verse_occupied":False})
          (out/"anchor-alignment.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print("MHC_ANCHOR_ALIGNMENT",json.dumps(result,sort_keys=True),flush=True)
          # Classify boundary crossings: converting annotations to containers
          # would change real paragraphs/poetry when they contain text on both sides.
          start={n.get("sID"):n for n in doc.iter(ns+"verse") if n.get("sID")}
          end={n.get("eID"):n for n in doc.iter(ns+"verse") if n.get("eID")}
          assert set(start)==set(end) and len(start)==4255
          def before(n):
              p=n.getparent()
              return (p.text or "")+"".join("".join(x.itertext())+(x.tail or "") for x in list(p)[:p.index(n)])
          def after(n):
              p=n.getparent()
              return (n.tail or "")+"".join("".join(x.itertext())+(x.tail or "") for x in list(p)[p.index(n)+1:])
          counts=Counter();examples={}
          for sid,a in start.items():
              b=end[sid]
              p,q=a.getparent(),b.getparent()
              signature=(etree.QName(p).localname,etree.QName(q).localname,bool(before(a).strip()),bool(after(b).strip()))
              counts[signature]+=1;examples.setdefault(signature,sid)
          census=[{"start_parent":k[0],"end_parent":k[1],"text_before_start_within_parent":k[2],"text_after_end_within_parent":k[3],"count":n,"example":examples[k]} for k,n in counts.items()]
          (out/"paragraph-boundaries.json").write_text(json.dumps(census,indent=2,sort_keys=True)+"\n")
          print("MHC_BOUNDARY_CENSUS",json.dumps(census,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mhc-first-verse-final-audit
          path: ${{ runner.temp }}/mhc-anchor-final/
          if-no-files-found: warn
          retention-days: 90
