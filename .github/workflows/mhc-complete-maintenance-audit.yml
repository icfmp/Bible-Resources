name: Integrate verified MHC 1.0.0 on review branch
on:
  pull_request:
    paths:
      - '.github/workflows/mhc-complete-maintenance-audit.yml'
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/mhc-complete-maintenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate exact tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14944829878/zip" > "$RUNNER_TEMP/candidate.zip"
          echo "db179a533e43f0ba90682ad1786fb4c674cbd5a9db8d2a98b2d34acc89b7efe2  $RUNNER_TEMP/candidate.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/verified"
          python -m pip install -r requirements.txt
      - name: Bind archived prior proof, exact source, payload, native and reader evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          from reviewed_compiled_commentary_rebuild import checked_commentary_payload_files
          from reviewed_osis_commentary_rebuild import reviewed_osis_commentary_errors
          from validate import parse_conf
          tmp=Path(os.environ["RUNNER_TEMP"]);v=tmp/"verified"
          m=Path("modules/mhc-crosswire");ed=Path("sources/cleaned/commentaries/en/mhc-crosswire");e=ed/"editorial/evidence"
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          load=lambda p:json.loads(p.read_text())
          def save(p,obj):
              p.write_text(json.dumps(obj,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          previous=e/"release-0.1.0";previous.mkdir()
          release=e/"release-1.0.0";release.mkdir()
          review=Path("config/commentary-rebuilds/mhc-crosswire.json")
          plan=Path("config/release-plans/mhc-0.1.0.json")
          for src,dest in [(review,"review-manifest.json"),(plan,"release-plan.json"),(ed/"CLEANUP_MANIFEST.json","CLEANUP_MANIFEST.json"),(m/"SOURCE_VALIDATION.json","SOURCE_VALIDATION.json"),(m/"RELEASE_ARTIFACT_PROOF.json","RELEASE_ARTIFACT_PROOF.json"),(m/"metadata.json","metadata.json"),(m/"EDITORIAL.md","EDITORIAL.md")]:
              shutil.copyfile(src,previous/dest)
          old=load(review);prev_cleanup=load(ed/"CLEANUP_MANIFEST.json")
          audit=load(e/"2026-11-24-maintenance-audit.json")
          boundary=load(e/"2026-11-24-boundary-and-link-audit.json")["results"]["MHC_EXACT_TRIM"]
          alias=load(e/"2026-11-24-first-verse-repair.json")["results"]["MHC_ALIAS_TRIAL"]
          reader=load(e/"2026-11-24-reader-receipt.json")
          brnp=load(e/"2026-11-24-brnp-v03-regression.json")["results"]["mhc-candidate"]
          w=audit["whitespace_source_trial"]
          assert sha(ed/"mhc.osis.xml")==prev_cleanup["approved_cleaned_sha256"]==w["source_sha256"]
          assert sha(v/"mhc.osis.xml")==alias["candidate_source_sha256"]==reader["source_sha256"]==brnp["source_sha256"]
          assert w["candidate_sha256"]==alias["source_sha256"]
          assert boundary["candidate_native_sha256"]==alias["baseline_native_sha256"]
          assert reader["native_corpus_sha256"]==alias["candidate_native_sha256"]
          assert boundary["previous_native_sha256"]==audit["published_audit"]["native_corpus_sha256"]
          assert boundary["all_other_native_markup_and_text_exact"] and boundary["opaque_top_equal"] and boundary["link_topology_equal"] and boundary["key_sets_equal"]
          assert alias["changed_old_native_key_count"]==0 and alias["missing_keys"]==[] and alias["all_prior_native_link_edges_unchanged"]
          assert alias["exact_text_and_other_attributes_equal"] and alias["reversible"] and w["reversible"]
          assert all(x["native_linked"] and x["identical_to_previous_master"] and x["identical_to_candidate_master"] for x in alias["alias_checks"])
          assert reader["xiphos"]["independent_gui_commentary_excerpt_match_count"]==len(reader["diatheke_samples"])==9
          assert brnp["after"]=={} and brnp["official_schema"]=="validated"
          source=v/"mhc.osis.xml";shutil.copyfile(source,ed/"mhc.osis.xml")
          conf=m/"payload/mods.d/mhc.conf";previous_conf=conf.read_text()
          assert sha(conf)==load(previous/"RELEASE_ARTIFACT_PROOF.json")["member_sha256"]["mods.d/mhc.conf"]
          payload=checked_commentary_payload_files(v/"payload","MHC","CHAPTER","zCom4")
          assert payload["mods.d/mhc.conf"].read_bytes()==conf.read_bytes()
          for k,p in payload.items():
              if k.startswith("modules/"):shutil.copyfile(p,m/"payload"/k)
          conf.write_text(previous_conf.replace("Version=0.1.0\n","Version=1.0.0\n").replace("Description=Matthew Henry's Complete Commentary on the Whole Bible — Bible Resources\n","Description=Matthew Henry's Complete Commentary\n"))
          meta=load(m/"metadata.json");meta["version"]="1.0.0";meta["title"]["en"]="Matthew Henry's Complete Commentary"
          meta["quality"]["reviewed_by"]+="; 2026-11-24 maintenance audit: 10 reference whitespace repairs, 3 independently source-attested index aliases, BRNP v0.3 zero findings, 9 real reader passages; owner selected MHC 1.0"
          save(m/"metadata.json",meta)
          members={k:sha(p) for k,p in checked_commentary_payload_files(m/"payload","MHC","CHAPTER","zCom4").items()}
          ev={"schema_version":1,"previous_source_sha256":w["source_sha256"],"candidate_source_sha256":alias["candidate_source_sha256"],"previous_native_sha256":boundary["previous_native_sha256"],"candidate_native_sha256":alias["candidate_native_sha256"],"source_reversible":True,"all_prior_native_keys_accounted_for":True,"all_other_native_markup_and_text_exact":True,"all_prior_native_link_edges_unchanged":True,"opaque_top_equal":True,"official_schema_validated":True,"reader_checks_passed":True,"brnp_findings":0,"missing_keys":[],"extra_keys":alias["extra_keys"],"aliases":[[a["alias"],a["master"]] for a in alias["alias_checks"]],"source_attribute_stages":[{"attribute":"osisRef","input_sha256":w["source_sha256"],"output_sha256":w["candidate_sha256"],"edits":w["edits"]},{"attribute":"osisID","input_sha256":alias["source_sha256"],"output_sha256":alias["candidate_source_sha256"],"edits":alias["edits"]}],"payload_sha256":members,"previous_conf":previous_conf,"reader_run":reader["run_url"],"brnp_run":"https://github.com/icfmp/Bible-Resources/actions/runs/45451189667","native_run":"https://github.com/icfmp/Bible-Resources/actions/runs/45447586839"}
          save(release/"incremental-native-reader.json",ev)
          rev={"previous_version":"0.1.0","previous_review_sha256":sha(previous/"review-manifest.json"),"previous_cleanup_sha256":sha(previous/"CLEANUP_MANIFEST.json"),"source_name":"mhc.osis.xml","previous_source_sha256":ev["previous_source_sha256"],"candidate_source_sha256":ev["candidate_source_sha256"],"previous_native_sha256":ev["previous_native_sha256"],"candidate_native_sha256":ev["candidate_native_sha256"],"evidence_sha256":sha(release/"incremental-native-reader.json")}
          auth={"approved_by":"Bible Resources project owner","scope":"Proceed with verified MHC 1.0.0, exact source-preserving reference cleanup and three verified navigation aliases; name Matthew Henry's Complete Commentary, short name MHC.","evidence_url":"https://github.com/icfmp/Bible-Resources/issues/290","rights_basis":old["authorization"]["rights_basis"]}
          updated=dict(old,schema_version=2,version="1.0.0",numbered_native_entries=31101,candidate_artifact_sha256=sha(tmp/"candidate.zip"),candidate_artifact_bytes=(tmp/"candidate.zip").stat().st_size,candidate_artifact_source_run=45447586839,candidate_artifact_id=14944829878,native_evidence_url=ev["native_run"],authorization=auth,revision=rev)
          save(review,updated)
          proof=load(previous/"SOURCE_VALIDATION.json")
          proof.update(schema_version=2,curated_version="1.0.0",release_artifact_sha256=updated["candidate_artifact_sha256"],numbered_native_entries=31101,source_attestation_run=ev["native_run"],revision=rev,candidate_native_corpus_sha256=ev["candidate_native_sha256"],candidate_source_sha256=ev["candidate_source_sha256"])
          save(m/"SOURCE_VALIDATION.json",proof)
          artifact={"schema_version":2,"revision":rev,"source_workflow_run":45447586839,"artifact_id":14944829878,"review_zip_sha256":updated["candidate_artifact_sha256"],"review_zip_bytes":updated["candidate_artifact_bytes"],"original_authoring_osis_sha256":old["original_authoring_osis_sha256"],"source_binary_payload_byte_identical":False,"full_native_corpus_readback_equal":True,"six_compiled_data_members_byte_identical_to_review_artifact":True,"member_sha256":members}
          save(m/"RELEASE_ARTIFACT_PROOF.json",artifact)
          prev_cleanup.update(approved_cleaned_sha256=ev["candidate_source_sha256"],previous_approved_cleaned_sha256=ev["previous_source_sha256"],status="reviewed_attribute_only_revision",published_release="https://github.com/icfmp/Bible-Resources/releases/tag/mhc-1.0.0",source_attestation_run=ev["native_run"])
          prev_cleanup["reviewed_patches"].update(reference_whitespace=10,first_verse_navigation_aliases=3)
          prev_cleanup["transformation_steps"].extend([{"stage":"reference_whitespace","sha256":w["candidate_sha256"]},{"stage":"first_verse_navigation_aliases","sha256":ev["candidate_source_sha256"]}])
          save(ed/"CLEANUP_MANIFEST.json",prev_cleanup)
          notes=ed/"editorial/releases/MHC-1.0.0.md"
          draft=ed/"editorial/releases/MHC-1.0.0-candidate.md"
          notes.write_text("# Matthew Henry's Complete Commentary — MHC 1.0.0\n\nSource-preserving maintenance release based on CrossWire MHC 2.2. No authorial prose changed. Ten reference attribute whitespace corrections; three verified first-verse navigation aliases (Joshua 18:1, 1 Samuel 25:1, 2 Samuel 22:1). 4,255 numbered commentary sections, 31,101 numbered addresses, 1,255 introductions, two opaque TOP records. Exact OSIS schema and BRNP v0.3 draft: zero findings. Nine real Xiphos and diatheke samples passed. Prior release remains immutable. CrossWire, CCEL and Logos attribution preserved; Public Domain. Existing MHC ID intentionally retained; upstream MHC 2.2 uses the same ID, so explicit provider replacement may be required.\n\nSee the [native audit]("+ev["native_run"]+"), [reader audit]("+ev["reader_run"]+") and [BRNP regression]("+ev["brnp_run"]+"). No universal Android GUI or clicked-reference guarantee.\n")
          draft.unlink()
          (m/"EDITORIAL.md").write_text(notes.read_text()+"\nHistorical 0.1.0 editorial and source proof are archived in the cleaned source evidence directory. The 1.0.0 exact revision receipt reverses to the approved 0.1.0 source. No CCEL prose substitution.\n")
          plan.unlink()
          native_id,parsed=parse_conf(conf)
          assert native_id=="MHC"
          errors=reviewed_osis_commentary_errors(m,Path("."),meta,parsed)
          assert errors==[],errors
          print("MHC_INTEGRATED_SOURCE",ev["candidate_source_sha256"],"NATIVE",ev["candidate_native_sha256"])
          PY
      - name: Rebuild exact catalogue, package and current release plan
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          from build import build
          tmp=Path(os.environ["RUNNER_TEMP"]);dist=tmp/"dist"
          snap=Path("catalog/v1/catalog.json");snap.unlink()
          build(output=dist)
          shutil.copyfile(dist/"catalog/v1/catalog.json",snap)
          p=dist/"sword/packages/MHC.zip"
          plan={"schema_version":1,"tag":"mhc-1.0.0","module_id":"mhc-crosswire","sword_id":"MHC","version":"1.0.0","title":"Matthew Henry's Complete Commentary — MHC 1.0.0","zip_name":"MHC-1.0.0.zip","package_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"package_size_bytes":p.stat().st_size,"notes_path":"sources/cleaned/commentaries/en/mhc-crosswire/editorial/releases/MHC-1.0.0.md","evidence_path":"modules/mhc-crosswire/SOURCE_VALIDATION.json","editorial_path":"modules/mhc-crosswire/EDITORIAL.md","authorization":{"reviewed_by":"Bible Resources project owner","decision":"Owner selected MHC 1.0.0 and requested continuation of verified maintenance and release; exact source/native/reader tests required.","evidence_url":"https://github.com/icfmp/Bible-Resources/issues/290","source_rights":"CrossWire 2.2 Public Domain — Copy Freely, prior owner acceptance 2026-11-19. No relicensing or CCEL substitution."}}
          Path("config/release-plans/mhc-1.0.0.json").write_text(json.dumps(plan,indent=2,sort_keys=True)+"\n")
          print("MHC_RELEASE_PLAN",json.dumps(plan,sort_keys=True),flush=True)
          PY
          python scripts/tool_registry.py --write
          python scripts/release_preflight.py --module-id mhc-crosswire --report "$RUNNER_TEMP/preflight.json"
          python -m unittest discover -s tests -p test_recovered_cleaned_source_integrity.py -v
          python -m unittest discover -s tests -p test_brnp.py -v
          cat "$RUNNER_TEMP/preflight.json"
      - name: Commit validated integration only to existing review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- sources/cleaned/commentaries/en/mhc-crosswire modules/mhc-crosswire config/release-plans config/commentary-rebuilds/mhc-crosswire.json catalog/v1/catalog.json
          git add -u -- reports/tooling/TOOL_REGISTRY.json reports/tooling/TOOL_REGISTRY.md
          git commit -m "Integrate source-attested Matthew Henry Complete Commentary 1.0.0 and immutable release plan"
          git push origin HEAD:refs/heads/audit/mhc-complete-maintenance
          git rev-parse HEAD
