name: BRNP v0.3 paired commentary regression and corrected candidate
on:
  pull_request:
    paths:
      - '.github/workflows/mhc-complete-maintenance-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source, official schema and synthetic regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14944829878/zip" > "$RUNNER_TEMP/verified.zip"
          echo "db179a533e43f0ba90682ad1786fb4c674cbd5a9db8d2a98b2d34acc89b7efe2  $RUNNER_TEMP/verified.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/verified.zip" -d "$RUNNER_TEMP/verified"
          echo "069d18e5be5839e3082fbdd33280802c5287b0d5be2703cb0494f4c29f1f4749  $RUNNER_TEMP/verified/mhc.osis.xml" | sha256sum -c
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_brnp.py -v
          python scripts/fetch_reviewed_schema.py --directory "$RUNNER_TEMP/schema"
      - name: Compare v0.2 and v0.3 on all real masters and exact corrected candidate
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 643a3e1ba5735a8e9fff1de2bd186e06beb925c8
          test "$(git rev-parse FETCH_HEAD)" = 643a3e1ba5735a8e9fff1de2bd186e06beb925c8
          git show FETCH_HEAD:scripts/check_brnp.py > "$RUNNER_TEMP/check_brnp_v02.py"
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          import check_brnp
          tmp=Path(os.environ["RUNNER_TEMP"]);schema=tmp/"schema/osisCore.2.1.1-cw-latest.xsd"
          spec=importlib.util.spec_from_file_location("check_brnp_v02",tmp/"check_brnp_v02.py")
          old=importlib.util.module_from_spec(spec);spec.loader.exec_module(old)
          # The old checker normally resolves its policy relative to its own script.
          old.POLICY=check_brnp.POLICY
          entries=[
              ("lsg","bible",Path("sources/cleaned/bibles/fr/lsg-1910/lsg-1910.osis.xml")),
              ("darby","bible",Path("sources/cleaned/bibles/fr/darby-jnd-2024/bible_jnd_2_0.osis.xml")),
              ("mhcc","commentary",Path("sources/cleaned/commentaries/en/mhcc-crosswire/mhcc.osis.xml")),
              ("mhc-old","commentary",Path("sources/cleaned/commentaries/en/mhc-crosswire/mhc.osis.xml")),
              ("mhc-candidate","commentary",tmp/"verified/mhc.osis.xml")]
          out=tmp/"brnp-regression";out.mkdir()
          summary={}
          for label,kind,path in entries:
              a=old.check(path,kind,schema_path=schema);b=check_brnp.check(path,kind,schema_path=schema)
              (out/(label+".json")).write_text(json.dumps(b,indent=2,sort_keys=True)+"\n")
              summary[label]={"before":a["finding_codes"],"after":b["finding_codes"],"representation":b["commentary_representation"],"entries":b["commentary_entry_count"],"paired_members":b["paired_commentary_member_count"],"source_sha256":b["sha256"],"official_schema":b["official_osis"]["status"]}
              print("BRNP_REAL",label,json.dumps(summary[label],sort_keys=True),flush=True)
              if label in {"lsg","darby","mhcc"}:
                  assert a["finding_codes"]==b["finding_codes"]
              else:
                  expected=dict(a["finding_codes"]);assert expected.pop("NO_COMMENTARY_ENTRIES")==1
                  assert b["finding_codes"]==expected
                  assert b["paired_commentary_entry_count"]==4255
                  assert b["paired_commentary_member_count"]==(31101 if label=="mhc-candidate" else 31098)
          assert summary["mhc-candidate"]["after"]=={}
          (out/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("BRNP_REGRESSION",json.dumps(summary,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brnp-v03-regression
          path: ${{ runner.temp }}/brnp-regression/
          if-no-files-found: warn
          retention-days: 90
