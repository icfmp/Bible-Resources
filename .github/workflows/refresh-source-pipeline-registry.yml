name: Refresh registry after source-first documentation update
on:
  push:
    branches:
      - docs/source-first-editorial-pipeline
    paths:
      - .github/workflows/refresh-source-pipeline-registry.yml
permissions:
  contents: write
jobs:
  update:
    if: github.repository == 'icfmp/Bible-Resources'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild registry and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-source-pipeline-registry.yml
          python scripts/tool_registry.py --write
          python scripts/tool_registry.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TOOL_REGISTRY.json docs/TOOL_REGISTRY.md
          git diff --cached --check
          git commit -m "Refresh tracked tool references for source-first editorial guide"
          git push origin HEAD:docs/source-first-editorial-pipeline
